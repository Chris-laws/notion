name: Codeguard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run guard
      - name: Coverage report
        if: always()
        run: npx c8 report --reporter=text
