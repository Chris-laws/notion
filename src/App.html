/* ---------------- server ---------------- */
/** Tasks that were created optimistically: temporary id -> promise of the real id. */
const PENDING = {};
function call(method, payload) {
  const keys = ['id', 'taskId', 'parentId'].filter(k => payload && payload[k] && PENDING[payload[k]]);
  if (keys.length) {
    return Promise.all(keys.map(k => PENDING[payload[k]])).then(ids => {
      const next = Object.assign({}, payload);
      keys.forEach((k, i) => { next[k] = ids[i]; });
      return call(method, next);
    });
  }
  // reading calls are retried twice (0.6 s, 1.8 s) when Google is busy or the connection hiccups
  const READS = /^(bootstrap|tasks\.list|calendar\.range|availability|comments\.list|ai\.briefing|ai\.status)$/;
  if (!READS.test(method) && typeof BOOT_DONE !== 'undefined' && !BOOT_DONE) S.wroteDuringBoot = true;
  const attempt = n => runCall(method, payload).catch(err => {
    const msg = (err && err.message) || '';
    // refused before it ran (too many at once): safe to repeat, also for writes
    const refused = /simultaneous|gleichzeitig/i.test(msg);
    const transient = refused || /\binternal\b|server error occurred|lock|timed? ?out|Zeitüberschreitung|too many|Rate Limit|NetworkError|network|Failed to fetch|503|500/i.test(msg);
    if (transient && (refused ? n < 3 : n < 2 && READS.test(method))) {
      return new Promise(r => setTimeout(r, Shared.retryDelay(n, Math.random()))).then(() => attempt(n + 1));
    }
    throw err;
  });
  return attempt(0);
}
/** Timing of every server call (round trip and time on the server); shown with ?perf=1. */
const PERF = [];
const PERF_START = Date.now();
function runCall(method, payload) {
  S.busy++;
  syncDot();
  const t0 = Date.now();
  const log = (res, ok) => {
    PERF.push({ method: method, at: t0 - PERF_START, total: Date.now() - t0, server: res && res.ms, reads: res && res.reads, ok: ok, bytes: res && res.bytes });
    if (S.perf) perfPanel();
  };
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        S.busy--; syncDot();
        let res;
        try { res = JSON.parse(raw); } catch (e) { log(null, false); return reject(new Error('Ungültige Antwort vom Server')); }
        res.bytes = raw.length;
        log(res, res.ok);
        if (res.ok) resolve(res.data); else reject(new Error(res.error));
      })
      .withFailureHandler(err => { S.busy--; syncDot(); log(null, false); reject(err instanceof Error ? err : new Error(String(err))); })
      .api(method, JSON.stringify(payload || {}));
  });
}
/** Small timing table in the corner (open the app with ?perf=1). */
function perfPanel() {
  let p = $('#perf');
  if (!p) { p = document.createElement('div'); p.id = 'perf'; document.body.appendChild(p); }
  const rows = PERF.slice(-14);
  p.innerHTML = '<b>Server-Aufrufe</b> <small>' + PERF.length + ' gesamt · Gesamtdauer bis jetzt ' + Math.max(0, ...PERF.map(x => x.at + x.total)) + ' ms</small>' +
    '<table><tr><th>Aufruf</th><th>Start</th><th>gesamt</th><th>Server</th><th>Tab.</th><th>KB</th></tr>' + rows.map(x =>
      '<tr class="' + (x.ok ? '' : 'err') + '"><td>' + esc(x.method) + '</td><td>' + x.at + '</td><td><b>' + x.total + '</b></td><td>' + (x.server == null ? '–' : x.server) + '</td><td>' +
      (x.reads == null ? '–' : x.reads) + '</td><td>' + (x.bytes ? Math.round(x.bytes / 102.4) / 10 : '–') + '</td></tr>').join('') + '</table>';
}
/** Saving/loading feedback: pulsing dot next to the app name and a thin bar at the top (after 150 ms, no flicker). */
let busyTimer = null;
function syncDot() {
  const d = $('#sync');
  if (d) d.classList.toggle('busy', S.busy > 0);

  if (!bar) { bar = document.createElement('div'); bar.id = 'busy-bar'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar); }
  clearTimeout(busyTimer);

/** Technical errors from Google become a sentence that says what happened and what to do. */
function friendlyError(msg) {
  if (!navigator.onLine || /NetworkError|Failed to fetch|network/i.test(msg)) return 'Keine Verbindung zum Server. Deine Änderung wurde nicht gespeichert – bitte Internet prüfen und erneut versuchen.';
  if (/\binternal\b|server error occurred/i.test(msg)) return 'Bei Google ist gerade ein Serverfehler aufgetreten. Bitte gleich noch einmal versuchen.';
  if (/lock|timed? ?out|Zeitüberschreitung|Service invoked too many times|Rate Limit/i.test(msg)) return 'Der Server ist gerade ausgelastet. Bitte in ein paar Sekunden erneut versuchen.';
  if (/authoriz|permission|Berechtigung/i.test(msg) && !/Keine Berechtigung|nur/i.test(msg)) return 'Dafür fehlt die Berechtigung. Bitte die Seite neu laden oder eine Admin-Person fragen.';
  if (/ScriptError|Exception|undefined|null/i.test(msg)) return 'Da ist etwas schiefgelaufen. Bitte die Seite neu laden. Wenn es bleibt, melde es mit dieser Meldung: ' + msg;
  return msg;
}

/* ---------------- task data ---------------- */
function applyTasks(list) {
  if (list && list.length) S.reportDirty = true;
  (list || []).forEach(t => {
    const i = S.tasks.findIndex(x => x.id === t.id);
    if (i >= 0) S.tasks[i] = t; else S.tasks.push(t);
  });
}
function dropTasks(ids) {
  S.tasks = S.tasks.filter(t => ids.indexOf(t.id) < 0);
}
/** Optimistic update; reverts on error. */
function patchTask(id, patch, opts) {
  const t = task(id);
  if (!t) return Promise.resolve();
  // Nobody left assigned: the task goes back to the person who created it.
  if (patch.assignees && !patch.assignees.length) patch = Object.assign({}, patch, { assignees: [t.createdBy || S.me.email] });
  const before = Object.assign({}, t);
  Object.assign(t, patch);
  if (!(opts && opts.silent)) render({ peek: !(opts && opts.keepPeek) });
  return call('tasks.save', Object.assign({ id: id }, patch))
    .then(changed => {
      applyTasks(changed);
      if (changed.length > 1) toast('Nächste Wiederholung angelegt: ' + fmtDate(changed[1].dueDate, { absolute: true }));
      if (!(opts && opts.silent)) render({ peek: !(opts && opts.keepPeek) });
      return changed;
    })
    .catch(err => { Object.assign(t, before); render(); fail(err); });
}
/** Shows the new task at once and swaps in the saved one when the server answers. */
function createTask(fields, opts) {
  // Every task belongs to someone: the creator unless another person was picked.
  if (!fields.assignees || !fields.assignees.length) fields = Object.assign({}, fields, { assignees: [S.me.email] });
  const tmpId ='tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const now = new Date().toISOString();
  const draft = Object.assign({
    id: tmpId, title: 'Ohne Titel', description: '', status: 'todo', priority: '', projectId: '',
    teams: [], assignees: [], tags: [], startDate: '', dueDate: '', estimate: 0, parentId: '', recurrence: '',
    sort: Date.now(), createdBy: S.me.email, createdAt: now, updatedAt: now, completedAt: '',
    planDate: '', planStart: 0, progress: 0, spent: 0, timerStart: '',
  }, fields);
  if (!draft.title) draft.title = 'Ohne Titel';
  S.tasks.push(draft);
  FRESH[tmpId] = true;
  if (opts && opts.open) openPeek(tmpId); else render();
  const saved = call('tasks.save', fields).then(changed => changed);
  PENDING[tmpId] = saved.then(changed => changed[0].id);
  return saved.then(changed => {
    const real = changed[0];
    // Discarded while the request was running (discardIfBlank removes it on the server).
    const gone = !S.tasks.some(t => t.id === tmpId);
    ALIAS[tmpId] = real.id;
    if (gone) return real;
    if (FRESH[tmpId]) FRESH[real.id] = true;
    S.tasks = S.tasks.filter(t => t.id !== tmpId);
    applyTasks(changed);
    if (S.peekId === tmpId) S.peekId = real.id;
    if (S.comments && S.comments.taskId === tmpId) S.comments.taskId = real.id;
    // The side panel keeps its DOM (and what is being typed); its handlers resolve the old id through ALIAS.
    render({ peek: false });
    return real;
  }).catch(err => {
    delete PENDING[tmpId];
    S.tasks = S.tasks.filter(t => t.id !== tmpId);
    if (S.peekId === tmpId) S.peekId = null;
    render();
    fail(err);
  });
}
/**
 * Delete with "Rückgängig" instead of a confirmation dialog: the task (and its sub-tasks) disappear at once,
 * the server delete follows after a few seconds unless the user takes it back.
 */
const PENDING_DELETES = {};
function deleteWithUndo(t) {
  const ids = [t.id];
  for (let i = 0; i < ids.length; i++) S.tasks.forEach(x => { if (x.parentId === ids[i] && ids.indexOf(x.id) < 0) ids.push(x.id); });
  const removed = S.tasks.filter(x => ids.indexOf(x.id) >= 0);
  dropTasks(ids);
  if (ids.indexOf(S.peekId) >= 0) { S.peekId = null; S.peekFull = false; }
  render();
  const send = () => {
    delete PENDING_DELETES[t.id];
    call('tasks.remove', { id: t.id }).catch(err => { S.tasks = S.tasks.concat(removed); render(); fail(err); });
  };
  const timer = setTimeout(send, 6000);
  PENDING_DELETES[t.id] = { timer: timer, send: send };
  toast('„' + t.title + '“ gelöscht', { duration: 6000, action: { label: 'Rückgängig', fn: () => {
    clearTimeout(timer);
    delete PENDING_DELETES[t.id];
    S.tasks = S.tasks.concat(removed);
    render();
  } } });
}
// leaving the page: send deletes that are still waiting for their undo window
window.addEventListener('pagehide', () => Object.keys(PENDING_DELETES).forEach(id => { clearTimeout(PENDING_DELETES[id].timer); PENDING_DELETES[id].send(); }));

/** Tasks created in this session; untouched ones are thrown away when their panel closes. */
const FRESH = {};
function discardIfBlank(id) {
  const t = id && task(id);
  if (!t || !FRESH[t.id]) return;
  const blank = (!t.title || t.title === 'Ohne Titel') && !String(t.description || '').trim() && !subtasks(t.id).length;
  delete FRESH[t.id];
  if (!blank) return;
  dropTasks([t.id]);
  // call() waits for the real id if the task is still being created.
  call('tasks.remove', { id: t.id }).catch(() => {});
}

/* ---------------- routing ---------------- */
function go(view, id, opts) {

/* ---------------- rendering ---------------- */
function render(opts) {
  opts = opts || {};
  if (!S.me) return;
  const view = $('#view');
  // resetScroll: a new page (with fade-in); top: same page, new period or view (back to the top)
  const fromTop = opts.resetScroll || opts.top;
  const top = fromTop ? 0 : view.scrollTop;
  const board = $('.board', view);
  const left = board ? board.scrollLeft : 0;
  renderSidebar();
  renderTopbar();
  const drafts = captureForms(view);
  const inner = {};
  $$('[data-keep-scroll]', view).forEach(el => { inner[el.dataset.keepScroll] = el.scrollTop; inner[el.dataset.keepScroll + ':x'] = el.scrollLeft; });
  const html = Views.render();
  // Only route changes play the page fade-in; data updates swap content in place.
  view.classList.toggle('enter', !!opts.resetScroll);
  const swapped = html === null || setHtml(view, html);
  restoreForms(view, drafts);
  view.scrollTop = top;
  if (swapped) {
    $$('[data-keep-scroll]', view).forEach(el => {
      const k = el.dataset.keepScroll;
      if (inner[k] !== undefined && !fromTop) { el.scrollTop = inner[k]; el.scrollLeft = inner[k + ':x']; }
      else el.scrollTop = 0;
    });
  }
  const nb = $('.board', view);
  if (nb && !opts.resetScroll) nb.scrollLeft = left;
  if (opts.peek !== false) renderPeek();
  // after() binds listeners to the fresh markup, so skip it when nothing was replaced.
  if (swapped && Views.after) Views.after();
}

/** Replaces an element's content only when the markup changed (no flicker; hover, focus and scroll survive). */
function setHtml(el, html) {
  if (el.__html === html) return false;
  el.innerHTML = html;
  el.__html = html;
  return true;
}

/** Keeps what the user typed into a form when data arriving in the background re-renders the page. */
function captureForms(root) {
  return $$('form[data-touched]', root).map(f => ({
    key: f.getAttribute('data-on-submit'),
    focus: document.activeElement && f.contains(document.activeElement) ? document.activeElement.name : null,
    fields: $$('[name]', f).map(el => [el.name, el.type === 'checkbox' || el.type === 'radio' ? el.value : null, el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value]),
  }));
}
function restoreForms(root, drafts) {
  drafts.forEach(d => {
    const f = $('form[data-on-submit="' + d.key + '"]', root);
    if (!f) return;
    f.setAttribute('data-touched', '1');
    d.fields.forEach(x => {
      const el = x[1] === null ? $('[name="' + x[0] + '"]', f) : $('[name="' + x[0] + '"][value="' + x[1] + '"]', f);
      if (!el) return;
      if (x[1] === null) el.value = x[2]; else el.checked = x[2];
    });
    if (d.focus && f.elements[d.focus] && f.elements[d.focus].focus) f.elements[d.focus].focus();
  });
}

const IS_MAC =/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const SEARCH_HINT = 'Suchen oder neue Aufgabe anlegen (Tastenkürzel: ' + (IS_MAC ? 'Cmd' : 'Strg') + ' + K)';
/** Theme and language: always top right (top bar, or the header card on calendar and availability). */
function prefControls() {
  return '<div class="prefs"><button class="icon-btn theme-btn" data-action="help" title="Hilfe und Tastenkürzel" aria-label="Hilfe und Tastenkürzel">' + icon('help') + '</button>' + themeButton() +
    '<div class="lang-sw" role="group" aria-label="Sprache">' + ['de', 'en'].map(l =>
      '<button class="' + (LANG === l ? 'on' : '') + '" data-action="lang" data-lang="' + l + '">' + l.toUpperCase() + '</button>').join('') + '</div></div>';
}
const THEMES = [['system', 'monitor', 'Design: wie System'], ['light', 'sun', 'Design: Hell'], ['dark', 'moon', 'Design: Dunkel']];
function themeButton() {
  const cur = THEMES.find(x => x[0] === THEME) || THEMES[0];
  return '<button class="icon-btn theme-btn" data-action="theme" title="' + cur[2] + '" aria-label="' + cur[2] + '">' + icon(cur[1]) + '</button>';
}
A.theme = () => {
  const i = THEMES.findIndex(x => x[0] === THEME);
  const mode = setTheme(THEMES[(i + 1) % THEMES.length][0]);
  render({ peek: false });
  toast(THEMES.find(x => x[0] === mode)[2]);
};
A['rail-toggle'] =() => { S.rail = !S.rail; store.set('rail', S.rail); renderSidebar(); };
A['toggle-team'] = el => { S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id]; store.set('collapsed', S.collapsed); renderSidebar(); };

function renderTopbar() {
  const r = S.route;
  const crumbs = [];
  const labels = { dash: 'Übersicht', home: 'Meine Aufgaben', all: 'Alle Aufgaben', calendar: 'Kalender', capacity: 'Verfügbarkeit', settings: 'Einstellungen' };
  if (labels[r.view]) crumbs.push({ html: esc(labels[r.view]) });
  if (r.view === 'team' && team(r.id)) crumbs.push({ html: mark(team(r.id)) + esc(team(r.id).name) });
  if (r.view === 'project' && project(r.id)) {
    const p = project(r.id);
    const t = team(p.teamId);
    if (t) crumbs.push({ html: mark(t) + esc(t.name), view: 'team', id: t.id });
    crumbs.push({ html: mark(p) + esc(p.name) });
  }
  // The calendar needs the height: no search or "new task" bar there (phones keep the menu button).
  const cal = r.view === 'calendar' || r.view === 'capacity';
  $('#app').classList.toggle('no-topbar', cal);
  setHtml($('#topbar'),
    '<button class="icon-btn menu-btn" data-action="sidebar-open" aria-label="Menü">' + icon('menu') + '</button>' +
    '<nav class="crumbs">' + crumbs.map((c, i) => (i ? '<span class="sep">/</span>' : '') +
      (c.view ? '<button data-action="nav" data-view="' + c.view + '" data-id="' + esc(c.id) + '">' + c.html + '</button>'
        : '<button class="current">' + c.html + '</button>')).join('') + '</nav>' +
    (cal ? '<div class="spacer"></div>' : '<button class="top-search" data-action="palette" title="' + SEARCH_HINT + '">' + icon('search', 'sm') + '<span>Aufgaben, Projekte und Personen suchen …</span></button>') +
    (S.ai.enabled && !cal ? '<span class="chip accent">' + icon('sparkle', 'sm') + 'KI aktiv</span>' : '') +
    (['home', 'all', 'dash', 'calendar', 'capacity'].indexOf(r.view) < 0 ? '<button class="btn primary" data-action="new-task">' + icon('plus', 'sm') + 'Neue Aufgabe</button>' : '') + prefControls());
}

/* ---------------- global events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.action];
  if (fn) {
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    fn(el, e);
  }
});
['submit', 'input', 'change', 'keydown'].forEach(type => {
  document.addEventListener(type, e => {
    const el = e.target.closest('[data-on-' + type + ']');
    if (!el) return;
    const fn = ON[type][el.getAttribute('data-on-' + type)];
    if (fn) {
      if (type === 'submit') e.preventDefault();
      fn(el, e);
    }
  });
});
/**
 * Shortcuts. Letters work with or without Shift/Caps Lock and on any keyboard layout (e.code as fallback);
 * nothing fires while typing in a field or with a dialog open.
 */
window.addEventListener('keydown', e => {
  const a = document.activeElement;
  const typing = !!a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable);
  const k = String(e.key || '').toLowerCase();
  if ((e.metaKey || e.ctrlKey) && (k === 'k' || e.code === 'KeyK')) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (closeTopLayer()) { e.preventDefault(); return; }
    if (S.peekId && !typing) { closePeek(); return; }
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !S.me) return;
  if ($('#modal-root').children.length || $('#palette-root').children.length || $('#people-root').children.length) return;
  const letter = /^Key[A-Z]$/.test(e.code || '') ? e.code.slice(3).toLowerCase() : k;
  if (k === '?' || (e.shiftKey && (e.code === 'Slash' || e.code === 'Minus')) || e.key === 'F1') { e.preventDefault(); A.help(); return; }
  if (S.route.view === 'calendar') {
    const m = CAL_VIEWS.map(v => v[0])[Number(e.key) - 1];
    if (m) { A['cal-mode']({ dataset: { v: m } }); return; }
    if (e.key === 'ArrowLeft') { A['cal-prev'](); return; }
    if (e.key === 'ArrowRight') { A['cal-next'](); return; }
  }
  if (letter === 't') { e.preventDefault(); if (S.route.view !== 'calendar') go('calendar'); A['cal-today'](); return; }
  if (letter === 'n') { e.preventDefault(); A['new-task'](); return; }
  if (letter === 'c' || k === '/') { e.preventDefault(); openPalette(); }
}, true);
// keyboard focus belongs to the app, not to the Google frame around it
window.addEventListener('mouseenter', () => { if (document.activeElement === document.body) window.focus(); });

/* ---------------- background sync ---------------- */
function editing() {
  const a = document.activeElement;
  return (a && /INPUT|TEXTAREA/.test(a.tagName)) || $('#popover-root').children.length || $('#modal-root').children.length || dragState.id;
}
let pollFailures = 0;
function refresh() {
  if (document.visibilityState !== 'visible' || editing() || S.busy) return;
  call('tasks.list', { ver: S.tasksVer || '' }).then(res => {
    pollFailures = 0;
    if (res.same || editing() || S.busy) return;
    const list = res.tasks;
    const pending = S.tasks.filter(t => PENDING[t.id]);
    if (pending.length) return;
    // Only redraw when someone else actually changed something.
    if (JSON.stringify(list) === JSON.stringify(S.tasks)) { S.tasksVer = res.ver; return; }
    S.tasks = list;
    S.tasksVer = res.ver;
    S.reportDirty = true;
    render();
  }).catch(() => { pollFailures++; /* next round, a bit later */ });
}
// polling: about every 2 minutes, spread per client, slower after failures (see Shared.pollDelay)
function schedulePoll() { setTimeout(() => { refresh(); schedulePoll(); }, Shared.pollDelay(120, pollFailures, Math.random())); }
schedulePoll();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

/* ---------------- skeletons: placeholders shaped like the content that is on its way ---------------- */
const SKW = ['72%', '54%', '86%', '61%', '78%', '47%', '69%', '58%'];
const sk = (w, h, cls) => '<span class="sk' + (cls ? ' ' + cls : '') + '" style="width:' + (w || '100%') + (h ? ';height:' + h : '') + '"></span>';
const skBox = (inner, cls, style) => '<div class="sk-box' + (cls ? ' ' + cls : '') + '"' + (style ? ' style="' + style + '"' : '') + ' role="status" aria-busy="true" aria-label="Wird geladen …">' + inner + '</div>';
const skRep = (n, f) => { let s = ''; for (let i = 0; i < n; i++) s += f(i); return s; };
const skPct = (i, min, span) => (min + (i * 17) % span) + '%';
function skLines(n, h) { return skBox(skRep(n || 3, i => '<div class="sk-line">' + sk(SKW[i % 8], h) + '</div>')); }
/** list rows: check, title, chips, avatar */
function skRows(n) {
  return skBox(skRep(n || 6, i => '<div class="sk-row">' + sk('16px', '16px', 'round') + sk(skPct(i, 22, 30), '12px') +
    '<span class="grow"></span>' + sk('58px', '18px', 'pill') + sk('22px', '22px', 'round') + '</div>'));
}
function skTable(n, cols) {
  cols = cols || 5;
  const row = (i, head) => '<div class="sk-tr' + (head ? ' head' : '') + '">' +
    skRep(cols, c => sk(head ? (c ? '50%' : '40%') : c ? skPct(i + c, 35, 45) : SKW[i % 8], head ? '10px' : '12px')) + '</div>';
  return skBox(row(0, true) + skRep(n || 8, i => row(i)), 'sk-table', '--cols:' + cols);
}
function skBoard(cols) {
  return skBox(skRep(cols || 4, c => '<div class="sk-col"><div class="sk-line">' + sk('46%', '11px') + '</div>' +
    skRep(3 - (c % 2), i => '<div class="sk-card">' + sk(SKW[(c + i) % 8], '12px') + sk('40%', '10px') +
      '<div class="sk-foot">' + sk('52px', '16px', 'pill') + sk('20px', '20px', 'round') + '</div></div>') + '</div>'), 'sk-board');
}
function skTiles(n) {
  return skBox(skRep(n || 4, () => '<div class="sk-tile">' + sk('30px', '30px', 'sq') + sk('46%', '10px') + sk('34%', '22px') + '</div>'), 'sk-tiles');
}
function skGantt(n) {
  return skBox(skRep(n || 7, i => '<div class="sk-gr">' + sk(skPct(i, 10, 12), '11px') +
    '<span class="sk sk-gbar" style="margin-left:' + skPct(i, 6, 50) + ';width:' + skPct(i, 14, 26) + '"></span></div>'), 'sk-gantt');
}
function skCalGrid(cols, rows) {
  return skBox(skRep(cols * rows, i => '<div class="sk-cell">' + sk('24%', '10px') + (i % 3 === 0 ? sk(SKW[i % 8], '14px', 'pill') : '') + '</div>'), 'sk-cal', '--cols:' + cols);
}
function skPeople(n) {
  return skBox(skRep(n || 4, i => '<div class="sk-row">' + sk('34px', '34px', 'round') + '<div class="sk-stack">' + sk(skPct(i, 30, 30), '12px') + sk('45%', '10px') + '</div>' +
    sk('70px', '12px') + '</div>'));
}
function skCards(n) {
  return skBox(skRep(n || 3, i => '<div class="sk-pcard"><div class="sk-row tight">' + sk('26px', '26px', 'sq') + sk('50%', '13px') + '</div>' + sk(SKW[i % 8], '10px') +
    sk('100%', '6px', 'pill') + '<div class="sk-foot">' + sk('30%', '10px') + sk('60px', '20px', 'pill') + '</div></div>'), 'sk-pcards');
}
/** Whole page while the app starts: shaped like the page that will open (saved route and layout). */
function skPage(route) {
  const v = route.view || 'dash';
  const head = '<div class="sk-head">' + sk('220px', '24px') + sk('320px', '12px') + '</div>';
  const card = inner => '<div class="card-w">' + inner + '</div>';
  const tabs = (n, w) => '<div class="sk-tabs">' + skRep(n, () => sk(w, '26px', 'pill')) + '</div>';
  if (v === 'dash') {
    return '<div class="page wide sk-page">' + head + skTiles(4) + '<div class="sk-2">' + card('<div class="sk-line">' + sk('34%', '13px') + '</div>' + skRows(5)) +
      card('<div class="sk-line">' + sk('40%', '13px') + '</div>' + skLines(4)) + '</div>' + card(skCards(3)) + '</div>';
  }
  if (v === 'calendar') return '<div class="page wide sk-page">' + head + card(skCalGrid(7, 5)) + '</div>';
  if (v === 'capacity') return '<div class="page wide sk-page">' + head + card(skTable(7, 7)) + '</div>';
  if (v === 'settings' || v === 'admin') return '<div class="page sk-page">' + head + card(skLines(6, '14px')) + card(skPeople(3)) + '</div>';
  if (v === 'team') return '<div class="page wide sk-page">' + head + tabs(3, '96px') + card(skCards(3)) + '</div>';
  const prefs = (store.get('db', {}) || {})[v + ':' + (route.id || '')] || {};
  const layout = prefs.layout || (v === 'home' ? 'list' : 'board');
  const body = layout === 'board' ? skBoard(4) : layout === 'table' ? card(skTable(9, 6)) : layout === 'gantt' ? card(skGantt(8))
    : layout === 'calendar' ? card(skCalGrid(7, 5)) : card(skRows(9));
  if (v === 'project') return '<div class="page wide sk-page"><div class="sk-banner">' + sk('40%', '24px') + sk('55%', '12px') + '</div>' + tabs(3, '86px') + body + '</div>';
  return '<div class="page wide sk-page">' + head + tabs(v === 'home' ? 6 : 4, '96px') + body + '</div>';
}
function skSidebar() {
  return '<div class="sk-side">' + sk('130px', '28px') + sk('100%', '34px') + skRep(6, i => '<div class="sk-row tight">' + sk('16px', '16px', 'sq') + sk(skPct(i, 40, 35), '12px') + '</div>') +
    '<div class="sk-line" style="margin-top:14px">' + sk('40%', '10px') + '</div>' + skRep(4, i => '<div class="sk-row tight">' + sk('18px', '18px', 'sq') + sk(skPct(i, 35, 40), '12px') + '</div>') + '</div>';
}

/* ---------------- start ---------------- */
/*
 * Start: the bootstrap request leaves right away (not after fonts and images).
 * The last start data of this user is kept in the browser, so the app shows at
 * once from that copy and swaps in the fresh data when it arrives.
 */
const SNAP_MAX_AGE = 7 * 864e5;
// var on purpose: call() reads it with typeof before this line has run
// eslint-disable-next-line no-var
var BOOT_DONE = false;
const BOOT_REQ = call('bootstrap');
BOOT_REQ.then(() => { BOOT_DONE = true; }, () => { BOOT_DONE = true; });
function readSnap() {
  const snap = store.get('snap', null);
  return snap && BOOT_USER && snap.user === BOOT_USER && Date.now() - snap.at < SNAP_MAX_AGE && snap.d ? snap.d : null;
}
function saveSnap(d) {
  try {
    const raw = JSON.stringify({ user: BOOT_USER, at: Date.now(), d: d });
    // keep well below the ~5 MB browser limit; a too big copy is simply not kept
    if (raw.length < 2e6) localStorage.setItem('tr:snap', raw); else localStorage.removeItem('tr:snap');
  } catch (e) { /* storage full or private mode */ }
}
function applyBoot(d) {
  Object.assign(S, d);
  S.appName = d.appName || S.appName;
  document.title = S.appName;
  $('#app').classList.remove('is-loading');
}
function boot() {
  S.collapsed = store.get('collapsed', {});
  try { localStorage.removeItem('tr:dashLayout'); } catch (e) { /* layout switch removed */ }
  let started = false;
  let params = {};
  const openLinkedTask = () => {
    if (!params.task) return;
    if (task(params.task)) { openPeek(params.task); params.task = null; }
    else if (!S.fromSnap) { toast('Diese Aufgabe gibt es nicht mehr oder du hast keinen Zugriff darauf.', { warn: true }); params.task = null; }
  };
  const start = p => {
    started = true;
    params = p;
    if (params.perf === '1') { S.perf = true; perfPanel(); }
    calPrefetch();
    const last = store.get('route', null);
    if (params.view) S.route = { view: params.view, id: params.id || null };
    else if (last && last.view && (!last.id || team(last.id) || project(last.id))) S.route = last;
    render({ resetScroll: true });
    openLinkedTask();
  };
  const go0 = () => { try { google.script.url.getLocation(loc => start(loc.parameter || {})); } catch (e) { start({}); } };
  const fail0 = err => {
    $('#app').classList.remove('is-loading');
    $('#sidebar').innerHTML = '';
    $('#view').innerHTML = '<div class="page"><div class="nf">' + logoMark() + '<h1>App konnte nicht geladen werden</h1>' +
      '<p>' + esc(friendlyError(err.message || String(err))) + '</p>' +
      '<div class="nf-acts"><button class="btn primary" onclick="location.reload()">Erneut versuchen</button></div></div></div>';
  };
  const snap = readSnap();
  if (snap) { S.fromSnap = true; applyBoot(snap); go0(); }
  BOOT_REQ.then(d => {
    saveSnap(d);
    if (!S.fromSnap) { applyBoot(d); go0(); return; }
    // fresh data replaces the copy; tasks still being created here are kept on top
    const pending = S.tasks.filter(t => PENDING[t.id]);
    S.fromSnap = false;
    applyBoot(d);
    if (pending.length) S.tasks = S.tasks.concat(pending);
    // the copy may point at a team or calendar scope that is gone meanwhile
    if (S.cap.teamId && !team(S.cap.teamId)) { S.cap.teamId = null; S.cap.data = null; }
    if (S.cal.teamId && !team(S.cal.teamId)) S.cal.teamId = '';
    S.reportDirty = true;
    if (started) { render(); openLinkedTask(); }
    // something was saved while the start data was on its way: fetch the list once more
    if (S.wroteDuringBoot) { S.tasksVer = ''; setTimeout(refresh, 300); }
  }).catch(err => {
    const offline = /network|netzwerk|failed to fetch|timed? ?out|zeitüberschreitung|verbindung|503|502/i.test((err && err.message) || '');
    if (S.fromSnap && offline) { toast('Keine Verbindung – du siehst den zuletzt geladenen Stand.', { warn: true }); return; }
    // no access (any more) or another server answer: the copy must not stay visible
    try { localStorage.removeItem('tr:snap'); } catch (e) { /* ignore */ }
    S.fromSnap = false;
    fail0(err);
  });
  if (google.script.history) google.script.history.setChangeHandler(ev => {
    if (ev.state && ev.state.view) { S.route = ev.state; render({ resetScroll: true }); }
  });
}
// all scripts are parsed by then; fonts and images may still load
document.addEventListener('DOMContentLoaded', boot);
// placeholders shaped like the page that will open, drawn right away (before fonts and data)
(function () {
  const saved = store.get('route', null);
  $('#sidebar').innerHTML = skSidebar();
  $('#view').innerHTML = skPage(saved && saved.view ? saved : { view: 'dash' });
})();
</script>
