function fmtDate(iso, opts) {
  if (!iso) return '';
  const t = TODAY();
  const diff = Shared.diffDays(t, iso);
  if (!(opts && opts.absolute)) {
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Morgen';
    if (diff === -1) return 'Gestern';
    if (diff > 1 && diff < 7) return DOW_LONG[Shared.weekday(iso)];
  }
  const [y, m, d] = iso.split('-').map(Number);
  return d + '. ' + MONTHS[m - 1] + (String(y) !== t.slice(0, 4) ? ' ' + y : '');
}
function fmtRange(a, b) {
  if (!b || a === b) return fmtDate(a, { absolute: true });
  return fmtDate(a, { absolute: true }) + ' – ' + fmtDate(b, { absolute: true });
}
function fmtHours(h) {
  h = Number(h) || 0;
  if (!h) return '';
  if (h < 1) return Math.round(h * 60) + ' min';
  return (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h';
}
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'gerade eben';
  if (s < 3600) return 'vor ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'vor ' + Math.floor(s / 3600) + ' h';
  return fmtDate(iso.slice(0, 10), { absolute: true });
}

const allTags = () => {
  const set = {};
  S.tasks.forEach(t => t.tags.forEach(x => { set[x] = true; }));
  return Object.keys(set).sort((a, b) => a.localeCompare(b));

  let h = 0;

function icon(name, cls) {
  return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

/* ---------------- small renderers ---------------- */
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function avatar(email, cls) {
  const u = user(email);
  return '<span class="avatar ' + (cls || '') + '" style="background:' + esc(u.color || '#8b8d98') + '" title="' + esc(u.name) + '">' + esc(initials(u.name)) + '</span>';
}
function avatars(emails, max) {
  max = max || 3;
  const list = emails.slice(0, max).map(e => avatar(e)).join('');
  const more = emails.length > max ? '<span class="avatar" style="background:var(--text-3)">+' + (emails.length - max) + '</span>' : '';
  return '<span class="avatars">' + list + more + '</span>';
}
function person(email) {
  return '<span class="person">' + avatar(email) + '<span>' + esc(user(email).name) + '</span></span>';
}
/** Coloured square with the first letter: identifies teams and projects. */
function mark(entity, cls) {
  if (!entity) return '';
  const color = entity.color && entity.color !== 'default' ? 'var(--c-' + esc(entity.color) + ')' : 'var(--c-gray)';
  return '<span class="mark ' + (cls || '') + '" style="background:' + color + '">' + esc((entity.name || '?').charAt(0).toUpperCase()) + '</span>';
}
const GLYPHS = {
  backlog: '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--text-3)" stroke-width="1.6" stroke-dasharray="2.4 2.2"/>',
  todo: '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--text-3)" stroke-width="1.6"/>',
  doing: '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--c-yellow)" stroke-width="1.6"/><path d="M8 4a4 4 0 0 1 0 8z" fill="var(--c-yellow)"/>',
  review: '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M8 4a4 4 0 1 1-4 4h4z" fill="var(--accent)"/>',
  done: '<circle cx="8" cy="8" r="7" fill="var(--success)"/><path d="m5 8.1 2 2 4-4.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
};
function glyph(key) {
  return '<svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">' + (GLYPHS[key] || GLYPHS.todo) + '</svg>';
}
const STATUS_COLORS = { backlog: '#8d98b0', todo: '#5b78a8', doing: '#e0a800', review: '#0050aa', done: '#12935b' };
function statusTag(key) {
  return '<span class="spill st-' + esc(key) + '">' + esc(statusOf(key).label) + '</span>';
}
function prioTag(key, short) {
  const p = prioOf(key);
  if (!p) return '';
  const on = { urgent: 3, high: 3, medium: 2, low: 1 }[p.key];
  if (!short) return '<span class="ppill prio-' + p.key + '" title="Priorität: ' + esc(p.label) + '">' + esc(p.label) + '</span>';
  const bars = key === 'urgent'
    ? '<svg class="i sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" stroke="none"/><path d="M12 7v6M12 16.5h.01" stroke="#fff" stroke-width="2.4"/></svg>'
    : '<span class="prio-bars">' + [1, 2, 3].map(i => '<i class="' + (i <= on ? 'on' : '') + '"></i>').join('') + '</span>';
  return '<span class="prio prio-' + p.key + '" title="Priorität: ' + esc(p.label) + '">' + bars + '</span>';
}
/** Progress in %: set by hand (1-100) or derived from sub-tasks and status. */
function progressOf(t) {
  if (t.progress > 0) return Math.min(100, t.progress);
  if (isDone(t)) return 100;
  const subs = subtasks(t.id);
  if (subs.length) return Math.round(subs.filter(isDone).length / subs.length * 100);
  return { backlog: 0, todo: 0, doing: 40, review: 80 }[t.status] || 0;
}
function progressBar(t, o) {
  const v = progressOf(t);
  return '<span class="pbar' + (o && o.wide ? ' wide' : '') + '"><span class="track"><i style="width:' + v + '%"></i></span><span class="pv">' + v + '%</span></span>';
}
function dueTag(t) {
  if (!t.dueDate) return '';
  const today = TODAY();
  const cls = !isDone(t) && t.dueDate < today ? 'overdue' : t.dueDate === today ? 'today' : '';
  return '<span class="meta ' + cls + '">' + icon('calendar', 'sm') + esc(fmtDate(t.dueDate)) + '</span>';
}

}

/* ---------------- server ---------------- */
/** Tasks that were created optimistically: temporary id -> promise of the real id. */
const PENDING = {};
function call(method, payload) {
  const keys = ['id', 'taskId', 'parentId'].filter(k => payload && payload[k] && PENDING[payload[k]]);
  if (keys.length) {
    return Promise.all(keys.map(k => PENDING[payload[k]])).then(ids => {
      const next = Object.assign({}, payload);
      keys.forEach((k, i) => { next[k] = ids[i]; });
      return call(method, next);
    });
  }
  S.busy++;
  syncDot();
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        S.busy--; syncDot();
        let res;
        try { res = JSON.parse(raw); } catch (e) { return reject(new Error('Ungültige Antwort vom Server')); }
        if (res.ok) resolve(res.data); else reject(new Error(res.error));
      })
      .withFailureHandler(err => { S.busy--; syncDot(); reject(err instanceof Error ? err : new Error(String(err))); })
      .api(method, JSON.stringify(payload || {}));
  });
}
function syncDot() {
  const d = $('#sync');
  if (d) d.classList.toggle('busy', S.busy > 0);
}
function fail(err) {
  console.error(err);
  toast(err && err.message ? err.message : String(err), { error: true });
}

/* ---------------- task data ---------------- */
function applyTasks(list) {
  (list || []).forEach(t => {
    const i = S.tasks.findIndex(x => x.id === t.id);
    if (i >= 0) S.tasks[i] = t; else S.tasks.push(t);
  });
}
function dropTasks(ids) {
  S.tasks = S.tasks.filter(t => ids.indexOf(t.id) < 0);
}
/** Optimistic update; reverts on error. */
function patchTask(id, patch, opts) {
  const t = task(id);
  if (!t) return Promise.resolve();
  // Nobody left assigned: the task goes back to the person who created it.
  if (patch.assignees && !patch.assignees.length) patch = Object.assign({}, patch, { assignees: [t.createdBy || S.me.email] });
  const before = Object.assign({}, t);
  Object.assign(t, patch);
  if (!(opts && opts.silent)) render({ peek: !(opts && opts.keepPeek) });
  return call('tasks.save', Object.assign({ id: id }, patch))
    .then(changed => {
      applyTasks(changed);
      if (changed.length > 1) toast('Nächste Wiederholung angelegt: ' + fmtDate(changed[1].dueDate, { absolute: true }));
      if (!(opts && opts.silent)) render({ peek: !(opts && opts.keepPeek) });
      return changed;
    })
    .catch(err => { Object.assign(t, before); render(); fail(err); });
}
/** Shows the new task at once and swaps in the saved one when the server answers. */
function createTask(fields, opts) {
  // Every task belongs to someone: the creator unless another person was picked.
  if (!fields.assignees || !fields.assignees.length) fields = Object.assign({}, fields, { assignees: [S.me.email] });
  const tmpId ='tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const now = new Date().toISOString();
  const draft = Object.assign({
    id: tmpId, title: 'Ohne Titel', description: '', status: 'todo', priority: '', projectId: '',
    teams: [], assignees: [], tags: [], startDate: '', dueDate: '', estimate: 0, parentId: '', recurrence: '',
    sort: Date.now(), createdBy: S.me.email, createdAt: now, updatedAt: now, completedAt: '',
    planDate: '', planStart: 0, progress: 0, spent: 0, timerStart: '',
  }, fields);
  if (!draft.title) draft.title = 'Ohne Titel';
  S.tasks.push(draft);
  FRESH[tmpId] = true;
  if (opts && opts.open) openPeek(tmpId); else render();
  const saved = call('tasks.save', fields).then(changed => changed);
  PENDING[tmpId] = saved.then(changed => changed[0].id);
  return saved.then(changed => {
    const real = changed[0];
    // Discarded while the request was running (discardIfBlank removes it on the server).
    const gone = !S.tasks.some(t => t.id === tmpId);
    ALIAS[tmpId] = real.id;
    if (gone) return real;
    if (FRESH[tmpId]) FRESH[real.id] = true;
    S.tasks = S.tasks.filter(t => t.id !== tmpId);
    applyTasks(changed);
    if (S.peekId === tmpId) S.peekId = real.id;
    if (S.comments && S.comments.taskId === tmpId) S.comments.taskId = real.id;
    // The side panel keeps its DOM (and what is being typed); its handlers resolve the old id through ALIAS.
    render({ peek: false });
    return real;
  }).catch(err => {
    delete PENDING[tmpId];
    S.tasks = S.tasks.filter(t => t.id !== tmpId);
    if (S.peekId === tmpId) S.peekId = null;
    render();
    fail(err);
  });
}
/** Tasks created in this session; untouched ones are thrown away when their panel closes. */
const FRESH = {};
function discardIfBlank(id) {
  const t = id && task(id);
  if (!t || !FRESH[t.id]) return;
  const blank = (!t.title || t.title === 'Ohne Titel') && !String(t.description || '').trim() && !subtasks(t.id).length;
  delete FRESH[t.id];
  if (!blank) return;
  dropTasks([t.id]);
  // call() waits for the real id if the task is still being created.
  call('tasks.remove', { id: t.id }).catch(() => {});
}
/** Defaults for "+ Neu" depending on where the user is. */
function contextDefaults(extra) {
  const r = S.route;
  const f = {};
  if (r.view === 'project') f.projectId = r.id;
  if (r.view === 'team') f.teams = [r.id];
  if (r.view === 'home' || r.view === 'dash' || r.view === 'planner') f.assignees = [S.me.email];
  return Object.assign(f, extra || {});
}

/* ---------------- routing ---------------- */
function go(view, id, opts) {
  S.route = { view: view, id: id || null };
  if (!(opts && opts.keepPeek)) { discardIfBlank(S.peekId); S.peekId = null; }
  store.set('route', S.route);
  $('#app').classList.remove('side-open');
  try {
    if (google.script.history) google.script.history.push(S.route, { view: view, id: id || '' });
  } catch (e) { /* preview */ }
  render({ resetScroll: true });
}
A.nav = el => go(el.dataset.view, el.dataset.id);
A['sidebar-open'] = () => $('#app').classList.add('side-open');
A['sidebar-close'] = () => $('#app').classList.remove('side-open');

/* ---------------- rendering ---------------- */
function render(opts) {
  opts = opts || {};
  if (!S.me) return;
  const view = $('#view');
  const top = opts.resetScroll ? 0 : view.scrollTop;
  const board = $('.board', view);
  const left = board ? board.scrollLeft : 0;
  renderSidebar();
  renderTopbar();
  const drafts = captureForms(view);
  const inner = {};
  $$('[data-keep-scroll]', view).forEach(el => { inner[el.dataset.keepScroll] = el.scrollTop; });
  const html = Views.render();
  // Only route changes play the page fade-in; data updates swap content in place.
  view.classList.toggle('enter', !!opts.resetScroll);
  const swapped = html === null || setHtml(view, html);
  restoreForms(view, drafts);
  view.scrollTop = top;
  if (swapped) {
    $$('[data-keep-scroll]', view).forEach(el => {
      const k = el.dataset.keepScroll;
      if (inner[k] !== undefined && !opts.resetScroll) el.scrollTop = inner[k];
      else if (k === 'wk') el.scrollTop = Math.max(0, (7 * 60 - PL.from) / 60 * PL.hh); // start the day at 07:00
    });
  }
  const nb = $('.board', view);
  if (nb && !opts.resetScroll) nb.scrollLeft = left;
  if (opts.peek !== false) renderPeek();
  // after() binds listeners to the fresh markup, so skip it when nothing was replaced.
  if (swapped && Views.after) Views.after();
}

/** Replaces an element's content only when the markup changed (no flicker; hover, focus and scroll survive). */
function setHtml(el, html) {
  if (el.__html === html) return false;
  el.innerHTML = html;
  el.__html = html;
  return true;
}

/** Keeps what the user typed into a form when data arriving in the background re-renders the page. */
function captureForms(root) {
  return $$('form[data-touched]', root).map(f => ({
    key: f.getAttribute('data-on-submit'),
    focus: document.activeElement && f.contains(document.activeElement) ? document.activeElement.name : null,
    fields: $$('[name]', f).map(el => [el.name, el.type === 'checkbox' || el.type === 'radio' ? el.value : null, el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value]),
  }));
}
function restoreForms(root, drafts) {
  drafts.forEach(d => {
    const f = $('form[data-on-submit="' + d.key + '"]', root);
    if (!f) return;
    f.setAttribute('data-touched', '1');
    d.fields.forEach(x => {
      const el = x[1] === null ? $('[name="' + x[0] + '"]', f) : $('[name="' + x[0] + '"][value="' + x[1] + '"]', f);
      if (!el) return;
      if (x[1] === null) el.value = x[2]; else el.checked = x[2];
    });
    if (d.focus && f.elements[d.focus] && f.elements[d.focus].focus) f.elements[d.focus].focus();
  });
}
document.addEventListener('input', e => {
  const f = e.target.closest && e.target.closest('#view form');
  if (f) f.setAttribute('data-touched', '1');
});

function renderSidebar() {
  const r = S.route;
  const active = (v, id) => (r.view === v && (id === undefined || r.id === id) ? ' active' : '');
  const mineOpen = S.tasks.filter(t => isMine(t) && !isDone(t)).length;
  const navItem = (view, ic, label, extra, id) =>
    '<button class="nav-item' + active(view, id) + '" data-action="nav" data-view="' + view + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + ' title="' + esc(String(label).replace(/<[^>]*>/g, '')) + '">' +
    ic + '<span class="nav-label">' + label + '</span>' + (extra || '') + '</button>';
  S.rail = S.rail === undefined ? store.get('rail', true) : S.rail;
  $('#sidebar').classList.toggle('rail', !!S.rail);
  const warn = (S.warnings || []).length ? '<span class="alert" title="Team-Abwesenheit über der Warnschwelle"></span>' : '';

  const teamsHtml = S.teams.slice().sort((a, b) => a.name.localeCompare(b.name)).map(t => {
    const collapsed = S.collapsed[t.id];
    const projects = S.projects.filter(p => p.teamId === t.id && p.status !== 'done');
    return '<div class="' + (collapsed ? 'collapsed' : '') + '"><div class="team-row">' +
      '<button class="chev-btn" data-action="toggle-team" data-id="' + esc(t.id) + '" aria-label="Ein-/ausklappen">' + icon('chevron', 'sm chev') + '</button>' +
      navItem('team', mark(t), esc(t.name), '', t.id) + '</div>' +
      (collapsed ? '' : projects.map(p => '<div class="nav-sub">' + navItem('project', mark(p), esc(p.name), '', p.id) + '</div>').join('') +
        '<div class="nav-sub"><button class="nav-item faint" data-action="project-new" data-team="' + esc(t.id) + '">' + icon('plus', 'sm') + '<span class="nav-label">Neues Projekt</span></button></div>') +
      '</div>';
  }).join('');

  setHtml($('#sidebar'),
    '<div class="side-head"><div class="ws-mark">' + icon('check') + '</div><div class="ws-name">' + esc(S.appName) + '</div>' +
    '<span id="sync" class="sync-dot" title="Wird gespeichert …"></span>' +
    '<button class="icon-btn rail-toggle" data-action="rail-toggle" title="Seitenleiste ein-/ausklappen">' + icon('menu') + '</button></div>' +
    '<div class="side-scroll">' +
    '<button class="side-search" data-action="palette">' + icon('search', 'sm') + '<span class="grow">Suchen …</span><span class="kbd">⌘K</span></button>' +
    navItem('dash', icon('home'), 'Übersicht') +
    navItem('home', icon('checksq'), 'Meine Aufgaben', mineOpen ? '<span class="count">' + mineOpen + '</span>' : '') +
    navItem('all', icon('inbox'), 'Alle Aufgaben') +
    navItem('calendar', icon('calendar'), 'Kalender') +
    navItem('capacity', icon('users'), 'Verfügbarkeit', warn) +
    '<div class="side-section"><span>Teams</span><button class="icon-btn sm" data-action="team-new" title="Neues Team">' + icon('plus', 'sm') + '</button></div>' +
    (teamsHtml || '<div class="faint" style="padding:4px 10px;font-size:13px">Noch keine Teams.</div>') +
    '</div>' +
    '<div class="side-foot"><button class="me-row" data-action="nav" data-view="settings">' + avatar(S.me.email, 'lg') +
    '<div class="me-meta"><div style="font-weight:500">' + esc(S.me.name) + '</div><div class="faint">' +
    esc((S.me.region || S.me.country || '') + ' · Einstellungen') + '</div></div></button></div>');
  syncDot();
}
A['rail-toggle'] = () => { S.rail = !S.rail; store.set('rail', S.rail); renderSidebar(); };
A['toggle-team'] = el => { S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id]; store.set('collapsed', S.collapsed); renderSidebar(); };

function renderTopbar() {
  const r = S.route;
  const crumbs = [];
  const labels = { dash: 'Übersicht', home: 'Meine Aufgaben', all: 'Alle Aufgaben', calendar: 'Kalender', capacity: 'Verfügbarkeit', settings: 'Einstellungen' };
  if (labels[r.view]) crumbs.push({ html: esc(labels[r.view]) });
  if (r.view === 'team' && team(r.id)) crumbs.push({ html: mark(team(r.id)) + esc(team(r.id).name) });
  if (r.view === 'project' && project(r.id)) {
    const p = project(r.id);
    const t = team(p.teamId);
    if (t) crumbs.push({ html: mark(t) + esc(t.name), view: 'team', id: t.id });
    crumbs.push({ html: mark(p) + esc(p.name) });
  }
  setHtml($('#topbar'),
    '<button class="icon-btn menu-btn" data-action="sidebar-open" aria-label="Menü">' + icon('menu') + '</button>' +
    '<nav class="crumbs">' + crumbs.map((c, i) => (i ? '<span class="sep">/</span>' : '') +
      (c.view ? '<button data-action="nav" data-view="' + c.view + '" data-id="' + esc(c.id) + '">' + c.html + '</button>'
        : '<button class="current">' + c.html + '</button>')).join('') + '</nav>' +
    '<button class="top-search" data-action="palette">' + icon('search', 'sm') + '<span>Aufgaben und Projekte suchen</span><span class="kbd">⌘K</span></button>' +
    '<div class="spacer"></div>' +
    (S.ai.enabled ? '<span class="chip accent">' + icon('sparkle', 'sm') + 'KI aktiv</span>' : '') +
    (['home', 'all', 'dash'].indexOf(r.view) < 0 ? '<button class="btn primary" data-action="new-task">' + icon('plus', 'sm') + 'Neue Aufgabe</button>' : ''));
}

/* ---------------- global events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.action];
  if (fn) {
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    fn(el, e);
  }
});
['submit', 'input', 'change', 'keydown'].forEach(type => {
  document.addEventListener(type, e => {
    const el = e.target.closest('[data-on-' + type + ']');
    if (!el) return;
    const fn = ON[type][el.getAttribute('data-on-' + type)];
    if (fn) {
      if (type === 'submit') e.preventDefault();
      fn(el, e);
    }
  });
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (closeTopLayer()) { e.preventDefault(); return; }
    if (S.peekId && !typing) { closePeek(); return; }
  }
  if (typing) return;
  if ((S.route.view === 'calendar' || S.route.view === 'planner') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const m = CAL_VIEWS.map(v => v[0])[Number(e.key) - 1];
    if (m) { A['cal-mode']({ dataset: { v: m } }); return; }
    if (e.key === 't') { A['cal-today'](); return; }
    if (e.key === 'ArrowLeft') { A['cal-prev'](); return; }
    if (e.key === 'ArrowRight') { A['cal-next'](); return; }
  }
  if (e.key === 'c' || e.key === 'n') { e.preventDefault(); openPalette(); }
  if (e.key === '/') { e.preventDefault(); openPalette(); }
});

/* ---------------- background sync ---------------- */
function editing() {
  const a = document.activeElement;
  return (a && /INPUT|TEXTAREA/.test(a.tagName)) || $('#popover-root').children.length || $('#modal-root').children.length || dragState.id;
}
function refresh() {
  if (document.visibilityState !== 'visible' || editing() || S.busy) return;
  call('tasks.list').then(list => {
    if (editing() || S.busy) return;
    const pending = S.tasks.filter(t => PENDING[t.id]);
    if (pending.length) return;
    // Only redraw when someone else actually changed something.
    if (JSON.stringify(list) === JSON.stringify(S.tasks)) return;
    S.tasks = list;
    render();
  }).catch(() => { /* next round */ });
}
setInterval(refresh, 90000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

/* ---------------- start ---------------- */
function boot() {
  S.collapsed = store.get('collapsed', {});
  call('bootstrap').then(d => {
    Object.assign(S, d);
    S.appName = d.appName || S.appName;
    document.title = S.appName;
    $('#app').classList.remove('is-loading');
    const start = params => {
      const last = store.get('route', null);
      if (params.view) S.route = { view: params.view, id: params.id || null };
      else if (last && last.view && (!last.id || team(last.id) || project(last.id))) S.route = last;
      render({ resetScroll: true });
      if (params.task && task(params.task)) openPeek(params.task);
    };
    try {
      google.script.url.getLocation(loc => start(loc.parameter || {}));
    } catch (e) { start({}); }
    if (google.script.history) google.script.history.setChangeHandler(ev => {
      if (ev.state && ev.state.view) { S.route = ev.state; render({ resetScroll: true }); }
    });
  }).catch(err => {
    $('#view').innerHTML = '<div class="page"><div class="empty"><div class="big">🔒</div><h2>App konnte nicht geladen werden</h2>' +
      '<p class="muted">' + esc(err.message) + '</p></div></div>';
  });
}
window.addEventListener('load', boot);
</script>
