<script>
/**
 * Images into a description or a line of minutes (loaded on first use): checked here, made smaller when
 * big (at most 1600 px, JPEG), sent to the server, and the marker ![name](lf:<id>) put where the cursor is.
 */
const IMG_MAX_PX = 1600;
const IMG_TYPES = /^image\/(jpeg|png|gif|webp)$/;
function imgRead(blob) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); });
}
/** Big photos get smaller in the browser (less to send and to store); small images stay as they are. */
function imgShrink(file) {
  if (file.size <= 600000 || typeof createImageBitmap !== 'function' || file.type === 'image/gif') return Promise.resolve(file);
  // photos as JPEG; PNG and WebP as WebP (keeps transparency)
  const type = file.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp';
  return createImageBitmap(file).then(bmp => {
    const f = Math.min(1, IMG_MAX_PX / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * f);
    c.height = Math.round(bmp.height * f);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(ok => c.toBlob(b => ok(b || file), type, 0.85));
  }).catch(() => file);
}
/** Sends one image (shrunk when big) and returns the server's answer { id, name, token, mime, size }. */
function imgSend(file, where, extra) {
  return imgShrink(file).then(blob => {
    if (blob.size > 3 * 1024 * 1024) throw new Error(L('Das Bild ist zu groß (höchstens 3 MB).', 'The image is too big (at most 3 MB).'));
    const mime = blob.type || file.type;
    // the name says what the file is after shrinking
    const name = String(file.name || 'Bild').replace(/\.(png|jpe?g|gif|webp)$/i, '') + '.' + mime.split('/')[1].replace('jpeg', 'jpg');
    return imgRead(blob).then(data => call('files.upload', Object.assign({ name: name, mime: mime, data: data }, where, extra || {}), { quiet: true }));
  });
}
function imgUpload(file, where, ta) {
  if (!IMG_TYPES.test(file.type)) { toast(L('Nur Bilder (JPEG, PNG, GIF oder WebP).', 'Images only (JPEG, PNG, GIF or WebP).')); return Promise.resolve(); }
  return imgSend(file, where)
    .then(r => imgInsert(typeof ta === 'function' ? ta() : ta, r.token)).catch(fail);
}
// documents next to the images (attachments of a jour fixe topic); the server checks the content again
const DOC_MIME = { pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
  txt: 'text/plain', csv: 'text/csv' };
/** An image (attach false) or a document (attach true) for a topic: resolves to { id, name, mime, size } or nothing. */
function fileUpload(file, where, attach) {
  if (!attach) {
    if (!IMG_TYPES.test(file.type)) { toast(L('Nur Bilder (JPEG, PNG, GIF oder WebP).', 'Images only (JPEG, PNG, GIF or WebP).')); return Promise.resolve(null); }
    return imgSend(file, where, { attach: true });
  }
  const ext = (/\.([a-z0-9]+)$/i.exec(file.name || '') || [])[1];
  const mime = DOC_MIME[String(ext || '').toLowerCase()];
  if (!mime) { toast(L('Dieser Dateityp ist nicht erlaubt (PDF, Word, Excel, PowerPoint, Text).', 'This file type is not allowed (PDF, Word, Excel, PowerPoint, text).')); return Promise.resolve(null); }
  if (file.size > 3 * 1024 * 1024) { toast(L('Die Datei ist zu groß (höchstens 3 MB).', 'The file is too big (at most 3 MB).'), { warn: true }); return Promise.resolve(null); }
  return imgRead(file).then(data => call('files.upload', Object.assign({ name: file.name, mime: mime, data: data, attach: true }, where), { quiet: true }));
}
/** The marker at the cursor (or at the end); the field's own input handling saves it. */
function imgInsert(ta, token) {
  if (!ta || !document.contains(ta)) { toast(L('Bild hochgeladen. Das Feld war schon zu – bitte erneut einfügen.', 'Image uploaded. The field was closed – please paste it again.')); return; }
  const at = typeof ta.selectionStart === 'number' ? ta.selectionStart : ta.value.length;
  const before = ta.value.slice(0, at), after = ta.value.slice(at);
  ta.value = before + (before && !/\s$/.test(before) ? ' ' : '') + token + (after && !/^\s/.test(after) ? ' ' : '') + after;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  ta.dispatchEvent(new Event('change', { bubbles: true }));
}
</script>
