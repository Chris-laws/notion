<script>
/* ==========================================================================
   Pages and database layouts (list, board, table, calendar), team calendar,
   capacity planning, teams, projects and settings.
   ========================================================================== */

const Views = {
  render() {
    const r = S.route;
    switch (r.view) {
      case 'home': return homePage();
      case 'all': return allPage();
      case 'team': return team(r.id) ? teamPage(team(r.id)) : notFound();
      case 'project': return project(r.id) ? projectPage(project(r.id)) : notFound();
      case 'calendar': return calendarPage();
      case 'capacity': return capacityPage();
      case 'settings': return settingsPage();
      default: return homePage();
    }
  },
  after() { bindDrag(); bindCalSelect(); },
};
function notFound() {
  return '<div class="page"><div class="empty">' + icon('search') + '<div>Diese Seite gibt es nicht mehr.</div><br>' +
    '<button class="btn outline" data-action="nav" data-view="home">Zu meinen Aufgaben</button></div></div>';
}

/* ---------------- database (task collection) ---------------- */
const LAYOUTS = [
  { key: 'list', label: 'Liste', ic: 'list' },
  { key: 'board', label: 'Board', ic: 'board' },
  { key: 'table', label: 'Tabelle', ic: 'table' },
  { key: 'calendar', label: 'Kalender', ic: 'calendar' },
];
const GROUPS = [
  { key: 'status', label: 'Status' }, { key: 'priority', label: 'Priorität' },
  { key: 'assignee', label: 'Person' }, { key: 'project', label: 'Projekt' },
];
function dbKey() { return S.route.view + ':' + (S.route.id || ''); }
function prefs() {
  if (!S.db) S.db = store.get('db', {});
  const k = dbKey();
  if (!S.db[k]) {
    S.db[k] = {
      layout: S.route.view === 'home' ? 'list' : 'board', groupBy: 'status', who: 'all', prio: [],
      showDone: S.route.view !== 'home', search: '', sort: { key: 'dueDate', dir: 1 },
    };
  }
  return S.db[k];
}
function setPrefs(patch) {
  Object.assign(prefs(), patch);
  store.set('db', S.db);
  render();
}
function applyFilters(list, p) {
  const q = (p.search || '').trim().toLowerCase();
  return list.filter(t => {
    if (q && (t.title + ' ' + t.tags.join(' ')).toLowerCase().indexOf(q) < 0) return false;
    if (p.who === 'me' && t.assignees.indexOf(S.me.email) < 0) return false;
    if (p.who === 'none' && t.assignees.length) return false;
    if (p.who && p.who.indexOf('@') > 0 && t.assignees.indexOf(p.who) < 0) return false;
    if (p.prio.length && p.prio.indexOf(t.priority) < 0) return false;
    return true;
  });
}
function bySort(a, b) { return (a.sort || 0) - (b.sort || 0) || (a.createdAt < b.createdAt ? -1 : 1); }
function rankPrio(t) { return (prioOf(t.priority) || { rank: 9 }).rank; }

function database(tasks, opts) {
  const p = prefs();
  opts = opts || {};
  const filtered = applyFilters(tasks, p);
  const whoLabel = p.who === 'all' ? '' : p.who === 'me' ? 'Mir zugewiesen' : p.who === 'none' ? 'Nicht zugewiesen' : user(p.who).name;
  const bar =
    '<div class="db-bar"><div class="tabs">' + LAYOUTS.map(l =>
      '<button class="tab' + (p.layout === l.key ? ' active' : '') + '" data-action="layout" data-v="' + l.key + '">' + icon(l.ic) + l.label + '</button>').join('') + '</div>' +
    '<input class="db-search' + (p.search ? ' open' : '') + '" placeholder="Suchen…" value="' + esc(p.search) + '" data-on-input="db-search">' +
    '<button class="icon-btn" data-action="db-search-open" title="Suchen">' + icon('search') + '</button>' +
    '<button class="btn" data-action="db-who">' + icon('user', 'sm') + 'Person</button>' +
    '<button class="btn" data-action="db-prio">' + icon('flag', 'sm') + 'Priorität</button>' +
    (p.layout === 'board' ? '<button class="btn" data-action="db-group">' + icon('layers', 'sm') + 'Gruppiert nach ' + esc(GROUPS.find(g => g.key === p.groupBy).label) + '</button>' : '') +
    (p.layout !== 'board' ? '<button class="btn' + (p.showDone ? ' on' : '') + '" data-action="db-done">' + icon('checksq', 'sm') + 'Erledigte</button>' : '') +
    '</div>';
  const chips = [];
  if (whoLabel) chips.push('<button class="fchip" data-action="db-clear" data-k="who">' + icon('user', 'sm') + esc(whoLabel) + icon('x', 'sm') + '</button>');
  if (p.prio.length) chips.push('<button class="fchip" data-action="db-clear" data-k="prio">' + icon('flag', 'sm') + esc(p.prio.map(k => (prioOf(k) || { label: 'Keine' }).label).join(', ')) + icon('x', 'sm') + '</button>');
  const chipsHtml = chips.length ? '<div class="filter-chips">' + chips.join('') + '</div>' : '';

  let body;
  const visibleDone = p.showDone ? filtered : filtered.filter(t => !isDone(t));
  if (p.layout === 'board') body = boardHtml(filtered.filter(t => !t.parentId || opts.includeSub), p, opts);
  else if (p.layout === 'table') body = tableHtml(visibleDone.filter(t => !t.parentId || opts.includeSub), p, opts);
  else if (p.layout === 'calendar') body = taskCalendarHtml(visibleDone, opts);
  else body = listHtml(visibleDone, opts);
  return bar + chipsHtml + body;
}
A.layout = el => setPrefs({ layout: el.dataset.v });
A['db-done'] = () => setPrefs({ showDone: !prefs().showDone });
A['db-clear'] = el => setPrefs(el.dataset.k === 'who' ? { who: 'all' } : { prio: [] });
A['db-search-open'] = () => { const i = $('.db-search'); i.classList.add('open'); i.focus(); };
ON.input['db-search'] = debounce(el => {
  prefs().search = el.value;
  store.set('db', S.db);
  const pos = el.selectionStart;
  render();
  const n = $('.db-search');
  if (n) { n.focus(); n.setSelectionRange(pos, pos); }
}, 200);
A['db-who'] = el => openMenu(el, [
  { value: 'all', html: icon('users', 'sm') + '<span>Alle</span>', search: 'alle' },
  { value: 'me', html: icon('user', 'sm') + '<span>Mir zugewiesen</span>', search: 'ich mir' },
  { value: 'none', html: icon('circle', 'sm') + '<span>Nicht zugewiesen</span>', search: 'niemand' },
].concat(peopleItems()), { selected: [prefs().who], onPick: v => setPrefs({ who: v }) });
A['db-prio'] = el => openMenu(el, Shared.PRIORITIES.map(p => ({ value: p.key, html: prioTag(p.key), search: p.label }))
  .concat([{ value: '', html: '<span class="faint">Keine</span>', search: 'keine' }]),
{ multi: true, search: false, selected: prefs().prio, onPick: (v, sel) => { prefs().prio = sel; store.set('db', S.db); render(); } });
A['db-group'] = el => openMenu(el, GROUPS.map(g => ({ value: g.key, html: '<span>' + g.label + '</span>', search: g.label })),
  { selected: [prefs().groupBy], search: false, onPick: v => setPrefs({ groupBy: v }) });

/* ----- card ----- */
function metaHtml(t, opts) {
  const subs = subtasks(t.id);
  const parts = [];
  if (t.priority) parts.push(prioTag(t.priority, true));
  if (t.dueDate) parts.push(dueTag(t));
  if (subs.length) parts.push('<span class="meta">' + icon('sub', 'sm') + subs.filter(isDone).length + '/' + subs.length + '</span>');
  if (t.estimate) parts.push('<span class="meta">' + icon('hourglass', 'sm') + esc(fmtHours(t.estimate)) + '</span>');
  if (t.recurrence) parts.push('<span class="meta" title="Wiederholt sich">' + icon('repeat', 'sm') + '</span>');
  if (opts && opts.withTags) t.tags.slice(0, 2).forEach(x => parts.push(tagChip(x)));
  return parts.join('');
}
function cardHtml(t, opts) {
  const p = !(opts && opts.hideProject) && t.projectId && project(t.projectId);
  const tm = !p && t.teams.length && team(t.teams[0]);
  const ctx = p ? mark(p) + '<span>' + esc(p.name) + '</span>' : tm ? mark(tm) + '<span>' + esc(tm.name) + '</span>' : '';
  const tags = t.tags.slice(0, 2).map(tagChip).join('');
  return '<div class="card' + (S.peekId === t.id ? ' selected' : '') + '" draggable="true" data-drag-id="' + esc(t.id) + '" data-action="open-task" data-id="' + esc(t.id) + '">' +
    (ctx ? '<div class="card-top">' + ctx + '</div>' : '') +
    '<div class="card-title' + (isDone(t) ? ' done' : '') + '">' + esc(t.title) + '</div>' +
    '<div class="card-meta">' + metaHtml(t, opts) + '</div>' +
    (tags || t.assignees.length ? '<div class="card-foot"><span style="display:flex;gap:4px;min-width:0">' + tags + '</span>' + (t.assignees.length ? avatars(t.assignees) : '') + '</div>' : '') +
    '</div>';
}
A['open-task'] = el => openPeek(el.dataset.id);
A['toggle-done'] = (el, e) => {
  e.stopPropagation();
  const t = task(el.dataset.id);
  if (!t) return;
  patchTask(t.id, { status: isDone(t) ? 'todo' : 'done' });
};

/* ----- board ----- */
function boardColumns(tasks, p) {
  if (p.groupBy === 'priority') {
    return Shared.PRIORITIES.map(x => ({ value: x.key, head: prioTag(x.key), preset: { priority: x.key } }))
      .concat([{ value: '', head: '<span class="faint">Keine Priorität</span>', preset: { priority: '' } }])
      .map(c => Object.assign(c, { tasks: tasks.filter(t => (t.priority || '') === c.value) }));
  }
  if (p.groupBy === 'assignee') {
    const emails = [S.me.email];
    tasks.forEach(t => t.assignees.forEach(e => { if (emails.indexOf(e) < 0) emails.push(e); }));
    return emails.map(e => ({ value: e, head: person(e), preset: { assignees: [e] }, tasks: tasks.filter(t => t.assignees.indexOf(e) >= 0) }))
      .concat([{ value: '', head: '<span class="faint">Nicht zugewiesen</span>', preset: { assignees: [] }, tasks: tasks.filter(t => !t.assignees.length) }]);
  }
  if (p.groupBy === 'project') {
    const ids = [];
    tasks.forEach(t => { if (t.projectId && ids.indexOf(t.projectId) < 0 && project(t.projectId)) ids.push(t.projectId); });
    return ids.map(id => ({ value: id, head: projectChip(project(id)), preset: { projectId: id }, tasks: tasks.filter(t => t.projectId === id) }))
      .concat([{ value: '', head: '<span class="faint">Ohne Projekt</span>', preset: { projectId: '' }, tasks: tasks.filter(t => !t.projectId) }]);
  }
  return Shared.STATUSES.map(s => ({ value: s.key, head: statusTag(s.key), preset: { status: s.key }, tasks: tasks.filter(t => t.status === s.key) }));
}
function boardHtml(tasks, p, opts) {
  const cols = boardColumns(tasks, p);
  return '<div class="board">' + cols.map(c => {
    const list = c.tasks.slice().sort(bySort);
    return '<div class="col" data-drop-group="' + esc(p.groupBy) + '" data-drop-value="' + esc(c.value) + '">' +
      '<div class="col-head">' + c.head + '<span class="n">' + list.length + '</span>' +
      '<button class="icon-btn" data-action="new-task" data-preset="' + attr(c.preset) + '" title="Neu">' + icon('plus', 'sm') + '</button></div>' +
      list.map(t => cardHtml(t, opts)).join('') +
      '<button class="add-row" data-action="new-task" data-preset="' + attr(c.preset) + '">' + icon('plus', 'sm') + 'Neu</button></div>';
  }).join('') + '</div>';
}

/* ----- drag & drop (board + calendar) ----- */
const dragState = { id: null, from: null };
function bindDrag() {
  $$('[data-drag-id]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragState.id = el.dataset.dragId;
      const col = el.closest('[data-drop-value]');
      dragState.from = col ? col.dataset.dropValue : null;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragState.id); } catch (err) { /* IE */ }
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragState.id = null; $$('.drop').forEach(x => x.classList.remove('drop')); });
  });
  $$('[data-drop-value], [data-drop-date]').forEach(zone => {
    zone.addEventListener('dragover', e => { if (dragState.id) { e.preventDefault(); zone.classList.add('drop'); } });
    zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drop'); });
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drop');
      const id = dragState.id;
      dragState.id = null;
      const t = task(id);
      if (!t) return;
      if (zone.dataset.dropDate) return dropOnDate(t, zone.dataset.dropDate);
      dropOnColumn(t, zone, e.clientY);
    });
  });
}
function dropOnDate(t, date) {
  if (t.dueDate === date) return;
  const patch = { dueDate: date };
  if (t.startDate && t.dueDate) patch.startDate = Shared.addDays(t.startDate, Shared.diffDays(t.dueDate, date));
  patchTask(t.id, patch);
}
function dropOnColumn(t, zone, y) {
  const field = zone.dataset.dropGroup;
  const value = zone.dataset.dropValue;
  const cards = $$('.card', zone).filter(c => c.dataset.dragId !== t.id);
  let idx = cards.findIndex(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (idx < 0) idx = cards.length;
  const before = cards[idx - 1] && task(cards[idx - 1].dataset.dragId);
  const after = cards[idx] && task(cards[idx].dataset.dragId);
  let sort;
  if (before && after) sort = (before.sort + after.sort) / 2;
  else if (before) sort = before.sort + 1000;
  else if (after) sort = after.sort - 1000;
  else sort = Date.now();
  const patch = { sort: sort };
  if (field === 'status') patch.status = value;
  if (field === 'priority') patch.priority = value;
  if (field === 'project') patch.projectId = value;
  if (field === 'assignee') {
    let list = t.assignees.filter(e => e !== dragState.from);
    if (value && list.indexOf(value) < 0) list.push(value);
    if (!value) list = [];
    patch.assignees = list;
  }
  patchTask(t.id, patch);
}

/* ----- table ----- */
const COLUMNS = [
  { key: 'status', label: 'Status', ic: 'status', cell: t => statusTag(t.status) },
  { key: 'assignees', label: 'Zugewiesen', ic: 'user', cell: t => (t.assignees.length === 1 ? person(t.assignees[0]) : avatars(t.assignees, 4)) },
  { key: 'priority', label: 'Priorität', ic: 'flag', cell: t => prioTag(t.priority) },
  { key: 'dueDate', label: 'Fällig', ic: 'calendar', cell: t => dueTag(t) },
  { key: 'projectId', label: 'Projekt', ic: 'folder', cell: t => projectChip(project(t.projectId)) },
  { key: 'teams', label: 'Teams', ic: 'users', cell: t => t.teams.map(id => teamChip(team(id))).join('') },
  { key: 'estimate', label: 'Aufwand', ic: 'hourglass', cell: t => esc(fmtHours(t.estimate)) },
  { key: 'tags', label: 'Tags', ic: 'tag', cell: t => t.tags.map(tagChip).join('') },
];
function sortValue(t, key) {
  switch (key) {
    case 'title': return t.title.toLowerCase();
    case 'status': return Shared.STATUSES.findIndex(s => s.key === t.status);
    case 'priority': return rankPrio(t);
    case 'dueDate': return t.dueDate || '9999';
    case 'assignees': return t.assignees.map(e => user(e).name).join(',') || '~';
    case 'projectId': return t.projectId ? (project(t.projectId) || {}).name || '' : '~';
    case 'estimate': return t.estimate || 0;
    default: return '';
  }
}
function tableHtml(tasks, p, opts) {
  const s = p.sort || { key: 'dueDate', dir: 1 };
  const list = tasks.slice().sort((a, b) => {
    const x = sortValue(a, s.key), y = sortValue(b, s.key);
    return (x < y ? -1 : x > y ? 1 : 0) * s.dir || bySort(a, b);
  });
  const cols = COLUMNS.filter(c => !(opts.hideProject && c.key === 'projectId'));
  const ind = k => (s.key === k ? '<span class="sort-ind">' + (s.dir > 0 ? '▲' : '▼') + '</span>' : '');
  return '<div class="table-wrap"><table class="db"><thead><tr>' +
    '<th data-action="sort" data-k="title" style="min-width:300px">' + icon('text', 'sm') + ' Titel' + ind('title') + '</th>' +
    cols.map(c => '<th data-action="sort" data-k="' + c.key + '">' + icon(c.ic, 'sm') + ' ' + c.label + ind(c.key) + '</th>').join('') +
    '</tr></thead><tbody>' + list.map(t =>
    '<tr><td><div class="title-cell" data-action="open-task" data-id="' + esc(t.id) + '">' +
      '<span class="check' + (isDone(t) ? ' on' : '') + '" data-action="toggle-done" data-id="' + esc(t.id) + '" role="checkbox" aria-checked="' + isDone(t) + '"></span>' +
      '<span' + (isDone(t) ? ' class="faint" style="text-decoration:line-through"' : '') + '>' + esc(t.title) + '</span>' +
      '<span class="open">' + icon('open', 'sm') + 'Öffnen</span></div></td>' +
      cols.map(c => '<td><div class="cell" data-action="prop" data-id="' + esc(t.id) + '" data-field="' + c.key + '">' + c.cell(t) + '</div></td>').join('') +
      '</tr>').join('') +
    '</tbody></table></div><button class="add-row" data-action="new-task">' + icon('plus', 'sm') + 'Neu</button>';
}
A.sort = el => {
  const p = prefs();
  const k = el.dataset.k;
  setPrefs({ sort: { key: k, dir: p.sort && p.sort.key === k ? -p.sort.dir : 1 } });
};

/* ----- list ----- */
function listRow(t, opts) {
  const p = !(opts && opts.hideProject) && t.projectId && project(t.projectId);
  return '<div class="lrow" data-action="open-task" data-id="' + esc(t.id) + '">' +
    '<span class="check' + (isDone(t) ? ' on' : '') + '" data-action="toggle-done" data-id="' + esc(t.id) + '" role="checkbox" aria-checked="' + isDone(t) + '" title="Erledigt"></span>' +
    '<div class="t"><span class="title' + (isDone(t) ? ' done' : '') + '">' + esc(t.title) + '</span>' +
    (t.parentId && task(t.parentId) ? '<span class="parent">↳ ' + esc(task(t.parentId).title) + '</span>' : '') + '</div>' +
    '<div class="side">' + metaHtml(t, Object.assign({ withTags: true }, opts)) + (p ? '<span class="meta">' + mark(p) + esc(p.name) + '</span>' : '') +
    (t.assignees.length ? avatars(t.assignees) : '') + '</div></div>';
}
function listHtml(tasks, opts) {
  const today = TODAY();
  const weekEnd = Shared.addDays(Shared.mondayOf(today), 6);
  let groups;
  if (S.route.view === 'home') {
    groups = [
      { label: 'Überfällig', danger: true, f: t => !isDone(t) && t.dueDate && t.dueDate < today },
      { label: 'Heute', f: t => !isDone(t) && t.dueDate === today },
      { label: 'Diese Woche', f: t => !isDone(t) && t.dueDate > today && t.dueDate <= weekEnd },
      { label: 'Später', f: t => !isDone(t) && t.dueDate > weekEnd },
      { label: 'Ohne Datum', f: t => !isDone(t) && !t.dueDate },
      { label: 'Erledigt', f: isDone },
    ];
  } else {
    groups = Shared.STATUSES.map(s => ({ label: s.label, glyph: s.key, f: t => t.status === s.key }));
  }
  const html = groups.map(g => {
    const list = tasks.filter(g.f).sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || rankPrio(a) - rankPrio(b) || bySort(a, b));
    if (!list.length) return '';
    return '<div class="group"><div class="group-head' + (g.danger ? ' danger' : '') + '">' + (g.glyph ? glyph(g.glyph) : '') + esc(g.label) + '<span class="n">' + list.length + '</span></div>' +
      list.map(t => listRow(t, opts)).join('') + '</div>';
  }).join('');
  return html || emptyState(opts.empty);
}
function emptyState(text) {
  return '<div class="empty">' + icon('checksq') + '<div>' + esc(text || 'Keine Aufgaben hier.') + '</div><br>' +
    '<button class="btn outline" data-action="palette">' + icon('plus', 'sm') + 'Aufgabe anlegen</button></div>';
}

/* ---------------- calendar data ---------------- */
function monthDays(cursor) {
  const first = cursor.slice(0, 8) + '01';
  const start = Shared.mondayOf(first);
  const end = Shared.addDays(Shared.mondayOf(Shared.endOfMonth(first)), 6);
  const days = [];
  for (let d = start; d <= end; d = Shared.addDays(d, 1)) days.push(d);
  return days;
}
function calCursor() {
  if (!S.cal.cursor) S.cal.cursor = TODAY().slice(0, 8) + '01';
  return S.cal.cursor;
}
function calKey(from, to, teamId) { return from + '|' + to + '|' + (teamId || ''); }
/** Returns cached range data or starts loading it (and re-renders when done). */
function calEnsure(from, to, teamId) {
  const key = calKey(from, to, teamId);
  const hit = S.cal.cache[key];
  if (hit && hit !== 'loading') return hit;
  if (!hit) {
    S.cal.cache[key] = 'loading';
    call('calendar.range', { from: from, to: to, teamId: teamId || '' })
      .then(d => { S.cal.cache[key] = d; render({ peek: false }); })
      .catch(err => { delete S.cal.cache[key]; fail(err); });
  }
  return null;
}
function calReload() { S.cal.cache = {}; S.cap.data = null; S.briefing = null; render(); }
function calFind(kind, id) {
  let hit = null;
  Object.keys(S.cal.cache).forEach(k => {
    const d = S.cal.cache[k];
    if (d && d[kind]) hit = hit || d[kind].find(x => x.id === id);
  });
  return hit;
}
const absenceType = k => Shared.ABSENCE_TYPES.find(x => x.key === k) || Shared.ABSENCE_TYPES[3];
function dayBox(date) {
  return '<div class="d"><b>' + Number(date.slice(8)) + '</b><small>' + MONTHS[Number(date.slice(5, 7)) - 1] + '</small></div>';
}

/* ---------------- month grid ---------------- */
/**
 * o: { cursor, tasks, data, people (emails in scope or null = everyone), show, teamId, select }
 */
function monthHtml(o) {
  const days = monthDays(o.cursor);
  const month = o.cursor.slice(0, 7);
  const today = TODAY();
  const data = o.data || { events: [], holidays: [], absences: [], warnings: [] };
  const show = o.show || { tasks: true, events: true, absences: true, holidays: true };
  const inScope = e => !o.people || o.people.indexOf(e) >= 0;
  return '<div class="cal">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => '<div class="cal-dow">' + d + '</div>').join('') +
    days.map(d => {
      const wd = Shared.weekday(d);
      const weekend = wd === 0 || wd === 6;
      const hol = data.holidays.filter(h => h.date === d && h.affects.some(inScope));
      const warn = (data.warnings || []).filter(w => w.date === d && (!o.teamId || w.teamId === o.teamId));
      const awayEmails = [];
      if (show.absences && !weekend) {
        data.absences.filter(a => a.startDate <= d && a.endDate >= d && inScope(a.email)).forEach(a => { if (awayEmails.indexOf(a.email) < 0) awayEmails.push(a.email); });
        if (show.holidays) hol.forEach(h => h.affects.filter(inScope).forEach(e => { if (awayEmails.indexOf(e) < 0) awayEmails.push(e); }));
      }
      const items = [];
      if (show.events) data.events.filter(e => e.startDate <= d && (e.endDate || e.startDate) >= d).forEach(e => {
        items.push('<div class="ev event' + (e.type === 'milestone' ? ' milestone' : '') + '" data-action="event-edit" data-id="' + esc(e.id) + '" title="' + esc(e.title) + '"><span>' + esc(e.title) + '</span></div>');
      });
      if (show.tasks) (o.tasks || []).filter(t => t.dueDate === d).sort((a, b) => rankPrio(a) - rankPrio(b)).forEach(t => {
        items.push('<div class="ev task' + (isDone(t) ? ' done' : '') + '" draggable="true" data-drag-id="' + esc(t.id) + '" data-action="open-task" data-id="' + esc(t.id) + '" title="' + esc(t.title) + '">' +
          glyph(t.status) + '<span>' + esc(t.title) + '</span></div>');
      });
      const max = 3;
      const holLabel = show.holidays && hol.length
        ? '<span class="hol" title="' + esc(hol.map(h => h.name + ' (' + h.country + ')').join(', ')) + '">' + esc(hol[0].name) + (hol.length > 1 ? ' +' + (hol.length - 1) : '') + '</span>' : '';
      const badge = warn.length
        ? '<span class="wbadge" title="' + esc(warn.map(w => w.teamName + ': ' + w.absent + ' von ' + w.total + ' abwesend').join('\n')) + '">' +
          esc((o.teamId ? '' : warn[0].teamName + ' ') + warn[0].absent + '/' + warn[0].total + ' weg') + '</span>' : '';
      const cls = ['cal-day', d.slice(0, 7) !== month ? 'other' : '', d === today ? 'today' : '', weekend ? 'weekend' : '', warn.length ? 'warn' : ''].join(' ');
      return '<div class="' + cls + '" data-drop-date="' + d + '" data-sel-date="' + d + '" data-action="cal-day" data-date="' + d + '">' +
        '<div class="daytop"><span class="daynum">' + Number(d.slice(8)) + '</span>' + holLabel + badge + '</div>' +
        (awayEmails.length ? '<div class="away" data-action="day-away" data-date="' + d + '" title="' + esc(awayEmails.map(e => user(e).name).join(', ')) + '">' +
          avatars(awayEmails, 4) + '<span>' + awayEmails.length + ' abwesend</span></div>' : '') +
        items.slice(0, max).join('') + (items.length > max ? '<div class="ev more">+' + (items.length - max) + ' weitere</div>' : '') + '</div>';
    }).join('') + '</div>';
}

/* Drag across days to enter a vacation (team calendar only). */
const calSel = { start: null, end: null, active: false, justSelected: false };
function paintSel() {
  const a = calSel.start < calSel.end ? calSel.start : calSel.end;
  const b = calSel.start < calSel.end ? calSel.end : calSel.start;
  $$('[data-sel-date]').forEach(c => c.classList.toggle('sel', calSel.active && c.dataset.selDate >= a && c.dataset.selDate <= b));
}
function bindCalSelect() {
  if (S.route.view !== 'calendar') return;
  $$('[data-sel-date]').forEach(cell => {
    cell.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('.ev, .away')) return;
      calSel.start = calSel.end = cell.dataset.selDate;
      calSel.active = true;
    });
    cell.addEventListener('mouseenter', () => {
      if (!calSel.active) return;
      calSel.end = cell.dataset.selDate;
      paintSel();
    });
  });
}
document.addEventListener('mouseup', () => {
  if (!calSel.active) return;
  calSel.active = false;
  if (calSel.start && calSel.end && calSel.start !== calSel.end) {
    const a = calSel.start < calSel.end ? calSel.start : calSel.end;
    const b = calSel.start < calSel.end ? calSel.end : calSel.start;
    calSel.justSelected = true;
    setTimeout(() => { calSel.justSelected = false; }, 300);
    absenceModal({ type: 'vacation', email: S.me.email, startDate: a, endDate: b });
  }
  paintSel();
});

  const abs = d.absences.filter(a => a.endDate >= t && inScope(a.email)).sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 6);
  const warns = d.warnings.slice(0, 6);

    '<div class="panel"><h3>' + icon('plane', 'sm') + 'Abwesenheiten</h3><div class="hlist">' + (abs.map(a =>
      '<div class="hitem" data-action="absence-edit" data-id="' + esc(a.id) + '" style="cursor:pointer">' + avatar(a.email, 'lg') +
      '<div class="what"><div>' + esc(user(a.email).name) + '</div><div class="muted">' + esc(absenceType(a.type).label + ' · ' + fmtRange(a.startDate, a.endDate)) + '</div></div></div>').join('') ||
      '<div class="faint" style="font-size:13px;padding:4px 6px">Niemand ist abwesend.</div>') + '</div></div>' +
    '<div class="panel"><h3>' + icon('globe', 'sm') + 'Feiertage</h3><div class="hlist">' + (hl.map(h =>
      '<div class="hitem">' + dayBox(h.date) + '<div class="what"><div>' + esc(h.name) + '</div>' +
      '<div class="muted">' + h.countries.map(flag).join(' ') + ' ' + esc(DOW[Shared.weekday(h.date)] + ' · ' + h.affects.map(e => user(e).name.split(' ')[0]).join(', ')) + '</div></div></div>').join('') ||
      '<div class="faint" style="font-size:13px;padding:4px 6px">Keine in den nächsten 90 Tagen.</div>') + '</div></div>';
}
A['cal-show'] = el => { S.cal.show[el.dataset.k] = !S.cal.show[el.dataset.k]; render(); };
function scopeMenu(el, current, onPick) {
  openMenu(el, [{ value: '', html: icon('users', 'sm') + '<span>Alle Personen</span>', search: 'alle' }]
    .concat(S.teams.map(t => ({ value: t.id, html: teamChip(t), search: t.name }))), { selected: [current || ''], onPick: onPick });
}
A['cal-team'] = el => scopeMenu(el, S.cal.teamId, v => { S.cal.teamId = v; render(); });

/* ---------------- availability (capacity) ---------------- */
const ABS_LETTER = { vacation: 'U', sick: 'K', training: 'F', other: 'A', holiday: 'FT' };
function capacityPage() {
  const c = S.cap;
  if (!c.from) c.from = Shared.mondayOf(TODAY());
  if (c.teamId === undefined || c.teamId === null || (c.teamId && !team(c.teamId))) c.teamId = (myTeams()[0] || {}).id || '';
  const teamId = c.teamId;
  const weeks = c.weeks > 13 ? 6 : c.weeks || 6;
  const key = [teamId, c.from, weeks].join('|');
  if (!c.data || c.key !== key) {
    if (!c.loading || c.loadingKey !== key) {
      c.loading = true;
      c.loadingKey = key;
      call('availability', { teamId: teamId, from: c.from, weeks: weeks })
        .then(d => { c.data = d; c.key = key; c.loading = false; if (S.route.view === 'capacity') render({ peek: false }); })
        .catch(err => { c.loading = false; fail(err); });
    }
  }
  const d = c.data && c.key === key ? c.data : null;
  const head = '<div class="page wide">' +
    pageHead('Verfügbarkeit', 'Wer ist wann da? Urlaub und Abwesenheiten kommen aus dem Teamkalender, gesetzliche Feiertage je Land und Bundesland sind eingerechnet. Ab ' +
      ((d && d.threshold) || 50) + ' % Abwesenheit im Team gibt es eine Warnung.', '',
      '<button class="btn primary" data-action="absence-new">' + icon('plane', 'sm') + 'Urlaub eintragen</button>') +
    '<div class="db-bar"><div class="tabs">' + scopeButton('cap-team', teamId) +
    '<div class="seg" style="margin-left:6px">' + [4, 6, 8, 13].map(n => '<button class="' + (weeks === n ? 'on' : '') + '" data-action="cap-weeks" data-n="' + n + '">' + n + ' Wo.</button>').join('') + '</div></div>' +
    '<button class="icon-btn" data-action="cap-prev" aria-label="Früher">' + icon('left') + '</button>' +
    '<button class="btn outline sm" data-action="cap-today">Diese Woche</button>' +
    '<button class="icon-btn" data-action="cap-next" aria-label="Später">' + icon('right') + '</button></div>';
  if (!d) return head + '<div class="skeleton" style="height:260px;border-radius:12px"></div></div>';

  const work = d.days.filter(x => { const wd = Shared.weekday(x); return wd !== 0 && wd !== 6; });
  const warnDays = d.team.filter(x => x.warn);
  const banner = warnDays.length
    ? '<div class="banner danger">' + icon('alert') + '<div><b>' + warnDays.length + (warnDays.length === 1 ? ' Tag' : ' Tage') + ' mit ≥ ' + d.threshold + ' % Abwesenheit' +
      (teamId ? ' in ' + esc(team(teamId).name) : '') + '.</b> Bitte Urlaube abstimmen oder Vertretung klären.' +
      '<div class="days-list">' + warnDays.slice(0, 14).map(w => '<span class="chip danger" title="' + esc(w.people.map(x => user(x.email).name + ' – ' + (x.kind === 'holiday' ? x.label : absenceType(x.kind).label)).join('\n')) + '">' +
        esc(DOW[Shared.weekday(w.date)] + ' ' + fmtDate(w.date, { absolute: true }) + ' · ' + w.absent + '/' + w.total) + '</span>').join('') + '</div></div></div>'
    : '<div class="banner ok">' + icon('check') + '<div><b>Gut besetzt.</b> Im gewählten Zeitraum ist nie die Hälfte des Teams gleichzeitig weg.</div></div>';

  const today = TODAY();
  const th = '<tr><th class="who">' + d.members.length + ' Personen</th>' + work.map(x =>
    '<th class="' + (Shared.weekday(x) === 1 ? 'wk ' : '') + (x === today ? 'today' : '') + '">' + DOW[Shared.weekday(x)] + '<small>' + Number(x.slice(8)) + '.' + Number(x.slice(5, 7)) + '.</small></th>').join('') + '</tr>';
  const rows = d.members.map(m => '<tr><td class="who"><div class="person">' + avatar(m.email, 'md') + '<div style="min-width:0;line-height:1.3"><div style="font-weight:500;font-size:13px">' + esc(m.name) + '</div>' +
    '<div class="faint" style="font-size:11.5px">' + esc(m.region || m.country || '') + (m.awayDays ? ' · ' + m.awayDays + ' Tage weg' : '') + '</div></div></div></td>' +
    work.map(x => {
      const cell = m.cells[x];
      const inner = !cell.works ? '<div class="blk off" title="Kein Arbeitstag"></div>'
        : cell.away ? '<div class="blk ' + esc(cell.kind) + '" title="' + esc(cell.label) + '">' + (ABS_LETTER[cell.kind] || '') + '</div>' : '';
      return '<td class="c' + (Shared.weekday(x) === 1 ? ' wk' : '') + '">' + inner + '</td>';
    }).join('') + '</tr>').join('');
  const foot = '<tr><td class="who">Abwesend</td>' + work.map(x => {
    const tday = d.team.find(y => y.date === x);
    const cls = tday.warn ? 'warn' : tday.ratio >= 25 ? 'mid' : '';
    return '<td class="c' + (Shared.weekday(x) === 1 ? ' wk' : '') + '"><span class="pct ' + cls + '" title="' + tday.absent + ' von ' + tday.total + '">' + (tday.absent ? tday.ratio + '%' : '–') + '</span></td>';
  }).join('') + '</tr>';
  const legend = '<div class="legend">' + Shared.ABSENCE_TYPES.map(a => '<span><span class="sw" style="background:var(--' + a.key + ')"></span>' + esc(a.label) + '</span>').join('') +
    '<span><span class="sw" style="background:var(--holiday)"></span>Feiertag</span><span><span class="sw blk off" style="display:inline-block;width:10px;height:10px;margin:0 6px 0 0"></span>kein Arbeitstag (Teilzeit)</span></div>';
  return head + banner + '<div class="av-wrap"><table class="av"><thead>' + th + '</thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + legend + '</div>';
}
function fmtNum(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }
function uniq(a) { return a.filter((x, i) => a.indexOf(x) === i); }
A['cap-team'] = el => scopeMenu(el, S.cap.teamId, v => { S.cap.teamId = v; render(); });
A['cap-weeks'] = el => { S.cap.weeks = Number(el.dataset.n); render(); };
A['cap-prev'] = () => { S.cap.from = Shared.addDays(S.cap.from, -7); render(); };
A['cap-next'] = () => { S.cap.from = Shared.addDays(S.cap.from, 7); render(); };
A['cap-today'] = () => { S.cap.from = Shared.mondayOf(TODAY()); render(); };

/* ---------------- settings ---------------- */
const COUNTRIES = [['DE', 'Deutschland'], ['AT', 'Österreich'], ['CH', 'Schweiz'], ['US', 'USA'], ['GB', 'Vereinigtes Königreich'],
  ['FR', 'Frankreich'], ['IT', 'Italien'], ['ES', 'Spanien'], ['NL', 'Niederlande'], ['BE', 'Belgien'], ['LU', 'Luxemburg'],
  ['PL', 'Polen'], ['CZ', 'Tschechien'], ['DK', 'Dänemark'], ['SE', 'Schweden'], ['NO', 'Norwegen'], ['FI', 'Finnland'],
  ['IE', 'Irland'], ['PT', 'Portugal'], ['HU', 'Ungarn'], ['RO', 'Rumänien'], ['HR', 'Kroatien'], ['GR', 'Griechenland'],
  ['TR', 'Türkei'], ['UA', 'Ukraine'], ['RS', 'Serbien'], ['CA', 'Kanada'], ['MX', 'Mexiko'], ['BR', 'Brasilien'],
  ['AR', 'Argentinien'], ['CN', 'China'], ['JP', 'Japan'], ['KR', 'Südkorea'], ['SG', 'Singapur'], ['AU', 'Australien'],
  ['NZ', 'Neuseeland'], ['ZA', 'Südafrika']];
const DE_STATES = [['DE-BW', 'Baden-Württemberg'], ['DE-BY', 'Bayern'], ['DE-BE', 'Berlin'], ['DE-BB', 'Brandenburg'], ['DE-HB', 'Bremen'],
  ['DE-HH', 'Hamburg'], ['DE-HE', 'Hessen'], ['DE-MV', 'Mecklenburg-Vorpommern'], ['DE-NI', 'Niedersachsen'], ['DE-NW', 'Nordrhein-Westfalen'],
  ['DE-RP', 'Rheinland-Pfalz'], ['DE-SL', 'Saarland'], ['DE-SN', 'Sachsen'], ['DE-ST', 'Sachsen-Anhalt'], ['DE-SH', 'Schleswig-Holstein'], ['DE-TH', 'Thüringen']];
const AVATAR_COLORS = ['#e16b5c', '#e5894a', '#d9a72a', '#5aa36b', '#3e8ed0', '#7a6ad8', '#c45fa0', '#4aa8a8', '#8a7a6a'];

function settingsPage() {
  const me = S.me;
  const days = String(me.workDays || '').split(',');
  const t = TODAY();
  const abs = calEnsure(Shared.addDays(t, -30), Shared.addDays(t, 365), '');
  const myAbs = abs ? abs.absences.filter(a => a.email === me.email && a.endDate >= t) : null;
  const profile = '<form data-on-submit="profile" class="settings-grid">' +
    field('Name', '<input class="input" name="name" value="' + esc(me.name) + '">') +
    divField('Farbe', '<input type="hidden" name="color" value="' + esc(me.color) + '"><div class="color-row">' + AVATAR_COLORS.map(c =>
      '<button type="button" class="' + (c === me.color ? 'on' : '') + '" style="background:' + c + '" data-action="pick-color" data-v="' + c + '"></button>').join('') + '</div>') +
    field('Land (für Feiertage)', '<select class="select" name="country">' + COUNTRIES.map(c => '<option value="' + c[0] + '"' + (c[0] === me.country ? ' selected' : '') + '>' + c[1] + ' (' + c[0] + ')</option>').join('') + '</select>') +
    field('Bundesland / Region', '<input class="input" name="region" list="regions" value="' + esc(me.region || '') + '" placeholder="z. B. DE-BY, CH-ZH, US-CA">' +
      '<datalist id="regions">' + DE_STATES.map(s => '<option value="' + s[0] + '">' + s[1] + '</option>').join('') + '</datalist>') +
    field('Wochenstunden', '<input class="input" type="number" min="0" max="80" step="0.5" name="hoursPerWeek" value="' + esc(me.hoursPerWeek) + '">') +
    divField('Arbeitstage', '<div class="days">' + [1, 2, 3, 4, 5, 6, 0].map(d => '<label><input type="checkbox" name="workDays" value="' + d + '"' + (days.indexOf(String(d)) >= 0 ? ' checked' : '') + '><span>' + DOW[d] + '</span></label>').join('') + '</div>') +
    '<div><button class="btn primary" type="submit">Profil speichern</button></div></form>';

  const absHtml = myAbs === null ? '<div class="skeleton"></div>' : (myAbs.map(a => {
    const ty = Shared.ABSENCE_TYPES.find(x => x.key === a.type) || Shared.ABSENCE_TYPES[3];
    return '<div class="li"><span class="chip"><span class="dot" style="background:var(--' + ty.key + ')"></span>' + esc(ty.label) + '</span><span class="grow">' + esc(fmtRange(a.startDate, a.endDate)) +
      (a.note ? ' <span class="faint">· ' + esc(a.note) + '</span>' : '') + '</span>' +
      '<button class="btn sm" data-action="absence-edit" data-id="' + esc(a.id) + '">Bearbeiten</button></div>';
  }).join('') || '<div class="empty-li">Keine geplanten Abwesenheiten.</div>');

  const ai = '<div class="notice">' + (S.ai.enabled
    ? '✅ <b>Vertex AI ist aktiv</b> (Modell <code>' + esc(S.ai.model) + '</code>). Briefing, Quick-Add und Aufgaben-Zerlegung nutzen Gemini.'
    : '<b>Regelbasierter Modus.</b> Alle smarten Funktionen laufen bereits mit Regeln (Quick-Add-Parser, Kapazitäts-Vorschläge, Briefing). ' +
      'Für KI: im Apps-Script-Projekt unter <i>Projekteinstellungen → Skripteigenschaften</i> den Wert <code>VERTEX_API_KEY</code> setzen ' +
      '(Platzhalter: <code>PLATZHALTER_VERTEX_AI_API_KEY</code>), optional <code>VERTEX_MODEL</code>, <code>VERTEX_PROJECT_ID</code>, <code>VERTEX_LOCATION</code>.') + '</div>';

  let admin = '';
  if (me.admin) {
    admin = '<div class="h2">' + icon('users') + 'Personen <span class="faint" style="font-weight:400">· Admin</span></div><div class="list-plain">' +
      S.users.slice().sort((a, b) => a.name.localeCompare(b.name)).map(u => '<div class="li">' + avatar(u.email) + '<span class="grow">' + esc(u.name) +
        ' <span class="faint">' + esc(u.email) + '</span></span><span class="faint num">' + esc((u.region || u.country || '') + ' · ' + u.hoursPerWeek + ' h') + '</span>' +
        '<button class="btn sm' + (u.role === 'admin' ? ' active' : '') + '" data-action="user-role" data-email="' + esc(u.email) + '"' + (u.email === me.email ? ' disabled' : '') + '>' + (u.role === 'admin' ? 'Admin' : 'Mitglied') + '</button>' +
        '<button class="btn sm" data-action="user-edit" data-email="' + esc(u.email) + '">Bearbeiten</button></div>').join('') + '</div>' +
      '<button class="btn sm outline" data-action="user-invite" style="margin-top:8px">' + icon('plus', 'sm') + 'Person hinzufügen</button>' +
      '<div class="h2">' + icon('globe') + 'Firmen-Feiertage <span class="faint" style="font-weight:400">· zusätzlich zu den gesetzlichen</span></div><div class="list-plain">' +
      (S.companyHolidays.slice().sort((a, b) => a.date.localeCompare(b.date)).map(h => '<div class="li"><span class="faint nowrap" style="width:110px">' + esc(fmtDate(h.date, { absolute: true })) + '</span>' +
        '<span class="grow">' + esc(h.name) + ' <span class="faint">' + esc(h.countries.length ? h.countries.join(', ') : 'alle Länder') + '</span></span>' +
        '<button class="btn sm danger" data-action="ch-remove" data-id="' + esc(h.id) + '">Entfernen</button></div>').join('') || '<div class="empty-li">Keine.</div>') +
      '</div><button class="btn sm outline" data-action="ch-new" style="margin-top:8px">' + icon('plus', 'sm') + 'Firmen-Feiertag</button>';
  }
  return '<div class="page">' + pageHead('Einstellungen', '') +
    '<p class="page-sub">Angemeldet über Google als <b>' + esc(me.email) + '</b>. Land, Region, Wochenstunden und Arbeitstage bestimmen deine Kapazität.</p>' +
    '<div class="h2">' + icon('user') + 'Profil</div>' + profile +
    '<div class="h2">' + icon('plane') + 'Meine Abwesenheiten</div><div class="list-plain">' + absHtml + '</div>' +
    '<button class="btn sm outline" data-action="absence-new" style="margin-top:8px">' + icon('plus', 'sm') + 'Abwesenheit eintragen</button>' +
    '<div class="h2">' + icon('sparkle') + 'Smarte Funktionen</div>' + ai + admin + '</div>';
}
ON.submit.profile = form => {
  const v = formValues(form);
  call('users.save', v).then(u => {
    form.removeAttribute('data-touched');
    Object.assign(S.me, u);
    applyUser(u);
    S.cap.data = null; S.cal.cache = {}; S.briefing = null;
    toast('Profil gespeichert');
    render();
  }).catch(fail);
};
function applyUser(u) {
  const i = S.users.findIndex(x => x.email === u.email);
  if (i >= 0) S.users[i] = u; else S.users.push(u);
}
A['user-role'] = el => {
  const u = user(el.dataset.email);
  call('users.save', { email: u.email, role: u.role === 'admin' ? 'member' : 'admin' }).then(x => { applyUser(x); render(); }).catch(fail);
};
function userModal(u) {
  const isNew = !u;
  u = u || { country: S.me.country, hoursPerWeek: 40, workDays: '1,2,3,4,5' };
  const days = String(u.workDays || '').split(',');
  openModal({
    title: isNew ? 'Person hinzufügen' : u.name + ' bearbeiten',
    body: (isNew ? field('E-Mail (Google-Konto)', '<input class="input" name="email" type="email" required>') : '<input type="hidden" name="email" value="' + esc(u.email) + '">') +
      field('Name', '<input class="input" name="name" value="' + esc(u.name || '') + '">') +
      '<div class="row">' + field('Land', '<select class="select" name="country">' + COUNTRIES.map(c => '<option value="' + c[0] + '"' + (c[0] === u.country ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select>') +
      field('Region', '<input class="input" name="region" list="regions2" value="' + esc(u.region || '') + '"><datalist id="regions2">' + DE_STATES.map(s => '<option value="' + s[0] + '">' + s[1] + '</option>').join('') + '</datalist>') + '</div>' +
      field('Wochenstunden', '<input class="input" type="number" name="hoursPerWeek" min="0" max="80" step="0.5" value="' + esc(u.hoursPerWeek) + '">') +
      divField('Arbeitstage', '<div class="days">' + [1, 2, 3, 4, 5, 6, 0].map(d => '<label><input type="checkbox" name="workDays" value="' + d + '"' + (days.indexOf(String(d)) >= 0 ? ' checked' : '') + '><span>' + DOW[d] + '</span></label>').join('') + '</div>'),
    danger: !isNew && u.email !== S.me.email ? { label: 'Deaktivieren', onClick: () => call('users.save', { email: u.email, active: false }).then(() => { closeModal(); reloadAll(); }).catch(fail) } : null,
    onSubmit: v => call('users.save', v).then(x => { applyUser(x); S.cap.data = null; render(); }),
  });
}
A['user-edit'] = el => userModal(user(el.dataset.email));
A['user-invite'] = () => userModal(null);
A['ch-new'] = () => openModal({
  title: 'Firmen-Feiertag',
  body: '<div class="row">' + field('Datum', '<input class="input" type="date" name="date" required>') + field('Name', '<input class="input" name="name" required placeholder="z. B. Betriebsausflug">') + '</div>' +
    field('Nur für Länder (optional, kommagetrennt)', '<input class="input" name="countries" placeholder="z. B. DE, AT">'),
  onSubmit: v => call('companyHolidays.save', { date: v.date, name: v.name, countries: v.countries.split(/[,\s]+/).filter(Boolean) })
    .then(h => { S.companyHolidays.push(h); calReload(); }),
});
A['ch-remove'] = el => call('companyHolidays.remove', { id: el.dataset.id })
  .then(() => { S.companyHolidays = S.companyHolidays.filter(h => h.id !== el.dataset.id); calReload(); }).catch(fail);
</script>
