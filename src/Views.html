<script>
/* ==========================================================================
   Pages and database layouts (list, board, table, calendar), team calendar,
   capacity planning, teams, projects and settings.
   ========================================================================== */

const Views = {
  render() {
    const r = S.route;
    switch (r.view) {
      case 'dash': return dashPage();
      case 'home': return homePage();
      case 'planner': S.route = { view: 'calendar', id: null }; S.cal.mode = 'day'; return calendarPage();
      case 'all': return allPage();
      case 'team': return team(r.id) ? teamPage(team(r.id)) : notFound();
      case 'project': return project(r.id) ? projectPage(project(r.id)) : notFound();
      case 'calendar': return calendarPage();
      case 'capacity': return capacityPage();
      case 'settings': return settingsPage();
      default: return dashPage();
    }
  },
  after() { bindDrag(); bindCalSelect(); bindPlanner(); bindGantt(); },
};
function notFound() {
  return '<div class="page"><div class="empty">' + icon('search') + '<div>Diese Seite gibt es nicht mehr.</div><br>' +
    '<button class="btn outline" data-action="nav" data-view="home">Zu meinen Aufgaben</button></div></div>';
}

/* ---------------- database (task collection) ---------------- */
const LAYOUTS = [
  { key: 'list', label: 'Liste', ic: 'list' },
  { key: 'table', label: 'Tabelle', ic: 'table' },
  { key: 'board', label: 'Board', ic: 'board' },
  { key: 'calendar', label: 'Kalender', ic: 'calendar' },
  { key: 'gantt', label: 'Gantt', ic: 'gantt' },
];
const GROUPS = [
  { key: 'status', label: 'Status' }, { key: 'priority', label: 'Priorität' },
  { key: 'assignee', label: 'Person' }, { key: 'project', label: 'Projekt' },
];
function dbKey() { return S.route.view + ':' + (S.route.id || ''); }
function defaultPrefs() {
  const home = S.route.view === 'home';
  return {
    layout: home ? 'list' : 'board', groupBy: 'status', listGroup: home ? 'due' : 'status', people: [], prio: [], projects: [], statuses: [],
    quick: 'open', showDone: !home, search: '', sort: { key: 'dueDate', dir: 1 }, rows: 50, page: 0, collapsedCols: {},
  };
}
function prefs() {
  if (!S.db) S.db = store.get('db', {});
  const k = dbKey();
  if (!S.db[k]) S.db[k] = defaultPrefs();
  const p = S.db[k];
  // older saved prefs: fill in new fields, one "who" value becomes the people list
  const d = defaultPrefs();
  Object.keys(d).forEach(x => { if (p[x] === undefined) p[x] = d[x]; });
  if (p.who && p.who !== 'all') p.people = [p.who === 'me' ? '__me' : p.who === 'none' ? '__none' : p.who];
  delete p.who;
  if (!LAYOUTS.some(l => l.key === p.layout)) p.layout = 'list';
  return p;
}
/** "Meine Aufgaben" quick tabs (smart lists). */
const QUICK = [
  ['open', 'Alle offenen', t => !isDone(t)],
  ['today', 'Heute', t => !isDone(t) && ((t.dueDate && t.dueDate <= TODAY()) || t.planDate === TODAY())],
  ['upcoming', 'Anstehend', t => !isDone(t) && t.dueDate > TODAY() && t.dueDate <= Shared.addDays(TODAY(), 7)],
  ['overdue', 'Überfällig', t => !isDone(t) && t.dueDate && t.dueDate < TODAY()],
  ['nodate', 'Ohne Datum', t => !isDone(t) && !t.dueDate],
  ['done', 'Erledigt', t => isDone(t)],
];
const LIST_GROUPS = [['due', 'Fälligkeit'], ['status', 'Status'], ['priority', 'Priorität'], ['project', 'Projekt']];
function setPrefs(patch) {
  Object.assign(prefs(), patch);
  store.set('db', S.db);
  render();
}
function applyFilters(list, p) {
  const q = (p.search || '').trim().toLowerCase();
  return list.filter(t => {
    if (q && (t.title + ' ' + t.tags.join(' ')).toLowerCase().indexOf(q) < 0) return false;
    if (p.people.length && !p.people.some(e => (e === '__none' ? !t.assignees.length : t.assignees.indexOf(e === '__me' ? S.me.email : e) >= 0))) return false;
    if (p.prio.length && p.prio.indexOf(t.priority) < 0) return false;
    if (p.projects.length && p.projects.indexOf(t.projectId || '') < 0) return false;
    if (p.statuses.length && p.statuses.indexOf(t.status) < 0) return false;
    return true;
  });
}
function bySort(a, b) { return (a.sort || 0) - (b.sort || 0) || (a.createdAt < b.createdAt ? -1 : 1); }
function rankPrio(t) { return (prioOf(t.priority) || { rank: 9 }).rank; }

function database(tasks, opts) {
  const p = prefs();
  opts = opts || {};
  // "Meine Aufgaben" are mine anyway: no person filter there, smart quick tabs instead
  const mine = S.route.view === 'home';
  const pre = applyFilters(tasks, p);
  const quick = mine ? (QUICK.find(q => q[0] === p.quick) || QUICK[0]) : null;
  const filtered = quick ? pre.filter(quick[2]) : pre;
  const sortable = p.layout === 'table' || p.layout === 'gantt';
  const cnt = n => (n ? '<span class="tn">' + n + '</span>' : '');
  const views = savedViews();
  const sw = '<div class="vsw">' + LAYOUTS.map(l =>
    '<button class="' + (p.layout === l.key ? 'on' : '') + '" data-action="layout" data-v="' + l.key + '" title="' + l.label + '">' + icon(l.ic) + '</button>').join('') + '</div>';
  const titleRow = opts.title
    ? '<div class="dbh-top"><div><h1 class="page-title">' + esc(opts.title) + '</h1>' + (opts.sub ? '<p class="page-sub">' + opts.sub + '</p>' : '') + '</div>' +
      '<div class="dbh-r">' + sw + '<button class="btn white" data-action="new-task">' + icon('plus', 'sm') + 'Neue Aufgabe</button></div></div>'
    : '';
  const quickTabs = mine ? '<div class="qtabs">' + QUICK.map(q => {
    const n = pre.filter(q[2]).length;
    return '<button class="' + (quick[0] === q[0] ? 'on' : '') + (q[0] === 'overdue' && n ? ' warn' : '') + '" data-action="db-quick" data-k="' + q[0] + '">' + q[1] + '<span class="n">' + n + '</span></button>';
  }).join('') + '</div>' : '';
  const listGroup = LIST_GROUPS.find(g => g[0] === p.listGroup) || LIST_GROUPS[0];
  const tools = quickTabs + '<div class="dbh-tools">' +
    (mine ? '' : '<button class="tbtn' + (p.people.length ? ' on' : '') + '" data-action="db-who">' + icon('user', 'sm') + 'Person' + cnt(p.people.length) + '</button>') +
    '<button class="tbtn' + (p.prio.length ? ' on' : '') + '" data-action="db-prio">' + icon('flag', 'sm') + 'Priorität' + cnt(p.prio.length) + '</button>' +
    (opts.hideProject ? '' : '<button class="tbtn' + (p.projects.length ? ' on' : '') + '" data-action="db-proj">' + icon('folder', 'sm') + 'Projekt' + cnt(p.projects.length) + '</button>') +
    '<button class="tbtn' + (p.statuses.length ? ' on' : '') + '" data-action="db-status">' + icon('status', 'sm') + 'Status' + cnt(p.statuses.length) + '</button>' +
    (sortable ? '<button class="tbtn" data-action="db-sort">' + icon('sort', 'sm') + 'Sortierung' + cnt(1) + '</button>' : '') +
    (p.layout === 'board' ? '<button class="tbtn" data-action="db-group">' + icon('layers', 'sm') + 'Gruppe: ' + esc(GROUPS.find(g => g.key === p.groupBy).label) + '</button>' : '') +
    (p.layout === 'list' ? '<button class="tbtn" data-action="db-lgroup">' + icon('layers', 'sm') + 'Gruppe: ' + esc(listGroup[1]) + '</button>' : '') +
    (p.layout !== 'board' && !mine ? '<button class="tbtn' + (p.showDone ? ' on' : '') + '" data-action="db-done">' + icon('checksq', 'sm') + 'Erledigte</button>' : '') +
    '<input class="db-search' + (p.search ? ' open' : '') + '" placeholder="Suchen…" value="' + esc(p.search) + '" data-on-input="db-search">' +
    '<button class="icon-btn" data-action="db-search-open" title="Suchen">' + icon('search') + '</button>' +
    '<span class="grow"></span>' + (opts.title ? '' : sw) +
    '<span class="vlbl">Gespeicherte Ansichten</span><button class="tbtn sel" data-action="view-menu">' + esc(p.view || 'Standard') + icon('chevron', 'sm') + '</button>' +
    '<button class="icon-btn" data-action="view-save" title="Aktuelle Ansicht speichern">' + icon('plus') + '</button></div>';
  // active filters as chips; people are one chip each plus "+" to add more
  const chips = [];
  if (!mine && p.people.length) {
    p.people.forEach(e => chips.push('<button class="fchip" data-action="db-unperson" data-v="' + esc(e) + '">' +
      (e === '__me' ? icon('user', 'sm') + 'Mir zugewiesen' : e === '__none' ? icon('circle', 'sm') + 'Nicht zugewiesen' : avatar(e) + esc(user(e).name)) + icon('x', 'sm') + '</button>'));
    chips.push('<button class="fchip add" data-action="db-who" title="Person hinzufügen">' + icon('plus', 'sm') + '</button>');
  }
  if (p.prio.length) chips.push('<button class="fchip" data-action="db-clear" data-k="prio">' + icon('flag', 'sm') + esc(p.prio.map(k => (prioOf(k) || { label: 'Keine' }).label).join(', ')) + icon('x', 'sm') + '</button>');
  if (p.projects.length) chips.push('<button class="fchip" data-action="db-clear" data-k="projects">' + icon('folder', 'sm') + esc(p.projects.map(id => (project(id) || { name: 'Ohne Projekt' }).name).join(', ')) + icon('x', 'sm') + '</button>');
  if (p.statuses.length) chips.push('<button class="fchip" data-action="db-clear" data-k="statuses">' + icon('status', 'sm') + esc(p.statuses.map(k => (Shared.STATUSES.find(s => s.key === k) || {}).label).join(', ')) + icon('x', 'sm') + '</button>');
  const chipsHtml = chips.length ? '<div class="filter-chips">' + chips.join('') + '</div>' : '';

  let body;
  const visibleDone = p.showDone || mine ? filtered : filtered.filter(t => !isDone(t));
  const top = l => l.filter(t => !t.parentId || opts.includeSub);
  if (p.layout === 'board') body = boardHtml(top(filtered), p, opts);
  else if (p.layout === 'table') body = tableHtml(top(visibleDone), p, opts);
  else if (p.layout === 'calendar') body = taskCalendarHtml(visibleDone, opts);
  else if (p.layout === 'gantt') body = ganttHtml(top(visibleDone), p, opts);
  else body = listHtml(visibleDone, opts);
  return '<div class="card-w dbh' + (opts.title ? ' titled' : '') + '">' + titleRow + tools + '</div>' +
    '<div class="fit-body db-body" data-keep-scroll="db">' + chipsHtml + body + '</div>';
}
/* saved views: filter, layout and sorting per page, kept in this browser */
function savedViews() {
  const all = store.get('views', {});
  return all[dbKey()] || [];
}
A['view-menu'] = el => {
  const list = savedViews();
  openMenu(el, [{ value: '', html: '<span>Standard</span>', search: '' }].concat(list.map(v => ({ value: v.name, html: '<span>' + esc(v.name) + '</span>', search: v.name, deletable: true }))), {
    search: false, selected: [prefs().view || ''],
    onDelete: name => {
      const all = store.get('views', {});
      const kept = (all[dbKey()] || []).filter(x => x.name !== name);
      const gone = (all[dbKey()] || []).find(x => x.name === name);
      all[dbKey()] = kept;
      store.set('views', all);
      if (prefs().view === name) { prefs().view = ''; store.set('db', S.db); }
      render({ peek: false });
      toast('Ansicht „' + name + '“ gelöscht', { action: { label: 'Rückgängig', fn: () => {
        const again = store.get('views', {});
        again[dbKey()] = (again[dbKey()] || []).concat([gone]);
        store.set('views', again);
        render({ peek: false });
      } } });
    },
    onPick: name => {
      const d = defaultPrefs();
      const v = list.find(x => x.name === name);
      S.db[dbKey()] = Object.assign(d, v ? v.p : {}, { view: name });
      store.set('db', S.db);
      render();
    },
  });
};
A['view-save'] = () => {
  openModal({
    title: 'Ansicht speichern', submitLabel: 'Speichern',
    body: field('Name', '<input class="input" name="name" required maxlength="40" placeholder="z. B. Meine offenen Aufgaben">') +
      '<p class="hint">Gespeichert werden Layout, Filter, Gruppierung und Sortierung dieser Seite, nur in diesem Browser.</p>',
    onSubmit: v => {
      const name = String(v.name || '').trim();
      if (!name) return false;
      const all = store.get('views', {});
      const list = (all[dbKey()] || []).filter(x => x.name !== name);
      const cur = Object.assign({}, prefs());
      delete cur.view; delete cur.page;
      list.push({ name: name, p: cur });
      all[dbKey()] = list;
      store.set('views', all);
      prefs().view = name;
      store.set('db', S.db);
      render();
      toast('Ansicht „' + name + '“ gespeichert');
    },
  });
};
A['db-sort'] = el => {
  const keys = [['dueDate', 'Fälligkeit'], ['startDate', 'Start'], ['priority', 'Priorität'], ['status', 'Status'], ['title', 'Titel'], ['assignees', 'Zugewiesen'], ['projectId', 'Projekt'], ['progress', 'Fortschritt'], ['estimate', 'Aufwand']];
  const s = prefs().sort || { key: 'dueDate', dir: 1 };
  openMenu(el, keys.map(k => ({ value: k[0], html: '<span>' + k[1] + '</span>' + (s.key === k[0] ? '<small>' + (s.dir > 0 ? 'aufsteigend' : 'absteigend') + '</small>' : ''), search: k[1] })),
    { search: false, selected: [s.key], onPick: v => setPrefs({ sort: { key: v, dir: s.key === v ? -s.dir : 1 } }) });
};
A.layout = el => setPrefs({ layout: el.dataset.v });
A['db-done'] = () => setPrefs({ showDone: !prefs().showDone });
A['db-clear'] = el => setPrefs({ [el.dataset.k]: [] });
A['db-unperson'] = el => setPrefs({ people: prefs().people.filter(e => e !== el.dataset.v) });
A['db-quick'] = el => setPrefs({ quick: el.dataset.k });
A['db-lgroup'] = el => openMenu(el, LIST_GROUPS.map(g => ({ value: g[0], html: '<span>' + g[1] + '</span>', search: g[1] })),
  { selected: [prefs().listGroup], search: false, onPick: v => setPrefs({ listGroup: v }) });
const multiFilter = key => (v, sel) => { prefs()[key] = sel; store.set('db', S.db); render(); };
A['db-proj'] = el => {
  const items = [{ value: '', html: '<span class="faint">Ohne Projekt</span>', search: 'ohne kein' }];
  S.teams.forEach(tm => {
    const ps = S.projects.filter(x => x.teamId === tm.id);
    if (!ps.length) return;
    items.push({ label: tm.name, search: '' });
    ps.forEach(x => items.push({ value: x.id, html: projectChip(x), search: x.name + ' ' + tm.name }));
  });
  openMenu(el, items, { multi: true, search: true, placeholder: 'Projekt suchen…', selected: prefs().projects, onPick: multiFilter('projects') });
};
A['db-status'] = el => openMenu(el, Shared.STATUSES.map(s => ({ value: s.key, html: statusTag(s.key), search: s.label })),
  { multi: true, search: false, selected: prefs().statuses, onPick: multiFilter('statuses') });
A['db-search-open'] = () => { const i = $('.db-search'); i.classList.add('open'); i.focus(); };
ON.input['db-search'] = debounce(el => {
  prefs().search = el.value;
  store.set('db', S.db);
  const pos = el.selectionStart;
  render();
  const n = $('.db-search');
  if (n) { n.focus(); n.setSelectionRange(pos, pos); }
}, 200);
/** Person filter: type a few letters, pick several people; they show up as chips with a "+" to add more. */
A['db-who'] = el => openMenu(el, [
  { value: '__me', html: icon('user', 'sm') + '<span>Mir zugewiesen</span>', search: 'ich mir me' },
  { value: '__none', html: icon('circle', 'sm') + '<span>Nicht zugewiesen</span>', search: 'nicht zugewiesen' },
].concat(peopleItems()), { multi: true, search: true, placeholder: 'Name oder E-Mail suchen…', selected: prefs().people, onPick: multiFilter('people') });
A['db-prio'] = el => openMenu(el, Shared.PRIORITIES.map(p => ({ value: p.key, html: prioTag(p.key), search: p.label }))
  .concat([{ value: '', html: '<span class="faint">Keine</span>', search: 'keine' }]),
{ multi: true, search: false, selected: prefs().prio, onPick: (v, sel) => { prefs().prio = sel; store.set('db', S.db); render(); } });
A['db-group'] = el => openMenu(el, GROUPS.map(g => ({ value: g.key, html: '<span>' + g.label + '</span>', search: g.label })),
  { selected: [prefs().groupBy], search: false, onPick: v => setPrefs({ groupBy: v }) });

/* ----- card ----- */
function metaHtml(t, opts) {
  const subs = subtasks(t.id);
  const parts = [];
  if (t.priority) parts.push(prioTag(t.priority, true));
  if (t.dueDate && !(opts && opts.skipDue)) parts.push(dueTag(t));
  if (subs.length) parts.push('<span class="meta">' + icon('sub', 'sm') + subs.filter(isDone).length + '/' + subs.length + '</span>');
  if (t.estimate && !(opts && opts.skipEst)) parts.push('<span class="meta">' + icon('hourglass', 'sm') + esc(fmtHours(t.estimate)) + '</span>');
  if (t.recurrence) parts.push('<span class="meta" title="Wiederholt sich">' + icon('repeat', 'sm') + '</span>');
  if (opts && opts.withTags) t.tags.slice(0, 2).forEach(x => parts.push(tagChip(x)));
  return parts.join('');
}
/** "Überfällig seit 4 Wo. 6 T." */
function agoText(days) {
  if (days < 14) return days + (days === 1 ? ' Tag' : ' Tage');
  const w = Math.floor(days / 7), d = days % 7;
  return w + ' Wo.' + (d ? ' ' + d + ' T.' : '');
}
function fmtShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return d + '.' + m + '.' + String(y).slice(2);
}
function cardHtml(t, opts) {
  const pr = t.priority && prioOf(t.priority);
  const p = !(opts && opts.hideProject) && t.projectId && project(t.projectId);
  const tm = !p && t.teams.length && team(t.teams[0]);
  const subs = subtasks(t.id);
  const today = TODAY();
  const over = !isDone(t) && t.dueDate && t.dueDate < today;
  const dates = t.dueDate
    ? '<div class="cdates"><span class="cdate' + (over ? ' over' : t.dueDate === today ? ' today' : '') + '">' + icon('calendar', 'sm') +
      esc(t.startDate && t.startDate !== t.dueDate ? fmtRange(t.startDate, t.dueDate) : fmtDate(t.dueDate, { absolute: true })) + '</span>' +
      (over ? '<span class="cover">Überfällig seit ' + agoText(Shared.diffDays(t.dueDate, today)) + '</span>' : '') + '</div>' : '';
  const tags = t.tags.slice(0, 3).map(tagChip).join('');
  const pv = progressOf(t);
  return '<div class="card' + (S.peekId === t.id ? ' selected' : '') + '" style="--cc:' + STATUS_COLORS[t.status] + '" draggable="true" data-drag-id="' + esc(t.id) + '" data-action="open-task" data-id="' + esc(t.id) + '">' +
    '<div class="card-top">' + (pr ? '<span class="cprio prio-' + pr.key + '">' + esc(pr.label) + '</span>' : '') +
    (p ? projectPill(p) : tm ? '<span class="jpill" style="background:var(--c-' + esc(tm.color || 'gray') + ')">' + esc(tm.name) + '</span>' : '') + '</div>' +
    '<div class="card-title' + (isDone(t) ? ' done' : '') + '"><span>' + esc(t.title) + '</span></div>' +
    dates + (tags ? '<div class="ctags">' + tags + '</div>' : '') +
    (subs.length || pv > 0 && !isDone(t) ? '<div class="cprog"><span class="track"><i style="width:' + pv + '%"></i></span><span class="pv">' +
      (subs.length ? subs.filter(isDone).length + '/' + subs.length + ' · ' : '') + pv + '%</span></div>' : '') +
    '<div class="card-foot"><span class="cavs">' + (t.assignees.length ? avatars(t.assignees) : '') + '</span><span class="cmeta">' +
    (t.estimate ? '<span class="meta">' + icon('hourglass', 'sm') + esc(fmtHours(t.estimate)) + '</span>' : '') +
    (t.recurrence ? '<span class="meta" title="Wiederholt sich">' + icon('repeat', 'sm') + '</span>' : '') + '</span></div>' +
    '</div>';
}
A['open-task'] = el => openPeek(el.dataset.id);
A['toggle-done'] = (el, e) => {
  e.stopPropagation();
  const t = task(el.dataset.id);
  if (!t) return;
  patchTask(t.id, { status: isDone(t) ? 'todo' : 'done' });
};

/* ----- board ----- */
const cdot = c => '<span class="cdot" style="background:' + c + '"></span>';
function boardColumns(tasks, p) {
  const PC = { urgent: 'var(--danger)', high: 'var(--c-orange)', medium: 'var(--c-yellow)', low: 'var(--c-gray)' };
  if (p.groupBy === 'priority') {
    return Shared.PRIORITIES.map(x => ({ value: x.key, label: x.label, color: PC[x.key], preset: { priority: x.key } }))
      .concat([{ value: '', label: 'Keine Priorität', color: 'var(--text-3)', preset: { priority: '' } }])
      .map(c => Object.assign(c, { tasks: tasks.filter(t => (t.priority || '') === c.value) }));
  }
  if (p.groupBy === 'assignee') {
    const emails = [S.me.email];
    tasks.forEach(t => t.assignees.forEach(e => { if (emails.indexOf(e) < 0) emails.push(e); }));
    return emails.map(e => ({ value: e, label: user(e).name, color: user(e).color || 'var(--c-gray)', preset: { assignees: [e] }, tasks: tasks.filter(t => t.assignees.indexOf(e) >= 0) }))
      .concat([{ value: '', label: 'Nicht zugewiesen', color: 'var(--text-3)', preset: { assignees: [] }, tasks: tasks.filter(t => !t.assignees.length) }]);
  }
  if (p.groupBy === 'project') {
    const ids = [];
    tasks.forEach(t => { if (t.projectId && ids.indexOf(t.projectId) < 0 && project(t.projectId)) ids.push(t.projectId); });
    const pc = id => 'var(--c-' + (project(id).color && project(id).color !== 'default' ? project(id).color : 'gray') + ')';
    return ids.map(id => ({ value: id, label: project(id).name, color: pc(id), preset: { projectId: id }, tasks: tasks.filter(t => t.projectId === id) }))
      .concat([{ value: '', label: 'Ohne Projekt', color: 'var(--text-3)', preset: { projectId: '' }, tasks: tasks.filter(t => !t.projectId) }]);
  }
  return Shared.STATUSES.map(s => ({ value: s.key, label: s.label, color: STATUS_COLORS[s.key], preset: { status: s.key }, tasks: tasks.filter(t => t.status === s.key) }));
}
function boardHtml(tasks, p, opts) {
  const cols = boardColumns(tasks, p);
  return '<div class="board">' + cols.map(c => {
    const list = c.tasks.slice().sort(bySort);
    const key = p.groupBy + ':' + c.value;
    const dz = 'data-drop-group="' + esc(p.groupBy) + '" data-drop-value="' + esc(c.value) + '"';
    if (p.collapsedCols[key]) {

  });

/* ---------------- calendar data ---------------- */
function monthDays(cursor) {
  const first = cursor.slice(0, 8) + '01';
  const start = Shared.mondayOf(first);
  const end = Shared.addDays(Shared.mondayOf(Shared.endOfMonth(first)), 6);
  const days = [];
  for (let d = start; d <= end; d = Shared.addDays(d, 1)) days.push(d);
  return days;
}
function calCursor() {
  if (!S.cal.cursor) S.cal.cursor = TODAY().slice(0, 8) + '01';
  return S.cal.cursor;
}
function calKey(from, to, teamId) { return from + '|' + to + '|' + (teamId || ''); }
/** Returns cached range data or starts loading it (and re-renders when done). */
function calEnsure(from, to, teamId) {
  const key = calKey(from, to, teamId);
  const hit = S.cal.cache[key];
  if (hit && hit !== 'loading') return hit;
  if (!hit) {
    S.cal.cache[key] = 'loading';
    call('calendar.range', { from: from, to: to, teamId: teamId || '' })
      .then(d => { S.cal.cache[key] = d; render({ peek: false }); })
      .catch(err => { delete S.cal.cache[key]; fail(err); });
  }
  return null;
}
function calReload() { S.cal.cache = {}; S.cap.data = null; S.briefing = null; render(); }
function calFind(kind, id) {
  let hit = null;
  Object.keys(S.cal.cache).forEach(k => {
    const d = S.cal.cache[k];
    if (d && d[kind]) hit = hit || d[kind].find(x => x.id === id);
  });
  return hit;
}
const absenceType = k => Shared.ABSENCE_TYPES.find(x => x.key === k) || Shared.ABSENCE_TYPES[3];
function dayBox(date) {
  return '<div class="d"><b>' + Number(date.slice(8)) + '</b><small>' + MONTHS[Number(date.slice(5, 7)) - 1] + '</small></div>';
}

/* ---------------- month grid ---------------- */
/**
 * o: { cursor, tasks, data, people (emails in scope or null = everyone), show, teamId, select }
 */
function monthHtml(o) {
  const days = monthDays(o.cursor);
  const month = o.cursor.slice(0, 7);
  const today = TODAY();
  const data = o.data || { events: [], holidays: [], absences: [], warnings: [] };
  const show = o.show || { tasks: true, events: true, absences: true, holidays: true };
  const inScope = e => !o.people || o.people.indexOf(e) >= 0;
  return '<div class="cal">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => '<div class="cal-dow">' + d + '</div>').join('') +
    days.map(d => {
      const wd = Shared.weekday(d);
      const weekend = wd === 0 || wd === 6;
      const hol = data.holidays.filter(h => h.date === d && h.affects.some(inScope));
      const warn = (data.warnings || []).filter(w => w.date === d && (!o.teamId || w.teamId === o.teamId));
      const awayEmails = [];
      if (show.absences && !weekend) {
        data.absences.filter(a => a.startDate <= d && a.endDate >= d && inScope(a.email)).forEach(a => { if (awayEmails.indexOf(a.email) < 0) awayEmails.push(a.email); });
        if (show.holidays) hol.forEach(h => h.affects.filter(inScope).forEach(e => { if (awayEmails.indexOf(e) < 0) awayEmails.push(e); }));
      }
      const items = [];
      if (show.events) data.events.filter(e => e.startDate <= d && (e.endDate || e.startDate) >= d).forEach(e => {
        items.push('<div class="ev event' + (e.type === 'milestone' ? ' milestone' : '') + '" data-action="event-edit" data-id="' + esc(e.id) + '" title="' + esc(e.title) + '"><span>' + esc(e.title) + '</span></div>');
      });
      if (show.tasks) (o.tasks || []).filter(t => t.dueDate === d).sort((a, b) => rankPrio(a) - rankPrio(b)).forEach(t => {
        items.push('<div class="ev task' + (isDone(t) ? ' done' : '') + '" draggable="true" data-drag-id="' + esc(t.id) + '" data-action="open-task" data-id="' + esc(t.id) + '" title="' + esc(t.title) + '">' +
          glyph(t.status) + '<span>' + esc(t.title) + '</span></div>');
      });
      const max = 3;
      const holLabel = show.holidays && hol.length
        ? '<span class="hol" title="' + esc(hol.map(h => h.name + ' (' + h.country + ')').join(', ')) + '">' + esc(hol[0].name) + (hol.length > 1 ? ' +' + (hol.length - 1) : '') + '</span>' : '';
      const badge = warn.length
        ? '<span class="wbadge" title="' + esc(warn.map(w => w.teamName + ': ' + w.absent + ' von ' + w.total + ' abwesend').join('\n')) + '">' +
          esc((o.teamId ? '' : warn[0].teamName + ' ') + warn[0].absent + '/' + warn[0].total + ' weg') + '</span>' : '';
      const cls = ['cal-day', d.slice(0, 7) !== month ? 'other' : '', d === today ? 'today' : '', weekend ? 'weekend' : '', warn.length ? 'warn' : ''].join(' ');
      return '<div class="' + cls + '" data-drop-date="' + d + '" data-sel-date="' + d + '" data-action="cal-day" data-date="' + d + '">' +
        '<div class="daytop"><span class="daynum">' + Number(d.slice(8)) + '</span>' + holLabel + badge + '</div>' +
        (awayEmails.length ? '<div class="away" data-action="day-away" data-date="' + d + '" title="' + esc(awayEmails.map(e => user(e).name).join(', ')) + '">' +
          avatars(awayEmails, 4) + '<span>' + awayEmails.length + ' abwesend</span></div>' : '') +
        items.slice(0, max).join('') + (items.length > max ? '<div class="ev more">+' + (items.length - max) + ' weitere</div>' : '') + '</div>';
    }).join('') + '</div>';
}

/** Which calendar view is active (database calendars are always the month grid). */
function calMode() { return S.route.view === 'calendar' || S.route.view === 'planner' ? S.cal.mode || 'week' : 'month'; }
function calStep(dir) {
  focusDate();
  const m = calMode();
  if (m === 'month') S.cal.cursor = Shared.addMonths(calCursor(), dir);
  else if (m === 'week') S.plan.date = Shared.addDays(focusDate(), dir * 7);
  else if (m === 'day' || m === 'planner') S.plan.date = Shared.addDays(focusDate(), dir);
  render();
}
A['cal-prev'] = () => calStep(-1);
A['cal-next'] = () => calStep(1);
A['cal-today'] = () => { S.cal.cursor = TODAY().slice(0, 8) + '01'; focusDate(); S.plan.date = TODAY(); render(); };
function weekTitle(days) {

function calNav(title, o) {

/* Drag across days to enter a vacation (team calendar only). */
const calSel = { start: null, end: null, active: false, justSelected: false };
function paintSel() {
  const a = calSel.start < calSel.end ? calSel.start : calSel.end;
  const b = calSel.start < calSel.end ? calSel.end : calSel.start;
  $$('[data-sel-date]').forEach(c => c.classList.toggle('sel', calSel.active && c.dataset.selDate >= a && c.dataset.selDate <= b));
}
function bindCalSelect() {
  if (S.route.view !== 'calendar') return;
  $$('[data-sel-date]').forEach(cell => {
    cell.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('.ev, .away')) return;
      calSel.start = calSel.end = cell.dataset.selDate;
      calSel.active = true;
    });
    cell.addEventListener('mouseenter', () => {
      if (!calSel.active) return;
      calSel.end = cell.dataset.selDate;
      paintSel();
    });
  });

document.addEventListener('mouseup', () => {
  if (!calSel.active) return;
  calSel.active = false;
  if (calSel.start && calSel.end && calSel.start !== calSel.end) {
    const a = calSel.start < calSel.end ? calSel.start : calSel.end;
    const b = calSel.start < calSel.end ? calSel.end : calSel.start;
    calSel.justSelected = true;
    setTimeout(() => { calSel.justSelected = false; }, 300);
    absenceModal({ type: 'vacation', email: S.me.email, startDate: a, endDate: b });
  }
  paintSel();
});

/** Agenda: days with something going on, grouped by date. */
function agendaHtml(data, from, n, o) {
  const inScope = e => !o.people || o.people.indexOf(e) >= 0;
  const show = o.show || { tasks: true, events: true, absences: true, holidays: true };
  const today = TODAY();
  let out = '', month = '', any = false;
  for (let i = 0; i < n; i++) {
    const d = Shared.addDays(from, i);
    const wd = Shared.weekday(d);
    const items = [];
    const warn = (data.warnings || []).filter(w => w.date === d && (!o.teamId || w.teamId === o.teamId));
    if (show.absences) warn.forEach(w => items.push('<div class="ag-item warn">' + icon('alert', 'sm') + '<span class="tt">' + esc(w.teamName) + ': ' + w.absent + ' von ' + w.total + ' abwesend</span></div>'));
    if (show.holidays) data.holidays.filter(h => h.date === d && h.affects.some(inScope)).forEach(h => items.push('<div class="ag-item hol">' + flag(h.country) + '<span class="tt">' + esc(h.name) + '</span></div>'));
    if (show.events) data.events.filter(e => e.startDate <= d && (e.endDate || e.startDate) >= d && (e.startDate === d || (i === 0))).forEach(e =>
      items.push('<div class="ag-item event" data-action="event-edit" data-id="' + esc(e.id) + '">' + icon('calendar', 'sm') + '<span class="tt">' + esc(e.title) + '</span><span class="meta">' + esc(fmtRange(e.startDate, e.endDate || e.startDate)) + '</span></div>'));
    if (show.absences) data.absences.filter(a => inScope(a.email) && a.endDate >= d && (a.startDate === d || (i === 0 && a.startDate < d))).forEach(a =>
      items.push('<div class="ag-item away">' + avatar(a.email) + '<span class="tt">' + esc(user(a.email).name) + ' · ' + esc(absenceType(a.type).label) + '</span><span class="meta">' + esc(fmtRange(a.startDate, a.endDate)) + '</span></div>'));
    if (show.tasks) (o.tasks || []).filter(t => t.dueDate === d || (i === 0 && !o.skipOverdue && t.dueDate < d && !isDone(t))).sort((a, b) => rankPrio(a) - rankPrio(b)).forEach(t =>
      items.push('<div class="ag-item' + (isDone(t) ? ' done' : '') + '" data-action="open-task" data-id="' + esc(t.id) + '">' + glyph(t.status) + '<span class="tt">' + esc(t.title) + '</span>' +
        metaHtml(t, { skipDue: true }) + (t.assignees.length ? avatars(t.assignees, 2) : '') + '</div>'));
    if (!items.length) continue;
    any = true;
    const m = d.slice(0, 7);
    if (m !== month && !o.compact) { month = m; out += '<div class="ag-month">' + MONTHS_LONG[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4) + '</div>'; }

  }
  return '<div class="agenda">' + (any ? out : '<div class="ag-empty">In diesem Zeitraum steht nichts an.</div>') + '</div>';
}

/**
 * Workload, next 4 weeks: hours of my open tasks (by plan date, else due date; overdue counts now)
 * against my real capacity (weekly hours on my workdays, minus vacation and public holidays).
 */
function workloadCard(t) {
  const mon = Shared.mondayOf(t);
  const end = Shared.addDays(mon, 27);
  const data = calEnsure(mon, end, '');
  const me = S.me.email;
  const workDays = String(S.me.workDays || '1,2,3,4,5').split(',').filter(Boolean).map(Number);
  const perDay = (Number(S.me.hoursPerWeek) || 40) / Math.max(1, workDays.length);
  const open = S.tasks.filter(x => isMine(x) && !isDone(x));
  const weeks = [0, 1, 2, 3].map(i => {
    const from = Shared.addDays(mon, i * 7), to = Shared.addDays(from, 6);
    let cap = 0, off = 0;
    for (let d = from; d <= to; d = Shared.addDays(d, 1)) {
      if (workDays.indexOf(Shared.weekday(d)) < 0) continue;
      const away = data && (data.absences.some(a => a.email === me && a.startDate <= d && a.endDate >= d) ||
        data.holidays.some(h => h.date === d && (h.affects || []).indexOf(me) >= 0));
      if (away) off++; else cap += perDay;
    }
    const when = x => x.planDate || x.dueDate;
    const tasks = open.filter(x => { const w = when(x); return w && (i === 0 ? w <= to : w >= from && w <= to); });
    const hours = tasks.reduce((s2, x) => s2 + (Number(x.estimate) || 0), 0);
    const pct = cap ? Math.round(hours / cap * 100) : (hours ? 999 : 0);
    const state = pct > 100 ? ['danger', 'Überlastet'] : pct >= 80 ? ['warn', 'Knapp'] : ['ok', 'Im Rahmen'];
    return { from: from, cap: cap, hours: hours, off: off, n: tasks.length, noEst: tasks.filter(x => !x.estimate).length, pct: pct, state: state };
  });
  const max = Math.max(1, ...weeks.map(w => Math.max(w.cap, w.hours)));
  const rows = weeks.map(w => '<button class="wl-row" data-action="nav" data-view="capacity" title="' +
    esc(w.n + ' Aufgaben · ' + fmtNum(w.hours) + ' h geplant · ' + fmtNum(w.cap) + ' h verfügbar' + (w.off ? ' · ' + w.off + ' Tage frei' : '') + (w.noEst ? ' · ' + w.noEst + ' ohne Aufwand' : '')) + '">' +
    '<span class="wl-wk"><b>KW ' + Shared.isoWeek(w.from) + '</b><small>' + esc(fmtDate(w.from, { absolute: true })) + '</small></span>' +
    '<span class="wl-track"><i class="wl-fill ' + w.state[0] + '" style="width:' + Math.min(100, w.hours / max * 100) + '%"></i>' +
    '<i class="wl-cap" style="left:' + (w.cap / max * 100) + '%"></i></span>' +
    '<span class="wl-val"><b>' + fmtNum(w.hours) + '</b> / ' + fmtNum(w.cap) + ' h</span>' +
    '<span class="wl-chip ' + w.state[0] + '">' + w.state[1] + '</span></button>').join('');
  return '<div class="card-w w-6 wl"><h3>' + icon('gauge', 'sm') + 'Auslastung nächste 4 Wochen<a class="more" data-action="nav" data-view="capacity">Verfügbarkeit</a></h3>' +
    '<p class="hint" style="margin:-6px 0 10px">Geplanter Aufwand deiner offenen Aufgaben gegen deine Arbeitszeit, Urlaub und Feiertage schon abgezogen. Der Strich ist deine Kapazität.</p>' +
    rows + '</div>';
}

/** Tasks I finished per week, last 8 weeks, with the trend against the week before. */
function doneWeeksCard(t) {
  const mon = Shared.mondayOf(t);
  const done = S.tasks.filter(x => isDone(x) && x.completedAt && isMine(x)).map(x => x.completedAt.slice(0, 10));
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const from = Shared.addDays(mon, -7 * i), to = Shared.addDays(from, 6);
    weeks.push({ from: from, n: done.filter(d => d >= from && d <= to).length, now: i === 0 });
  }
  const max = Math.max(1, ...weeks.map(w => w.n));
  const cur = weeks[7].n, prev = weeks[6].n, diff = cur - prev;
  const avg = Math.round(weeks.slice(0, 7).reduce((s2, w) => s2 + w.n, 0) / 7 * 10) / 10;
  const trend = diff > 0 ? '<span class="dw-trend up">▲ ' + diff + ' mehr als letzte Woche</span>'
    : diff < 0 ? '<span class="dw-trend down">▼ ' + (-diff) + ' weniger als letzte Woche</span>' : '<span class="dw-trend">wie letzte Woche</span>';
  const bars = weeks.map(w => '<div class="dw-col' + (w.now ? ' now' : '') + '" title="' + esc('KW ' + Shared.isoWeek(w.from) + ': ' + w.n + ' erledigt') + '">' +
    '<span class="dw-n">' + w.n + '</span><span class="dw-bar"><i style="height:' + (w.n / max * 100) + '%"></i></span>' +
    '<small>KW ' + Shared.isoWeek(w.from) + '</small></div>').join('');
  return '<div class="card-w w-6 dw"><h3>' + icon('check', 'sm') + 'Erledigt pro Woche</h3>' +
    '<div class="dw-head"><b>' + cur + '</b><span>diese Woche</span>' + trend + '<span class="dw-avg">Ø ' + fmtNum(avg) + ' pro Woche</span></div>' +
    (weeks.some(w => w.n) ? '<div class="dw-chart">' + bars + '</div>'
      : '<div class="empty-w">Noch nichts erledigt. Sobald du Aufgaben abhakst, siehst du hier deinen Wochenverlauf.</div>') + '</div>';
}

/* day planner: pick tasks from the list, drop them on the time line */
const PL = { from: 6 * 60, to: 21 * 60, hh: 44 };
function plDur(t) { return Math.max(15, Math.round((Number(t.estimate) || 0.5) * 60 / 5) * 5); }
function fmtClock(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
const plPx = m => (m - PL.from) / 60 * PL.hh;
function focusDate() {
  if (!S.plan) S.plan = { date: TODAY(), filter: 'due' };
  return S.plan.date;
}
/** Time blocks of one day (tasks sorted by start), overlapping blocks share the width. */
function blocksHtml(planned) {
  let cluster = [], clusterEnd = 0;
  const flush = () => { cluster.forEach(c => { c.n = cluster.reduce((m, x) => Math.max(m, x.lane + 1), 1); }); };
  const evs = planned.slice().sort((a, c) => a.planStart - c.planStart).map(t => ({ t: t, s: t.planStart, e: t.planStart + plDur(t), lane: 0, n: 1 }));
  const laneEnds = [];
  evs.forEach(ev => {
    if (ev.s >= clusterEnd) { flush(); cluster = []; laneEnds.length = 0; clusterEnd = 0; }
    let l = laneEnds.findIndex(x => x <= ev.s);
    if (l < 0) { l = laneEnds.length; laneEnds.push(0); }
    laneEnds[l] = ev.e; ev.lane = l; cluster.push(ev); clusterEnd = Math.max(clusterEnd, ev.e);
  });
  flush();
  return evs.map(ev => {
    const t = ev.t, top = plPx(Math.max(ev.s, PL.from)), height = Math.max(plPx(Math.min(ev.e, PL.to)) - top, 26);
    return '<div class="blk-p p-' + esc(t.priority || 'none') + (isDone(t) ? ' done' : '') + '" draggable="true" data-plan-drag="' + esc(t.id) + '" data-action="open-task" data-id="' + esc(t.id) + '" style="top:' + top + 'px;height:' + height +
      'px;left:calc(6px + (100% - 12px) * ' + ev.lane + ' / ' + ev.n + ');width:calc((100% - 12px) / ' + ev.n + ' - 4px)">' +
      '<div class="bt">' + esc(t.title) + '</div>' + (height > 40 ? '<div class="bm">' + fmtClock(ev.s) + ' – ' + fmtClock(ev.e) + '</div>' : '') +
      '<div class="bx"><button data-action="blk-len" data-id="' + esc(t.id) + '" data-d="-15" title="15 Min. kürzer">−</button><button data-action="blk-len" data-id="' + esc(t.id) + '" data-d="15" title="15 Min. länger">+</button>' +
      '<button data-action="blk-unplan" data-id="' + esc(t.id) + '" title="Aus dem Plan nehmen">×</button></div></div>';
  }).join('');
}
function hourLabels() {
  const hours = [];
  for (let h = PL.from / 60; h < PL.to / 60; h++) hours.push('<div class="hl">' + String(h).padStart(2, '0') + ':00</div>');
  return hours.join('');
}
function nowLineHtml(d) {
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  return d === TODAY() && nowMin >= PL.from && nowMin <= PL.to ? '<div class="tl-now" style="top:' + plPx(nowMin) + 'px"></div>' : '';
}
/** Holiday, team-warning and absence chips of one day. */
function dayFlags(data, d, o) {
  const flags = [];
  if (!data) return flags;
  const inScope = o.people ? (e => o.people.indexOf(e) >= 0) : (e => e === S.me.email || people_(e));
  data.holidays.filter(h => h.date === d && h.affects.some(inScope)).forEach(h => flags.push('<span class="chip warn" title="' + esc(h.name + ' (' + h.country + ')') + '">' + flag(h.country) + esc(h.name) + '</span>'));
  (data.warnings || []).filter(w => w.date === d && (!o.teamId || w.teamId === o.teamId)).forEach(w => flags.push('<span class="chip danger">' + icon('alert', 'sm') + esc(w.teamName + ' ' + w.absent + '/' + w.total + ' weg') + '</span>'));
  const away = uniq(data.absences.filter(a => a.startDate <= d && a.endDate >= d && inScope(a.email)).map(a => a.email));
  if (away.length) flags.push('<span class="chip" title="' + esc(away.map(e => user(e).name).join(', ')) + '">' + avatars(away, 3) + away.length + ' abwesend</span>');
  return flags;
}

/** Week / day: one column per day with a time line, all-day strip on top. */
function timeGridHtml(days, o) {
  const data = o.data;

    return '<div class="wk-a' + (d === today ? ' today' : '') + '" data-drop-date="' + d + '">' + items.slice(0, 4).join('') + (items.length > 4 ? '<div class="wk-more">+' + (items.length - 4) + ' weitere</div>' : '') + '</div>';
  }).join('');
  const cols = days.map(d => {
    const wd = Shared.weekday(d);

    return '<div class="wk-col' + (d === today ? ' today' : '') + (wd === 0 || wd === 6 ? ' weekend' : '') + '" data-plan-date="' + d + '" data-action="wk-slot" data-date="' + d + '" title="Klicken, um hier eine Aufgabe einzuplanen">' + blocksHtml(planned) + nowLineHtml(d) + '</div>';
  }).join('');
  const h = (PL.to - PL.from) / 60 * PL.hh;
  return '<div class="card-w wk" data-keep-scroll="wk" style="--cols:' + days.length + ';--hh:' + PL.hh + 'px;--tlh:' + h + 'px">' +
    '<div class="wk-corner"></div>' + head + '<div class="wk-corner a">ganztägig</div>' + allday +
    '<div class="wk-gutter" style="height:' + h + 'px">' + hourLabels() + '</div>' + cols + '</div>';
}

/** Heatmap: finished tasks per day over the last 52 weeks. */
function heatmapHtml(people) {
  const t = TODAY();
  const start = Shared.addDays(Shared.mondayOf(t), -51 * 7);
  const inScope = people ? (x => x.assignees.some(e => people.indexOf(e) >= 0)) : isMine;
  const counts = {};
  S.tasks.filter(x => isDone(x) && x.completedAt && inScope(x)).forEach(x => { const d = x.completedAt.slice(0, 10); counts[d] = (counts[d] || 0) + 1; });
  let total = 0, active = 0, best = 0, bestDay = '', run = 0, streak = 0;
  const cells = [], months = [];
  for (let i = 0; i < 52 * 7; i++) {
    const d = Shared.addDays(start, i), c = counts[d] || 0, wd = Shared.weekday(d);
    if (d > t) { cells.push('<i style="visibility:hidden"></i>'); continue; }
    total += c; if (c) active++;
    if (c > best) { best = c; bestDay = d; }
    if (wd !== 0 && wd !== 6) { run = c ? run + 1 : 0; streak = Math.max(streak, run); }

const planDrag = { id: null };
function bindPlanner() {
  $$('[data-plan-drag]').forEach(el => {
    el.addEventListener('dragstart', e => {
      planDrag.id = el.dataset.planDrag;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', planDrag.id); } catch (err) { /* IE */ }
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); planDrag.id = null; $$('.drop').forEach(x => x.classList.remove('drop')); });
  });
  $$('.tl-grid, .wk-col').forEach(grid => {
    grid.addEventListener('dragover', e => { if (planDrag.id) { e.preventDefault(); grid.classList.add('drop'); } });
    grid.addEventListener('dragleave', () => grid.classList.remove('drop'));
    grid.addEventListener('drop', e => {
      e.preventDefault();
      grid.classList.remove('drop');
      const id = planDrag.id;
      planDrag.id = null;
      if (!id) return;
      const y = e.clientY - grid.getBoundingClientRect().top;
      const min = Math.max(PL.from, Math.min(PL.to - 15, PL.from + Math.round(y / PL.hh * 4) * 15));
      patchTask(id, { planDate: grid.dataset.planDate, planStart: min }, { keepPeek: true });
    });
  });
  const back = $('[data-plan-return]');
  if (back) {
    back.addEventListener('dragover', e => { if (planDrag.id) e.preventDefault(); });
    back.addEventListener('drop', e => { e.preventDefault(); const id = planDrag.id; planDrag.id = null; if (id && task(id) && task(id).planDate) patchTask(id, { planDate: '' }, { keepPeek: true }); });
  }
}

/* ---------------- availability (capacity) ---------------- */
const ABS_LETTER = { vacation: 'U', sick: 'K', training: 'F', other: 'A', holiday: 'FT' };
function capacityPage() {
  const c = S.cap;
  if (!c.from) c.from = Shared.mondayOf(TODAY());
  if (c.teamId === undefined || c.teamId === null || (c.teamId && !team(c.teamId))) c.teamId = (myTeams()[0] || {}).id || '';
  const teamId = c.teamId;
  const weeks = c.weeks > 13 ? 6 : c.weeks || 6;
  const key = [teamId, c.from, weeks].join('|');
  if (!c.data || c.key !== key) {
    if (!c.loading || c.loadingKey !== key) {
      c.loading = true;
      c.loadingKey = key;
      call('availability', { teamId: teamId, from: c.from, weeks: weeks })
        .then(d => { c.data = d; c.key = key; c.loading = false; if (S.route.view === 'capacity') render({ peek: false }); })
        .catch(err => { c.loading = false; fail(err); });
    }
  }
  const d = c.data && c.key === key ? c.data : null;
  // Same layout as the calendar: one slim header row, the page does not scroll, the table and side panels do.
  const head = '<div class="page wide cal-fit cap-fit">' +
    '<div class="card-w cal-top"><div class="cal-top-l"><h1 class="page-title" title="' + esc('Urlaub aus dem Teamkalender, Feiertage je Land und Bundesland eingerechnet. Ab ' +
      ((d && d.threshold) || 50) + ' % Abwesenheit im Team gibt es eine Warnung.') + '">Verfügbarkeit</h1>' +
    '<div class="cal-ctl">' + scopeButton('cap-team', teamId) +
    '<div class="seg">' + [4, 6, 8, 13].map(n => '<button class="' + (weeks === n ? 'on' : '') + '" data-action="cap-weeks" data-n="' + n + '">' + n + ' Wo.</button>').join('') + '</div>' +
    '<button class="icon-btn" data-action="cap-prev" aria-label="Früher">' + icon('left') + '</button>' +
    '<button class="btn outline sm" data-action="cap-today">Diese Woche</button>' +
    '<button class="icon-btn" data-action="cap-next" aria-label="Später">' + icon('right') + '</button></div></div>' +
    '<div class="cal-top-r"><button class="btn primary" data-action="absence-new">' + icon('plane', 'sm') + 'Urlaub eintragen</button>' + prefControls() + '</div></div>';
  if (!d) return head + '<div class="skeleton" style="height:260px;border-radius:12px"></div></div>';

  const work = d.days.filter(x => { const wd = Shared.weekday(x); return wd !== 0 && wd !== 6; });
  const warnDays = d.team.filter(x => x.warn);
  const banner = warnDays.length
    ? '<div class="banner danger">' + icon('alert') + '<div><b>' + warnDays.length + (warnDays.length === 1 ? ' Tag' : ' Tage') + ' mit ≥ ' + d.threshold + ' % Abwesenheit' +
      (teamId ? ' in ' + esc(team(teamId).name) : '') + '.</b> Bitte Urlaube abstimmen oder Vertretung klären.' +
      '<div class="days-list">' + warnDays.slice(0, 14).map(w => '<span class="chip danger" title="' + esc(w.people.map(x => user(x.email).name + ' – ' + (x.kind === 'holiday' ? x.label : absenceType(x.kind).label)).join('\n')) + '">' +
        esc(DOW[Shared.weekday(w.date)] + ' ' + fmtDate(w.date, { absolute: true }) + ' · ' + w.absent + '/' + w.total) + '</span>').join('') + '</div></div></div>'
    : '<div class="banner ok">' + icon('check') + '<div><b>Gut besetzt.</b> Im gewählten Zeitraum ist nie die Hälfte des Teams gleichzeitig weg.</div></div>';

  const today = TODAY();
  const th = '<tr><th class="who">' + d.members.length + (d.members.length === 1 ? ' Person' : ' Personen') + '</th>' + work.map((x, i) =>
    '<th class="' + (Shared.weekday(x) === 1 ? 'wkb ' : '') + (x === today ? 'today' : '') + '" title="' + esc(fmtDate(x, { absolute: true })) + '">' + DOW[Shared.weekday(x)] + '<small>' + Number(x.slice(8)) + (Number(x.slice(8)) <= 3 || i === 0 ? '<br>' + MONTHS[Number(x.slice(5, 7)) - 1] : '') + '</small></th>').join('') + '</tr>';
  const rows = d.members.map(m => '<tr><td class="who"><div class="person">' + avatar(m.email, 'md') + '<div style="min-width:0;line-height:1.3"><div style="font-weight:500;font-size:13px">' + esc(m.name) + '</div>' +
    '<div class="faint" style="font-size:11.5px">' + esc(m.region || m.country || '') + (m.awayDays ? ' · ' + m.awayDays + ' Tage weg' : '') + '</div></div></div></td>' +
    work.map(x => {
      const cell = m.cells[x];
      const inner = !cell.works ? '<div class="blk off" title="Kein Arbeitstag"></div>'
        : cell.away ? '<div class="blk ' + esc(cell.kind) + '" title="' + esc(cell.label) + '">' + (ABS_LETTER[cell.kind] || '') + '</div>' : '';
      return '<td class="c' + (Shared.weekday(x) === 1 ? ' wkb' : '') + '">' + inner + '</td>';
    }).join('') + '</tr>').join('');
  const foot = '<tr><td class="who">Abwesend</td>' + work.map(x => {
    const tday = d.team.find(y => y.date === x);
    const cls = tday.warn ? 'warn' : tday.ratio >= 25 ? 'mid' : '';
    return '<td class="c' + (Shared.weekday(x) === 1 ? ' wkb' : '') + '"><span class="pct ' + cls + '" title="' + tday.absent + ' von ' + tday.total + '">' + (tday.absent ? tday.ratio + '%' : '–') + '</span></td>';
  }).join('') + '</tr>';
  const legend = '<div class="legend">' + Shared.ABSENCE_TYPES.map(a => '<span><span class="sw" style="background:var(--' + a.key + ')"></span>' + esc(a.label) + '</span>').join('') +
    '<span><span class="sw" style="background:var(--holiday)"></span>Feiertag</span><span><span class="sw blk off" style="display:inline-block;width:10px;height:10px;margin:0 6px 0 0"></span>kein Arbeitstag (Teilzeit)</span></div>';
  // the side panel always looks 90 days ahead (Christmas included), not only at the weeks in the table
  const extra = calEnsure(TODAY(), Shared.addDays(TODAY(), 90), teamId);
  const scope = teamId ? teamMembers(team(teamId)) : null;
  return head + '<div class="cal-body"><div class="cal-layout"><div class="cal-main cap-main">' + banner +
    '<div class="av-wrap" data-keep-scroll="av"><table class="av"><thead>' + th + '</thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + legend + '</div>' +
    '<div class="cal-side" data-keep-scroll="side">' + (extra ? sidePanel(extra, scope, { noWarn: true }) : '<div class="panel"><div class="skeleton"></div></div>') + '</div></div></div></div>';
}

  call('users.save', { email: u.email, role: u.role === 'admin' ? 'member' : 'admin' }).then(x => { applyUser(x); render(); }).catch(fail);
};
function userModal(u) {
  const isNew = !u;
  u = u || { country: S.me.country, hoursPerWeek: 40, workDays: '1,2,3,4,5' };
  const days = String(u.workDays || '').split(',');
  openModal({
    title: isNew ? 'Person hinzufügen' : u.name + ' bearbeiten',
    body: (isNew ? field('E-Mail (Google-Konto)', '<input class="input" name="email" type="email" required>') : '<input type="hidden" name="email" value="' + esc(u.email) + '">') +
      field('Name', '<input class="input" name="name" value="' + esc(u.name || '') + '">') +
      '<div class="row">' + field('Land', countrySelect(u.country)) +
      divField('Region', '<div data-region-box>' + regionField(u.country, u.region || '') + '</div>') + '</div>' +
      field('Wochenstunden', '<input class="input" type="number" name="hoursPerWeek" min="0" max="80" step="0.5" value="' + esc(u.hoursPerWeek) + '">') +
      divField('Arbeitstage', '<div class="days">' + [1, 2, 3, 4, 5, 6, 0].map(d => '<label><input type="checkbox" name="workDays" value="' + d + '"' + (days.indexOf(String(d)) >= 0 ? ' checked' : '') + '><span>' + DOW[d] + '</span></label>').join('') + '</div>'),
    danger: !isNew && u.email !== S.me.email ? { label: 'Deaktivieren', onClick: () => call('users.save', { email: u.email, active: false }).then(() => { closeModal(); reloadAll(); }).catch(fail) } : null,
    onSubmit: v => call('users.save', v).then(x => { applyUser(x); S.cap.data = null; render(); }),
  });
}
A['user-edit'] = el => userModal(user(el.dataset.email));
A['user-invite'] = () => userModal(null);
A['ch-new'] = () => openModal({
  title: 'Firmen-Feiertag',
  body: '<div class="row">' + field('Datum', '<input class="input" type="date" name="date" required>') + field('Name', '<input class="input" name="name" required placeholder="z. B. Betriebsausflug">') + '</div>' +
    field('Nur für Länder (optional, kommagetrennt)', '<input class="input" name="countries" placeholder="z. B. DE, AT">'),
  onSubmit: v => call('companyHolidays.save', { date: v.date, name: v.name, countries: v.countries.split(/[,\s]+/).filter(Boolean) })
    .then(h => { S.companyHolidays.push(h); calReload(); }),
});
A['ch-remove'] = el => call('companyHolidays.remove', { id: el.dataset.id })
  .then(() => { S.companyHolidays = S.companyHolidays.filter(h => h.id !== el.dataset.id); calReload(); }).catch(fail);
</script>
