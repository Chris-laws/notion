<script>
/* ==========================================================================
   Jour fixe of a project: meetings in rows, minutes as a form (header, numbered
   topics, lines I/A/B/N). Series and the list of minutes come with the app start
   (S.jf); the minutes text is stored in Drive (server: Docs.js, Drive.js).
   ========================================================================== */

const RHYTHMS = () => [{ key: 'weekly', label: L('Wöchentlich', 'Weekly') }, { key: 'biweekly', label: L('Alle 2 Wochen', 'Every 2 weeks') }, { key: 'monthly', label: L('Monatlich', 'Monthly') }];
const WEEKDAYS = () => [1, 2, 3, 4, 5, 6, 0].map(d => ({ key: String(d), label: DOW_LONG[d] }));
const PROTO_LABELS = () => ({ I: L('Info', 'Info'), A: L('Aufgabe', 'Action'), B: L('Beschluss', 'Decision'), N: L('Nachtrag', 'Note') });
const END_BTN = '</button></div>';
const hintP = t => '<p class="hint">' + esc(t) + '</p>';
const labelled = t => ' title="' + esc(t) + '" aria-label="' + esc(t) + '"';
const whoName = e => (e ? user(e).name : '');
const draftKey = id => 'draft:doc:' + (id || 'new');

/** Series and minutes of the projects the person sees (from the app start; refreshed after changes). */
function jfData() { return S.jf || { series: [], minutes: [] }; }
function jfReload() {
  return call('jf.list', {}, { quiet: true }).then(d => { S.jf = d; render({ peek: false }); }).catch(() => {});
}
/** Leaving the project closes the open minutes (and releases "wird gerade bearbeitet"); the browser draft stays. */
function jfLeave(view, id) {
  const pid = S.protoEdit ? S.protoEdit.projectId : S.doc && S.doc.projectId;
  if (!pid || (view === 'project' && id === pid)) return;
  if (S.protoEdit) docEndEdit();
  S.protoEdit = null;
  S.doc = null;
}
/** "Weekly · Team / Projekt": what a jour fixe entry is called in calendars and the overview. */
function jfName(seriesTitle, projectId) {
  const p = project(projectId);
  const t = p && team(p.teamId);
  return seriesTitle + (p ? ' · ' + (t ? t.name + ' / ' : '') + p.name : '');
}
/** Calendar and overview label of an event (jour fixe with team and project). */
function evLabel(e) { return e.type === 'jf' ? jfName(e.title, e.projectId) : e.title; }

/* ---------------- the tab: active series on top, the archive below ---------------- */
/** Next meeting of every active series of the project (today counts); a series past its end is left out. */
function jfUpcoming(pid) {
  const today = TODAY();
  return jfData().series.filter(s => s.projectId === pid)
    .map(s => ({ s: s, date: Shared.jfDates(s, today, Shared.addDays(today, 400))[0] })).filter(x => x.date)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}
/** All minutes of the project except those of the meetings on top, newest first. */
function jfArchiveRows(pid) {
  const next = jfUpcoming(pid);
  return jfData().minutes.filter(m => m.projectId === pid && !next.some(u => u.s.id === m.seriesId && u.date === m.date))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
/** The last meeting of every series within the past month that has no minutes yet (written a day later, say). */
function jfMissing(pid) {
  const today = TODAY();
  const minutes = jfData().minutes;
  return jfData().series.filter(s => s.projectId === pid).map(s => ({ s: s, date: Shared.jfDates(s, Shared.addDays(today, -31), Shared.addDays(today, -1)).pop() }))
    .filter(x => x.date && !minutes.some(m => m.seriesId === x.s.id && m.date === x.date));
}
function jfTab(p) {
  if (S.protoEdit && S.protoEdit.projectId === p.id) return protoEditor();
  if (S.doc && S.doc.projectId === p.id) return protoViewer();
  const minutes = jfData().minutes;
  const active = jfUpcoming(p.id).map(u => jfRow(u.s, u.date, minutes.find(m => m.seriesId === u.s.id && m.date === u.date), true))
    .concat(jfMissing(p.id).map(u => jfRow(u.s, u.date, null, false)));
  return '<div class="docs-head"><div><h3>' + icon('repeat', 'sm') + 'Jour Fixe</h3>' +
    hintP(L('Regelmäßige Termine mit Protokoll. Offene Aufgaben wandern ins nächste Protokoll.', 'Regular meetings with minutes. Open actions move on to the next minutes.')) + '</div>' +
    '<button class="btn primary" data-action="jf-new" data-id="' + esc(p.id) + '">' + icon('plus', 'sm') + 'Neuer Jour Fixe</button></div>' +
    (active.length ? '<div class="jf-rows jf-active" role="list">' + active.join('') + '</div>'
      : '<div class="empty-mini">' + esc(L('Kein laufender Jour Fixe. Lege eine Serie an, z. B. jeden Montag 9:00.', 'No running jour fixe. Create a series, e.g. every Monday 9:00.')) + '</div>') +
    jfArchive(p);
}
const ARCHIVE_PAGE = 50;
/** The archive: collapsed until opened (remembered in the browser); 50 rows, the rest on request. */
function jfArchive(p) {
  const rows = jfArchiveRows(p.id);
  if (!rows.length) return '';
  const open = store.get('jfArchive', false);
  const names = {};
  jfData().series.forEach(s => { names[s.id] = s; });
  const shown = S.jfArchiveAll ? rows : rows.slice(0, ARCHIVE_PAGE);
  return '<div class="jf-archive"><button type="button" class="jf-arch-h" data-action="jf-archive" aria-controls="jf-archive-list" aria-expanded="' + open + '">' + icon(open ? 'chevron' : 'right', 'sm') +
    '<b>' + L('Archiv', 'Archive') + '</b><span class="n">' + rows.length + '</span><span class="faint">' + esc(L('alle Protokolle, neueste zuerst', 'all minutes, newest first')) + '</span></button>' +
    (open ? '<div class="jf-rows" id="jf-archive-list" role="list">' + shown.map(m => jfRow(names[m.seriesId] || { id: m.seriesId, title: String(m.title || '').split(' · ')[0], attendees: [] }, m.date, m, false)).join('') + '</div>' +
      (shown.length < rows.length ? '<button type="button" class="btn sm outline" data-action="jf-archive-all">' + esc(L('Alle ' + rows.length + ' anzeigen', 'Show all ' + rows.length)) + '</button>' : '') : '') + '</div>';
}
A['jf-archive'] = () => { store.set('jfArchive', !store.get('jfArchive', false)); render({ peek: false }); };
A['jf-archive-all'] = () => { S.jfArchiveAll = true; render({ peek: false }); };
/**
 * One meeting: series, date ("Nächster: …" for the next one, the plain date in the archive) and people:
 * before the meeting everybody invited, afterwards only who missed it (they should read the minutes).
 */
function jfRow(s, date, minutes, upcoming) {
  // no minutes yet (or ahead): the people invited; afterwards: who missed it
  const planned = upcoming || !minutes;
  const people = planned ? s.attendees || [] : (minutes.people && minutes.people.absent) || [];
  const label = upcoming ? L('Nächster: ', 'Next: ') + fmtDate(date, { absolute: true }) : fmtDate(date, { absolute: true });
  return '<div class="jf-row' + (upcoming ? ' next' : '') + '" role="listitem"><div class="jf-hit" role="button" tabindex="0" data-action="jf-open" data-id="' + esc(s.id) + '" data-v="' + esc(date) + '" ' +
    'data-on-keydown="jf-row-key">' +
    '<b class="jf-t">' + esc(s.title) + '</b><span class="jf-d' + (upcoming ? ' next' : '') + '">' + esc(label) + '</span>' +
    (minutes && minutes.openCount ? '<span class="chip warn">' + esc(minutes.openCount + L(' offen', ' open')) + '</span>' : '') +
    '<span class="grow"></span>' +
    (people.length ? (planned ? '' : '<span class="faint jf-miss">' + esc(L('Gefehlt:', 'Missed:')) + '</span>') + avatars(people, 6) : '') +
    icon('right', 'sm faint') + '</div>' +
    (upcoming ? '<button class="icon-btn" data-action="jf-edit" data-id="' + esc(s.id) + '"' + labelled(L('Jour Fixe bearbeiten', 'Edit jour fixe')) + '>' + icon('settings', 'sm') + '</button>' : '') +
    '</div>';
}
ON.keydown['jf-row-key'] = (el, e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); A['jf-open'](el); } };
A['jf-open'] = el => jfOpen(el.dataset.id, el.dataset.v);
/** One call: saved minutes with their text, or a draft from the template (nothing is written before "Übernehmen"). */
function jfOpen(seriesId, date) {
  if (S.jfOpening) return Promise.resolve();
  S.jfOpening = true;
  return call('jf.meeting', { seriesId: seriesId, date: date, lang: LANG }).then(m => {
    S.jfOpening = false;
    S.projTab = 'jf';
    if (S.route.view !== 'project' || S.route.id !== m.projectId) go('project', m.projectId);
    S.doc = m;
    if (m.draft && m.canWrite) return protoStartEdit(m);
    render({ peek: false });
  }).catch(err => { S.jfOpening = false; fail(err); });
}
A['jf-new'] = el => jfModal(null, el.dataset.id);
A['jf-edit'] = el => { const s = jfData().series.find(x => x.id === el.dataset.id); if (s) jfModal(s, s.projectId); };
function jfModal(s, projectId) {
  const p = project(projectId);
  s = s || { title: 'Jour Fixe', rhythm: 'weekly', weekday: 1, time: '09:00', duration: 30, startDate: TODAY(), attendees: p ? projectMembers(p) : [S.me.email] };
  openModal({
    title: s.id ? L('Jour Fixe bearbeiten', 'Edit jour fixe') : L('Neuer Jour Fixe', 'New jour fixe'),
    body: field('Titel', '<input class="input" name="title" required maxlength="80" value="' + esc(s.title) + '">') +
      '<div class="row">' + field('Rhythmus', selectField('rhythm', RHYTHMS(), s.rhythm)) + field('Wochentag', selectField('weekday', WEEKDAYS(), String(s.weekday))) + '</div>' +
      '<div class="row">' + field('Uhrzeit', '<input class="input" type="time" name="time" value="' + esc(s.time) + '">') +
      field('Dauer (Min.)', '<input class="input" type="number" min="15" max="480" step="5" name="duration" value="' + esc(s.duration) + '">') + '</div>' +
      '<div class="row">' + field('Ab', '<input class="input" type="date" name="startDate" value="' + esc(s.startDate || '') + '">') +
      field('Bis (optional)', '<input class="input" type="date" name="endDate" value="' + esc(s.endDate || '') + '">') + '</div>' +
      divField('Teilnehmende', peoplePicker('attendees', s.attendees || [], { add: 'Personen hinzufügen', prefer: p ? projectMembers(p) : [] })) +
      field('Google-Meet-Link (optional)', '<input class="input" name="meetLink" placeholder="https://meet.google.com/…" value="' + esc(s.meetLink || '') + '">'),
    submitLabel: s.id ? 'Speichern' : L('Jour Fixe anlegen', 'Create jour fixe'),
    danger: s.id ? { label: L('Serie beenden', 'End series'), onClick: () => confirmDelete(L('Serie beenden? Alle Protokolle bleiben erhalten.', 'End the series? All minutes are kept.'),
      () => call('jf.removeSeries', { id: s.id }).then(() => { calReload(); return jfReload(); })) } : null,
    onSubmit: v => call('jf.saveSeries', Object.assign({ id: s.id, projectId: projectId }, v, { weekday: Number(v.weekday), attendees: collectPeople(v, 'attendees') }))
      .then(() => { closeModal(); calReload(); toast(L('Jour Fixe gespeichert', 'Jour fixe saved')); return jfReload(); }),
  });
}

/* ---------------- minutes: view ---------------- */
/** The minutes table: numbered topics with their lines (Art, Thema, Verantwortlich, Termin). */
function protoTable(m, o) {
  const rows = [];
  m.topics.forEach((t, k) => {
    rows.push('<tr class="pt-topic"><td>' + (k + 1) + '.</td><td></td><td><b>' + esc(t.title) + '</b></td><td>' + esc(whoName(t.owner)) + '</td><td></td></tr>');
    t.items.forEach((i, n) => {
      const task = i.taskId ? ' <button class="md-task" data-action="open-task" data-id="' + esc(i.taskId) + '">' + icon('check', 'sm') + L('Aufgabe', 'Task') + '</button>'
        : o.actions && i.type === 'A' && !i.done ? ' <button class="md-mk" data-action="proto-task" data-id="' + esc(o.docId) + '" data-t="' + k + '" data-i="' + n + '" data-tid="' + esc(t.id) + '" data-iid="' + esc(i.id) + '">' + icon('plus', 'sm') + L('Als Aufgabe', 'As task') + '</button>' : '';
      rows.push('<tr class="pt-line' + (i.done ? ' done' : '') + '"><td></td><td><span class="pt-type t-' + i.type + '" title="' + esc(PROTO_LABELS()[i.type]) + '">' + i.type + '</span></td>' +
        '<td>' + esc(i.text) + task + '</td><td>' + esc(whoName(i.owner)) + '</td><td class="nowrap">' + (i.due ? esc(fmtDate(i.due, { absolute: true })) : '') + '</td></tr>');
    });
  });
  return '<div class="md-tw"><table class="pt"><thead><tr><th>' + L('Nr.', 'No.') + '</th><th>' + L('Art', 'Type') + '</th><th>' + L('Thema', 'Topic') + '</th><th>' +
    L('Verantwortlich', 'Responsible') + '</th><th>' + L('Termin', 'Due') + '</th></tr></thead><tbody>' +
    (rows.join('') || '<tr><td colspan="5" class="faint">' + L('Noch keine Themen.', 'No topics yet.') + '</td></tr>') + '</tbody></table></div>';
}
/** Minutes as a table; any other text (older files) as plain text. */
function docPreview(text) {
  const m = Shared.protoFromText(text);
  return m ? protoTable(m, {}) : '<pre class="pt-plain">' + esc(text) + '</pre>';
}
function protoHead(m, version) {
  const people = list => (list.length ? list.map(e => '<span class="pt-p">' + avatar(e) + esc(whoName(e)) + '</span>').join('') : '<span class="faint">–</span>');
  return '<dl class="pt-head"><dt>' + L('Datum', 'Date') + '</dt><dd>' + esc(fmtDate(m.date, { absolute: true })) + (version ? ' · Rev. ' + version : '') + '</dd>' +
    '<dt>' + L('Protokoll', 'Minutes by') + '</dt><dd>' + people(m.minuteTaker ? [m.minuteTaker] : []) + '</dd>' +
    '<dt>' + L('Anwesend', 'Present') + '</dt><dd>' + people(m.present) + '</dd>' +
    '<dt>' + L('Abwesend', 'Absent') + '</dt><dd>' + people(m.absent) + '</dd></dl>';
}
function protoViewer() {
  const d = S.doc;
  if (d.content === undefined) return skLines(6);
  const m = Shared.protoFromText(d.content) || Shared.protoClean({ title: d.title, date: d.date });
  return '<div class="doc-view card-w"><div class="dv-head"><button class="icon-btn" data-action="doc-close"' + labelled(L('Zurück', 'Back')) + '>' + icon('back') + '</button>' +
    '<div class="dv-t"><h2>' + esc(jfName(m.title || d.title, d.projectId)) + '</h2><small>' + esc(L('Jour-Fixe-Protokoll', 'Jour fixe minutes')) +
    (d.updatedBy ? esc(' · ' + user(d.updatedBy).name + ' · ' + timeAgo(d.updatedAt)) : '') + '</small></div>' +
    (d.lockBy && d.lockBy !== S.me.email ? '<span class="chip warn">' + icon('lock', 'sm') + esc(user(d.lockBy).name) + ' bearbeitet gerade</span>' : '') +
    (d.canWrite && d.id ? '<button class="btn sm" data-action="doc-versions" data-id="' + esc(d.id) + '">' + icon('clock', 'sm') + 'Versionen</button>' : '') +
    (d.canWrite ? '<button class="btn sm primary" data-action="proto-edit">' + L('Bearbeiten', 'Edit') + '</button>' : '') + '</div>' +
    protoHead(m, d.version) + protoTable(m, { actions: d.canWrite && d.id, docId: d.id }) + '</div>';
}
A['doc-close'] = () => { S.doc = null; S.projTab = 'jf'; render({ peek: false }); };
/** "+1 Thema · 2 Zeilen neu · 1 geändert": what one save changed (null for older entries). */
function changeText(c) {
  if (!c) return '';
  const parts = [];
  const n = (k, one, many) => (Math.abs(c[k]) === 1 ? one : many).replace('#', Math.abs(c[k]));
  if (c.topics > 0) parts.push(n('topics', L('+# Thema', '+# topic'), L('+# Themen', '+# topics')));
  if (c.topics < 0) parts.push(n('topics', L('−# Thema', '−# topic'), L('−# Themen', '−# topics')));
  if (c.lines) parts.push(n('lines', L('# Zeile neu', '# new line'), L('# Zeilen neu', '# new lines')));
  if (c.changed) parts.push(n('changed', L('# geändert', '# changed'), L('# geändert', '# changed')));
  if (c.removed) parts.push(n('removed', L('# gelöscht', '# removed'), L('# gelöscht', '# removed')));
  if (c.header) parts.push(L('Kopf geändert', 'header changed'));
  return parts.join(' · ') || L('keine inhaltliche Änderung', 'no change in content');
}
/** Every version: who, when, what changed; view any of them, restore an earlier one (as a new version). */
A['doc-versions'] = el => {
  const id = el.dataset.id;
  call('docs.versions', { id: id }).then(list => openModal({
    title: L('Versionen', 'Versions'),
    body: '<div class="list-plain ver-list">' + list.map(v => '<div class="li"><span class="grow"><b>' + esc(L('Version ', 'Version ') + v.version) + '</b>' +
      (v.current ? ' <span class="chip soft">' + esc(L('aktuell', 'current')) + '</span>' : '') +
      '<br><span class="faint">' + esc(user(v.by).name + ' · ' + fmtDate(String(v.at).slice(0, 10), { absolute: true }) + ' ' + String(v.at).slice(11, 16)) + '</span>' +
      (v.change ? '<br><span class="ver-ch">' + esc(changeText(v.change)) + '</span>' : '') + '</span>' +
      '<button type="button" class="btn sm" data-action="doc-version-view" data-id="' + esc(id) + '" data-v="' + v.version + '">' + esc(L('Ansehen', 'View')) + '</button>' +
      (v.current ? '</div>' : '<button type="button" class="btn sm" data-action="doc-restore" data-id="' + esc(id) + '" data-v="' + v.version + '">' + esc(L('Wiederherstellen', 'Restore')) + END_BTN)).join('') + '</div>',
    submitLabel: L('Schließen', 'Close'),
    onSubmit: () => closeModal(),
  })).catch(fail);
};
/** One version, read only (the version list stays one click away). */
A['doc-version-view'] = el => call('docs.version', { id: el.dataset.id, version: Number(el.dataset.v) }).then(v => {
  const m = Shared.protoFromText(v.content);
  openModal({
    title: L('Version ', 'Version ') + v.version,
    body: '<div class="ver-view">' + (m ? protoHead(m, v.version) + protoTable(m, {}) : docPreview(v.content)) + '</div>',
    submitLabel: L('Zurück zur Liste', 'Back to the list'),
    onSubmit: () => A['doc-versions'](el),
  });
}).catch(fail);
A['doc-restore'] = el => call('docs.restore', { id: el.dataset.id, version: Number(el.dataset.v) })
  .then(() => { closeModal(); toast(L('Version wiederhergestellt', 'Version restored')); return protoReopen(el.dataset.id); }).catch(fail);
function protoReopen(id) {
  return call('docs.get', { id: id }).then(d => { S.doc = d; render({ peek: false }); return jfReload(); });
}

/* ---------------- minutes: the form ---------------- */
let docLockTimer = null;
/** "Wird gerade bearbeitet": set while the form is open, renewed every 4 minutes (runs out after 5 on its own). */
function docLock(id) {
  clearInterval(docLockTimer);
  call('docs.lock', { id: id }, { quiet: true }).catch(() => {});
  docLockTimer = setInterval(() => { if (S.protoEdit && S.protoEdit.id === id) call('docs.lock', { id: id }, { quiet: true }).catch(() => {}); else clearInterval(docLockTimer); }, 4 * 60000);
}
function docEndEdit() {
  const e = S.protoEdit;
  clearInterval(docLockTimer);
  if (e && e.id) call('docs.unlock', { id: e.id }, { quiet: true }).catch(() => {});
}
const protoKey = e => draftKey('jf:' + e.seriesId + ':' + e.date);
function protoStartEdit(d) {
  const model = Shared.protoFromText(d.content) || Shared.protoClean({ date: d.date, topics: [] });
  const e = { id: d.id || '', projectId: d.projectId, seriesId: d.seriesId, date: d.date, title: d.title, base: d.version || 0, model: model, saved: Shared.protoToText(model), sizes: {} };
  const draft = store.get(protoKey(e), null);
  if (draft && Shared.protoToText(draft.model) !== e.saved) {
    // saved by someone else since: my draft is merged into their version (my side wins a clash)
    const newer = draft.base !== e.base && draft.baseText;
    e.model = newer ? Shared.protoMerge(Shared.protoFromText(draft.baseText), draft.model, model).model : Shared.protoClean(draft.model);
    toast(newer ? L('Dein Entwurf wurde mit der neuen Fassung zusammengeführt.', 'Your draft was merged with the newer version.')
      : L('Dein ungespeicherter Entwurf wurde wiederhergestellt.', 'Your unsaved draft was restored.'));
  }
  S.protoEdit = e;
  if (e.id) docLock(e.id);
  render({ peek: false });
}
const protoDirty = () => !!S.protoEdit && Shared.protoToText(S.protoEdit.model) !== S.protoEdit.saved;
/** Re-renders the form; text fields someone dragged larger keep their size. */
function protoRender() {
  const sizes = S.protoEdit.sizes;
  $$('.proto-edit textarea[data-path]').forEach(t => { if (t.style.height) sizes[t.dataset.path] = t.style.height; });
  render({ peek: false });
  $$('.proto-edit textarea[data-path]').forEach(t => { if (sizes[t.dataset.path]) t.style.height = sizes[t.dataset.path]; });
}
/** People to pick from: attendees, the project's people, then everybody else. */
function protoPeople() {
  const e = S.protoEdit;
  const p = project(e.projectId);
  return e.model.present.concat(p ? projectMembers(p) : [], S.users.map(u => u.email)).filter((x, i, a) => x && a.indexOf(x) === i);
}
function personSelect(path, value) {
  return '<select class="select sm" data-on-change="proto-field" data-path="' + path + '" aria-label="' + esc(L('Verantwortlich', 'Responsible')) + '"><option value="">–</option>' +
    protoPeople().map(x => '<option value="' + esc(x) + '"' + (x === value ? ' selected' : '') + '>' + esc(user(x).name) + '</option>').join('') + '</select>';
}
function protoLine(i, k, n) {
  const at = 'topics.' + k + '.items.' + n;
  return '<div class="pe-line">' +
    '<select class="select sm pe-type" data-on-change="proto-field" data-path="' + at + '.type" aria-label="' + esc(L('Art', 'Type')) + '">' +
    Shared.PROTO_TYPES.map(ty => '<option value="' + ty + '"' + (ty === i.type ? ' selected' : '') + '>' + ty + ' · ' + esc(PROTO_LABELS()[ty]) + '</option>').join('') + '</select>' +
    '<textarea class="textarea pe-text" rows="1" data-on-input="proto-field" data-path="' + at + '.text" aria-label="Text">' + esc(i.text) + '</textarea>' +
    personSelect(at + '.owner', i.owner) +
    '<input class="input sm" type="date" data-on-change="proto-field" data-path="' + at + '.due" value="' + esc(i.due) + '" aria-label="' + esc(L('Termin', 'Due')) + '">' +
    (i.type === 'A' ? '<label class="pe-done"><input type="checkbox" data-on-change="proto-field" data-path="' + at + '.done"' + (i.done ? ' checked' : '') + '> ' + esc(L('erledigt', 'done')) + '</label>' : '<span class="pe-done"></span>') +
    '<button type="button" class="icon-btn" data-action="proto-del" data-t="' + k + '" data-i="' + n + '"' + labelled(L('Zeile löschen', 'Delete line')) + '>' + icon('x', 'sm') + END_BTN;
}
function protoEditor() {
  const e = S.protoEdit;
  const m = e.model;
  const dirty = protoDirty();
  const chips = (list, key) => list.map(x => '<span class="nt-chip">' + avatar(x) + '<span>' + esc(user(x).name) + '</span><button type="button" class="nt-x" data-action="proto-unperson" data-k="' + key + '" data-v="' + esc(x) + '"' + labelled(L('Entfernen', 'Remove')) + '>' + icon('x', 'sm') + '</button></span>').join('');
  const topics = m.topics.map((t, k) =>
    '<div class="pe-topic card-w"><div class="pe-th"><span class="pe-no">' + (k + 1) + '.</span>' +
    '<input class="input" data-on-input="proto-field" data-path="topics.' + k + '.title" value="' + esc(t.title) + '" placeholder="' + esc(L('Thema', 'Topic')) + '" aria-label="' + esc(L('Thema', 'Topic')) + '">' +
    personSelect('topics.' + k + '.owner', t.owner) +
    '<button type="button" class="icon-btn" data-action="proto-del" data-t="' + k + '"' + labelled(L('Thema löschen', 'Delete topic')) + '>' + icon('trash', 'sm') + END_BTN +
    t.items.map((i, n) => protoLine(i, k, n)).join('') +
    '<button type="button" class="btn sm outline" data-action="proto-add-line" data-t="' + k + '">' + icon('plus', 'sm') + L('Zeile', 'Line') + '</button></div>').join('');
  return '<div class="doc-edit card-w proto-edit"><div class="dv-head"><div class="dv-t"><h2>' + esc(jfName(m.title || e.title, e.projectId)) + '</h2><small>' + esc(fmtDate(e.date, { absolute: true })) + '</small></div></div>' +
    '<div class="pe-head"><label class="field"><span>' + L('Protokoll', 'Minutes by') + '</span>' + personSelect('minuteTaker', m.minuteTaker) + '</label>' +
    '<div class="field"><span>' + L('Anwesend', 'Present') + '</span><div class="nt-people">' + chips(m.present, 'present') + '<button type="button" class="nt-add" data-action="proto-person" data-k="present">' + icon('plus', 'sm') + L('Personen', 'People') + '</button></div></div>' +
    '<div class="field"><span>' + L('Abwesend', 'Absent') + '</span><div class="nt-people">' + chips(m.absent, 'absent') + '<button type="button" class="nt-add" data-action="proto-person" data-k="absent">' + icon('plus', 'sm') + L('Personen', 'People') + '</button></div></div></div>' +
    hintP(L('Art: I = Info · A = Aufgabe (mit Verantwortlich und Termin, wird zur Projektaufgabe) · B = Beschluss · N = Nachtrag', 'Type: I = info · A = action (with responsible and due date, becomes a project task) · B = decision · N = note')) +
    topics + '<button type="button" class="btn" data-action="proto-add-topic">' + icon('plus', 'sm') + L('Thema hinzufügen', 'Add topic') + '</button>' +
    '<div class="peek-commit doc-commit' + (dirty ? '' : ' clean') + '" role="status">' +
    '<span class="grow">' + (dirty ? L('Ungespeicherte Änderungen (als Entwurf im Browser gesichert)', 'Unsaved changes (kept as a draft in this browser)') : L('Keine Änderungen', 'No changes')) + '</span>' +
    '<button type="button" class="btn sm" data-action="proto-discard">' + (dirty ? L('Verwerfen', 'Discard') : L('Schließen', 'Close')) + '</button>' +
    '<button type="button" class="btn sm primary" data-action="proto-save"' + (dirty ? '' : ' disabled') + '>' + L('Übernehmen', 'Apply') + '</button></div></div>';
}
/** Sets model[path] ("topics.0.items.2.text") and keeps a draft in the browser. */
function protoSet(path, value) {
  const keys = path.split('.');
  let o = S.protoEdit.model;
  keys.slice(0, -1).forEach(k => { o = o[k]; });
  o[keys[keys.length - 1]] = value;
  store.set(protoKey(S.protoEdit), { base: S.protoEdit.base, baseText: S.protoEdit.saved, model: S.protoEdit.model });
}
ON.input['proto-field'] = el => { protoSet(el.dataset.path, el.value); protoBarSoon(); };
ON.change['proto-field'] = el => { protoSet(el.dataset.path, el.type === 'checkbox' ? el.checked : el.value); protoRender(); };
const protoBarSoon = debounce(() => {
  const bar = $('.proto-edit .doc-commit');
  if (!bar || !S.protoEdit) return;
  const dirty = protoDirty();
  bar.classList.toggle('clean', !dirty);
  $('.grow', bar).textContent = dirty ? L('Ungespeicherte Änderungen (als Entwurf im Browser gesichert)', 'Unsaved changes (kept as a draft in this browser)') : L('Keine Änderungen', 'No changes');
  $('[data-action="proto-save"]', bar).disabled = !dirty;
}, 150);
// every topic and line gets an id, so two people's changes can be merged on saving
const newId = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const newLine = () => ({ id: newId(), type: 'I', text: '', owner: '', due: '', done: false, taskId: '' });
A['proto-add-topic'] = () => { S.protoEdit.model.topics.push({ id: newId(), title: '', owner: S.me.email, items: [newLine()] }); protoRender(); };
A['proto-add-line'] = el => { S.protoEdit.model.topics[Number(el.dataset.t)].items.push(newLine()); protoRender(); };
A['proto-del'] = el => {
  const t = S.protoEdit.model.topics;
  if (el.dataset.i === undefined) t.splice(Number(el.dataset.t), 1);
  else t[Number(el.dataset.t)].items.splice(Number(el.dataset.i), 1);
  protoRender();
};
A['proto-person'] = el => {
  const k = el.dataset.k;
  peopleModal({ title: k === 'present' ? L('Anwesend', 'Present') : L('Abwesend', 'Absent'), selected: S.protoEdit.model[k].slice(), prefer: protoPeople(),
    onChange: list => { S.protoEdit.model[k] = list; protoRender(); } });
};
A['proto-unperson'] = el => { const k = el.dataset.k; S.protoEdit.model[k] = S.protoEdit.model[k].filter(x => x !== el.dataset.v); protoRender(); };
A['proto-edit'] = () => protoStartEdit(S.doc);
A['proto-discard'] = () => {
  const e = S.protoEdit;
  store.set(protoKey(e), null);
  docEndEdit();
  S.protoEdit = null;
  if (!e.id) S.doc = null;
  render({ peek: false });
};
A['proto-save'] = () => protoSave();
function protoSave() {
  const e = S.protoEdit;
  const content = Shared.protoToText(e.model);
  const payload = e.id ? { id: e.id, title: e.title, content: content, baseVersion: e.base, baseContent: e.saved }
    : { projectId: e.projectId, seriesId: e.seriesId, date: e.date, title: e.title, content: content, baseContent: e.saved };
  return call('docs.save', payload).then(r => {
    if (r.conflict) return protoConflict(r);
    store.set(protoKey(e), null);
    docEndEdit();
    S.protoEdit = null;
    toast(r.merged ? L('Gespeichert und mit den Änderungen von ' + user(r.mergedWith).name + ' zusammengeführt', 'Saved and merged with the changes of ' + user(r.mergedWith).name)
      : L('Protokoll gespeichert', 'Minutes saved'));
    S.doc = Object.assign({}, r, { content: r.content || content, canWrite: true });
    render({ peek: false });
    return jfReload();
  }).catch(fail);
}
/** Someone saved in between: keep mine (on top of theirs) or take theirs. Nothing is lost silently. */
function protoConflict(r) {
  const cur = r.current;
  openModal({
    title: L('Inzwischen geändert', 'Changed in the meantime'),
    body: '<p style="margin:0 0 8px">' + esc(L(user(cur.updatedBy).name + ' hat gespeichert, während du bearbeitet hast.', user(cur.updatedBy).name + ' saved while you were editing.')) + '</p>' +
      hintP(L('Deine Fassung bleibt als Entwurf im Browser erhalten. Ihre Fassung siehst du unten.', 'Your version stays as a draft in this browser. Theirs is shown below.')) +
      '<div class="de-preview conflict">' + docPreview(cur.content) + '</div>',
    submitLabel: L('Meine Fassung speichern', 'Save my version'),
    danger: { label: L('Ihre Fassung übernehmen', 'Take their version'), onClick: () => {
      closeModal();
      const e = S.protoEdit;
      store.set(protoKey(e), null);
      docEndEdit();
      S.protoEdit = null;
      S.doc = cur;
      render({ peek: false });
    } },
    onSubmit: () => {
      closeModal();
      // on top of their version: theirs plus my changes, mine only where both changed the same field
      const e = S.protoEdit;
      e.id = cur.id;
      e.base = cur.version;
      e.saved = cur.content;
      if (r.merged) e.model = Shared.protoFromText(r.merged);
      return protoSave();
    },
  });
}
A['proto-task'] = el => call('jf.actionToTask', { docId: el.dataset.id, topic: Number(el.dataset.t), item: Number(el.dataset.i), topicId: el.dataset.tid, itemId: el.dataset.iid }).then(r => {
  applyTasks([r.task]);
  toast(L('Aufgabe angelegt: ', 'Task created: ') + r.task.title, { action: { label: L('Öffnen', 'Open'), fn: () => openPeek(r.task.id) } });
  return protoReopen(el.dataset.id);
}).catch(fail);

/* ---------------- admin: storage links ---------------- */
function storageBox() {
  if (S.storage === undefined) {
    S.storage = null;
    call('storage.links').then(l => { S.storage = l; render(); }).catch(err => { S.storage = { error: friendlyError(err.message) }; render(); });
  }
  const l = S.storage;
  if (!l) return skLines(1);
  if (l.error) return '<div class="notice">' + esc(l.error) + '</div>';
  const link = (href, label, ic) => (href ? '<a class="btn sm" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + icon(ic, 'sm') + esc(label) + '</a>' : '');
  return hintP(L('Alles liegt im Google Drive des App-Kontos: Datenbank, Backups und der Ordner LidlFlow mit den Jour-Fixe-Protokollen.',
    'Everything lives in the Google Drive of the app account: the database, the backups and the LidlFlow folder with the jour fixe minutes.')) +
    '<div class="row-btns">' + link(l.database, L('Datenbank öffnen', 'Open database'), 'table') + link(l.backups, L('Backups öffnen', 'Open backups'), 'layers') +
    link(l.drive, L('Drive-Ordner öffnen', 'Open Drive folder'), 'folder') + (l.drive ? '' : '<span class="faint">' + esc(L('Der Drive-Ordner entsteht mit dem ersten Protokoll.', 'The Drive folder appears with the first minutes.')) + '</span>') + '</div>';
}
</script>
