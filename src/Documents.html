<script>
/* ==========================================================================
   Jour fixe of a team (v62): the meetings in a table, the minutes as a mask with
   topic cards (type, people, description with images, links, screenshots, files,
   task). Series and the list of minutes come with the app start (S.jf); the minutes
   text is stored in Drive (server: Docs.js, Drive.js).
   ========================================================================== */

const RHYTHMS = () => [{ key: 'weekly', label: L('Wöchentlich', 'Weekly') }, { key: 'biweekly', label: L('Alle 2 Wochen', 'Every 2 weeks') }, { key: 'monthly', label: L('Monatlich', 'Monthly') }];
const WEEKDAYS = () => [1, 2, 3, 4, 5, 6, 0].map(d => ({ key: String(d), label: DOW_LONG[d] }));
const PROTO_LABELS = () => ({ I: L('Info', 'Info'), A: L('Aufgabe', 'Action'), B: L('Beschluss', 'Decision'), N: L('Nachtrag', 'Note') });
const END_BTN = '</button></div>';
const END_ROW = '</td></tr>';
const ATTR_I = '" data-i="';
const hintP = t => '<p class="hint">' + esc(t) + '</p>';
const labelled = t => ' title="' + esc(t) + '" aria-label="' + esc(t) + '"';
const ariaL = t => ' aria-label="' + esc(t) + '"';
const whoName = e => (e ? user(e).name : '');
const draftKey = id => 'draft:doc:' + (id || 'new');


const KIND_LABELS = () => ({ I: L('Info', 'Info'), A: L('Aufgabe', 'Task'), B: L('Beschluss', 'Decision') });
const isTeamPlace = id => String(id || '').indexOf('team:') === 0;
const placeTeam = id => (isTeamPlace(id) ? team(String(id).slice(5)) : null);
/** May the person write in this jour fixe? Members of the team and admins (the server checks again). */
const jfCanWrite = id => { const t = placeTeam(id); return !!t && (S.me.admin || teamMembers(t).indexOf(S.me.email) >= 0); };

/** Series and minutes of the teams the person is in (from the app start; refreshed after changes). */
function jfData() { return S.jf || { series: [], minutes: [] }; }
function jfReload() {
  return call('jf.list', {}, { quiet: true }).then(d => { S.jf = d; render({ peek: false }); }).catch(() => {});
}
/** Leaving the team page closes the open minutes (and releases "wird gerade bearbeitet"); the browser draft stays. */
function jfLeave(view, id) {
  const pid = S.protoEdit ? S.protoEdit.projectId : S.doc && S.doc.projectId;
  if (!pid || (view === 'team' && 'team:' + id === pid)) return;
  if (S.protoEdit) docEndEdit();
  S.protoEdit = null;
  S.doc = null;
}
/** "Weekly · Team": what a jour fixe entry is called in calendars and the overview. */
function jfName(seriesTitle, placeId) {
  const t = placeTeam(placeId);
  return seriesTitle + (t ? ' · ' + t.name : '');
}
/** Calendar and overview label of an event (jour fixe with its team). */
function evLabel(e) { return e.type === 'jf' ? jfName(e.title, e.projectId) : e.title; }

/* ---------------- the overview of a team: one table, next meetings on top ---------------- */
/** Next meeting of every active series of the team (today counts); a series past its end is left out. */
function jfUpcoming(pid) {
  const today = TODAY();
  return jfData().series.filter(s => s.projectId === pid)
    .map(s => ({ s: s, date: Shared.jfDates(s, today, Shared.addDays(today, 400))[0] })).filter(x => x.date)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}
/** All minutes of the team except those of the meetings on top, newest first. */
function jfArchiveRows(pid) {
  const next = jfUpcoming(pid);
  return jfData().minutes.filter(m => m.projectId === pid && !next.some(u => u.s.id === m.seriesId && u.date === m.date))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
/** The last meeting of every series within the past month that has no minutes yet (written a day later, say). */
function jfMissing(pid) {
  const today = TODAY();
  const minutes = jfData().minutes;
  return jfData().series.filter(s => s.projectId === pid).map(s => ({ s: s, date: Shared.jfDates(s, Shared.addDays(today, -31), Shared.addDays(today, -1)).pop() }))
    .filter(x => x.date && !minutes.some(m => m.seriesId === x.s.id && m.date === x.date));
}
const JF_PAGE = 9;
const OPT_OPEN = '<option value="';
const SEC_END = '</section>';
/** What a meeting is right now: planned, minutes missing, in progress or closed. */
function jfStatus(minutes, upcoming) {
  if (!minutes) return upcoming ? { key: 'plan', label: L('Geplant', 'Planned') } : { key: 'miss', label: L('Protokoll fehlt', 'Minutes missing') };
  return minutes.people && minutes.people.closed ? { key: 'done', label: L('Abgeschlossen', 'Closed') } : { key: 'work', label: L('In Bearbeitung', 'In progress') };
}
const JF_FILTERS = () => [['all', L('Alle Einträge', 'All entries')], ['plan', L('Geplant', 'Planned')], ['miss', L('Protokoll fehlt', 'Minutes missing')],
  ['work', L('In Bearbeitung', 'In progress')], ['done', L('Abgeschlossen', 'Closed')]];
const pad2 = n => String(n).padStart(2, '0');
/** The year of a calendar week (ISO: the year of the week's Thursday). */
const jfWeekYear = date => Shared.addDays(date, 4 - (Shared.weekday(date) || 7)).slice(0, 4);
const monShort = m => MONTHS[m - 1] + (MONTHS[m - 1].length <= 3 ? '.' : '');
/** "Do, 05. Nov." */
const jfDay = date => DOW[Shared.weekday(date)] + ', ' + (LANG === 'en' ? monShort(Number(date.slice(5, 7))) + ' ' + pad2(Number(date.slice(8))) : pad2(Number(date.slice(8))) + '. ' + monShort(Number(date.slice(5, 7))));
/** "Heute, 14:29" · "Gestern, 09:10" · "03. Nov., 16:37" (the time of a save, in the person's time zone). */
function jfStamp(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d.getTime())) return '–';
  const ymd = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const diff = Shared.diffDays(TODAY(), ymd);
  if (diff === 0) return L('Heute', 'Today') + ', ' + time;
  if (diff === -1) return L('Gestern', 'Yesterday') + ', ' + time;
  return jfDay(ymd).replace(/^[^,]+, /, '') + ', ' + time;
}
/** Every meeting of the team as one row: the next ones, meetings without minutes, then the saved minutes. */
function jfRows(pid) {
  const minutes = jfData().minutes;
  const seriesOf = {};
  jfData().series.forEach(s => { seriesOf[s.id] = s; });
  const rows = jfUpcoming(pid).map(u => ({ s: u.s, date: u.date, m: minutes.find(m => m.seriesId === u.s.id && m.date === u.date), up: true }))
    .concat(jfMissing(pid).map(u => ({ s: u.s, date: u.date, m: null, up: false })))
    .concat(jfArchiveRows(pid).map(m => ({ s: seriesOf[m.seriesId] || { id: m.seriesId, title: String(m.title || '').split(' · ')[0], attendees: [] }, date: m.date, m: m, up: false })));
  // the page points to the nearest meeting that is still to come
  const next = rows.filter(r => r.up).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
  return rows.map(r => Object.assign(r, { st: jfStatus(r.m, r.up), next: r === next }));
}
/** The rows as the filters leave them (year, status, search), sorted by date, and the page that is shown. */
function jfView(t) {
  const all = jfRows('team:' + t.id);
  const cur = TODAY().slice(0, 4);
  const years = all.map(r => r.date.slice(0, 4)).concat([cur]).filter((y, i, a) => a.indexOf(y) === i).sort().reverse();
  const year = years.indexOf(S.jfYear) >= 0 ? S.jfYear : (all.some(r => r.date.slice(0, 4) === cur) || !all.length ? cur : all[0].date.slice(0, 4));
  const q = String(S.jfQuery || '').trim().toLowerCase();
  const flt = S.jfFilter || 'all';
  const rows = all.filter(r => r.date.slice(0, 4) === year && (flt === 'all' || r.st.key === flt) &&
    (!q || [r.s.title, t.name, 'kw ' + Shared.isoWeek(r.date), jfDay(r.date), r.date, r.st.label, r.m ? whoName(r.m.updatedBy) : ''].join(' ').toLowerCase().indexOf(q) >= 0))
    .sort((a, b) => (a.date < b.date ? 1 : -1) * (S.jfSort === 'asc' ? -1 : 1));
  const pages = Math.max(1, Math.ceil(rows.length / JF_PAGE));
  const page = Math.min(Math.max(S.jfPage || 0, 0), pages - 1);
  return { all: all, years: years, year: year, rows: rows, page: page, pages: pages, shown: rows.slice(page * JF_PAGE, (page + 1) * JF_PAGE) };
}
function jfTeamTab(t) {
  const v = jfView(t);
  setTimeout(() => jfPrefetch(v.shown.filter(r => r.m).slice(0, 4).map(r => r.m.id)), 400);
  const opt = (key, label, cur) => OPT_OPEN + esc(key) + '"' + (key === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
  return '<section class="jfo"><div class="jfo-head"><span class="jfo-ico">' + icon('calendar') + '</span><div><h2>' + esc(L('Jour Fixe – Übersicht', 'Jour fixe – overview')) + '</h2>' +
    '<p>' + esc(L('Team-Meetings, Protokolle und zentrale Informationen – Single Source of Truth.', 'Team meetings, minutes and key information – single source of truth.')) + '</p></div>' +
    (jfCanWrite('team:' + t.id) ? '<button class="btn jf-primary" data-action="jf-new" data-team="' + esc(t.id) + '">' + icon('plus', 'sm') + esc(L('Neuer Jour Fixe', 'New jour fixe')) + '</button>' : '') + '</div>' +
    '<div class="jfo-filters"><select class="select" data-on-change="jf-year"' + ariaL(L('Jahr', 'Year')) + '>' + v.years.map(y => opt(y, y, v.year)).join('') + '</select>' +
    '<label class="jfo-search">' + icon('search', 'sm') + '<input class="input" type="search" data-on-input="jf-q" value="' + esc(S.jfQuery || '') + '" placeholder="' + esc(L('Jour Fixe durchsuchen …', 'Search jour fixe …')) + '"' + ariaL(L('Jour Fixe durchsuchen', 'Search jour fixe')) + '></label>' +
    '<select class="select" data-on-change="jf-filter"' + ariaL(L('Einträge filtern', 'Filter entries')) + '>' + JF_FILTERS().map(f => opt(f[0], f[1], S.jfFilter || 'all')).join('') + '</select></div>' +
    '<div id="jf-list">' + jfListHtml(t, v) + '</div></section>';
}
/** The list with its header and the pages (drawn again alone when a filter changes, so the search field keeps its focus). */
function jfListHtml(t, v) {
  if (!v.all.length) return '<div class="empty-mini">' + esc(L('Noch kein Jour Fixe in diesem Team. Lege eine Serie an, z. B. jeden Montag 9:00.', 'No jour fixe in this team yet. Create a series, e.g. every Monday 9:00.')) + '</div>';
  if (!v.rows.length) return '<div class="empty-mini">' + esc(L('Keine Einträge für diese Auswahl.', 'No entries for this selection.')) + '</div>';
  return '<div class="jfo-tbl" role="table" aria-label="Jour Fixe"><div class="jfo-th" role="row"><div role="columnheader"><button type="button" class="jfo-sort" data-action="jf-sort"' +
    ariaL(L('Nach Kalenderwoche sortieren', 'Sort by calendar week')) + '>KW ' + icon('sort', 'sm') + '</button></div><div role="columnheader">' + esc(L('Datum', 'Date')) + '</div><div role="columnheader">' + esc(L('Themen', 'Topics')) +
    '</div><div role="columnheader">' + icon('layers', 'sm') + esc(L('Aufgaben', 'Tasks')) + '</div><div role="columnheader">' + esc(L('Letzte Änderung', 'Last change')) + '</div><div role="columnheader"></div></div>' +
    v.shown.map(r => jfRow(r, t)).join('') + '</div>' + jfPager(v);
}
/** One meeting: week, day, name, tasks (made / done), last change; the name is the one button that opens it (stretched over the row). */
function jfRow(r, t) {
  const s = r.s, m = r.m;
  const label = jfDay(r.date);
  const made = m && m.people ? m.people.tasks || 0 : 0;
  const cta = m ? L('Protokoll öffnen', 'Open minutes') : r.up ? L('Protokoll vorbereiten', 'Prepare minutes') : L('Protokoll nachtragen', 'Write minutes');
  return '<div class="jfo-row' + (r.next ? ' next' : '') + '" role="row"><div role="cell"><span class="jfo-kw st-' + r.st.key + '" title="' + esc(r.st.label) + '"><b>KW ' + Shared.isoWeek(r.date) + '</b><small>/ ' + jfWeekYear(r.date) + '</small></span></div>' +
    '<div role="cell">' + esc(label) + '</div>' +
    '<div role="cell"><button type="button" class="jf-hit" data-action="jf-open" data-id="' + esc(s.id) + '" data-v="' + esc(r.date) + '"' + (m ? ' data-doc="' + esc(m.id) + '"' : '') +
    labelled(cta + ': ' + s.title + ', ' + label + ', ' + r.st.label) + '><span>' + esc(s.title) + ' –</span><span>' + esc(t.name) + '</span></button></div>' +
    '<div role="cell"><span class="jfo-n"' + labelled(L('Aufgaben angelegt', 'Tasks made')) + '>' + icon('layers', 'sm') + made + '</span><span class="jfo-n ok"' + labelled(L('davon erledigt', 'of them done')) + '>' + icon('checkc', 'sm') + (m && m.tasksDone ? m.tasksDone : 0) + '</span></div>' +
    '<div role="cell">' + esc(m ? jfStamp(m.updatedAt) : '–') + '</div><div role="cell" class="jfo-g">' + icon('right', 'sm') + '</div></div>';
}
/** "‹ 1 2 3 4 5 ›" and "1 – 9 von 48". */
function jfPager(v) {
  const n = v.rows.length;
  const from = Math.max(0, Math.min(v.page - 2, v.pages - 5));
  const nums = [];
  for (let i = from; i < Math.min(v.pages, from + 5); i++) nums.push(i);
  const btn = (to, inner, label, off, on) => '<button type="button" class="jfo-pg' + (on ? ' on' : '') + '" data-action="jf-page" data-v="' + to + '"' + (off ? ' disabled' : '') + (on ? ' aria-current="page"' : '') + ariaL(label) + '>' + inner + '</button>';
  return '<div class="jfo-pager" role="navigation" aria-label="' + esc(L('Seiten', 'Pages')) + '">' + btn(v.page - 1, icon('left', 'sm'), L('Vorherige Seite', 'Previous page'), v.page === 0) +
    nums.map(i => btn(i, i + 1, L('Seite ', 'Page ') + (i + 1), false, i === v.page)).join('') + btn(v.page + 1, icon('right', 'sm'), L('Nächste Seite', 'Next page'), v.page >= v.pages - 1) +
    '<span class="grow"></span><span aria-live="polite">' + (v.page * JF_PAGE + 1) + ' – ' + Math.min(n, (v.page + 1) * JF_PAGE) + L(' von ', ' of ') + n + '</span></div>';
}
/** The list is drawn again without the page around it (the search field keeps the focus). */
function jfListDraw() {
  const t = S.route.view === 'team' ? team(S.route.id) : null;
  const box = $('#jf-list');
  if (t && box) box.innerHTML = jfListHtml(t, jfView(t));
}
const jfSet = (key, value) => { S[key] = value; S.jfPage = 0; jfListDraw(); };
A['jf-page'] = el => { S.jfPage = Math.max(0, Number(el.dataset.v) || 0); jfListDraw(); };
A['jf-sort'] = () => { S.jfSort = S.jfSort === 'asc' ? 'desc' : 'asc'; jfListDraw(); };
ON.change['jf-year'] = el => jfSet('jfYear', el.value);
ON.change['jf-filter'] = el => jfSet('jfFilter', el.value);
ON.input['jf-q'] = el => jfSet('jfQuery', el.value);
A['jf-open'] = el => jfOpen(el.dataset.id, el.dataset.v);
/**
 * Opens a meeting at once from what the page has: a new meeting is built here (series, carry-over of the last
 * minutes); saved minutes show right away and their text comes from the page's cache or one call meanwhile.
 * Only a meeting older than the last minutes asks the server for its draft.
 */
function jfOpen(seriesId, date) {
  if (JF_SAVING[seriesId + ':' + date]) { toast(L('Wird gerade gespeichert – gleich noch einmal öffnen.', 'Being saved right now – open it again in a moment.')); return Promise.resolve(); }
  const s = jfData().series.find(x => x.id === seriesId);
  const saved = jfData().minutes.find(m => m.seriesId === seriesId && m.date === date);
  if (saved) return Promise.resolve(jfOpenSaved(saved));
  if (s && s.carry && (!s.carryFrom || s.carryFrom < date)) return Promise.resolve(jfOpenDraft(s, date));
  return jfOpenRemote(seriesId, date);
}
function jfShow(m) {
  const tid = String(m.projectId).slice(5);
  S.teamTab = 'jf';
  S.jfView = 'topics';
  S.tcOpen = {};
  if (S.route.view !== 'team' || S.route.id !== tid) go('team', tid);
  S.doc = m;
  if (m.draft && m.canWrite) return protoStartEdit(m);
  render({ peek: false });
}
function jfOpenDraft(s, date) {
  return jfShow({ id: '', draft: true, kind: 'jf', projectId: s.projectId, seriesId: s.id, date: date, version: 0, title: s.title + ' · ' + date,
    canWrite: jfCanWrite(s.projectId), content: Shared.jfTemplate(s, date, s.carry, S.me.email) });
}
function jfOpenSaved(meta) {
  const hit = DOC_TEXT[meta.id];
  const d = Object.assign({}, meta, { kind: 'jf', canWrite: jfCanWrite(meta.projectId), content: hit && hit.version === meta.version ? hit.content : undefined });
  jfShow(d);
  // the skeleton stands until the text is there (usually loaded ahead already)
  if (d.content === undefined) {
    docFetch(meta.id).then(full => { if (S.doc && S.doc.id === meta.id && S.doc.content === undefined) { S.doc = full; render({ peek: false }); } }).catch(fail);
  }
}
function jfOpenRemote(seriesId, date) {
  if (S.jfOpening) return Promise.resolve();
  S.jfOpening = true;
  return call('jf.meeting', { seriesId: seriesId, date: date, lang: LANG }).then(m => { S.jfOpening = false; jfShow(m); })
    .catch(err => { S.jfOpening = false; fail(err); });
}
/* tasks this person deleted: links to them count as none (the server drops them on the next read too) */
const JF_DEAD = {};
const jfLive = id => (id && !JF_DEAD[id] ? id : '');
/** Tasks left the page: deleted here (links drop at once) or elsewhere (cached texts are read again). */
function jfTasksGone(ids, deleted) {
  if (deleted) ids.forEach(id => { JF_DEAD[id] = true; });
  Object.keys(DOC_TEXT).forEach(k => { delete DOC_TEXT[k]; });
  const d = S.doc;
  if (d && d.id && typeof d.content === 'string' && !S.protoEdit && ids.some(id => d.content.indexOf(id) >= 0)) {
    docFetch(d.id).then(full => { if (S.doc && S.doc.id === full.id && !S.protoEdit) { S.doc = full; render({ peek: false }); } }).catch(() => {});
  }
}
/** A linked action is done when its task is (the server says the same; here at once when the task changes). */
function lineDone(i) {
  const t = jfLive(i.taskId) ? task(i.taskId) : null;
  return t ? isDone(t) : !!i.done;
}
/* texts of saved minutes the page has seen (by id and version): opening them again needs no call */
const DOC_TEXT = {};
const DOC_LOADING = {};
function docRemember(d) { if (d && d.id && typeof d.content === 'string') DOC_TEXT[d.id] = { version: d.version, content: d.content }; }
function docFetch(id) {
  if (!DOC_LOADING[id]) {
    DOC_LOADING[id] = call('docs.get', { id: id }, { quiet: true }).then(d => { delete DOC_LOADING[id]; docRemember(d); return d; })
      .catch(err => { delete DOC_LOADING[id]; throw err; });
  }
  return DOC_LOADING[id];
}
/** Loads ahead the minutes a person is likely to open next (shown on top, or the newest of each series). */
function jfPrefetch(ids) {
  ids.filter(id => !DOC_TEXT[id] && !DOC_LOADING[id]).slice(0, 4).forEach(id => docFetch(id).catch(() => {}));
}
// pointing at a row with saved minutes loads them before the click
document.addEventListener('mouseover', e => {
  const h = e.target && e.target.closest ? e.target.closest('.jf-hit[data-doc]') : null;
  if (h) jfPrefetch([h.dataset.doc]);
});

A['jf-new'] = el => jfModal(null, el.dataset.team);
A['jf-edit'] = el => { const s = jfData().series.find(x => x.id === el.dataset.id); if (s) jfModal(s, String(s.projectId).slice(5)); };
function jfModal(s, teamId) {
  const t = team(teamId);
  s = s || { title: 'Jour Fixe', rhythm: 'weekly', weekday: 1, time: '09:00', duration: 30, startDate: TODAY(), attendees: t ? teamMembers(t) : [S.me.email] };
  openModal({
    title: s.id ? L('Jour Fixe bearbeiten', 'Edit jour fixe') : L('Neuer Jour Fixe', 'New jour fixe'),
    body: field('Titel', '<input class="input" name="title" required maxlength="80" value="' + esc(s.title) + '">') +
      '<div class="row">' + field('Rhythmus', selectField('rhythm', RHYTHMS(), s.rhythm)) + field('Wochentag', selectField('weekday', WEEKDAYS(), String(s.weekday))) + '</div>' +
      '<div class="row">' + field('Uhrzeit', '<input class="input" type="time" name="time" value="' + esc(s.time) + '">') +
      field('Dauer (Min.)', '<input class="input" type="number" min="15" max="480" step="5" name="duration" value="' + esc(s.duration) + '">') + '</div>' +
      '<div class="row">' + field('Ab', '<input class="input" type="date" name="startDate" value="' + esc(s.startDate || '') + '">') +
      field('Bis (optional)', '<input class="input" type="date" name="endDate" value="' + esc(s.endDate || '') + '">') + '</div>' +
      divField('Teilnehmende', peoplePicker('attendees', s.attendees || [], { add: 'Personen hinzufügen', prefer: t ? teamMembers(t) : [] })) +
      field('Google-Meet-Link (optional)', '<input class="input" name="meetLink" placeholder="https://meet.google.com/…" value="' + esc(s.meetLink || '') + '">'),
    submitLabel: s.id ? 'Speichern' : L('Jour Fixe anlegen', 'Create jour fixe'),
    danger: s.id ? { label: L('Serie beenden', 'End series'), onClick: () => confirmDelete(L('Serie beenden? Alle Protokolle bleiben erhalten.', 'End the series? All minutes are kept.'),
      () => call('jf.removeSeries', { id: s.id }).then(() => { calReload(); return jfReload(); })) } : null,
    onSubmit: v => call('jf.saveSeries', Object.assign({ id: s.id, teamId: teamId }, v, { weekday: Number(v.weekday), attendees: collectPeople(v, 'attendees') }))
      .then(() => { closeModal(); calReload(); toast(L('Jour Fixe gespeichert', 'Jour fixe saved')); return jfReload(); }),
  });
}

/* ---------------- minutes: the topics (cards) ---------------- */
/** The text of a topic's description: links and images shown, line breaks kept. */
const bodyHtml = s => '<div class="tc-text">' + richText(s) + '</div>';
const isImageFile = f => /^image\//.test(f.mime || '');
const fileSize = n => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
/** Who is responsible: the avatars (names on hover and for screen readers). */
function tcOwners(t) {
  const list = t.owners || [];
  return list.length ? '<span class="tc-own"' + labelled(L('Verantwortlich: ', 'Responsible: ') + list.map(whoName).join(', ')) + '>' + avatars(list, 4) + '</span>' : '';
}
function tcProjectChip(t) {
  const p = t.projectId && project(t.projectId);

/** The cards that match the search of the sheet (numbers stay those of the whole list). */

/* the text of a topic is written into its field after drawing (a long text stays out of the attribute); the field grows with it */

A['tc-rm'] = el => {

  const t = S.protoEdit.model.topics[k];
  protoSet('topics.' + k + '.' + (el.dataset.k === 'link' ? 'links' : 'files'), (el.dataset.k === 'link' ? t.links : t.files).filter((x, n) => n !== i));

/**
 * Screenshots and files of a topic: a placeholder shows at once in their own box (a screenshot with the picture itself, taken
 * from the chosen file), the upload runs quietly behind it, one file after the other; the picture stays, nothing is fetched again.
 */
ON.change['tc-file'] = el => {
  const k = Number(el.dataset.t), attach = el.dataset.attach === '1';
  const list = Array.prototype.slice.call(el.files || []).slice(0, 5);
  el.value = '';
  const e = S.protoEdit;
  const first = e && e.model.topics[k];
  if (!first || !list.length) return;
  const id = first.id;
  const waits = list.map(f => ({ doc: attach, name: f.name, url: !attach && /^image\//.test(f.type) ? URL.createObjectURL(f) : '' }));
  const setWait = fn => { S.tcPend = Object.assign({}, S.tcPend, { [id]: fn((S.tcPend || {})[id] || []) }); if (S.protoEdit === e) { protoRender(); } };
  setWait(l => l.concat(waits));
  const done = n => setWait(l => l.filter(x => x !== waits[n]));
  loadChunk('Images').then(() => list.reduce((p, f, n) => p.then(() => fileUpload(f, { kind: 'project', projectId: e.projectId }, attach).then(r => {
    const t = r && S.protoEdit === e ? e.model.topics.find(x => x.id === id) : null;
    if (r && waits[n].url) IMG_CACHE[r.id] = Promise.resolve(waits[n].url);
    if (t && !t.files.some(x => x.id === r.id)) t.files = t.files.concat([{ id: r.id, name: r.name, mime: r.mime, size: r.size }]);
  }).catch(fail).then(() => done(n))), Promise.resolve())).catch(err => { list.forEach((f, n) => done(n)); fail(err); });
};
/** The date field behind the "Fälligkeit" button opens its calendar. */
A['tc-due'] = el => {
  const i = $('input', el.parentNode);
  try { i.showPicker(); } catch (e) { i.focus(); }
};
/**
 * Opens an attachment: fetched with the app's sign-in (in the background). A PDF or text opens in a new tab
 * (the tab is opened by the click itself, so it is not blocked, and filled when the file has arrived); other types are saved.
 */
A['tc-get'] = el => {
  const viewable = /^(application\/pdf|text\/plain|text\/csv)$/.test(el.dataset.mime || '');
  let win = null;
  if (viewable) { try { win = window.open('', '_blank'); } catch (e) { win = null; } }
  return call('files.get', { id: el.dataset.id }, { quiet: true }).then(f => {
    const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(f.data), c => c.charCodeAt(0))], { type: f.mime }));
    if (win && !win.closed) win.location.href = url;
    else {
      const a = document.createElement('a');
      a.href = url;
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }).catch(err => { if (win) win.close(); fail(err); });
};

    (x.t.due ? esc(fmtDate(x.t.due, { absolute: true })) : '') + '</td><td>' + (tcTaskChip(x.t) || (canTask ? tcTaskBtn(x.t, x.k, false) : '')) + END_ROW;

    (act.length || lines.length ? '<div class="md-tw"><table class="pt"><thead><tr><th>' + L('Nr.', 'No.') + '</th><th>' + L('Thema', 'Topic') + '</th><th>' + L('Verantwortlich', 'Responsible') + '</th><th>' + L('Projekt', 'Project') + '</th><th>' + L('Fällig', 'Due') + '</th><th></th></tr></thead><tbody>' +
      act.map(row).join('') + lines.map(x => '<tr class="pt-line' + (lineDone(x.i) ? ' done' : '') + '"><td>' + (x.k + 1) + '.</td><td>' + richText(x.i.text) + '</td><td>' + esc(whoName(x.i.owner)) + '</td><td></td><td class="nowrap">' +
        (x.i.due ? esc(fmtDate(x.i.due, { absolute: true })) : '') + '</td><td>' + (jfLive(x.i.taskId) ? '<button class="md-task" data-action="open-task" data-id="' + esc(x.i.taskId) + '">' + icon('check', 'sm') + L('Aufgabe', 'Task') + '</button>'
        : canTask && !lineDone(x.i) ? '<button class="md-mk" data-action="proto-task" data-t="' + x.k + ATTR_I + x.n + '">' + icon('plus', 'sm') + L('Als Aufgabe', 'As task') + '</button>' : '') + END_ROW).join('') +
      '</tbody></table></div>' : '<p class="faint">' + esc(L('Noch keine Aufgaben oder Zuständigkeiten.', 'No tasks or responsibilities yet.')) + '</p>') + SEC_END;

  return jfSheet(d, m, { edit: true, people: people, foot: foot, body: (S.jfView || 'topics') === 'results' ? protoResults(m, false) : '<div class="tc-list">' + jfCards(m, true, false) + '</div>' });

/** Sets model[path] ("topics.0.items.2.text") and keeps a draft in the browser. */

/**
 * "Übernehmen": the minutes show at once ("Speichert …") while the save runs in the background. The draft stays
 * in the browser until the server has it; a conflict or an error brings the form back with everything typed.
 */
function protoSave() {
  const e = S.protoEdit;
  const content = Shared.protoToText(e.model);
  const payload = e.id ? { id: e.id, title: e.title, content: content, baseVersion: e.base, baseContent: e.saved }
    : { projectId: e.projectId, seriesId: e.seriesId, date: e.date, title: e.title, content: content, baseContent: e.saved };
  const token = {};
  const key = e.seriesId + ':' + e.date;
  // still on these minutes? (the person may have closed them or opened others meanwhile)
  const here = () => !!S.doc && S.doc.saveToken === token;
  // a conflict or an error: the form comes back with everything typed (the draft is still in the browser)
  const back = () => {
    if (!here()) { toast(L('Das Protokoll wurde nicht gespeichert. Öffne es erneut: dein Entwurf ist noch da.', 'The minutes were not saved. Open them again: your draft is still there.'), { warn: true }); return false; }
    S.protoEdit = e;
    if (e.id) docLock(e.id);
    render({ peek: false });
    return true;
  };
  clearInterval(docLockTimer);
  S.protoEdit = null;
  JF_SAVING[key] = true;
  S.doc = Object.assign({}, S.doc, { id: e.id, projectId: e.projectId, seriesId: e.seriesId, date: e.date, title: e.title, content: content, canWrite: true, draft: false, saving: true, savedAt: 0, saveToken: token });
  render({ peek: false });
  return call('docs.save', payload).then(r => {
    delete JF_SAVING[key];
    if (r.conflict) return back() ? protoConflict(r) : null;
    store.set(protoKey(e), null);
    const saved = Object.assign({}, r, { content: r.content || content, canWrite: true, saving: false, savedAt: Date.now(), mergedWith: r.merged ? r.mergedWith : '' });
    delete saved.jf;
    docRemember(saved);
    if (r.jf) S.jf = r.jf;
    if (here()) S.doc = saved;
    render({ peek: false });
    docFlush(r.id);
  }).catch(err => { delete JF_SAVING[key]; back(); fail(err); });
}
/* meetings whose minutes are being saved right now: not opened a second time meanwhile */
const JF_SAVING = {};
/** Writes the saved minutes into Drive (file and earlier version); nobody waits for it. */
function docFlush(id) {
  call('docs.flush', { id: id }, { quiet: true }).then(f => {
    if (f && f.error) driveTrouble(f.error);
    else if (f && !f.pending && S.driveIssue) { S.driveIssue = null; render({ peek: false }); }
  }).catch(() => {});
}
/**
 * Drive did not take the file (the minutes are saved in the database and stay readable): a quiet mark in the
 * header of the minutes with the reason behind "Details"; a short note at most once per session.
 */
function driveTrouble(reason) {
  S.driveIssue = String(reason || '');
  if (!S.driveToasted) { S.driveToasted = true; toast(L('Gespeichert. Die Ablage in Google Drive klappt noch nicht.', 'Saved. Storing in Google Drive does not work yet.'), { warn: true }); }
  if (S.doc) render({ peek: false });
}
A['drive-issue'] = () => msgDetails(L('Das Protokoll ist gespeichert und für alle lesbar. Nur die Kopie als Datei in Google Drive fehlt noch; sie wird beim nächsten Speichern und nachts nachgeholt.\n\n' +
  'Was tun: im Apps-Script-Editor einmal „setup“ ausführen und die Drive-Berechtigung zulassen. Steht unten „Drive API has not been used“, muss im Google-Cloud-Projekt des Skripts die Google Drive API aktiviert werden.\n\nMeldung von Google:\n',
  'The minutes are saved and readable for everybody. Only the copy as a file in Google Drive is missing; it is made with the next save and at night.\n\n' +
  'What to do: run "setup" once in the Apps Script editor and allow Drive. If the text below says "Drive API has not been used", enable the Google Drive API in the Cloud project of the script.\n\nGoogle said:\n') + (S.driveIssue || ''),
  L('Ablage in Google Drive', 'Storage in Google Drive'));
/** Someone saved in between: keep mine (on top of theirs) or take theirs. Nothing is lost silently. */
function protoConflict(r) {
  const cur = r.current;
  openModal({
    title: L('Inzwischen geändert', 'Changed in the meantime'),
    body: '<p style="margin:0 0 8px">' + esc(L(user(cur.updatedBy).name + ' hat gespeichert, während du bearbeitet hast.', user(cur.updatedBy).name + ' saved while you were editing.')) + '</p>' +
      hintP(L('Deine Fassung bleibt als Entwurf im Browser erhalten. Ihre Fassung siehst du unten.', 'Your version stays as a draft in this browser. Theirs is shown below.')) +
      '<div class="de-preview conflict">' + docPreview(cur.content) + '</div>',
    submitLabel: L('Meine Fassung speichern', 'Save my version'),
    danger: { label: L('Ihre Fassung übernehmen', 'Take their version'), onClick: () => {
      closeModal();
      const e = S.protoEdit;
      store.set(protoKey(e), null);
      docEndEdit();
      S.protoEdit = null;
      S.doc = cur;
      render({ peek: false });
    } },
    onSubmit: () => {
      closeModal();
      // on top of their version: theirs plus my changes, mine only where both changed the same field
      const e = S.protoEdit;
      e.id = cur.id;
      e.base = cur.version;
      e.saved = cur.content;
      if (r.merged) e.model = Shared.protoFromText(r.merged);
      return protoSave();
    },
  });
}

/**
 * The teams with their projects: a small arrow opens a team, the choice is one project (or none).

function projectTree(name, selected, homeTeamId, o) {
  const pool = S.projects.filter(p => !o.onlyMine || canEditProject(p));
  const teams = S.teams.filter(t => pool.some(p => p.teamId === t.id)).sort((a, b) => (a.id === homeTeamId ? -1 : b.id === homeTeamId ? 1 : a.name.localeCompare(b.name)));
  const none = o.none ? '<label class="ptr-opt ptr-none"><input type="radio" name="' + name + '" value=""' + (selected ? '' : ' checked') + '> ' + esc(o.none) + '</label>' : '';
  const body = teams.map(t => {
    const list = pool.filter(p => p.teamId === t.id);
    return '<details class="ptr-team"' + (t.id === homeTeamId || list.some(p => p.id === selected) ? ' open' : '') + '><summary>' + mark(t) + '<b>' + esc(t.name) + '</b><span class="n">' + list.length + '</span>' + icon('chevron', 'sm') + '</summary>' +
      list.map(p => '<label class="ptr-opt"><input type="radio" name="' + name + '" value="' + esc(p.id) + '"' + (p.id === selected ? ' checked' : '') + '> ' + mark(p) + esc(p.name) + '</label>').join('') + '</details>';
  }).join('');
  return '<div class="ptree" role="radiogroup" aria-label="' + esc(L('Projekt', 'Project')) + '">' + none + (body || hintP(L('Keine Projekte vorhanden.', 'No projects yet.'))) + '</div>';
}

/** Where the task goes (team, project or person) with the matching fields; title and due date below. */
function jfMaskTop(src, topic, line, head, people) {
  const tm = placeTeam(src.projectId);
  const start = topic.projectId && S.projects.some(p => p.id === topic.projectId && canEditProject(p)) ? 'project' : 'person';
  const opt = (key, ic, label, sub) => '<label class="jm-opt"><input type="radio" name="target" value="' + key + '" data-on-change="jm-target"' + (key === start ? ' checked' : '') + '><span>' + icon(ic, 'sm') + esc(label) + '</span><small>' + esc(sub) + '</small></label>';
  const who = line ? field(L('Verantwortlich', 'Responsible'), jfPersonField('owner', people, head.owner))
    : divField(L('Verantwortlich', 'Responsible'), peoplePicker('assignees', (topic.owners || []).length ? topic.owners : [S.me.email], { add: L('Personen hinzufügen', 'Add people'), prefer: people }));
  return divField(L('Aufgabe geht an', 'The task goes to'), '<div class="jm-seg" role="radiogroup">' +
      opt('team', 'users', L('Team', 'Team'), tm ? tm.name : L('alle Mitglieder', 'all members')) + opt('project', 'folder', L('Projekt', 'Project'), L('mit Personen', 'with people')) + opt('person', 'user', L('Person', 'Person'), L('direkt', 'directly')) + '</div>') +
    '<div class="jm-sec" data-for="project">' + divField(L('Projekt', 'Project'), projectTree('projectId', topic.projectId || '', tm ? tm.id : '', { onlyMine: true })) + '</div>' +
    '<div class="jm-sec" data-for="team">' + hintP(tm ? L('Alle ' + teamMembers(tm).length + ' Mitglieder von „' + tm.name + '“ bekommen die Aufgabe und werden Zuständige des Themas.', 'All ' + teamMembers(tm).length + ' members of "' + tm.name + '" get the task and become responsible for the topic.') : '') + '</div>' +
    '<div class="jm-sec" data-for="project person">' + who + '</div>' +
    '<div class="row">' + field(L('Aufgabe', 'Task'), '<input class="input" name="title" required maxlength="300" value="' + esc(head.text) + '">') + field(L('Fällig', 'Due'), '<input class="input" type="date" name="due" value="' + esc(head.due) + '">') + '</div>';
}
/** Shows the fields of the chosen target only. */

/**
 * The form for tasks from the minutes: where the task goes (team, project, person), title, due date;
 * for a topic also its lines with checkboxes: the ticked ones become sub-tasks of the topic's task.
 * Whoever gets the task is added to the people responsible for the topic.
 */
function jfTaskMask(draft, k, n) {
  const src = jfTaskSource(draft);
  const topic = src.model && src.model.topics[k];
  if (!topic) return;
  const line = n === undefined ? null : topic.items[n];
  const people = jfPeople(src);
  const requestId = newId();
  const head = line || { text: topic.title, owner: (topic.owners || [])[0] || '', due: topic.due || '' };
  const lines = line ? '' : '<div class="field"><span class="jm-h">' + esc(L('Unteraufgaben', 'Sub-tasks')) +
    '<label class="jm-all"><input type="checkbox" data-on-change="jm-all" checked> ' + esc(L('Alle auswählen', 'Select all')) + '</label></span>' +
    (topic.items.length ? topic.items.map(i => jfMaskLine(i, people)).join('') : '<p class="hint">' + esc(L('Das Thema hat keine Zeilen.', 'The topic has no lines.')) + '</p>') + '</div>';
  openModal({
    title: line ? L('Punkt als Aufgabe', 'Item as task') : L('In Aufgabe übernehmen', 'Make a task'),
    wide: !line,
    body: jfMaskTop(src, topic, line, head, people) + lines +
      hintP(draft ? L('Die Aufgaben entstehen sofort, das Protokoll merkt sich die Verknüpfung beim „Übernehmen“.', 'The tasks are made right away; the minutes keep the link when you apply them.')
        : L('Nichts wird angelegt, bevor du bestätigst.', 'Nothing is made before you confirm.')),
    submitLabel: line ? L('Aufgabe anlegen', 'Create task') : L('Aufgabe anlegen', 'Create task'),
    mount: m => jmShow(m),
    onSubmit: v => jfMakeTasks({ draft: draft, src: src, topic: topic, line: line, requestId: requestId }, v),
  });
}
ON.change['jm-all'] = el => { $$('input[name="pick"]:not([disabled])', el.closest('form')).forEach(c => { c.checked = el.checked; }); };
/** Who gets the task: all people of the team, the chosen people, or (a line) its person; nobody chosen means the person themself. */
function jfAssignees(o, v, tm) {
  if (v.target === 'team') return tm ? teamMembers(tm).slice(0, 20) : [S.me.email];
  const one = o.line ? (v.owner ? [v.owner] : []) : collectPeople(v, 'assignees');
  return one.length ? one : [S.me.email];
}
/** o: { draft, src, topic, line, requestId } from the form; v: its values. */
function jfMakeTasks(o, v) {
  const src = o.src, topic = o.topic, line = o.line;
  const tm = placeTeam(src.projectId);
  if (v.target === 'project' && !v.projectId) { toast(L('Bitte ein Projekt wählen.', 'Please choose a project.'), { warn: true }); return false; }
  const projectId = v.target === 'project' ? v.projectId : '';
  const who = e => (e ? [e] : [S.me.email]);
  const parentWho = jfAssignees(o, v, tm);
  const from = L('Aus dem Jour Fixe „', 'From the jour fixe "') + src.title + (L('“', '"'));
  const picked = line ? [] : [].concat(v.pick || []);
  const payload = { projectId: projectId, teamId: String(src.projectId).slice(5), requestId: o.requestId, docId: src.docId, draft: !!o.draft, topicId: topic.id, item: !!line,
    task: { title: noImg(v.title), assignees: parentWho, dueDate: v.due, description: from },
    items: line ? [{ itemId: line.id, title: v.title, assignees: parentWho, dueDate: v.due, description: from }]
      : picked.map(id => ({ itemId: id, title: noImg(v['t_' + id]), assignees: v.target === 'team' && !v['o_' + id] ? parentWho : who(v['o_' + id]), dueDate: v['d_' + id], description: from })) };
  return call('jf.makeTasks', payload).then(r => {
    applyTasks(r.tasks);
    toast(r.tasks.length > 1 ? L(r.tasks.length + ' Aufgaben angelegt', r.tasks.length + ' tasks created') : L('Aufgabe angelegt: ', 'Task created: ') + r.tasks[0].title,
      { action: { label: L('Öffnen', 'Open'), fn: () => openPeek(r.tasks[0].id) } });
    if (r.doc) { docRemember(r.doc); docFlush(r.doc.id); }
    if (o.draft) jfLinkDraft({ topicId: topic.id, line: line, tasks: r.tasks, picked: picked, doc: r.doc, projectId: projectId });
    else if (r.doc) { S.doc = Object.assign({}, S.doc, r.doc); render({ peek: false }); }
  });
}
/** Before "Übernehmen": the form keeps the task links (saved with the minutes, so nothing is made twice). */
function jfLinkDraft(o) {
  const topicId = o.topicId, line = o.line, tasks = o.tasks, picked = o.picked, doc = o.doc, projectId = o.projectId;
  const e = S.protoEdit;
  if (!e) return;
  // the server linked the saved minutes too: when that was the only change since I opened them, it is my new base
  if (doc && e.id === doc.id && Number(doc.version) === Number(e.base) + 1) { e.base = doc.version; e.saved = doc.content; }
  const t = e.model.topics.find(x => x.id === topicId);
  if (!t) return;
  if (line) { const i = t.items.find(x => x.id === line.id); if (i) i.taskId = tasks[0].id; }
  else {
    t.taskId = tasks[0].id;
    // whoever gets the task is responsible for the topic too; the project stays noted on it
    t.owners = (t.owners || []).concat(tasks[0].assignees || []).filter((x, i, a) => x && a.indexOf(x) === i);
    if (projectId) t.projectId = projectId;
    picked.forEach((id, k) => { const i = t.items.find(x => x.id === id); if (i && tasks[k + 1]) i.taskId = tasks[k + 1].id; });
  }
  store.set(protoKey(e), { base: e.base, baseText: e.saved, model: e.model });
  protoRender();
}
A['proto-task'] = el => jfTaskMask(false, Number(el.dataset.t), Number(el.dataset.i));

  if (l.error) return '<div class="notice">' + esc(l.error) + '</div>';

  return hintP(L('Alles liegt im Google Drive des App-Kontos: Datenbank, Backups und der Ordner LidlFlow mit den Jour-Fixe-Protokollen.',

    '<div class="row-btns">' + link(l.database, L('Datenbank öffnen', 'Open database'), 'table') + link(l.backups, L('Backups öffnen', 'Open backups'), 'layers') +
    link(l.drive, L('Drive-Ordner öffnen', 'Open Drive folder'), 'folder') + (l.drive ? '' : '<span class="faint">' + esc(L('Der Drive-Ordner entsteht mit dem ersten Protokoll.', 'The Drive folder appears with the first minutes.')) + '</span>') + '</div>';
}
