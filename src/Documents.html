<script>
/* ==========================================================================
   Jour fixe of a project: meetings in rows, minutes as a form (header, numbered
   topics, lines I/A/B/N). Series and the list of minutes come with the app start
   (S.jf); the minutes text is stored in Drive (server: Docs.js, Drive.js).
   ========================================================================== */

const RHYTHMS = () => [{ key: 'weekly', label: L('Wöchentlich', 'Weekly') }, { key: 'biweekly', label: L('Alle 2 Wochen', 'Every 2 weeks') }, { key: 'monthly', label: L('Monatlich', 'Monthly') }];
const WEEKDAYS = () => [1, 2, 3, 4, 5, 6, 0].map(d => ({ key: String(d), label: DOW_LONG[d] }));
const PROTO_LABELS = () => ({ I: L('Info', 'Info'), A: L('Aufgabe', 'Action'), B: L('Beschluss', 'Decision'), N: L('Nachtrag', 'Note') });
const END_BTN = '</button></div>';
const hintP = t => '<p class="hint">' + esc(t) + '</p>';
const labelled = t => ' title="' + esc(t) + '" aria-label="' + esc(t) + '"';
const ariaL = t => ' aria-label="' + esc(t) + '"';
const whoName = e => (e ? user(e).name : '');
const draftKey = id => 'draft:doc:' + (id || 'new');

/** Series and minutes of the projects the person sees (from the app start; refreshed after changes). */
function jfData() { return S.jf || { series: [], minutes: [] }; }
function jfReload() {
  return call('jf.list', {}, { quiet: true }).then(d => { S.jf = d; render({ peek: false }); }).catch(() => {});
}
/** Leaving the project closes the open minutes (and releases "wird gerade bearbeitet"); the browser draft stays. */
function jfLeave(view, id) {
  const pid = S.protoEdit ? S.protoEdit.projectId : S.doc && S.doc.projectId;
  if (!pid || (view === 'project' && id === pid)) return;
  if (S.protoEdit) docEndEdit();
  S.protoEdit = null;
  S.doc = null;
}
/** "Weekly · Team / Projekt": what a jour fixe entry is called in calendars and the overview. */
function jfName(seriesTitle, projectId) {
  const p = project(projectId);
  const t = p && team(p.teamId);
  return seriesTitle + (p ? ' · ' + (t ? t.name + ' / ' : '') + p.name : '');
}
/** Calendar and overview label of an event (jour fixe with team and project). */
function evLabel(e) { return e.type === 'jf' ? jfName(e.title, e.projectId) : e.title; }

/* ---------------- the tab: active series on top, the archive below ---------------- */
/** Next meeting of every active series of the project (today counts); a series past its end is left out. */
function jfUpcoming(pid) {
  const today = TODAY();
  return jfData().series.filter(s => s.projectId === pid)
    .map(s => ({ s: s, date: Shared.jfDates(s, today, Shared.addDays(today, 400))[0] })).filter(x => x.date)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}
/** All minutes of the project except those of the meetings on top, newest first. */
function jfArchiveRows(pid) {
  const next = jfUpcoming(pid);
  return jfData().minutes.filter(m => m.projectId === pid && !next.some(u => u.s.id === m.seriesId && u.date === m.date))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
/** The last meeting of every series within the past month that has no minutes yet (written a day later, say). */
function jfMissing(pid) {
  const today = TODAY();
  const minutes = jfData().minutes;
  return jfData().series.filter(s => s.projectId === pid).map(s => ({ s: s, date: Shared.jfDates(s, Shared.addDays(today, -31), Shared.addDays(today, -1)).pop() }))
    .filter(x => x.date && !minutes.some(m => m.seriesId === x.s.id && m.date === x.date));
}
function jfTab(p) {
  if (S.protoEdit && S.protoEdit.projectId === p.id) return protoEditor();
  if (S.doc && S.doc.projectId === p.id) return protoViewer();
  const minutes = jfData().minutes;
  const active = jfUpcoming(p.id).map(u => jfRow(u.s, u.date, minutes.find(m => m.seriesId === u.s.id && m.date === u.date), true))
    .concat(jfMissing(p.id).map(u => jfRow(u.s, u.date, null, false)));
  const newest = jfData().series.filter(s => s.projectId === p.id).map(s => minutes.filter(m => m.seriesId === s.id)[0]).filter(Boolean);
  setTimeout(() => jfPrefetch(newest.map(m => m.id)), 400);
  return '<div class="docs-head"><div><h3>' + icon('repeat', 'sm') + 'Jour Fixe</h3>' +
    hintP(L('Regelmäßige Termine mit Protokoll. Offene Aufgaben wandern ins nächste Protokoll.', 'Regular meetings with minutes. Open actions move on to the next minutes.')) + '</div>' +
    '<button class="btn primary" data-action="jf-new" data-id="' + esc(p.id) + '">' + icon('plus', 'sm') + 'Neuer Jour Fixe</button></div>' +
    (active.length ? '<div class="jf-rows jf-active" role="list">' + active.join('') + '</div>'
      : '<div class="empty-mini">' + esc(L('Kein laufender Jour Fixe. Lege eine Serie an, z. B. jeden Montag 9:00.', 'No running jour fixe. Create a series, e.g. every Monday 9:00.')) + '</div>') +
    jfArchive(p);
}
const ARCHIVE_PAGE = 50;
/** The archive: collapsed until opened (remembered in the browser); 50 rows, the rest on request. */
function jfArchive(p) {
  const rows = jfArchiveRows(p.id);
  if (!rows.length) return '';
  const open = store.get('jfArchive', false);
  const names = {};
  jfData().series.forEach(s => { names[s.id] = s; });
  const shown = S.jfArchiveAll ? rows : rows.slice(0, ARCHIVE_PAGE);
  return '<div class="jf-archive"><button type="button" class="jf-arch-h" data-action="jf-archive" aria-controls="jf-archive-list" aria-expanded="' + open + '">' + icon(open ? 'chevron' : 'right', 'sm') +
    '<b>' + L('Archiv', 'Archive') + '</b><span class="n">' + rows.length + '</span><span class="faint">' + esc(L('alle Protokolle, neueste zuerst', 'all minutes, newest first')) + '</span></button>' +
    (open ? '<div class="jf-rows" id="jf-archive-list" role="list">' + shown.map(m => jfRow(names[m.seriesId] || { id: m.seriesId, title: String(m.title || '').split(' · ')[0], attendees: [] }, m.date, m, false)).join('') + '</div>' +
      (shown.length < rows.length ? '<button type="button" class="btn sm outline" data-action="jf-archive-all">' + esc(L('Alle ' + rows.length + ' anzeigen', 'Show all ' + rows.length)) + '</button>' : '') : '') + '</div>';
}
A['jf-archive'] = () => { store.set('jfArchive', !store.get('jfArchive', false)); render({ peek: false }); };
A['jf-archive-all'] = () => { S.jfArchiveAll = true; render({ peek: false }); };
/**
 * One meeting: series, date ("Nächster: …" for the next one, the plain date in the archive) and people:
 * before the meeting everybody invited, afterwards only who missed it (they should read the minutes).
 */
/** The Meet link of a series, next to the row (opens Meet, not the minutes). */
function jfMeet(s) {
  return s.meetLink && /^https:\/\/meet\.google\.com\//.test(s.meetLink) ? '<a class="btn sm jf-meet" href="' + esc(s.meetLink) + '" target="_blank" rel="noopener noreferrer"' +
    labelled(L('Google Meet öffnen', 'Open Google Meet')) + '>' + icon('video', 'sm') + 'Meet</a>' : '';
}
/** What the row's button says: prepare the next meeting, write minutes later, or open them. */
function jfCta(upcoming, minutes) {
  if (minutes) return L('Protokoll öffnen', 'Open minutes');
  return upcoming ? L('Protokoll vorbereiten', 'Prepare minutes') : L('Protokoll nachtragen', 'Write minutes');
}
/** The middle of a row: weekday and time, then topics, open actions, anchored topics and who writes the minutes. */
function jfTime(s, date) {
  if (!/^\d\d:\d\d$/.test(s.time || '')) return '';
  const end = Number(s.time.slice(0, 2)) * 60 + Number(s.time.slice(3)) + (Number(s.duration) || 30);
  return '<span class="jf-f">' + icon('clock', 'sm') + esc(DOW[Shared.weekday(date)] + ' ' + s.time + '–' + fmtClock(end % 1440)) + '</span>';
}
/** Open actions and anchored topics: of the minutes, or (next meeting) carried over from the last ones. */
function jfCounts(minutes, carry) {
  if (minutes) return { open: minutes.openCount || 0, pins: minutes.pinnedCount || 0 };
  return carry ? { open: carry.open.length, pins: carry.pinned.length } : { open: 0, pins: 0 };
}
function jfFacts(s, date, minutes, upcoming) {
  const out = [jfTime(s, date)];
  const ppl = minutes && minutes.people ? minutes.people : {};
  const carry = !minutes && upcoming && s.carry ? s.carry : null;
  if (ppl.topics) out.push('<span class="jf-f">' + icon('list', 'sm') + esc(ppl.topics + L(ppl.topics === 1 ? ' Thema' : ' Themen', ppl.topics === 1 ? ' topic' : ' topics')) + '</span>');
  const n = jfCounts(minutes, carry);
  if (n.open) out.push('<span class="chip warn">' + esc(n.open + (carry ? L(' offen aus dem letzten JF', ' open from the last one') : L(' offen', ' open'))) + '</span>');
  const pins = n.pins;
  if (pins) out.push('<span class="jf-f"' + labelled(L('Verankerte Themen', 'Anchored topics')) + '>' + icon('pin', 'sm') + pins + '</span>');
  if (ppl.by) out.push('<span class="jf-f jf-by">' + avatar(ppl.by) + esc(L('Protokoll: ', 'Minutes: ') + whoName(ppl.by)) + '</span>');
  return out.join('');
}
/**
 * One meeting. The whole row opens it (one tab stop, its name says what happens); the button look shows how:
 * prepare the next one, write missing minutes, or open saved ones. People: before the meeting everybody invited,
 * afterwards only who missed it (they should read the minutes).
 */
function jfRow(s, date, minutes, upcoming) {
  const planned = upcoming || !minutes;
  const people = planned ? s.attendees || [] : (minutes.people && minutes.people.absent) || [];
  const label = upcoming ? L('Nächster: ', 'Next: ') + fmtDate(date, { absolute: true }) : fmtDate(date, { absolute: true });
  const cta = jfCta(upcoming, minutes);
  return '<div class="jf-row' + (upcoming ? ' next' : '') + '" role="listitem"><div class="jf-hit" role="button" tabindex="0" data-action="jf-open" data-id="' + esc(s.id) + '" data-v="' + esc(date) + '"' +
    (minutes ? ' data-doc="' + esc(minutes.id) + '"' : '') + ' data-on-keydown="jf-row-key"' + labelled(cta + ': ' + s.title + ', ' + label) + '>' +
    '<span class="jf-main"><b class="jf-t">' + esc(s.title) + '</b><span class="jf-d' + (upcoming ? ' next' : '') + '">' + esc(label) + '</span></span>' +
    '<span class="jf-mid">' + jfFacts(s, date, minutes, upcoming) + '</span>' +
    (people.length ? '<span class="jf-ppl">' + (planned ? '' : '<span class="faint jf-miss">' + esc(L('Gefehlt:', 'Missed:')) + '</span>') + avatars(people, 5) + '</span>' : '') +
    '<span class="btn sm jf-cta' + (minutes ? '' : ' primary') + '" aria-hidden="true">' + esc(cta) + icon('right', 'sm') + '</span></div>' +
    jfMeet(s) +
    (upcoming ? '<button class="icon-btn" data-action="jf-edit" data-id="' + esc(s.id) + '"' + labelled(L('Jour Fixe bearbeiten', 'Edit jour fixe')) + '>' + icon('settings', 'sm') + '</button>' : '') +
    '</div>';
}
ON.keydown['jf-row-key'] = (el, e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); A['jf-open'](el); } };
A['jf-open'] = el => jfOpen(el.dataset.id, el.dataset.v);
/**
 * Opens a meeting at once from what the page has: a new meeting is built here (series, carry-over of the last
 * minutes); saved minutes show right away and their text comes from the page's cache or one call meanwhile.
 * Only a meeting older than the last minutes asks the server for its draft.
 */
function jfOpen(seriesId, date) {
  const s = jfData().series.find(x => x.id === seriesId);
  const saved = jfData().minutes.find(m => m.seriesId === seriesId && m.date === date);
  if (saved) return Promise.resolve(jfOpenSaved(saved));
  if (s && s.carry && (!s.carryFrom || s.carryFrom < date)) return Promise.resolve(jfOpenDraft(s, date));
  return jfOpenRemote(seriesId, date);
}
function jfShow(m) {
  S.projTab = 'jf';
  if (S.route.view !== 'project' || S.route.id !== m.projectId) go('project', m.projectId);
  S.doc = m;
  if (m.draft && m.canWrite) return protoStartEdit(m);
  render({ peek: false });
}
function jfOpenDraft(s, date) {
  const p = project(s.projectId);
  return jfShow({ id: '', draft: true, kind: 'jf', projectId: s.projectId, seriesId: s.id, date: date, version: 0, title: s.title + ' · ' + date,
    canWrite: !!p && canEditProject(p), content: Shared.jfTemplate(s, date, s.carry, S.me.email) });
}
function jfOpenSaved(meta) {
  const p = project(meta.projectId);
  const hit = DOC_TEXT[meta.id];
  const d = Object.assign({}, meta, { kind: 'jf', canWrite: !!p && canEditProject(p), content: hit && hit.version === meta.version ? hit.content : undefined });
  jfShow(d);
  // the skeleton stands until the text is there (usually loaded ahead already)
  if (d.content === undefined) {
    docFetch(meta.id).then(full => { if (S.doc && S.doc.id === meta.id && S.doc.content === undefined) { S.doc = full; render({ peek: false }); } }).catch(fail);
  }
}
function jfOpenRemote(seriesId, date) {
  if (S.jfOpening) return Promise.resolve();
  S.jfOpening = true;
  return call('jf.meeting', { seriesId: seriesId, date: date, lang: LANG }).then(m => { S.jfOpening = false; jfShow(m); })
    .catch(err => { S.jfOpening = false; fail(err); });
}
/* texts of saved minutes the page has seen (by id and version): opening them again needs no call */
const DOC_TEXT = {};
const DOC_LOADING = {};
function docRemember(d) { if (d && d.id && typeof d.content === 'string') DOC_TEXT[d.id] = { version: d.version, content: d.content }; }
function docFetch(id) {
  if (!DOC_LOADING[id]) {
    DOC_LOADING[id] = call('docs.get', { id: id }, { quiet: true }).then(d => { delete DOC_LOADING[id]; docRemember(d); return d; })
      .catch(err => { delete DOC_LOADING[id]; throw err; });
  }
  return DOC_LOADING[id];
}
/** Loads ahead the minutes a person is likely to open next (shown on top, or the newest of each series). */
function jfPrefetch(ids) {
  ids.filter(id => !DOC_TEXT[id] && !DOC_LOADING[id]).slice(0, 4).forEach(id => docFetch(id).catch(() => {}));
}
// pointing at a row with saved minutes loads them before the click
document.addEventListener('mouseover', e => {
  const h = e.target && e.target.closest ? e.target.closest('.jf-hit[data-doc]') : null;
  if (h) jfPrefetch([h.dataset.doc]);
});
/** Team page: the jour fixe of all its projects, next meeting first; a new one for any of the projects. */
function jfTeamTab(t, projects) {
  const minutes = jfData().minutes;
  const rows = [];
  projects.forEach(p => jfUpcoming(p.id).forEach(u => rows.push({ date: u.date, html: jfRow(u.s, u.date, minutes.find(m => m.seriesId === u.s.id && m.date === u.date), true) })));
  rows.sort((a, c) => a.date.localeCompare(c.date));
  return '<div class="docs-head"><div><h3>' + icon('repeat', 'sm') + 'Jour Fixe</h3>' +
    hintP(L('Alle Jour Fixe der Projekte dieses Teams. Teilnehmende: ganze Projektgruppen oder einzelne Personen.', 'Every jour fixe of the projects of this team. Participants: whole project groups or single people.')) + '</div>' +
    (projects.length ? '<button class="btn primary" data-action="jf-new" data-id="' + esc(projects[0].id) + '" data-team="' + esc(t.id) + '">' + icon('plus', 'sm') + 'Neuer Jour Fixe</button>' : '') + '</div>' +
    (rows.length ? '<div class="jf-rows jf-active" role="list">' + rows.map(r => r.html).join('') + '</div>'
      : '<div class="empty-mini">' + esc(L('Noch kein Jour Fixe in den Projekten dieses Teams.', 'No jour fixe in the projects of this team yet.')) + '</div>');
}
A['jf-new'] = el => jfModal(null, el.dataset.id, el.dataset.team);
A['jf-edit'] = el => { const s = jfData().series.find(x => x.id === el.dataset.id); if (s) jfModal(s, s.projectId); };
/** "+ Projektgruppe": all people of a project join the participants (nobody twice). */
A['jf-add-group'] = el => {
  const box = $('.pp-field[data-pp="attendees"]', el.closest('form') || document);
  const p = project(el.dataset.id);
  if (box && p) ppSet(box, ppValue(box).concat(projectMembers(p)).filter((x, i, a) => a.indexOf(x) === i));
};
function jfGroups(teamId, projectId) {
  const tid = teamId || (project(projectId) || {}).teamId;
  const groups = S.projects.filter(p => p.teamId === tid);
  return groups.length ? '<div class="jf-groups"><span class="faint">' + esc(L('Projektgruppe hinzufügen:', 'Add project group:')) + '</span>' +
    groups.map(p => '<button type="button" class="nt-add" data-action="jf-add-group" data-id="' + esc(p.id) + '">' + icon('plus', 'sm') + esc(p.name) + '</button>').join('') + '</div>' : '';
}
function jfModal(s, projectId, teamId) {
  const p = project(projectId);
  const choose = !s && teamId ? S.projects.filter(x => x.teamId === teamId) : [];
  s = s || { title: 'Jour Fixe', rhythm: 'weekly', weekday: 1, time: '09:00', duration: 30, startDate: TODAY(), attendees: p ? projectMembers(p) : [S.me.email] };
  openModal({
    title: s.id ? L('Jour Fixe bearbeiten', 'Edit jour fixe') : L('Neuer Jour Fixe', 'New jour fixe'),
    body: field('Titel', '<input class="input" name="title" required maxlength="80" value="' + esc(s.title) + '">') +
      (choose.length ? field(L('Projekt', 'Project'), selectField('projectId', choose.map(x => ({ key: x.id, label: x.name })), projectId)) : '') +
      '<div class="row">' + field('Rhythmus', selectField('rhythm', RHYTHMS(), s.rhythm)) + field('Wochentag', selectField('weekday', WEEKDAYS(), String(s.weekday))) + '</div>' +
      '<div class="row">' + field('Uhrzeit', '<input class="input" type="time" name="time" value="' + esc(s.time) + '">') +
      field('Dauer (Min.)', '<input class="input" type="number" min="15" max="480" step="5" name="duration" value="' + esc(s.duration) + '">') + '</div>' +
      '<div class="row">' + field('Ab', '<input class="input" type="date" name="startDate" value="' + esc(s.startDate || '') + '">') +
      field('Bis (optional)', '<input class="input" type="date" name="endDate" value="' + esc(s.endDate || '') + '">') + '</div>' +
      divField('Teilnehmende', peoplePicker('attendees', s.attendees || [], { add: 'Personen hinzufügen', prefer: p ? projectMembers(p) : [] }) + jfGroups(teamId, projectId)) +
      field('Google-Meet-Link (optional)', '<input class="input" name="meetLink" placeholder="https://meet.google.com/…" value="' + esc(s.meetLink || '') + '">'),
    submitLabel: s.id ? 'Speichern' : L('Jour Fixe anlegen', 'Create jour fixe'),
    danger: s.id ? { label: L('Serie beenden', 'End series'), onClick: () => confirmDelete(L('Serie beenden? Alle Protokolle bleiben erhalten.', 'End the series? All minutes are kept.'),
      () => call('jf.removeSeries', { id: s.id }).then(() => { calReload(); return jfReload(); })) } : null,
    onSubmit: v => call('jf.saveSeries', Object.assign({ id: s.id, projectId: v.projectId || projectId }, v, { weekday: Number(v.weekday), attendees: collectPeople(v, 'attendees') }))
      .then(() => { closeModal(); calReload(); toast(L('Jour Fixe gespeichert', 'Jour fixe saved')); return jfReload(); }),
  });
}

/* ---------------- minutes: view ---------------- */
/** The minutes table: numbered topics with their lines (Art, Thema, Verantwortlich, Termin). */
function protoTable(m, o) {
  const rows = [];
  m.topics.forEach((t, k) => {
    const ttask = t.taskId ? ' <button class="md-task" data-action="open-task" data-id="' + esc(t.taskId) + '">' + icon('check', 'sm') + L('Aufgabe', 'Task') + '</button>'
      : o.actions ? ' <button class="md-mk" data-action="proto-topic-task" data-t="' + k + '">' + icon('plus', 'sm') + L('Thema als Aufgabe', 'Topic as task') + '</button>' : '';
    rows.push('<tr class="pt-topic"><td>' + (k + 1) + '.</td><td>' + (t.pinned ? '<span class="pt-pin"' + labelled(L('Verankert: kommt ins nächste Protokoll', 'Anchored: carried to the next minutes')) + '>' + icon('pin', 'sm') + '</span>' : '') +
      '</td><td><b>' + linkify(t.title) + '</b>' + ttask + '</td><td>' + esc(whoName(t.owner)) + '</td><td></td></tr>');
    t.items.forEach((i, n) => {
      const task = i.taskId ? ' <button class="md-task" data-action="open-task" data-id="' + esc(i.taskId) + '">' + icon('check', 'sm') + L('Aufgabe', 'Task') + '</button>'
        : o.actions && i.type === 'A' && !i.done ? ' <button class="md-mk" data-action="proto-task" data-t="' + k + '" data-i="' + n + '">' + icon('plus', 'sm') + L('Als Aufgabe', 'As task') + '</button>' : '';
      rows.push('<tr class="pt-line' + (i.done ? ' done' : '') + '"><td></td><td><span class="pt-type t-' + i.type + '" title="' + esc(PROTO_LABELS()[i.type]) + '">' + i.type + '</span></td>' +
        '<td>' + linkify(i.text) + task + '</td><td>' + esc(whoName(i.owner)) + '</td><td class="nowrap">' + (i.due ? esc(fmtDate(i.due, { absolute: true })) : '') + '</td></tr>');
    });
  });
  return '<div class="md-tw"><table class="pt"><thead><tr><th>' + L('Nr.', 'No.') + '</th><th>' + L('Art', 'Type') + '</th><th>' + L('Thema', 'Topic') + '</th><th>' +
    L('Verantwortlich', 'Responsible') + '</th><th>' + L('Termin', 'Due') + '</th></tr></thead><tbody>' +
    (rows.join('') || '<tr><td colspan="5" class="faint">' + L('Noch keine Themen.', 'No topics yet.') + '</td></tr>') + '</tbody></table></div>';
}
/** Minutes as a table; any other text (older files) as plain text. */
function docPreview(text) {
  const m = Shared.protoFromText(text);
  return m ? protoTable(m, {}) : '<pre class="pt-plain">' + esc(text) + '</pre>';
}
function protoHead(m, version) {
  const people = list => (list.length ? list.map(e => '<span class="pt-p">' + avatar(e) + esc(whoName(e)) + '</span>').join('') : '<span class="faint">–</span>');
  return '<dl class="pt-head"><dt>' + L('Datum', 'Date') + '</dt><dd>' + esc(fmtDate(m.date, { absolute: true })) + (version ? ' · Rev. ' + version : '') + '</dd>' +
    '<dt>' + L('Protokoll', 'Minutes by') + '</dt><dd>' + people(m.minuteTaker ? [m.minuteTaker] : []) + '</dd>' +
    '<dt>' + L('Anwesend', 'Present') + '</dt><dd>' + people(m.present) + '</dd>' +
    '<dt>' + L('Abwesend', 'Absent') + '</dt><dd>' + people(m.absent) + '</dd></dl>';
}
function protoViewer() {
  const d = S.doc;
  const loading = d.content === undefined;
  const m = (!loading && Shared.protoFromText(d.content)) || Shared.protoClean({ title: String(d.title || '').split(' · ')[0], date: d.date });
  return '<div class="doc-view card-w"><div class="dv-head"><button class="icon-btn" data-action="doc-close"' + labelled(L('Zurück', 'Back')) + '>' + icon('back') + '</button>' +

      hintP(draft ? L('Die Aufgaben entstehen sofort, das Protokoll merkt sich die Verknüpfung beim „Übernehmen“.', 'The tasks are made right away; the minutes keep the link when you apply them.')
        : L('Nichts wird angelegt, bevor du bestätigst.', 'Nothing is made before you confirm.')),
    submitLabel: line ? L('Aufgabe anlegen', 'Create task') : L('Aufgabe mit Unteraufgaben anlegen', 'Create task with sub-tasks'),
    onSubmit: v => jfMakeTasks({ draft: draft, src: src, topic: topic, line: line, requestId: requestId }, v),
  });
}
ON.change['jm-all'] = el => { $$('input[name="pick"]:not([disabled])', el.closest('form')).forEach(c => { c.checked = el.checked; }); };
/** o: { draft, src, topic, line, requestId } from the form; v: its values. */
function jfMakeTasks(o, v) {
  const src = o.src, topic = o.topic, line = o.line;
  const who = e => (e ? [e] : [S.me.email]);
  const from = L('Aus dem Jour Fixe „', 'From the jour fixe "') + src.title + (L('“', '"'));
  const picked = line ? [] : [].concat(v.pick || []);
  const payload = { projectId: v.projectId, requestId: o.requestId, docId: src.docId, topicId: topic.id, item: !!line,
    task: { title: v.title, assignees: who(v.owner), dueDate: v.due, description: from },
    items: line ? [{ itemId: line.id, title: v.title, assignees: who(v.owner), dueDate: v.due, description: from }]
      : picked.map(id => ({ itemId: id, title: v['t_' + id], assignees: who(v['o_' + id]), dueDate: v['d_' + id], description: from })) };
  return call('jf.makeTasks', payload).then(r => {
    applyTasks(r.tasks);
    toast(r.tasks.length > 1 ? L(r.tasks.length + ' Aufgaben angelegt', r.tasks.length + ' tasks created') : L('Aufgabe angelegt: ', 'Task created: ') + r.tasks[0].title,
      { action: { label: L('Öffnen', 'Open'), fn: () => openPeek(r.tasks[0].id) } });
    if (o.draft) jfLinkDraft(topic.id, line, r.tasks, picked);
    else if (r.doc) { S.doc = Object.assign({}, S.doc, r.doc); docRemember(S.doc); render({ peek: false }); }
  });
}
/** Before "Übernehmen": the form keeps the task links (saved with the minutes, so nothing is made twice). */
function jfLinkDraft(topicId, line, tasks, picked) {
  const e = S.protoEdit;
  if (!e) return;
  const t = e.model.topics.find(x => x.id === topicId);
  if (!t) return;
  if (line) { const i = t.items.find(x => x.id === line.id); if (i) i.taskId = tasks[0].id; }
  else {
    t.taskId = tasks[0].id;
    picked.forEach((id, k) => { const i = t.items.find(x => x.id === id); if (i && tasks[k + 1]) i.taskId = tasks[k + 1].id; });
  }
  store.set(protoKey(e), { base: e.base, baseText: e.saved, model: e.model });
  protoRender();
}
A['proto-task'] = el => jfTaskMask(false, Number(el.dataset.t), Number(el.dataset.i));
A['proto-topic-task'] = el => jfTaskMask(false, Number(el.dataset.t));
A['pe-task'] = el => jfTaskMask(true, Number(el.dataset.t), el.dataset.i === undefined ? undefined : Number(el.dataset.i));

/* ---------------- admin: storage links ---------------- */
function storageBox() {
  if (S.storage === undefined) {
    S.storage = null;
    call('storage.links').then(l => { S.storage = l; render(); }).catch(err => { S.storage = { error: friendlyError(err.message) }; render(); });
  }
  const l = S.storage;
  if (!l) return skLines(1);
  if (l.error) return '<div class="notice">' + esc(l.error) + '</div>';
  const link = (href, label, ic) => (href ? '<a class="btn sm" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + icon(ic, 'sm') + esc(label) + '</a>' : '');
  return hintP(L('Alles liegt im Google Drive des App-Kontos: Datenbank, Backups und der Ordner LidlFlow mit den Jour-Fixe-Protokollen.',
    'Everything lives in the Google Drive of the app account: the database, the backups and the LidlFlow folder with the jour fixe minutes.')) +
    '<div class="row-btns">' + link(l.database, L('Datenbank öffnen', 'Open database'), 'table') + link(l.backups, L('Backups öffnen', 'Open backups'), 'layers') +
    link(l.drive, L('Drive-Ordner öffnen', 'Open Drive folder'), 'folder') + (l.drive ? '' : '<span class="faint">' + esc(L('Der Drive-Ordner entsteht mit dem ersten Protokoll.', 'The Drive folder appears with the first minutes.')) + '</span>') + '</div>';
}
