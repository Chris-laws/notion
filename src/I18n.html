function trText(s) {
  const k = s.trim();
  if (!k) return s;
  const pre = s.slice(0, s.indexOf(k)), post = s.slice(s.indexOf(k) + k.length);
  if (EN[k] !== undefined) return pre + EN[k] + post;
  for (const p of PATTERNS) if (p[0].test(k)) return pre + k.replace(p[0], p[1]) + post;
  let out = s;
  FRAGMENTS.forEach(f => { if (out.indexOf(f[0]) >= 0) out = out.split(f[0]).join(f[1]); });
  return out;
}
