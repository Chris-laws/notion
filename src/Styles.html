<style>
/* Tokens: see DESIGN.md. Light canvas, white rounded cards; Lidl blue is the accent, yellow a small highlight, red means act now. */
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --canvas: #e9eef6;
  --bg: #ffffff;
  --bg-subtle: #f6f8fc;
  --bg-hover: #eef2f9;
  --bg-active: #e3ebf8;
  --bg-elevated: #ffffff;
  --border: #d5dce8;
  --border-strong: #b9c4d6;
  --text: #16223b;
  --text-2: #3f4a63;
  --text-3: #606b81;
  --accent: #012e90;
  --accent-hover: #00236e;
  --accent-soft: #e8eefb;
  --accent-text: #012e90;
  --yellow: #fcc702;
  --yellow-soft: #fff8c4;
  --yellow-ink: #6b5600;
  --danger: #dc1a1e;
  --danger-soft: #feebec;
  --warning: #b07a00;
  --warning-soft: #fff6cf;
  --success: #12935b;
  --success-soft: #e2f5ec;
  /* text on light surfaces: the brand tones a shade darker for 4.5:1, everything else keeps the brand tone */
  --danger-text: #d3191d; --warning-text: #946600; --success-text: #0f7b4c;
  --shadow-card: 0 1px 2px rgba(18, 40, 90, .05), 0 6px 18px -6px rgba(18, 40, 90, .08);
  --shadow-pop: 0 0 0 1px rgba(18, 40, 90, .06), 0 14px 36px -8px rgba(18, 40, 90, .25), 0 3px 8px rgba(18, 40, 90, .08);
  --shadow-drag: 0 14px 30px -8px rgba(18, 40, 90, .3);
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px;
  --side-w: 240px;
  --peek-w: 520px;
  --vacation: #1747c2; --sick: #dc1a1e; --training: #6b3fb5; --other: #8d98b0; --holiday: #fcc702;
  --c-teal: #0e9aa7; --c-gray: #7d8aa3; --c-brown: #8a6a4b; --c-orange: #ee7a1c; --c-yellow: #e8b500; --c-green: #12935b;
  --c-blue: #1747c2; --c-purple: #7a4fd0; --c-pink: #d6409f; --c-red: #e8262a; --c-default: #7d8aa3;
  --c-indigo: #4338ca; --c-lime: #84b51c; --c-cyan: #0b84a5;
  /* soft light in the page background: Lidl blue from the left, a hint of yellow top right */
  --glow-blue: rgba(0, 80, 170, .07);
  --glow-yellow: transparent;
  color-scheme: light;
}
/* Dark: same tokens, Lidl blue for buttons and a faint blue/yellow glow. Picked by data-theme, or by the OS when set to "system". */
:root[data-theme="dark"] {
  --canvas: #0a111d; --bg: #111a2b; --bg-subtle: #162135; --bg-hover: #1b2942; --bg-active: #1f3358; --bg-elevated: #162135;
  --border: #1e2c46; --border-strong: #2d3f63;
  --text: #e9eefa; --text-2: #a2afc9; --text-3: #8593b0;
  --accent: #2f5fe0; --accent-hover: #4a76ec; --accent-soft: #14275a; --accent-text: #a9c0ff;
  --yellow-soft: #3a3510; --yellow-ink: #ffe98a;
  --danger: #ff5a5d; --danger-soft: #3b1b22; --warning: #ffd84d; --warning-soft: #3a3510;
  --success: #3fd698; --success-soft: #11332a;
  --danger-text: var(--danger); --warning-text: var(--warning); --success-text: var(--success);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .02);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .08), 0 14px 36px -8px rgba(0, 0, 0, .6);
  --training: #a98aef; --other: #5c6f92; --vacation: #2f7fe0;
  --glow-blue: rgba(0, 80, 170, .22);
  --glow-yellow: transparent;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0a111d; --bg: #111a2b; --bg-subtle: #162135; --bg-hover: #1b2942; --bg-active: #1f3358; --bg-elevated: #162135;
    --border: #1e2c46; --border-strong: #2d3f63;
    --text: #e9eefa; --text-2: #a2afc9; --text-3: #8593b0;
    --accent: #2f5fe0; --accent-hover: #4a76ec; --accent-soft: #14275a; --accent-text: #a9c0ff;
    --yellow-soft: #3a3510; --yellow-ink: #ffe98a;
    --danger: #ff5a5d; --danger-soft: #3b1b22; --warning: #ffd84d; --warning-soft: #3a3510;
    --success: #3fd698; --success-soft: #11332a;
  --danger-text: var(--danger); --warning-text: var(--warning); --success-text: var(--success);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .02);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .08), 0 14px 36px -8px rgba(0, 0, 0, .6);
    --training: #a98aef; --other: #5c6f92; --vacation: #2f7fe0;
    --glow-blue: rgba(0, 80, 170, .22);
    --glow-yellow: transparent;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
/* slim, rounded scrollbars that only show up when you need them */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-3) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-3) 35%, transparent); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--text-3) 65%, transparent); }
::-webkit-scrollbar-corner, ::-webkit-scrollbar-button { display: none; background: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--font); font-optical-sizing: auto; color: var(--text);
  background:
    radial-gradient(900px 520px at 12% -8%, var(--glow-blue), transparent 70%),
    radial-gradient(700px 420px at 100% -12%, var(--glow-yellow), transparent 70%),
    var(--canvas);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03';
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.sidebar { width: var(--side-w); flex: none; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 8px; height: 72px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--border); }
/* brand: own logo mark + word mark */
.brand { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; padding: 6px 4px; border-radius: 12px; }
.brand:hover { background: var(--bg-hover); }
/* logo: full image on light, round mark + light lettering on dark, only the mark in the icon rail */
.brand .logo { width: 40px; height: 40px; flex: none; object-fit: contain; }
.brand-full { display: flex; align-items: center; min-width: 0; }
.brand-mark { display: none; }
.sidebar.rail .brand-full { display: none; }
.sidebar.rail .brand-mark { display: flex; }
.logo-full { height: 40px; width: auto; max-width: 100%; display: block; }
.logo-dark { display: none; align-items: center; gap: 9px; }
.logo-dark .wm { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; color: #c9d8ff; line-height: 1; }
.logo-dark .wm b { color: #fcc702; font-weight: 900; }
:root[data-theme="dark"] .on-light { display: none; }
:root[data-theme="dark"] .logo-dark.on-dark { display: flex; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .on-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark.on-dark { display: flex; }
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; visibility: hidden; }
.sync-dot.busy { visibility: visible; background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.side-scroll { flex: 1; overflow: auto; padding: 4px 12px 16px; }
.side-search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; margin-bottom: 14px;
  background: var(--canvas); border-radius: 10px; color: var(--text-3); font-size: 13px;
}
.side-search:hover { background: var(--bg-hover); color: var(--text-2); }
.side-search span:not(.kbd) { white-space: nowrap; overflow hidden; text-overflow: ellipsis; text-align: left; }
.kbd { margin-left: auto; font-size: 11px; color: var(--text-3); background: var(--bg); border-radius: 5px; padding: 1px 5px; box-shadow: 0 0 0 1px var(--border); }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 12px; border-radius: 10px;
  color: var(--text-2); font-size: 14px; font-weight: 500; transition: background .12s, color .12s;
}
.nav-item svg { color: var(--text-3); }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--yellow); }
.nav-item.active svg { color: var(--accent); }
.nav-item .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--canvas); border-radius: 999px; padding: 0 7px; line-height: 20px; }
.nav-item.active .count { background: var(--bg); color: var(--accent-text); }
.nav-item .alert { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.nav-item.faint { color: var(--text-3); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding-left: 14px; }
/* projects of a team hang on a thin line in the team colour */
.team-projects { margin-left: 21px; padding-left: 4px; border-left: 2px solid color-mix(in srgb, var(--tc) 70%, transparent); }
.team-projects .nav-sub { padding-left: 4px; }
.sidebar.rail .team-projects { margin-left: 0; border-left: 0; }
.sidebar.rail .brand { flex: none; justify-content: center; padding: 4px; }
/* project icon in the project colour; a small dot in the team colour sits in the corner */
.mark.proj { background: var(--mc); position: relative; }
.mark.in-team::after { content: ''; position: absolute; right: -3px; bottom: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 2px var(--bg); }
.mark.md.in-team::after { width: 10px; height: 10px; }
.mark.lg.in-team::after { width: 14px; height: 14px; right: -4px; bottom: -4px; }
.mark.ink-dark, .jpill.ink-dark { color: #1d2433; }
.nav-sub .nav-item { height: 32px; font-size: 13px; }
.side-section { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 4px; padding: 0 12px; height: 22px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.team-row { display: flex; align-items: center; }
.team-row .chev-btn { width: 18px; height: 36px; display: grid; place-items: center; color: var(--text-3); margin-left: -6px; }
.chev { transition: transform .15s; }
.collapsed .chev { transform: rotate(-90deg); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--text-2); flex: none; }
.icon-btn.sm { width: 24px; height: 24px; border-radius: 6px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 6px; }
.side-foot .me-row { flex: 1; min-width: 0; }
.prefs { display: flex; align-items: center; gap: 6px; flex: none; margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--border); }
.theme-btn { flex: none; width: 30px; height: 30px; }
.lang-sw { display: flex; flex: none; background: var(--bg-hover); border-radius: 8px; padding: 2px; }
.lang-sw button { font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 6px; color: var(--text-3); }
.lang-sw button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.sidebar.rail .side-foot { flex-direction: column; }
.me-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 10px; }
.me-row:hover { background: var(--bg-hover); }
.me-meta { line-height: 1.3; min-width: 0; font-size: 13px; }
.me-meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { position: relative; z-index: 5; height: 60px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: var(--canvas); }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; font-size: 14px; }
.crumbs button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--text-2); white-space: nowrap; }
.crumbs button:hover { background: var(--bg-hover); color: var(--text); }
.crumbs .current { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--text-3); padding: 0 2px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }

/* ---------- marks, avatars, chips ---------- */
.mark { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; line-height: 1; }
.mark.md { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; }
.mark.lg { width: 44px; height: 44px; border-radius: 13px; font-size: 20px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 600; flex: none; box-shadow: 0 0 0 2px var(--bg); }
.avatar.md { width: 28px; height: 28px; font-size: 11px; }
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -6px; }
.person { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 13px; }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--bg-hover); color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; }
.chip.soft { background: var(--bg-hover); }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.chip.danger { background: var(--danger-soft); color: var(--danger-text); }
.chip.warn { background: var(--yellow-soft); color: var(--yellow-ink); }
.chip.ok { background: var(--success-soft); color: var(--success-text); }
.cc { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 5px; border-radius: 5px; background: var(--bg-hover); color: var(--text-2); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); white-space: nowrap; }
.glyph { width: 16px; height: 16px; flex: none; }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
.prio-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.prio-bars i { width: 3px; border-radius: 2px; background: currentColor; opacity: .22; }
.prio-bars i:nth-child(1) { height: 5px; } .prio-bars i:nth-child(2) { height: 8px; } .prio-bars i:nth-child(3) { height: 12px; }
.prio-bars i.on { opacity: 1; }
.prio-urgent { color: var(--danger-text); } .prio-high { color: var(--c-orange); } .prio-medium { color: var(--accent); } .prio-low { color: var(--text-3); }
.meta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta svg { color: var(--text-3); }
.meta.overdue, .meta.overdue svg { color: var(--danger-text); font-weight: 600; }
.meta.today, .meta.today svg { color: var(--accent-text); font-weight: 600; }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600; color: var(--text-2); white-space: nowrap; border: 1px solid transparent; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.outline { background: var(--bg); border-color: var(--border-strong); color: var(--text); }
.btn.outline:hover { background: var(--bg-subtle); border-color: var(--text-3); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 86%, #fff), var(--accent)); color: #fff; box-shadow: 0 1px 2px rgba(0, 50, 120, .3), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger-text); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.on { background: var(--accent-soft); color: var(--accent-text); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea {
  width: 100%; height: 38px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 10px; padding: 0 12px; outline: none; font-size: 14px;
}
.textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 76px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--bg-hover); gap: 2px; }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(18, 40, 90, .12); }

/* ---------- page ---------- */
.page { max-width: 1360px; margin: 0 auto; padding: 4px 24px 56px; }
#view.enter .page { animation: pagein .22s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(5px); } }
.page.wide { max-width: none; }
.ph { margin-bottom: 4px; }
.page-head { display: flex; align-items: center; gap: 14px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; margin: 0; line-height: 1.2; }
.page-sub { color: var(--text-2); margin: 6px 0 0; max-width: 76ch; font-size: 14px; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--text-2); font-size: 13px; margin-top: 12px; }
.page-meta .sep { width: 1px; height: 14px; background: var(--border-strong); }
.page-actions { margin-left: auto; display: flex; gap: 8px; }
.h2 { font-size: 14px; font-weight: 700; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.h2 .faint { font-weight: 500; }
.card-w { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 18px 20px; min-width: 0; }
.card-w h3 { font-size: 14px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.card-w h3 .more { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent-text); }
.card-w h3 .more:hover { text-decoration: underline; }
.card-w h3 .n { font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--canvas); border-radius: 999px; padding: 0 7px; line-height: 20px; }

/* ---------- view bar ---------- */
.db-bar { display: flex; align-items: center; gap: 4px; margin: 18px 0 14px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; margin-right: auto; overflow-x: auto; padding: 3px; background: var(--bg-hover); border-radius: 12px; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 9px; color: var(--text-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.tab svg { color: var(--text-3); }
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(18, 40, 90, .12); }
.tab.active svg { color: var(--accent); }
.tab .n { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.db-search { height: 30px; width: 0; padding: 0; border: 0; outline: none; background: transparent; font-size: 13px; transition: width .2s; }

  border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 8px; }

/* new-task form */

/* AI colour: a lighter, friendly blue wherever the AI is involved (report, assistant, hints) */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ai: #6fa2ff; --ai-soft: #13274d; --ai-border: #24407a; --ai-text: #b3ceff; } }
/* quick report: one slim card in the AI colour */
.rep { margin-bottom: 10px; padding: 10px 14px; background: linear-gradient(100deg, var(--ai-soft), var(--bg) 80%); border: 1px solid var(--ai-border) !important; }
.rep-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }

.rep-news { margin-top: 4px; font-size: 12.5px; }

.rep-news li svg { color: var(--text-3); flex: none; }

.rep-dummy { font-size: 11px; color: var(--text-3); margin-top: 4px; }.linkbtn.warn { color: var(--danger-text); display: inline-flex; align-items: center; gap: 5px; }
/* 404 and start errors */
.nf { max-width: 520px; margin: 10vh auto 0; text-align: center; display: grid; justify-items: center; gap: 10px; }

/* thin loading bar at the very top while the server works */
/* loading bar: thin and pale, fades in and out; reduced motion: no sweep */
#busy-bar { position: fixed; left: 0; top: 0; height: 2px; width: 100%; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .4s ease;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent), transparent); background-size: 40% 100%; background-repeat: no-repeat; }
#busy-bar.on { opacity: .55; animation: busy 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  #busy-bar.on { animation: none; background: color-mix(in srgb, var(--accent) 35%, transparent); }
}
@keyframes busy { from { background-position: -40% 0; } to { background-position: 140% 0; } }
/* save buttons show that they work */
.btn.loading { position: relative; color: transparent !important; }
.btn.loading::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; animation: spin .7s linear infinite; }
.btn.outline.loading::after, .btn:not(.primary).loading::after { border-color: var(--border-strong); border-top-color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.modal.nudge { animation: nudge .3s; }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
/* start screen */
/* less motion for people who asked for it */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* print: just the content */

  .app, #view, .page, .fit-body, .cal-body, .db-body { height: auto !important; overflow: visible !important; }

}
.help h4 { margin: 14px 0 6px; font-size: 14px; }

/* dashboard: workload next 4 weeks */

/* ---------- board ---------- */

.ring { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-hover) 0); }
.ring.over { background: conic-gradient(var(--danger) 100%, var(--bg-hover) 0); }
.ring::before { content: ''; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); grid-area: 1/1; }

.trow { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }

.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 4px; overflow-x: auto; padding-bottom: 4px; }

/* ---------- agenda ---------- */

.ag-item { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 12px; border-radius: 10px; background: var(--bg); box-shadow: 0 0 0 1px var(--border); font-size: 13.5px; font-weight: 500; cursor: pointer; min-width: 0; }

.ag-item.done .tt { color: var(--text-3); text-decoration: line-through; }

.ag-item.warn { background: var(--danger-soft); box-shadow: none; color: var(--danger-text); font-weight: 600; cursor: default; }
.ag-item.away { background: var(--bg-hover); box-shadow: none; color: var(--text-2); cursor: default; }
.ag-item.event { background: var(--accent-soft); box-shadow: none; color: var(--accent-text); }
.ag-empty { color: var(--text-3); font-size: 13px; padding: 20px 0; }

/* ---------- calendar planning: task list + time grid ---------- */
.pl-list { display: flex; flex-direction: column; min-height: 0; }
.pl-head { flex: none; }
.pl-head h3 { margin-bottom: 10px; }
.pl-head .seg { margin-bottom: 8px; }
.pl-scroll { flex: 1; min-height: 0; overflow: auto; margin: 0 -6px; padding: 2px 6px; }
.cal-plan { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; height: 100%; min-height: 0; }
.cal-grid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.cal-grid > .wk { flex: 1; min-height: 0; overflow: auto; align-content: start; }
.wk .wk-h, .wk .wk-corner:first-child { position: sticky; top: 0; z-index: 3; background-color: var(--bg); }
.wk .wk-h.weekend { background-color: var(--bg-subtle); }

/* calendar page fills the window; only its boxes scroll */
#view:has(.cal-fit) { overflow: hidden; }
/* App layout on desktop: pages never scroll as a whole. Heads, tabs and tool bars stay, the .fit-body box scrolls. */
@media (min-width: 861px) {
  #view { overflow: hidden; }
  #view > .page { height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
  #view > .page > * { flex: none; }
  #view > .page > .cal-body { flex: 1 1 auto; min-height: 0; }
  #view > .page > .fit-body { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px 4px; }
  /* a task database inside a tab: its tool bar stays, its rows scroll */
  .fit-body:has(> .db-body) { display: flex; flex-direction: column; overflow: hidden !important; }
  .fit-body > .dbh { flex: none; }
  .fit-body > .db-body { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px 4px; }
  .db-body .board { min-height: 100%; }
  /* dashboard cards with long lists scroll inside themselves */
  .dash-grid .card-w { max-height: 560px; overflow: auto; }
}
@media (min-width: 861px) {
  .app.no-topbar .topbar { display: none; }
  .app.no-topbar .page { padding-top: 16px; }
}
.page.cal-fit { height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
.cal-fit > .cal-top { flex: none; }
/* calendar header as one slim row so the grid gets the height */

/* calendar: everything in one slim row */
.cal-fit .cal-top.slim { flex-wrap: nowrap; padding: 8px 12px; gap: 10px; margin-bottom: 10px; }
.cal-top.slim .cal-top-l { flex: 1 1 auto; flex-wrap: nowrap; gap: 10px; }

@media (max-width: 1400px) { .cal-top.slim .seg.views button { font-size: 0; gap: 0; } .cal-top.slim .seg.views button svg { font-size: 13px; } }
.cal-fit .cal-top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.cal-body { flex: 1; min-height: 0; }

/* availability: banner and legend stay, the table scrolls with sticky head, names and totals */

.cap-main > .banner { flex: none; margin: 0 0 10px; padding: 9px 14px; }

.cap-main table.av thead .who { z-index: 3; }
.cap-main table.av tfoot td { position: sticky; bottom: 0; z-index: 2; }
.cap-main table.av tfoot .who { z-index: 3; }
.pl-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px var(--border); cursor: grab; }
.pl-item:hover { box-shadow: 0 0 0 1px var(--accent); }

.pl-day { padding: 0; overflow: hidden; }

.pl-flags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0; }
.tl { position: relative; display: flex; margin: 10px 14px 16px 0; user-select: none; }

.tl-hours .hl, .wk-gutter .hl { height: var(--hh); text-align: right; padding-right: 12px; font-size: 11.5px; font-weight: 500; color: var(--text-3); transform: translateY(-7px); }
.tl-grid, .wk-col { position: relative; flex: 1; min-width: 0; background:
  repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px var(--hh)),
  repeating-linear-gradient(to bottom, transparent 0 calc(var(--hh) / 2), color-mix(in srgb, var(--border) 55%, transparent) calc(var(--hh) / 2) calc(var(--hh) / 2 + 1px), transparent calc(var(--hh) / 2 + 1px) var(--hh)); cursor: cell; }
.tl-grid.drop { background: var(--accent-soft); opacity: .4; }
.blk-p { position: absolute; left: 6px; right: 6px; border-radius: 10px; padding: 6px 10px; background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(0, 50, 120, .25); cursor: grab; overflow: hidden; border-left: 5px solid var(--yellow); min-width: 0; }

.blk-p .bx button:hover { background: rgba(255, 255, 255, .38); }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; min-width: 160px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: hidden; user-select: none; }
.cal-dow { height: 36px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--text-3); border-bottom: 1px solid var(--border); }
.cal-day { min-height: max(104px, calc((100vh - 380px) / 6)); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; position: relative; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cal-day:nth-child(7n) { border-right: 0; }

.cal-day.other .daynum { color: var(--text-3); }

.cal-day.sel { background: var(--accent-soft) !important; }
.cal-day.drop { background: var(--accent-soft); }

.daytop { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.daynum { font-size: 13px; font-weight: 600; color: var(--text-2); min-width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 12px; padding: 0 5px; font-variant-numeric: tabular-nums; }
.cal-day.today .daynum { background: var(--yellow); color: #3b3000; box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
.daytop .hol { font-size: 11px; color: var(--yellow-ink); background: var(--yellow-soft); border-radius: 6px; padding: 1px 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.daytop .wbadge { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--danger); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.away { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); min-height: 20px; }
.away .avatars .avatar { width: 18px; height: 18px; font-size: 8.5px; }
.ev { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 7px; padding: 0 7px; height: 24px; white-space: nowrap; overflow: hidden; min-width: 0; flex: none; }
.ev > span { overflow: hidden; text-overflow: ellipsis; }
.ev.task { background: var(--bg); box-shadow: 0 0 0 1px var(--border-strong); cursor: grab; }
.ev.task:hover { box-shadow: 0 0 0 1px var(--accent); }

.ev.more { color: var(--text-3); padding-left: 6px; height: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 12px 0; align-items: center; }

.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.panel { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px 18px; }
.panel + .panel { margin-top: 14px; }
.panel h3 { font-size: 14px; font-weight: 700; margin: 0 0 10px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.hlist { display: grid; gap: 2px; }
.hitem { display: flex; gap: 12px; align-items: center; padding: 7px 6px; margin: 0 -6px; border-radius: 10px; font-size: 13px; }
.hitem:hover { background: var(--bg-subtle); }
.hitem .d { width: 40px; flex: none; text-align: center; line-height: 1.05; background: var(--canvas); border-radius: 10px; padding: 5px 0; }
.hitem .d b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hitem .d small { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }

.hint-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); margin-top: 10px; }

/* ---------- availability ---------- */

.av-wrap { overflow-x: auto; background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
table.av { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; }
table.av th, table.av td { padding: 0; border-bottom: 1px solid var(--border); }
table.av thead th { height: 54px; vertical-align: top; padding-top: 8px; font-weight: 600; color: var(--text-3); text-align: center; min-width: 26px; }
table.av thead th.wkb { border-left: 1px solid var(--border-strong); }
table.av thead th small { display: block; font-size: 10px; font-weight: 500; }
table.av thead th.today { color: #3b3000; background: var(--yellow); }
table.av .who { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 210px; width: 210px; padding: 0 12px 0 16px; height: 48px; border-right: 1px solid var(--border); text-align: left; }
table.av thead .who { background: var(--bg); font-size: 12px; color: var(--text-3); font-weight: 600; }
table.av td.c { text-align: center; height: 48px; padding: 9px 0; }
table.av td.c.wkb { border-left: 1px solid var(--border-strong); }
table.av td.c.we { background: var(--bg-subtle); }
.blk { width: 100%; height: 30px; margin: 0; border-radius: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.blk.vacation { background: var(--vacation); } .blk.sick { background: var(--sick); } .blk.training { background: var(--training); }
.blk.other { background: var(--other); } .blk.holiday { background: var(--holiday); color: #3b3000; }
.blk.off { background: repeating-linear-gradient(-45deg, var(--bg-hover) 0 3px, transparent 3px 6px); }
table.av tfoot td { height: 46px; border-bottom: 0; background: var(--bg-subtle); }
table.av tfoot .who { font-weight: 700; background: var(--bg-subtle); }
.pct { font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
.pct.mid { color: var(--warning-text); }
.pct.warn { color: #fff; background: var(--danger); border-radius: 6px; padding: 3px 5px; }
.panels-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
.panels-row .panel + .panel { margin-top: 0; }

/* ---------- cards grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { border-radius: var(--r-lg); padding: 18px; cursor: pointer; background: var(--bg); box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s; }
.pcard:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(18, 40, 90, .25); }
.pcard .t { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.pcard .d { color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard.new { background: transparent; box-shadow: none; border: 2px dashed var(--border-strong); color: var(--text-3); align-items: center; justify-content: center; min-height: 140px; flex-direction: row; font-weight: 600; }
.pcard.new:hover { color: var(--text); border-color: var(--accent); transform: none; box-shadow: none; }
.members-list { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.mrow { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.mrow:last-child { border-bottom: 0; }
.mrow .info { flex: 1; min-width: 0; }
.mrow .info small { color: var(--text-3); font-size: 12px; }
.mrow .col2 { width: 110px; color: var(--text-2); text-align: right; font-size: 12.5px; }

/* ---------- peek ---------- */
.peek { width: var(--peek-w); flex: none; background: var(--bg); display: flex; flex-direction: column; animation: slidein .18s ease-out; overflow: hidden; box-shadow: -10px 0 30px -12px rgba(18, 40, 90, .2); }
.peek.full { position: fixed; inset: 0; width: auto; z-index: 30; box-shadow: none; }
.peek.full .peek-body { max-width: 760px; margin: 0 auto; }
@keyframes slidein { from { transform: translateX(16px); opacity: 0; } }
.peek-top { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 14px; border-bottom: 1px solid var(--border); flex: none; }
.peek-top .spacer { flex: 1; }
.peek-scroll { flex: 1; overflow: auto; }
.peek-body { padding: 24px 28px 64px; }
.peek-crumb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
.peek-title { width: 100%; border: 0; outline: none; background: transparent; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.25; resize: none; padding: 0; margin-bottom: 16px; overflow: hidden; }
.peek-title::placeholder { color: var(--text-3); }
.props { display: grid; gap: 2px; margin-bottom: 16px; padding: 6px; background: var(--bg-subtle); border-radius: var(--r-md); }
.prop { display: grid; grid-template-columns: 124px minmax(0, 1fr); align-items: center; min-height: 36px; }
.prop .k { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; padding-left: 8px; }
.prop .k svg { color: var(--text-3); }
.prop .v { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; min-height: 32px; width: 100%; font-size: 13px; font-weight: 500; }
.prop .v:hover { background: var(--bg-active); }
.ai-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); }
.ai-btn svg { color: var(--accent); }
.ai-btn:hover { background: var(--accent); color: #fff; }
.ai-btn:hover svg { color: var(--yellow); }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.desc { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 80px; line-height: 1.6; font-size: 14px; padding: 0; }
.desc::placeholder { color: var(--text-3); }
.section-label { font-size: 13px; font-weight: 700; margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
.subtask { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 8px; border-radius: 10px; }
.subtask:hover { background: var(--bg-subtle); }
.subtask .t { flex: 1; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.subtask .t.done { text-decoration: line-through; color: var(--text-3); }
.inline-add { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: var(--text-3); }
.inline-add input { flex: 1; border: 0; outline: none; background: transparent; height: 38px; font-size: 13.5px; }
.comment { display: flex; gap: 10px; padding: 10px 0; }
.comment .body { flex: 1; min-width: 0; background: var(--bg-subtle); border-radius: 12px; padding: 8px 12px; }
.comment .head { font-size: 13px; font-weight: 600; }
.comment .head .muted { font-size: 12px; margin-left: 6px; font-weight: 400; }
.comment .text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; margin-top: 2px; }
.comment-form { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
.comment-form textarea { flex: 1; min-height: 40px; }
.suggest { background: var(--accent-soft); border-radius: var(--r-md); padding: 8px; margin-bottom: 16px; }
.suggest .sh { font-size: 12px; font-weight: 700; color: var(--accent-text); padding: 4px 6px 6px; display: flex; justify-content: space-between; align-items: center; }
.suggest .opt { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; width: 100%; font-size: 13px; }
.suggest .opt:hover { background: var(--bg); }
.suggest .opt small { display: block; color: var(--text-3); font-size: 11.5px; }
.meta-foot { font-size: 12px; color: var(--text-3); margin-top: 32px; }

/* ---------- popover, modal, palette ---------- */
.pop { position: fixed; z-index: 60; background: var(--bg-elevated); border-radius: 14px; box-shadow: var(--shadow-pop); min-width: 220px; max-width: 320px; padding: 6px; animation: popin .1s ease-out; max-height: 380px; display: flex; flex-direction: column; }
@keyframes popin { from { opacity: 0; transform: translateY(-3px) scale(.99); } }
.pop-search { border: 0; border-bottom: 1px solid var(--border); outline: none; background: transparent; padding: 9px 10px; margin-bottom: 4px; width: 100%; font-size: 13px; }
.pop-list { overflow: auto; }
.pop-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 0 10px; height: 34px; border-radius: 9px; font-size: 13px; font-weight: 500; }
.pop-item:hover, .pop-item.hover { background: var(--accent-soft); color: var(--accent-text); }
.pop-item .pp-name { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.pop-item .pp-mail { margin-left: 0; font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.pop-item:has(.pp-name) { height: 44px; }
.pop-item .tick { margin-left: auto; color: var(--accent); }
.pop-item small { color: var(--text-3); margin-left: auto; font-size: 11.5px; }
.pop-sep { height: 1px; background: var(--border); margin: 5px 0; }
.pop-label { font-size: 11px; color: var(--text-3); font-weight: 700; padding: 8px 10px 4px; letter-spacing: .04em; text-transform: uppercase; }
.pop-quick { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; }
.modal-bg { position: fixed; inset: 0; background: rgba(14, 26, 52, .45); backdrop-filter: blur(2px); z-index: 50; display: grid; place-items: center; padding: 4vh 16px; overflow: hidden; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
/* dialogs: fixed frame, head and buttons stay, only the body scrolls */
.modal { width: 100%; max-width: 500px; max-height: 92vh; display: flex; flex-direction: column; background: var(--bg-elevated); border-radius: 20px; box-shadow: var(--shadow-pop); animation: popin .14s; overflow: hidden; }
.modal-head { flex: none; display: flex; align-items: center; padding: 20px 24px 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; border-bottom: 1px solid var(--border); }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 24px 8px; }
.modal-foot { flex: none; display: flex; gap: 8px; justify-content: flex-end; padding: 12px 24px 18px; border-top: 1px solid var(--border); }
.modal-foot .left { margin-right: auto; }
.picker { border: 1px solid var(--border-strong); border-radius: 10px; max-height: 180px; overflow: auto; padding: 4px; }
.picker label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.picker label:hover { background: var(--bg-hover); }
.color-row { display: flex; gap: 8px; }
.color-row button { width: 24px; height: 24px; border-radius: 50%; }
.color-row button.on { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 4px var(--text-2); }
/* colour already used by an overlapping team: crossed out with a red X */
.color-row button.taken { position: relative; cursor: not-allowed; box-shadow: inset 0 0 0 12px color-mix(in srgb, var(--bg-elevated) 55%, transparent); }
.color-row button.taken::before, .color-row button.taken::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2.5px; margin-left: -1.25px;
  border-radius: 2px; background: var(--danger); opacity: 1; }
.color-row button.taken::before { transform: rotate(45deg); }
.color-row button.taken::after { transform: rotate(-45deg); }
.palette-bg { position: fixed; inset: 0; z-index: 70; background: rgba(14, 26, 52, .4); backdrop-filter: blur(2px); display: flex; justify-content: center; padding-top: 14vh; animation: fade .1s; }
.palette { width: min(640px, calc(100vw - 32px)); background: var(--bg-elevated); border-radius: 20px; box-shadow: var(--shadow-pop); overflow: hidden; align-self: flex-start; }
.palette-in { display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 58px; border-bottom: 1px solid var(--border); }
.palette-in svg { color: var(--text-3); }
.palette-in input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; }
.palette-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
.palette-preview:empty { display: none; }
.palette-list { max-height: 360px; overflow: auto; padding: 8px; }
.palette-foot { border-top: 1px solid var(--border); padding: 9px 20px; font-size: 11.5px; color: var(--text-3); display: flex; gap: 12px; flex-wrap: wrap; background: var(--bg-subtle); }
.palette-foot code { font-family: ui-monospace, monospace; color: var(--text-2); }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; justify-items: center; }
.toast { background: var(--text); color: var(--bg); border-radius: 12px; padding: 11px 16px; box-shadow: var(--shadow-pop); font-size: 13px; font-weight: 500; display: flex; gap: 12px; align-items: center; animation: popin .15s; max-width: 560px; }
.toast.err, .toast.warn { background: var(--danger); color: #fff; }
.toast button { font-weight: 700; text-decoration: underline; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--text-2); padding: 56px 16px; font-size: 14px; background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.empty svg { width: 30px; height: 30px; color: var(--text-3); margin-bottom: 8px; }
.notice { border-radius: var(--r-md); padding: 14px 16px; background: var(--accent-soft); font-size: 13px; color: var(--text-2); line-height: 1.55; }
.notice code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.list-plain { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.list-plain .li { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.list-plain .li:last-child { border-bottom: 0; }
.list-plain .li .grow { flex: 1; min-width: 0; }
.list-plain .empty-li { padding: 14px 18px; color: var(--text-3); font-size: 13px; }
.days { display: flex; gap: 4px; }
.days label { cursor: pointer; }
.days input { display: none; }
.days span { display: inline-grid; place-items: center; width: 38px; height: 34px; border-radius: 10px; background: var(--bg-hover); font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.days input:checked + span { background: var(--accent); color: #fff; }

/* ---------- responsive ---------- */
/* ---------- calendar header, week/day grid, heatmap ---------- */
.cal-top { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; padding: 20px 24px; margin-bottom: 16px; }
.cal-top-l { flex: 1; min-width: 320px; }
.cal-top-l .page-sub { margin-bottom: 14px; }
.cal-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-top-r { display: grid; gap: 10px; justify-items: end; }
.cal-acts { display: flex; gap: 8px; }
.seg.views button { display: inline-flex; align-items: center; gap: 6px; }
.seg.views button svg { color: var(--text-3); }
.seg.views button.on svg { color: var(--accent); }
.cal-full { min-width: 0; }
.kbd-bar { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 18px; padding: 10px 18px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-card); font-size: 12px; color: var(--text-2); }
.kbd-bar kbd { font: inherit; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--bg-hover); border-radius: 5px; padding: 1px 6px; margin: 0 2px; }
.ag-over { margin-bottom: 14px; background: var(--danger-soft); box-shadow: none; }
.ag-over .ag-item { margin-bottom: 6px; }
.ag-item .meta.due { color: var(--danger-text); font-weight: 600; font-size: 12px; white-space: nowrap; }
.wk { display: grid; grid-template-columns: 62px repeat(var(--cols), minmax(0, 1fr)); padding: 0; overflow: hidden; user-select: none; }
.wk-corner { border-bottom: 1px solid var(--border); }
.wk-corner.a { font-size: 10.5px; color: var(--text-3); display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; border-bottom: 1px solid var(--border-strong); }
.wk-h { padding: 10px 8px 8px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
.wk-dn { display: flex; align-items: baseline; gap: 8px; }
.wk-dn small { font-size: 12px; font-weight: 600; color: var(--text-3); }
.wk-dn b { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; min-width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 17px; font-variant-numeric: tabular-nums; }
.wk-h.today .wk-dn b { background: var(--yellow); color: #3b3000; box-shadow: 0 0 0 2px var(--accent); }
.wk-h.weekend, .wk-col.weekend, .wk-a.weekend { background-color: var(--bg-subtle); }
.wk-fl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 6px; }
.wk-fl .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-a { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border-strong); padding: 5px; display: flex; flex-direction: column; gap: 3px; min-height: 34px; min-width: 0; }
.wk-chip { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 7px; background: var(--bg); box-shadow: 0 0 0 1px var(--border-strong); font-size: 12px; font-weight: 500; cursor: pointer; overflow: hidden; white-space: nowrap; min-width: 0; }
.wk-chip span { overflow: hidden; text-overflow: ellipsis; }
.wk-chip:hover { box-shadow: 0 0 0 1px var(--accent); }
.wk-chip.event { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; font-weight: 600; }
.wk-more { font-size: 11px; color: var(--text-3); padding-left: 4px; }
.wk-gutter { margin-top: 10px; }
.wk-col { border-left: 1px solid var(--border); margin-top: 10px; height: var(--tlh); }
.wk-col.today { background-color: color-mix(in srgb, var(--yellow-soft) 45%, transparent); }
.wk-col.drop { background-color: var(--accent-soft); }
.wk-col .tl-now { left: 0; }
.wk-col .blk-p { left: 3px; right: 3px; padding: 4px 6px; }
.wk-col .blk-p .bt { font-size: 12px; }
.hm { overflow-x: auto; }
.hm-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.hm-stat { flex: 1 1 160px; background: var(--canvas); border-radius: 14px; padding: 14px 16px; }
.hm-stat b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--accent-text); }
.hm-stat span { font-size: 12.5px; color: var(--text-2); }
.hm-wrap { display: flex; gap: 8px; min-width: min-content; }
.hm-dows { display: grid; grid-template-rows: repeat(7, 16px); gap: 4px; margin-top: 22px; font-size: 11px; color: var(--text-3); line-height: 16px; }
.hm-months { display: grid; grid-template-columns: repeat(52, 16px); gap: 4px; height: 18px; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.hm-months span { white-space: nowrap; }
.heat.big { grid-template-rows: repeat(7, 16px); grid-auto-columns: 16px; overflow: visible; }

/* ---------- pills, header cards, table, board, gantt ---------- */
.spill, .ppill, .tpill, .jpill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.spill { --sc: var(--text-2); background: color-mix(in srgb, var(--sc) 14%, var(--bg)); color: color-mix(in srgb, var(--sc) 82%, var(--text)); }
.spill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--sc); margin-right: 6px; flex: none; }
.st-backlog { --sc: #8d98b0; } .st-todo { --sc: #5b78a8; } .st-doing { --sc: #d99a00; } .st-review { --sc: #0050aa; } .st-done { --sc: #12935b; }
.ppill { background: var(--bg-hover); color: var(--text-2); }
.ppill.prio-urgent { background: var(--danger-soft); color: var(--danger-text); }
.ppill.prio-high { background: #fdebd9; color: #b45309; }
.ppill.prio-medium { background: var(--warning-soft); color: var(--warning-text); }
.ppill.prio-low { background: var(--accent-soft); color: var(--accent-text); }
.tpill { --tc: var(--c-gray); background: color-mix(in srgb, var(--tc) 15%, var(--bg)); color: color-mix(in srgb, var(--tc) 85%, var(--text)); margin-right: 4px; }
.t-blue { --tc: var(--c-blue); } .t-green { --tc: var(--c-green); } .t-purple { --tc: var(--c-purple); } .t-orange { --tc: var(--c-orange); }
.t-pink { --tc: var(--c-pink); } .t-yellow { --tc: var(--c-yellow); } .t-brown { --tc: var(--c-brown); } .t-red { --tc: var(--c-red); } .t-gray { --tc: var(--c-gray); }
.jpill { color: #fff; max-width: 190px; }
.cdot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.pbar { display: inline-flex; align-items: center; gap: 8px; min-width: 110px; }
.pbar .track, .cprog .track { flex: 1; height: 5px; border-radius: 99px; background: var(--bg-hover); overflow: hidden; }
.pbar .track i, .cprog .track i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.pbar .pv, .cprog .pv { font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.pbar.wide { display: flex; margin-top: 8px; }
.btn.white { background: var(--bg); border: 1px solid var(--border-strong); color: var(--text); font-weight: 600; }
.btn.white:hover { background: var(--bg-subtle); }
.btn.white svg { color: var(--accent); }

/* header card of task pages */

/* ---------- calm dashboard: neutral cards, colour only as a small signal ---------- */

.stile .sic, .stile.green .sic, .stile.yellow .sic, .stile.red .sic { width: 30px; height: 30px; border-radius: 9px; background: var(--bg-subtle); color: var(--text-3); }
.sbadge, .stile.red .sbadge { background: none; padding: 0; font-weight: 500; color: var(--text-3); }
.stile .sv { font-size: 26px; font-weight: 650; }
.stile.red .sv { color: var(--text); }

/* project preview: the original lively banner in the project colour (base styles above) */

.stile.green .sic { background: color-mix(in srgb, var(--success) 12%, var(--bg)); color: var(--success-text); }
.stile.yellow .sic { background: color-mix(in srgb, var(--yellow) 18%, var(--bg)); color: var(--yellow-ink); }
.stile.red .sic { background: var(--bg-subtle); color: var(--text-3); }
.stile.red.hot .sic { background: color-mix(in srgb, var(--danger) 12%, var(--bg)); color: var(--danger-text); }
.stile { border-top: 3px solid var(--border); }
.stile:not(.green):not(.yellow):not(.red) { border-top-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.stile.green { border-top-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
.stile.yellow { border-top-color: color-mix(in srgb, var(--yellow) 60%, var(--border)); }
.stile.red.hot { border-top-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }

.pj-m > .pj-people:hover { background: rgba(255, 255, 255, .16); }
.pj-plus { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px dashed rgba(255, 255, 255, .7); font-size: 12px; font-weight: 600; }
.pm-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }

/* skeletons: soft shimmer in the shape of the content that is loading */
:root { --sk: rgba(15, 23, 42, .065); --sk-hi: rgba(15, 23, 42, .12); }
:root[data-theme="dark"] { --sk: rgba(255, 255, 255, .06); --sk-hi: rgba(255, 255, 255, .12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sk: rgba(255, 255, 255, .06); --sk-hi: rgba(255, 255, 255, .12); } }
.sk, .skeleton, .sk-gbar, .cal.sk-on > div:not(.cal-dow)::after, .wk.sk-on .wk-a::after {
  display: block; height: 12px; border-radius: 6px; flex: none;
  background: linear-gradient(90deg, var(--sk) 0%, var(--sk-hi) 45%, var(--sk) 90%) 0 0 / 260% 100%;
  animation: sk-shine 1.5s ease-in-out infinite;
}
.skeleton { animation-name: sk-shine; }
@keyframes sk-shine { from { background-position: 100% 0; } to { background-position: -60% 0; } }
.sk.round { border-radius: 50%; }
.sk.pill { border-radius: 999px; }
.sk.sq { border-radius: 8px; }
.sk-box { display: flex; flex-direction: column; gap: 2px; }
.sk-line { padding: 6px 0; }
.sk-row { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-bottom: 1px solid var(--border); }
.sk-row:last-child { border-bottom: 0; }
.sk-row.tight { padding: 7px 4px; border: 0; gap: 10px; }
.sk-row .grow { flex: 1; }
.sk-stack { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; }
.sk-table .sk-tr { display: grid; grid-template-columns: 2.2fr repeat(calc(var(--cols) - 1), 1fr); gap: 18px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--border); }
.sk-table .sk-tr.head { padding: 8px 6px; }
.sk-board { flex-direction: row; gap: 14px; overflow: hidden; align-items: flex-start; }
.sk-col { flex: 1 1 0; min-width: 220px; display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: var(--r-lg, 14px); background: var(--bg-soft, var(--bg-hover)); }
.sk-card, .sk-pcard, .sk-tile { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--bg); box-shadow: var(--shadow-card); }
.sk-foot { display: flex; justify-content: space-between; align-items: center; }
.sk-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
.sk-pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.sk-pcard { box-shadow: inset 0 0 0 1px var(--border); }
.sk-gr { display: grid; grid-template-columns: 26% 1fr; align-items: center; gap: 16px; padding: 10px 6px; border-bottom: 1px solid var(--border); }
.sk-gbar { height: 18px; border-radius: 6px; }
.sk-cal { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.sk-cell { min-height: 86px; padding: 8px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.sk-page { display: flex; flex-direction: column; gap: 16px; }
.sk-head { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 4px; }
.sk-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.sk-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.sk-banner { display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 18px; min-height: 130px; justify-content: center; background: var(--bg-soft, var(--bg-hover)); }
.sk-side { display: flex; flex-direction: column; gap: 8px; padding: 18px 14px; }
.sk-side > .sk:nth-child(2) { margin: 8px 0 10px; border-radius: 10px; }
.boot { height: 100%; }
/* calendar while events and absences are on their way: a shimmering line in each day */
.cal.sk-on > div:not(.cal-dow)::after { content: ''; height: 14px; margin: 6px 4px 0; width: 70%; border-radius: 999px; }
.wk.sk-on .wk-a::after { content: ''; height: 14px; margin: 4px; width: 75%; border-radius: 999px; }
@media (max-width: 900px) { .sk-2 { grid-template-columns: 1fr; } .sk-col:nth-child(n+3) { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .sk, .skeleton, .sk-gbar, .cal.sk-on > div:not(.cal-dow)::after, .wk.sk-on .wk-a::after { animation: none; background: var(--sk-hi); }
}

/* ==========================================================================
   Semantic colours: one meaning, one token (light + dark).
   success = done · warning = due soon, holiday, attention · danger = overdue, error, over capacity
   info/accent = in progress, events, links · ai = AI · neutral = backlog, absence, low priority
   ========================================================================== */
:root {
  --st-backlog: #8d98b0; --st-todo: #5b78a8; --st-doing: #1d5fd6; --st-review: #7a4fd0; --st-done: var(--success);
  --prio-urgent: var(--danger); --prio-urgent-soft: var(--danger-soft);
  --prio-high: #c2570c; --prio-high-soft: #fdebd9; --prio-high-text: #af4e0b;
  --prio-medium: var(--warning); --prio-medium-soft: var(--warning-soft);
  --prio-low: var(--text-3); --prio-low-soft: var(--bg-hover);
  --warning-strong: #f2b000; --on-warning: #241a00;
  --heat-1: #c6dcf7; --heat-2: #7fb0ec; --heat-3: #2f7bd0; --heat-4: #0050aa;
}
:root[data-theme="dark"] {
  --st-backlog: #7d89a3; --st-todo: #8aa3cf; --st-doing: #6fa2ff; --st-review: #b39cf5;
  --prio-high: #ff9a5c; --prio-high-soft: #3a2414; --prio-high-text: var(--prio-high);
  --warning-strong: #ffd84d;
  --heat-1: #173058; --heat-2: #1f4f94; --heat-3: #3478d6; --heat-4: #7fb0ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --st-backlog: #7d89a3; --st-todo: #8aa3cf; --st-doing: #6fa2ff; --st-review: #b39cf5;
    --prio-high: #ff9a5c; --prio-high-soft: #3a2414; --prio-high-text: var(--prio-high);
    --warning-strong: #ffd84d;
    --heat-1: #173058; --heat-2: #1f4f94; --heat-3: #3478d6; --heat-4: #7fb0ff;
  }
}
/* status */
.st-backlog { --sc: var(--st-backlog); } .st-todo { --sc: var(--st-todo); } .st-doing { --sc: var(--st-doing); }
.st-review { --sc: var(--st-review); } .st-done { --sc: var(--st-done); }
/* priority: the same colour for bars, pills, cards and planner blocks */
.prio-urgent, .cprio.prio-urgent { color: var(--prio-urgent); } .prio-high, .cprio.prio-high { color: var(--prio-high-text); }
.prio-medium, .cprio.prio-medium { color: var(--prio-medium); } .prio-low, .cprio.prio-low { color: var(--prio-low); }
.ppill.prio-urgent { background: var(--prio-urgent-soft); color: var(--prio-urgent); }
.ppill.prio-high { background: var(--prio-high-soft); color: var(--prio-high-text); }
.ppill.prio-medium { background: var(--prio-medium-soft); color: var(--prio-medium); }
.ppill.prio-low { background: var(--prio-low-soft); color: var(--text-2); }
.blk-p.p-urgent { background: var(--prio-urgent); }
.qa-prio { color: var(--prio-high-text); } .qa-date { color: var(--accent-text); } .qa-rec { color: var(--text-2); }
/* attention: chips, toasts */
.chip.warn { background: var(--warning-soft); color: var(--warning-text); }
.toast.warn { background: var(--warning-strong); color: var(--on-warning); }
.toast.warn .icon, .toast.warn button { color: inherit; }
/* activity heatmap */
.heat i.l1 { background: var(--heat-1); } .heat i.l2 { background: var(--heat-2); } .heat i.l3 { background: var(--heat-3); } .heat i.l4 { background: var(--heat-4); }

/* "Woche im Blick": two rows of Mon–Fri, semantic colours only */
.wg h3 { flex-wrap: wrap; }
.wg-status { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.wg-status.ok { background: var(--success-soft); color: var(--success-text); }
.wg-status.bad { background: var(--danger-soft); color: var(--danger-text); }
.wg-week { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.wg-week + .wg-week { margin-top: 10px; }
.wg-wl { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; padding-top: 10px; }
