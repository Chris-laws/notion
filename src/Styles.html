<style>
/* Tokens: see DESIGN.md. Light canvas, white rounded cards; Lidl blue is the accent, yellow a small highlight, red means act now. */
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --canvas: #f1f4f9;
  --bg: #ffffff;
  --bg-subtle: #f6f8fc;
  --bg-hover: #eef2f9;
  --bg-active: #e3ebf8;
  --bg-elevated: #ffffff;
  --border: #e5eaf3;
  --border-strong: #d3dbe9;
  --text: #16223b;
  --text-2: #55617c;
  --text-3: #8d98b0;
  --accent: #0050aa;
  --accent-hover: #003f88;
  --accent-soft: #e7f0fc;
  --accent-text: #0050aa;
  --yellow: #ffe500;
  --yellow-soft: #fff8c4;
  --yellow-ink: #6b5600;
  --danger: #e60a14;
  --danger-soft: #feebec;
  --warning: #b07a00;
  --warning-soft: #fff6cf;
  --success: #12935b;
  --success-soft: #e2f5ec;
  --shadow-card: 0 1px 2px rgba(18, 40, 90, .05), 0 6px 18px -6px rgba(18, 40, 90, .08);
  --shadow-pop: 0 0 0 1px rgba(18, 40, 90, .06), 0 14px 36px -8px rgba(18, 40, 90, .25), 0 3px 8px rgba(18, 40, 90, .08);
  --shadow-drag: 0 14px 30px -8px rgba(18, 40, 90, .3);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --side-w: 240px;
  --peek-w: 520px;
  --vacation: #0050aa; --sick: #e60a14; --training: #6b3fb5; --other: #8d98b0; --holiday: #ffe500;
  --c-gray: #7d8aa3; --c-brown: #8a6a4b; --c-orange: #ee7a1c; --c-yellow: #e8b500; --c-green: #12935b;
  --c-blue: #0050aa; --c-purple: #7a4fd0; --c-pink: #d6409f; --c-red: #e60a14; --c-default: #7d8aa3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0b121f; --bg: #121b2c; --bg-subtle: #172237; --bg-hover: #1c2a44; --bg-active: #20345a; --bg-elevated: #172237;
    --border: #1f2d47; --border-strong: #2f4166;
    --text: #e9eefa; --text-2: #a2afc9; --text-3: #6d7c9a;
    --accent: #5ca2ff; --accent-hover: #86bbff; --accent-soft: #14305c; --accent-text: #8fbfff;
    --yellow-soft: #3a3510; --yellow-ink: #ffe98a;
    --danger: #ff5560; --danger-soft: #3b1b22; --warning: #ffd84d; --warning-soft: #3a3510;
    --success: #3fd698; --success-soft: #11332a;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .08), 0 14px 36px -8px rgba(0, 0, 0, .6);
    --training: #a98aef; --other: #5c6f92;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--font); font-optical-sizing: auto; color: var(--text); background: var(--canvas);
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03';
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.sidebar { width: var(--side-w); flex: none; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px; }
.ws-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); color: #fff; border-radius: 9px; position: relative; }
.ws-mark::after { content: ''; position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 2px var(--bg); }
.ws-mark svg { width: 16px; height: 16px; stroke-width: 2.6; }
.ws-name { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { width: 7px; height: 7px; background: var(--success); opacity: .55; border-radius: 50%; }
.sync-dot.busy { background: var(--accent); opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.side-scroll { flex: 1; overflow: auto; padding: 4px 12px 16px; }
.side-search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; margin-bottom: 14px;
  background: var(--canvas); border-radius: 10px; color: var(--text-3); font-size: 13px;
}
.side-search:hover { background: var(--bg-hover); color: var(--text-2); }
.side-search span:not(.kbd) { white-space: nowrap; overflow hidden; text-overflow: ellipsis; text-align: left; }
.kbd { margin-left: auto; font-size: 11px; color: var(--text-3); background: var(--bg); border-radius: 5px; padding: 1px 5px; box-shadow: 0 0 0 1px var(--border); }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 12px; border-radius: 10px;
  color: var(--text-2); font-size: 14px; font-weight: 500; transition: background .12s, color .12s;
}
.nav-item svg { color: var(--text-3); }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--yellow); }
.nav-item.active svg { color: var(--accent); }
.nav-item .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--canvas); border-radius: 999px; padding: 0 7px; line-height: 20px; }
.nav-item.active .count { background: var(--bg); color: var(--accent-text); }
.nav-item .alert { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.nav-item.faint { color: var(--text-3); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding-left: 14px; }
.nav-sub .nav-item { height: 32px; font-size: 13px; }
.side-section { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 4px; padding: 0 12px; height: 22px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.team-row { display: flex; align-items: center; }
.team-row .chev-btn { width: 18px; height: 36px; display: grid; place-items: center; color: var(--text-3); margin-left: -6px; }
.chev { transition: transform .15s; }
.collapsed .chev { transform: rotate(-90deg); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--text-2); flex: none; }
.icon-btn.sm { width: 24px; height: 24px; border-radius: 6px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 12px; }
.me-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 10px; }
.me-row:hover { background: var(--bg-hover); }
.me-meta { line-height: 1.3; min-width: 0; font-size: 13px; }
.me-meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { position: relative; z-index: 5; height: 60px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: var(--canvas); }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; font-size: 14px; }
.crumbs button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--text-2); white-space: nowrap; }
.crumbs button:hover { background: var(--bg-hover); color: var(--text); }
.crumbs .current { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--text-3); padding: 0 2px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }

/* ---------- marks, avatars, chips ---------- */
.mark { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; line-height: 1; }
.mark.md { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; }
.mark.lg { width: 44px; height: 44px; border-radius: 13px; font-size: 20px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 600; flex: none; box-shadow: 0 0 0 2px var(--bg); }
.avatar.md { width: 28px; height: 28px; font-size: 11px; }
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -6px; }
.person { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 13px; }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--bg-hover); color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; }
.chip.soft { background: var(--bg-hover); }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--yellow-soft); color: var(--yellow-ink); }
.chip.ok { background: var(--success-soft); color: var(--success); }
.cc { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 5px; border-radius: 5px; background: var(--bg-hover); color: var(--text-2); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); white-space: nowrap; }
.glyph { width: 16px; height: 16px; flex: none; }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
.prio-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.prio-bars i { width: 3px; border-radius: 2px; background: currentColor; opacity: .22; }
.prio-bars i:nth-child(1) { height: 5px; } .prio-bars i:nth-child(2) { height: 8px; } .prio-bars i:nth-child(3) { height: 12px; }
.prio-bars i.on { opacity: 1; }
.prio-urgent { color: var(--danger); } .prio-high { color: var(--c-orange); } .prio-medium { color: var(--accent); } .prio-low { color: var(--text-3); }
.meta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta svg { color: var(--text-3); }
.meta.overdue, .meta.overdue svg { color: var(--danger); font-weight: 600; }
.meta.today, .meta.today svg { color: var(--accent-text); font-weight: 600; }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600; color: var(--text-2); white-space: nowrap; border: 1px solid transparent; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.outline { background: var(--bg); border-color: var(--border-strong); color: var(--text); }
.btn.outline:hover { background: var(--bg-subtle); border-color: var(--text-3); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0, 50, 120, .3), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.on { background: var(--accent-soft); color: var(--accent-text); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea {
  width: 100%; height: 38px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 10px; padding: 0 12px; outline: none; font-size: 14px;
}
.textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 76px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--bg-hover); gap: 2px; }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(18, 40, 90, .12); }

/* ---------- page ---------- */
.page { max-width: 1360px; margin: 0 auto; padding: 4px 24px 56px; animation: pagein .22s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(5px); } }
.page.wide { max-width: none; }
.ph { margin-bottom: 4px; }
.page-head { display: flex; align-items: center; gap: 14px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; margin: 0; line-height: 1.2; }
.page-sub { color: var(--text-2); margin: 6px 0 0; max-width: 76ch; font-size: 14px; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--text-2); font-size: 13px; margin-top: 12px; }
.page-meta .sep { width: 1px; height: 14px; background: var(--border-strong); }
.page-actions { margin-left: auto; display: flex; gap: 8px; }
.h2 { font-size: 14px; font-weight: 700; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.h2 .faint { font-weight: 500; }
.card-w { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 18px 20px; min-width: 0; }
.card-w h3 { font-size: 14px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.card-w h3 .more { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent-text); }
.card-w h3 .more:hover { text-decoration: underline; }
.card-w h3 .n { font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--canvas); border-radius: 999px; padding: 0 7px; line-height: 20px; }

/* ---------- view bar ---------- */
.db-bar { display: flex; align-items: center; gap: 4px; margin: 18px 0 14px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; margin-right: auto; overflow-x: auto; padding: 3px; background: var(--bg-hover); border-radius: 12px; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 9px; color: var(--text-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.tab svg { color: var(--text-3); }
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(18, 40, 90, .12); }
.tab.active svg { color: var(--accent); }
.tab .n { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.db-search { height: 30px; width: 0; padding: 0; border: 0; outline: none; background: transparent; font-size: 13px; transition: width .2s; }
.db-search.open, .db-search:focus { width: 180px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg); }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

/* ---------- board ---------- */
.board { display: flex; gap: 14px; align-items: stretch; overflow-x: auto; padding-bottom: 16px; min-height: 420px; }
.col { flex: 1 0 224px; max-width: 360px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg-hover) 70%, transparent); padding: 10px; transition: background .12s; }
.col.drop { background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px; font-size: 13.5px; font-weight: 700; }
.col-head .n { font-size: 12px; color: var(--text-3); font-weight: 600; background: var(--bg); border-radius: 999px; padding: 0 7px; line-height: 20px; }
.col-head .icon-btn { margin-left: auto; }
.card {
  position: relative; background: var(--bg-elevated); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  box-shadow: var(--shadow-card); transition: transform .12s, box-shadow .12s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(18, 40, 90, .2); }
.card.dragging { opacity: .4; }
.card.selected { box-shadow: 0 0 0 2px var(--accent); }
.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--text-3); min-height: 16px; }
.card-top .mark { width: 16px; height: 16px; font-size: 9px; border-radius: 5px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -0.005em; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-title.done { color: var(--text-3); text-decoration: line-through; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 9px; }
.card-meta:empty { display: none; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px; }
.card-foot:empty { display: none; }
.add-row { display: flex; align-items: center; gap: 6px; width: 100%; height: 34px; padding: 0 8px; color: var(--text-3); font-size: 13px; font-weight: 500; border-radius: 10px; }
.add-row:hover { background: var(--bg); color: var(--text-2); }

/* ---------- checkbox ---------- */
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.75px solid var(--border-strong); display: inline-grid; place-items: center; flex: none; transition: all .12s; background: var(--bg); }
.check:hover { border-color: var(--accent); background: var(--accent-soft); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on::after { content: ''; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-.5px, -1px); }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
table.db { border-collapse: collapse; width: 100%; min-width: 960px; font-size: 13px; }
table.db th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 12px; height: 40px; padding: 0 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
table.db th:hover { color: var(--text); }
table.db th svg { vertical-align: -2px; margin-right: 4px; }
table.db td { padding: 0; border-bottom: 1px solid var(--border); height: 44px; vertical-align: middle; }
table.db tr:last-child td { border-bottom: 0; }
table.db tbody tr:hover td { background: var(--bg-subtle); }
table.db td .cell { padding: 0 14px; min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
table.db td .cell:hover { background: var(--bg-hover); }
table.db .title-cell { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; font-weight: 600; }
table.db .title-cell .open { margin-left: auto; opacity: 0; font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
table.db tr:hover .title-cell .open { opacity: 1; }
.sort-ind { margin-left: 4px; font-size: 9px; }

/* ---------- list ---------- */
.group { margin-bottom: 14px; background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.group-head { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; font-weight: 700; font-size: 13.5px; border-bottom: 1px solid var(--border); }
.group-head .n { font-size: 12px; font-weight: 600; color: var(--text-3); background: var(--canvas); border-radius: 999px; padding: 0 7px; line-height: 20px; }
.group-head.danger { color: var(--danger); }
.group-head.danger .n { background: var(--danger-soft); color: var(--danger); }
.lrow { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 6px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--bg-subtle); }
.lrow .t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.lrow .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.lrow .parent { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lrow .side { display: flex; align-items: center; gap: 14px; flex: none; }

/* ---------- dashboard ---------- */
.dash-head { display: flex; align-items: flex-end; gap: 16px; margin: 6px 0 18px; flex-wrap: wrap; }
.dash-head .date { font-size: 13px; color: var(--text-2); font-weight: 500; }
.dash-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 2px 0 0; line-height: 1.15; }
.quick { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 44px; width: min(420px, 100%); padding: 0 8px 0 16px; background: var(--bg); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--text-3); cursor: text; }
.quick .qt { flex: 1; min-width: 0; font-size: 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick .kbd { margin-left: 0; }
.quick .go { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; }
.brief-w { display: flex; gap: 14px; align-items: flex-start; background: linear-gradient(100deg, var(--accent-soft), var(--bg) 70%); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px 20px; margin-bottom: 14px; position: relative; }
.brief-w > svg { color: var(--accent); margin-top: 2px; }

.focus { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.focus button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--bg); box-shadow: 0 0 0 1px var(--border-strong); max-width: 100%; }
.focus button:hover { box-shadow: 0 0 0 1px var(--accent); }
.focus button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.tile { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform .12s; text-align: left; }
.tile:hover { transform: translateY(-2px); }
.tile .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.tile.red .ic { background: var(--danger-soft); color: var(--danger); }
.tile.yellow .ic { background: var(--yellow-soft); color: var(--yellow-ink); }
.tile.green .ic { background: var(--success-soft); color: var(--success); }
.tile .val { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile.red .val { color: var(--danger); }
.tile .lbl { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.ring { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-hover) 0); }
.ring.over { background: conic-gradient(var(--danger) 100%, var(--bg-hover) 0); }
.ring::before { content: ''; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); grid-area: 1/1; }
.ring span { grid-area: 1/1; font-size: 10.5px; font-weight: 700; z-index: 1; }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.dash-grid .w-7 { grid-column: span 7; } .dash-grid .w-5 { grid-column: span 5; } .dash-grid .w-6 { grid-column: span 6; } .dash-grid .w-12 { grid-column: span 12; }
.trow { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }
.trow:hover { background: var(--bg-subtle); }
.trow .tt { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tt.done { color: var(--text-3); text-decoration: line-through; }
.empty-w { padding: 18px 0; text-align: center; color: var(--text-3); font-size: 13px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 8px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }
.prow:hover { background: var(--bg-subtle); }
.prow .pn { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; }
.prow .pn small { display: block; font-weight: 400; color: var(--text-3); font-size: 12px; }
.prow .progress { width: 110px; }
.prow .pct2 { width: 38px; text-align: right; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { height: 7px; border-radius: 99px; background: var(--bg-hover); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.heat i { border-radius: 4px; background: var(--bg-hover); }
.heat i.l1 { background: #c6dcf7; } .heat i.l2 { background: #7fb0ec; } .heat i.l3 { background: #2f7bd0; } .heat i.l4 { background: #0050aa; }
.heat i.today { box-shadow: 0 0 0 2px var(--yellow); }
.heat-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 11.5px; color: var(--text-3); }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.skeleton { height: 12px; background: var(--bg-hover); animation: pulse 1.2s infinite; border-radius: 6px; }

/* ---------- agenda ---------- */
.agenda { display: grid; gap: 0; }
.ag-month { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; padding: 16px 0 6px; }
.ag-day { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
.ag-date { text-align: center; padding-top: 2px; }
.ag-date b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ag-date small { font-size: 12px; color: var(--text-3); font-weight: 600; }
.ag-day.today .ag-date b { display: grid; margin: 0 auto 2px; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--yellow); color: #3b3000; font-size: 20px; box-shadow: 0 0 0 2px var(--accent); }
.ag-day.warn .ag-date b { color: var(--danger); }
.ag-items { display: grid; gap: 6px; align-content: start; }
.ag-item { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 12px; border-radius: 10px; background: var(--bg); box-shadow: 0 0 0 1px var(--border); font-size: 13.5px; font-weight: 500; cursor: pointer; min-width: 0; }
.ag-item:hover { box-shadow: 0 0 0 1px var(--border-strong); background: var(--bg-subtle); }
.ag-item .tt { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-item.done .tt { color: var(--text-3); text-decoration: line-through; }
.ag-item.hol { background: var(--yellow-soft); box-shadow: none; cursor: default; color: var(--yellow-ink); }
.ag-item.warn { background: var(--danger-soft); box-shadow: none; color: var(--danger); font-weight: 600; cursor: default; }
.ag-item.away { background: var(--bg-hover); box-shadow: none; color: var(--text-2); cursor: default; }
.ag-item.event { background: var(--accent-soft); box-shadow: none; color: var(--accent-text); }
.ag-empty { color: var(--text-3); font-size: 13px; padding: 20px 0; }

/* ---------- day planner ---------- */
.planner { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
.pl-list { position: sticky; top: 0; max-height: calc(100vh - 160px); overflow: auto; }
.pl-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px var(--border); cursor: grab; }
.pl-item:hover { box-shadow: 0 0 0 1px var(--accent); }
.pl-item.dragging { opacity: .4; }
.pl-item .tt { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.pl-item .dur { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--bg-hover); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pl-hint { font-size: 12.5px; color: var(--text-3); margin: 0 0 10px; }
.pl-day { padding: 0; overflow: hidden; }
.pl-top { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pl-top .dl { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-right: 8px; }
.pl-top .tot { margin-left: auto; font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.pl-flags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0; }
.tl { position: relative; margin: 10px 14px 16px 0; user-select: none; }
.tl-hour { height: var(--hh); display: flex; }
.tl-hour .hl { width: 62px; flex: none; text-align: right; padding-right: 12px; font-size: 11.5px; font-weight: 500; color: var(--text-3); transform: translateY(-7px); }
.tl-hour .hs { flex: 1; border-top: 1px solid var(--border); position: relative; }
.tl-hour .hs::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--border); opacity: .7; }
.tl-grid { position: absolute; left: 62px; right: 0; top: 0; bottom: 0; }
.tl-grid.drop { background: var(--accent-soft); opacity: .4; }
.blk-p { position: absolute; left: 6px; right: 6px; border-radius: 10px; padding: 6px 10px; background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(0, 50, 120, .25); cursor: grab; overflow: hidden; border-left: 5px solid var(--yellow); min-width: 0; }
.blk-p.p-urgent { background: #b3070f; }
.blk-p.done { background: var(--success); opacity: .85; }
.blk-p.dragging { opacity: .4; }
.blk-p .bt { font-size: 13px; font-weight: 600; line-height: 1.25; }
.blk-p .bm { font-size: 11.5px; opacity: .85; margin-top: 1px; }
.blk-p .bx { position: absolute; top: 4px; right: 4px; display: none; gap: 2px; }
.blk-p:hover .bx { display: flex; }
.blk-p .bx button { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, .2); color: #fff; font-size: 11px; font-weight: 700; }
.blk-p .bx button:hover { background: rgba(255, 255, 255, .38); }
.tl-now { position: absolute; left: 56px; right: 0; border-top: 2px solid var(--danger); z-index: 2; pointer-events: none; }
.tl-now::before { content: ''; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; min-width: 160px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: hidden; user-select: none; }
.cal-dow { height: 36px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--text-3); border-bottom: 1px solid var(--border); }
.cal-day { min-height: max(104px, calc((100vh - 380px) / 6)); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; position: relative; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day:hover { background: var(--bg-subtle); }
.cal-day.other .daynum { color: var(--text-3); }
.cal-day.weekend { background: var(--bg-subtle); }
.cal-day.sel { background: var(--accent-soft) !important; }

.daytop { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.daynum { font-size: 13px; font-weight: 600; color: var(--text-2); min-width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 12px; padding: 0 5px; font-variant-numeric: tabular-nums; }
.cal-day.today .daynum { background: var(--yellow); color: #3b3000; box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
.daytop .hol { font-size: 11px; color: var(--yellow-ink); background: var(--yellow-soft); border-radius: 6px; padding: 1px 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.daytop .wbadge { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--danger); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.away { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); min-height: 20px; }
.away .avatars .avatar { width: 18px; height: 18px; font-size: 8.5px; }
.ev { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 7px; padding: 0 7px; height: 24px; white-space: nowrap; overflow: hidden; min-width: 0; flex: none; }
.ev > span { overflow: hidden; text-overflow: ellipsis; }
.ev.task { background: var(--bg); box-shadow: 0 0 0 1px var(--border-strong); cursor: grab; }
.ev.task:hover { box-shadow: 0 0 0 1px var(--accent); }
.ev.task.done span { text-decoration: line-through; color: var(--text-3); }
.ev.event { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.ev.event.milestone::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg); background: currentColor; flex: none; }
.ev.more { color: var(--text-3); padding-left: 6px; height: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 12px 0; align-items: center; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.panel { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px 18px; }
.panel + .panel { margin-top: 14px; }
.panel h3 { font-size: 14px; font-weight: 700; margin: 0 0 10px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.hlist { display: grid; gap: 2px; }
.hitem { display: flex; gap: 12px; align-items: center; padding: 7px 6px; margin: 0 -6px; border-radius: 10px; font-size: 13px; }
.hitem:hover { background: var(--bg-subtle); }
.hitem .d { width: 40px; flex: none; text-align: center; line-height: 1.05; background: var(--canvas); border-radius: 10px; padding: 5px 0; }
.hitem .d b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hitem .d small { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.hitem .what { min-width: 0; flex: 1; }
.hitem .what > div:first-child { font-weight: 600; }
.hitem .what .muted { font-size: 12px; }
.warnitem .d { background: var(--danger); color: #fff; }
.warnitem .d small { color: rgba(255, 255, 255, .85); }
.panel h3[style] { color: var(--danger) !important; }
.hint-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); margin-top: 10px; }

/* ---------- availability ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r-md); padding: 13px 16px; margin: 14px 0; font-size: 14px; }
.banner.danger { background: var(--danger-soft); color: var(--text); }
.banner.danger > svg { color: var(--danger); margin-top: 2px; }
.banner.ok { background: var(--success-soft); }
.banner.ok > svg { color: var(--success); margin-top: 2px; }
.banner b { font-weight: 700; }
.banner .days-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.av-wrap { overflow-x: auto; background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
table.av { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; }
table.av th, table.av td { padding: 0; border-bottom: 1px solid var(--border); }

table.av thead th.wk { border-left: 1px solid var(--border-strong); }
table.av thead th small { display: block; font-size: 10px; font-weight: 500; }
table.av thead th.today { color: #3b3000; background: var(--yellow); }
table.av .who { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 210px; width: 210px; padding: 0 12px 0 16px; height: 48px; border-right: 1px solid var(--border); text-align: left; }
table.av thead .who { background: var(--bg); font-size: 12px; color: var(--text-3); font-weight: 600; }
table.av td.c { text-align: center; height: 48px; padding: 9px 0; }
table.av td.c.wk { border-left: 1px solid var(--border-strong); }
table.av td.c.we { background: var(--bg-subtle); }
.blk { width: 100%; height: 30px; margin: 0; border-radius: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.blk.vacation { background: var(--vacation); } .blk.sick { background: var(--sick); } .blk.training { background: var(--training); }
.blk.other { background: var(--other); } .blk.holiday { background: var(--holiday); color: #3b3000; }
.blk.off { background: repeating-linear-gradient(-45deg, var(--bg-hover) 0 3px, transparent 3px 6px); }
table.av tfoot td { height: 46px; border-bottom: 0; background: var(--bg-subtle); }
table.av tfoot .who { font-weight: 700; background: var(--bg-subtle); }
.pct { font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
.pct.mid { color: var(--warning); }
.pct.warn { color: #fff; background: var(--danger); border-radius: 6px; padding: 3px 5px; }
.panels-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
.panels-row .panel + .panel { margin-top: 0; }

/* ---------- cards grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { border-radius: var(--r-lg); padding: 18px; cursor: pointer; background: var(--bg); box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s; }
.pcard:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(18, 40, 90, .25); }
.pcard .t { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.pcard .d { color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard.new { background: transparent; box-shadow: none; border: 2px dashed var(--border-strong); color: var(--text-3); align-items: center; justify-content: center; min-height: 140px; flex-direction: row; font-weight: 600; }
.pcard.new:hover { color: var(--text); border-color: var(--accent); transform: none; box-shadow: none; }
.members-list { background: var(--bg); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.mrow { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.mrow:last-child { border-bottom: 0; }
.mrow .info { flex: 1; min-width: 0; }
.mrow .info small { color: var(--text-3); font-size: 12px; }
.mrow .col2 { width: 110px; color: var(--text-2); text-align: right; font-size: 12.5px; }

/* ---------- peek ---------- */
.peek { width: var(--peek-w); flex: none; background: var(--bg); display: flex; flex-direction: column; animation: slidein .18s ease-out; overflow: hidden; box-shadow: -10px 0 30px -12px rgba(18, 40, 90, .2); }
.peek.full { position: fixed; inset: 0; width: auto; z-index: 30; box-shadow: none; }
.peek.full .peek-body { max-width: 760px; margin: 0 auto; }
@keyframes slidein { from { transform: translateX(16px); opacity: 0; } }
.peek-top { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 14px; border-bottom: 1px solid var(--border); flex: none; }
.peek-top .spacer { flex: 1; }
.peek-scroll { flex: 1; overflow: auto; }
.peek-body { padding: 24px 28px 64px; }
.peek-crumb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
.peek-title { width: 100%; border: 0; outline: none; background: transparent; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.25; resize: none; padding: 0; margin-bottom: 16px; overflow: hidden; }
.peek-title::placeholder { color: var(--text-3); }
.props { display: grid; gap: 2px; margin-bottom: 16px; padding: 6px; background: var(--bg-subtle); border-radius: var(--r-md); }
.prop { display: grid; grid-template-columns: 124px minmax(0, 1fr); align-items: center; min-height: 36px; }
