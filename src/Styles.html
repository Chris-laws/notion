<style>
/* Tokens: see DESIGN.md. Flat, hard-edged, ink on white; Lidl blue carries structure, yellow marks what you do or where you are. */
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ink: #0b1d3a;
  --bg: #ffffff;
  --bg-subtle: #f3f6fa;
  --bg-hover: #eaf0f8;
  --bg-active: #dde8f6;
  --bg-elevated: #ffffff;
  --border: #dfe5ee;
  --border-strong: #b9c4d6;
  --text: #0b1d3a;
  --text-2: #475775;
  --text-3: #8391ab;
  --accent: #0050aa;
  --accent-hover: #003d82;
  --accent-soft: #e3edfa;
  --accent-text: #0050aa;
  --yellow: #ffe500;
  --yellow-hover: #ffd400;
  --yellow-soft: #fff7b8;
  --danger: #e60a14;
  --danger-soft: #fde8e8;
  --warning: #8a5d00;
  --warning-soft: #fff7b8;
  --success: #0b7a4b;
  --success-soft: #e0f3ea;
  --side-bg: #0050aa;
  --side-text: rgba(255, 255, 255, .78);
  --side-dim: rgba(255, 255, 255, .5);
  --side-hover: rgba(255, 255, 255, .1);
  --shadow-pop: 0 0 0 1.5px var(--ink), 4px 5px 0 rgba(11, 29, 58, .16);
  --shadow-drag: 0 0 0 1.5px var(--ink), 5px 6px 0 rgba(11, 29, 58, .2);
  --r-sm: 3px; --r-md: 3px; --r-lg: 4px;
  --side-w: 232px;
  --peek-w: 520px;
  --vacation: #0050aa; --sick: #e60a14; --training: #0b1d3a; --other: #8391ab; --holiday: #ffe500;
  --c-gray: #7d8aa3; --c-brown: #8a6a4b; --c-orange: #e8650f; --c-yellow: #d9a400; --c-green: #12935b;
  --c-blue: #0050aa; --c-purple: #6b3fb5; --c-pink: #c2308a; --c-red: #e60a14; --c-default: #7d8aa3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eaf0fa;
    --bg: #0d1626; --bg-subtle: #121d31; --bg-hover: #182640; --bg-active: #1c3157; --bg-elevated: #14213a;
    --border: #1f2e49; --border-strong: #354867;
    --text: #eaf0fa; --text-2: #a4b2cb; --text-3: #6f7f9b;
    --accent: #5ca2ff; --accent-hover: #86bbff; --accent-soft: #14305c; --accent-text: #8fbfff;
    --yellow-soft: #3a3510;
    --danger: #ff5560; --danger-soft: #3b1b22; --warning: #ffd84d; --warning-soft: #3a3510;
    --success: #3fd698; --success-soft: #11332a;
    --side-bg: #00346e;
    --shadow-pop: 0 0 0 1.5px #5c6f92, 4px 5px 0 rgba(0, 0, 0, .45);
    --shadow-drag: 0 0 0 1.5px #5c6f92, 5px 6px 0 rgba(0, 0, 0, .5);
    --training: #9db2d6; --other: #5c6f92;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--font); font-optical-sizing: auto; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03';
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; text-transform: inherit; letter-spacing: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.sidebar { width: var(--side-w); flex: none; background: var(--side-bg); color: #fff; display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; }
.ws-mark { width: 26px; height: 26px; display: grid; place-items: center; background: var(--yellow); color: #0050aa; border-radius: 3px; }
.ws-mark svg { width: 15px; height: 15px; stroke-width: 3; }
.ws-name { font-weight: 800; font-size: 17px; letter-spacing: -0.03em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { width: 7px; height: 7px; background: #fff; opacity: .35; border-radius: 1px; }
.sync-dot.busy { background: var(--yellow); opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.side-scroll { flex: 1; overflow: auto; padding: 4px 10px 16px; }
.side-search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; margin-bottom: 14px;
  border: 1px solid rgba(255, 255, 255, .28); border-radius: 3px; color: var(--side-text); font-size: 13px;
}
.side-search:hover { border-color: #fff; color: #fff; }
.side-search span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.kbd { margin-left: auto; font: 500 10.5px var(--mono); color: var(--side-dim); }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border-radius: 3px;
  color: var(--side-text); font-size: 13.5px; font-weight: 550;
}
.nav-item svg { color: var(--side-dim); }
.nav-item:hover { background: var(--side-hover); color: #fff; }
.nav-item.active { background: var(--yellow); color: #0a2a5c; font-weight: 700; }
.nav-item.active svg { color: #0a2a5c; }
.nav-item .count { margin-left: auto; font: 600 11px var(--mono); color: inherit; opacity: .7; }
.nav-item .alert { margin-left: auto; width: 8px; height: 8px; background: var(--danger); box-shadow: 0 0 0 2px #fff; border-radius: 1px; }
.nav-item.faint { color: var(--side-dim); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding-left: 20px; }
.nav-sub .nav-item { height: 28px; font-size: 13px; font-weight: 500; }
.side-section { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 4px; padding: 0 10px; height: 20px; font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--side-dim); }
.side-section .icon-btn { color: var(--side-text); }
.side-section .icon-btn:hover { background: var(--side-hover); color: #fff; }
.team-row { display: flex; align-items: center; }
.team-row .chev-btn { width: 18px; height: 32px; display: grid; place-items: center; color: var(--side-dim); margin-left: -8px; }
.chev { transition: transform .15s; }
.collapsed .chev { transform: rotate(-90deg); }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 3px; color: var(--text-2); flex: none; }
.icon-btn.sm { width: 24px; height: 24px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side-foot { border-top: 1px solid rgba(255, 255, 255, .18); padding: 10px; }
.me-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 3px; }
.me-row:hover { background: var(--side-hover); }
.me-meta { line-height: 1.3; min-width: 0; font-size: 13px; color: #fff; }
.me-meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-meta .faint { color: var(--side-dim); font-size: 12px; }
.sidebar .avatar { box-shadow: none; outline: 2px solid rgba(255, 255, 255, .85); }

/* ---------- top bar ---------- */
.topbar { position: relative; z-index: 5; height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 20px 0 28px; border-bottom: 1px solid var(--border); background: var(--bg); }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.crumbs button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px; color: var(--text-2); white-space: nowrap; }
.crumbs button:hover { color: var(--text); text-decoration: underline; }
.crumbs .current { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--text-3); padding: 0 2px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }

/* ---------- marks, avatars, chips ---------- */
.mark { width: 18px; height: 18px; border-radius: 3px; display: inline-grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 800; flex: none; line-height: 1; }
.mark.md { width: 24px; height: 24px; font-size: 12px; }
.mark.lg { width: 40px; height: 40px; border-radius: 4px; font-size: 20px; letter-spacing: -0.03em; }
.avatar { width: 22px; height: 22px; border-radius: 3px; display: inline-grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 700; flex: none; box-shadow: 0 0 0 2px var(--bg); letter-spacing: .02em; }
.avatar.md { width: 26px; height: 26px; font-size: 10.5px; }
.avatar.lg { width: 30px; height: 30px; font-size: 11.5px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -4px; }
.person { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 2px; font: 500 11px var(--mono); letter-spacing: .02em;
  border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; background: var(--bg);
}
.chip .dot { width: 6px; height: 6px; flex: none; border-radius: 1px; }
.chip.soft { border-color: transparent; background: var(--bg-hover); }
.chip.accent { border-color: transparent; background: var(--accent); color: #fff; }
.chip.danger { border-color: transparent; background: var(--danger); color: #fff; }
.chip.warn { border-color: transparent; background: var(--yellow); color: #0a2a5c; }
.chip.ok { border-color: transparent; background: var(--success-soft); color: var(--success); }
.cc { font: 600 10px var(--mono); letter-spacing: .04em; padding: 1px 4px; border-radius: 2px; background: var(--bg-hover); color: var(--text-2); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); white-space: nowrap; }
.glyph { width: 14px; height: 14px; flex: none; }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
.prio-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.prio-bars i { width: 3px; background: currentColor; opacity: .22; }
.prio-bars i:nth-child(1) { height: 5px; } .prio-bars i:nth-child(2) { height: 8px; } .prio-bars i:nth-child(3) { height: 11px; }
.prio-bars i.on { opacity: 1; }
.prio-urgent { color: var(--danger); } .prio-high { color: var(--accent); } .prio-medium, .prio-low { color: var(--text-2); }
.meta { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px var(--mono); color: var(--text-2); white-space: nowrap; letter-spacing: -0.01em; }
.meta svg { color: var(--text-3); }
.meta.overdue, .meta.overdue svg { color: var(--danger); font-weight: 700; }
.meta.today, .meta.today svg { color: var(--accent-text); font-weight: 700; }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 3px;
  font-size: 13px; font-weight: 600; color: var(--text-2); white-space: nowrap; border: 1px solid transparent;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.outline { border-color: var(--border-strong); color: var(--text); background: var(--bg); }
.btn.outline:hover { border-color: var(--ink); background: var(--bg); }
.btn.primary { background: var(--yellow); color: #0a2a5c; font-weight: 700; }
.btn.primary:hover { background: var(--yellow-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn.on { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea {
  width: 100%; height: 34px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 3px; padding: 0 10px; outline: none; font-size: 13.5px;
}
.textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 72px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--yellow); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 3px; overflow: hidden; }
.seg button { height: 26px; padding: 0 11px; font-size: 12.5px; font-weight: 600; color: var(--text-2); border-left: 1px solid var(--border-strong); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--bg-hover); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- page ---------- */
.page { max-width: 1360px; margin: 0 auto; padding: 24px 28px 56px; animation: pagein .2s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(4px); } }
.page.wide { max-width: none; }
.ph { border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.page-head { display: flex; align-items: center; gap: 14px; }
.page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; margin: 0; line-height: 1.1; }
.page-sub { color: var(--text-2); margin: 8px 0 0; max-width: 76ch; font-size: 14px; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--text-2); font-size: 13px; margin-top: 12px; }
.page-meta .sep { width: 1px; height: 14px; background: var(--border-strong); }
.page-actions { margin-left: auto; display: flex; gap: 8px; }
.h2 { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 32px 0 10px; padding-top: 10px; border-top: 2px solid var(--ink); display: flex; align-items: center; gap: 8px; }
.h2 .faint { font-weight: 450; }

/* ---------- view bar ---------- */
.db-bar { display: flex; align-items: center; gap: 4px; margin: 0 0 14px; padding-top: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 20px; margin-right: auto; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 40px; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--text-2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.tab svg { color: var(--text-3); }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--yellow); }
.tab.active svg { color: var(--accent); }
.tab .n { font: 500 11px var(--mono); color: var(--text-3); }
.db-bar .btn, .db-bar .icon-btn { margin-bottom: 4px; }
.db-search { height: 28px; width: 0; padding: 0; border: 0; outline: none; background: transparent; font-size: 13px; transition: width .2s; margin-bottom: 4px; }
.db-search.open, .db-search:focus { width: 170px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 3px; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 2px; font: 500 11.5px var(--mono); background: var(--ink); color: var(--bg); }

/* ---------- board ---------- */
.board { display: flex; gap: 14px; align-items: stretch; overflow-x: auto; padding-bottom: 16px; min-height: 420px; }
.col { flex: 1 0 208px; max-width: 360px; border-top: 2px solid var(--ink); padding: 0 0 8px; transition: background .12s; }
.col.drop { background: var(--yellow-soft); }
.col-head { display: flex; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: 700; }
.col-head .n { font: 600 11px var(--mono); color: var(--text-3); }
.col-head .icon-btn { margin-left: auto; }
.card {
  position: relative; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 3px; padding: 10px 12px 10px 14px; margin-bottom: 8px; cursor: pointer;
  transition: border-color .1s, transform .1s, box-shadow .1s;
}
.card::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; background: var(--border); border-radius: 3px 0 0 3px; }
.card:has(.prio-urgent)::before { background: var(--danger); }
.card:has(.prio-high)::before { background: var(--accent); }
.card:hover { border-color: var(--ink); box-shadow: 3px 3px 0 rgba(11, 29, 58, .14); transform: translate(-1px, -1px); }
.card.dragging { opacity: .4; }
.card.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--yellow); }
.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font: 500 10.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); min-height: 16px; }
.card-top .mark { width: 14px; height: 14px; font-size: 8.5px; border-radius: 2px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-title.done { color: var(--text-3); text-decoration: line-through; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; }
.card-meta:empty { display: none; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.card-foot:empty { display: none; }
.add-row { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 6px; color: var(--text-3); font-size: 13px; font-weight: 500; border: 1px dashed var(--border-strong); border-radius: 3px; }
.add-row:hover { border-color: var(--ink); color: var(--text); }

/* ---------- checkbox ---------- */
.check { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--text-3); display: inline-grid; place-items: center; flex: none; transition: all .1s; background: var(--bg); }
.check:hover { border-color: var(--accent); background: var(--accent-soft); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on::after { content: ''; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-.5px, -1px); }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
table.db { border-collapse: collapse; width: 100%; min-width: 960px; font-size: 13px; }
table.db th { text-align: left; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; cursor: pointer; user-select: none; }
table.db th:hover { color: var(--text); }
table.db th svg { vertical-align: -2px; margin-right: 4px; }
table.db td { padding: 0; border-bottom: 1px solid var(--border); height: 40px; vertical-align: middle; }
table.db tbody tr:hover td { background: var(--bg-subtle); }
table.db td .cell { padding: 0 12px; min-height: 40px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
table.db td .cell:hover { background: var(--bg-hover); }
table.db .title-cell { display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 40px; cursor: pointer; font-weight: 600; letter-spacing: -0.01em; }
table.db .title-cell .open { margin-left: auto; opacity: 0; font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
table.db tr:hover .title-cell .open { opacity: 1; }
.sort-ind { margin-left: 4px; font-size: 9px; }

/* ---------- list ---------- */
.group { margin-bottom: 26px; }
.group-head { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--border-strong); }
.group-head .n { background: var(--yellow); color: #0a2a5c; padding: 1px 6px; border-radius: 2px; }
.group-head.danger { color: var(--danger); border-top-color: var(--danger); }
.group-head.danger .n { background: var(--danger); color: #fff; }
.lrow { display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 6px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.lrow:hover { background: var(--bg-subtle); }
.lrow .t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.lrow .title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .title.done { color: var(--text-3); text-decoration: line-through; }
.lrow .parent { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lrow .side { display: flex; align-items: center; gap: 14px; flex: none; }

/* ---------- week plan ---------- */
.week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.week-nav .kw { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin-right: 6px; }
.week-nav .range { font: 500 12px var(--mono); color: var(--text-2); margin-right: auto; }
.lane { border-top: 2px solid var(--danger); margin-bottom: 14px; }
.lane.later { border-top-color: var(--border-strong); margin: 14px 0 0; }
.lane-head { display: flex; align-items: center; gap: 8px; height: 32px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--danger); }
.lane.later .lane-head { color: var(--text-2); }
.lane-head .n { background: currentColor; padding: 1px 6px; border-radius: 2px; }
.lane-head .n span { color: var(--bg); }
.lane-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; padding-bottom: 8px; }
.week { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); border-top: 2px solid var(--ink); border-left: 1px solid var(--border-strong); min-height: 260px; }
.wday { border-right: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); display: flex; flex-direction: column; min-width: 0; position: relative; }
.wday.weekend { background: var(--bg-subtle); }
.wday.drop { background: var(--yellow-soft); }
.wday.today { box-shadow: inset 0 4px 0 var(--yellow); }
.wday.warn { background: var(--danger-soft); box-shadow: inset 0 4px 0 var(--danger); }
.wday-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 10px 8px; }
.wday-head .dow { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.wday-head .dnum { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-left: auto; font-variant-numeric: tabular-nums; }
.wday.today .dnum { background: var(--yellow); color: #0a2a5c; padding: 2px 6px; border-radius: 2px; box-shadow: 0 0 0 1.5px var(--ink); }
.wday-flags { display: flex; flex-direction: column; gap: 4px; padding: 0 10px 8px; }
.wflag { display: flex; align-items: center; gap: 6px; font: 500 11px var(--mono); line-height: 1.3; padding: 3px 6px; border-radius: 2px; }
.wflag.hol { background: var(--yellow); color: #0a2a5c; }
.wflag.warn { background: var(--danger); color: #fff; font-weight: 700; }
.wflag.away { background: var(--bg-hover); color: var(--text-2); }
.wflag .avatars .avatar { width: 16px; height: 16px; font-size: 7.5px; box-shadow: 0 0 0 1.5px var(--bg-hover); }
.wday-body { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.wday-add { margin-top: auto; opacity: 0; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--text-3); border: 1px dashed var(--border-strong); border-radius: 3px; }
.wday:hover .wday-add { opacity: 1; }
.wday-add:hover { color: var(--text); border-color: var(--ink); }
.wtask { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-left: 4px solid var(--border); border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; min-width: 0; }
.wtask:hover { border-color: var(--ink); }
.wtask.p-urgent { border-left-color: var(--danger); }
.wtask.p-high { border-left-color: var(--accent); }
.wtask .glyph { margin-top: 2px; }
.wtask .tt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.wtask.done .tt { color: var(--text-3); text-decoration: line-through; }
.wtask { flex-wrap: wrap; }
.wtask .tt { flex: 1 1 60%; }
.wtask .avatars { order: 3; margin-left: 22px; flex-basis: 100%; }
.wtask .avatar { width: 18px; height: 18px; font-size: 8px; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; min-width: 160px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--border-strong); border-top: 2px solid var(--ink); user-select: none; }
.cal-dow { height: 30px; display: flex; align-items: center; padding: 0 10px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); border-right: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
.cal-day { min-height: max(104px, calc((100vh - 360px) / 6)); border-right: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); padding: 6px; position: relative; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cal-day:hover { background: var(--bg-subtle); }
.cal-day.other .daynum { color: var(--text-3); }
.cal-day.weekend { background: var(--bg-subtle); }
.cal-day.sel { background: var(--yellow-soft) !important; }
.cal-day.drop { background: var(--yellow-soft); }
.cal-day.warn { background: var(--danger-soft); box-shadow: inset 0 3px 0 var(--danger); }
.cal-day.warn:hover { background: var(--danger-soft); }
.cal-day.today { box-shadow: inset 0 3px 0 var(--yellow); }
.daytop { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.daynum { font: 700 13px var(--font); letter-spacing: -0.02em; color: var(--text); min-width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 2px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.cal-day.today .daynum { background: var(--yellow); color: #0a2a5c; box-shadow: 0 0 0 1.5px var(--ink); }
.daytop .hol { font: 600 10px var(--mono); color: #0a2a5c; background: var(--yellow); border-radius: 2px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.daytop .wbadge { margin-left: auto; font: 700 10px var(--mono); color: #fff; background: var(--danger); border-radius: 2px; padding: 1px 5px; white-space: nowrap; }
.away { display: flex; align-items: center; gap: 4px; font: 500 10.5px var(--mono); color: var(--text-2); min-height: 20px; }
.away .avatars .avatar { width: 18px; height: 18px; font-size: 8.5px; }
.ev { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 2px; padding: 0 6px; height: 22px; white-space: nowrap; overflow: hidden; min-width: 0; flex: none; }
.ev > span { overflow: hidden; text-overflow: ellipsis; }
.ev.task { background: var(--bg-elevated); border: 1px solid var(--border-strong); cursor: grab; }
.ev.task:hover { border-color: var(--ink); }
.ev.task.done span { text-decoration: line-through; color: var(--text-3); }
.ev.event { background: var(--accent); color: #fff; }
.ev.event.milestone::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg); background: var(--yellow); flex: none; }
.ev.absence { color: var(--text); }
.ev.more { color: var(--text-3); font: 500 10.5px var(--mono); padding-left: 6px; height: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 500 11px var(--mono); color: var(--text-2); margin: 14px 0; align-items: center; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.panel { border-top: 2px solid var(--ink); padding: 10px 0 0; background: var(--bg); }
.panel + .panel { margin-top: 24px; }
.panel h3 { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.hlist { display: grid; gap: 0; }
.hitem { display: flex; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.hitem:hover { background: var(--bg-subtle); }
.hitem .d { width: 38px; flex: none; text-align: center; line-height: 1.05; background: var(--bg-hover); border-radius: 2px; padding: 4px 0; }
.hitem .d b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.hitem .d small { font: 500 9.5px var(--mono); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.hitem .what { min-width: 0; flex: 1; }
.hitem .what > div:first-child { font-weight: 600; letter-spacing: -0.01em; }
.hitem .what .muted { font-size: 12px; }
.warnitem .d { background: var(--danger); color: #fff; }
.warnitem .d small { color: rgba(255, 255, 255, .8); }
.panel h3[style] { color: var(--danger) !important; }
.hint-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); margin-top: 10px; }

/* ---------- availability ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 3px; padding: 12px 14px; margin: 16px 0; font-size: 14px; }
.banner.danger { background: var(--danger); color: #fff; }
.banner.danger > svg { color: #fff; margin-top: 2px; }
.banner.ok { background: var(--yellow); color: #0a2a5c; }
.banner.ok > svg { margin-top: 2px; }
.banner b { font-weight: 800; }
.banner .days-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.banner.danger .chip.danger { background: #fff; color: var(--danger); font-weight: 700; }
.av-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
table.av { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; }
table.av th, table.av td { padding: 0; border-bottom: 1px solid var(--border-strong); }
table.av thead th { height: 54px; vertical-align: top; padding-top: 8px; font: 600 10px var(--mono); color: var(--text-2); text-align: center; min-width: 26px; text-transform: uppercase; letter-spacing: .04em; }
table.av thead th.wk { border-left: 2px solid var(--ink); }
table.av thead th small { display: block; font-size: 9.5px; font-weight: 450; color: var(--text-3); text-transform: none; }
table.av thead th.today { background: var(--yellow); color: #0a2a5c; }
table.av thead th.today small { color: #0a2a5c; }
table.av .who { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 200px; width: 200px; padding: 0 12px 0 0; height: 46px; border-right: 1px solid var(--border-strong); text-align: left; }
table.av thead .who { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
table.av td.c { text-align: center; height: 46px; padding: 9px 0; }
table.av td.c.wk { border-left: 2px solid var(--ink); }
table.av td.c.we { background: var(--bg-subtle); }
.blk { width: 100%; height: 28px; margin: 0; border-radius: 0; display: grid; place-items: center; font: 700 10px var(--mono); color: #fff; }
.blk.vacation { background: var(--vacation); } .blk.sick { background: var(--sick); } .blk.training { background: var(--training); }
.blk.other { background: var(--other); } .blk.holiday { background: var(--holiday); color: #0a2a5c; }
.blk.off { background: repeating-linear-gradient(-45deg, var(--bg-hover) 0 3px, transparent 3px 6px); }
table.av tfoot td { height: 46px; border-bottom: 0; border-top: 2px solid var(--ink); }
table.av tfoot .who { font-weight: 800; }
.pct { font: 600 11px var(--mono); color: var(--text-3); }
.pct.mid { color: var(--warning); }
.pct.warn { color: #fff; background: var(--danger); border-radius: 2px; padding: 3px 4px; }
.panels-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; margin-top: 20px; }
.panels-row .panel + .panel { margin-top: 0; }

/* ---------- home ---------- */
.ticker { display: flex; align-items: stretch; background: var(--yellow); color: #0a2a5c; border-radius: 3px; margin: 0 0 20px; overflow: hidden; }
.ticker .tk-label { flex: none; display: flex; align-items: center; padding: 0 14px; background: #0050aa; color: #fff; font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.ticker .tk-txt { flex: 1; padding: 11px 16px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.45; min-width: 0; text-wrap: pretty; }
.ticker .tk-nums { flex: none; display: flex; align-items: center; gap: 18px; padding: 0 12px 0 16px; border-left: 1.5px solid rgba(10, 42, 92, .25); }
.tk-n { display: flex; align-items: baseline; gap: 6px; }
.tk-n b { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.tk-n span { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.tk-n.warn b { color: var(--danger); }
.ticker .icon-btn { align-self: center; color: #0a2a5c; }
.ticker .icon-btn:hover { background: rgba(10, 42, 92, .12); color: #0a2a5c; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.greet { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; margin: 0 0 14px; line-height: 1.1; }
.greet-date { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-bottom: 4px; }
.skeleton { height: 12px; background: var(--bg-hover); animation: pulse 1.2s infinite; border-radius: 2px; }

/* ---------- cards grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { border: 1px solid var(--border-strong); border-top: 4px solid var(--accent); border-radius: 3px; padding: 14px 16px; cursor: pointer; background: var(--bg); display: flex; flex-direction: column; gap: 10px; transition: transform .1s, box-shadow .1s, border-color .1s; }
.pcard:hover { border-color: var(--ink); border-top-color: var(--accent); box-shadow: 3px 3px 0 rgba(11, 29, 58, .14); transform: translate(-1px, -1px); }
.pcard .t { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.pcard .d { color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard.new { border: 1.5px dashed var(--border-strong); color: var(--text-3); align-items: center; justify-content: center; min-height: 140px; flex-direction: row; font-weight: 600; }
.pcard.new:hover { color: var(--text); border-color: var(--ink); box-shadow: none; transform: none; }
.progress { height: 6px; background: var(--bg-active); overflow: hidden; border-radius: 1px; }
.progress i { display: block; height: 100%; background: var(--accent); }
.members-list { border-top: 2px solid var(--ink); }
.mrow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.mrow .info { flex: 1; min-width: 0; }
.mrow .info small { color: var(--text-3); font-size: 12px; }
.mrow .col2 { width: 110px; color: var(--text-2); text-align: right; font: 500 12px var(--mono); }

/* ---------- peek ---------- */
.peek { width: var(--peek-w); flex: none; border-left: 2px solid var(--ink); background: var(--bg); display: flex; flex-direction: column; animation: slidein .16s ease-out; overflow: hidden; }
.peek.full { position: fixed; inset: 0; width: auto; z-index: 30; border-left: 0; }
.peek.full .peek-body { max-width: 760px; margin: 0 auto; }
@keyframes slidein { from { transform: translateX(12px); opacity: 0; } }
.peek-top { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.peek-top .spacer { flex: 1; }
.peek-scroll { flex: 1; overflow: auto; }
.peek-body { padding: 24px 28px 64px; }
.peek-crumb { display: flex; align-items: center; gap: 6px; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin-bottom: 10px; }
.peek-title { width: 100%; border: 0; outline: none; background: transparent; font-size: 26px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; resize: none; padding: 0; margin-bottom: 18px; overflow: hidden; }
.peek-title::placeholder { color: var(--text-3); }
.props { display: grid; gap: 0; margin-bottom: 16px; border-top: 2px solid var(--ink); }
.prop { display: grid; grid-template-columns: 120px minmax(0, 1fr); align-items: center; min-height: 36px; border-bottom: 1px solid var(--border); }
.prop .k { display: flex; align-items: center; gap: 8px; color: var(--text-2); font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.prop .k svg { color: var(--text-3); }
.prop .v { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 3px; min-height: 32px; width: 100%; font-size: 13px; font-weight: 500; }
.prop .v:hover { background: var(--bg-hover); }
.ai-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 3px; font-size: 12.5px; font-weight: 600; color: var(--accent-text); border: 1.5px solid var(--accent); background: var(--bg); }
.ai-btn svg { color: var(--accent); }
.ai-btn:hover { background: var(--accent); color: #fff; }
.ai-btn:hover svg { color: var(--yellow); }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.desc { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 80px; line-height: 1.6; font-size: 14px; padding: 0; }
.desc::placeholder { color: var(--text-3); }
.section-label { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 26px 0 6px; padding-top: 8px; border-top: 2px solid var(--ink); display: flex; align-items: center; gap: 8px; }
.subtask { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 4px; border-bottom: 1px solid var(--border); }
.subtask:hover { background: var(--bg-subtle); }
.subtask .t { flex: 1; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.subtask .t.done { text-decoration: line-through; color: var(--text-3); }
.inline-add { display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--text-3); }
.inline-add input { flex: 1; border: 0; outline: none; background: transparent; height: 36px; font-size: 13.5px; }
.comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment .body { flex: 1; min-width: 0; }
.comment .head { font-size: 13px; font-weight: 600; }
.comment .head .muted { font: 500 11px var(--mono); margin-left: 6px; font-weight: 450; }
.comment .text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; margin-top: 2px; }
.comment-form { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
.comment-form textarea { flex: 1; min-height: 36px; }
.suggest { border: 1.5px solid var(--ink); border-radius: 3px; padding: 6px; margin-bottom: 16px; }
.suggest .sh { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px 6px; display: flex; justify-content: space-between; align-items: center; }
.suggest .opt { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 3px; width: 100%; font-size: 13px; }
.suggest .opt:hover { background: var(--yellow-soft); }
.suggest .opt small { display: block; color: var(--text-3); font-size: 11.5px; }
.meta-foot { font: 500 11px var(--mono); color: var(--text-3); margin-top: 32px; }

/* ---------- popover, modal, palette ---------- */
.pop { position: fixed; z-index: 60; background: var(--bg-elevated); border-radius: 3px; box-shadow: var(--shadow-pop); min-width: 220px; max-width: 320px; padding: 4px; animation: popin .1s ease-out; max-height: 380px; display: flex; flex-direction: column; }
@keyframes popin { from { opacity: 0; transform: translateY(-2px); } }
.pop-search { border: 0; border-bottom: 1px solid var(--border-strong); outline: none; background: transparent; padding: 8px 8px; margin-bottom: 4px; width: 100%; font-size: 13px; }
.pop-list { overflow: auto; }
.pop-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 8px; height: 32px; border-radius: 2px; font-size: 13px; font-weight: 500; }
.pop-item:hover, .pop-item.hover { background: var(--yellow); color: #0a2a5c; }
.pop-item .tick { margin-left: auto; color: var(--accent); }
.pop-item small { color: var(--text-3); margin-left: auto; font-size: 11.5px; }
.pop-sep { height: 1px; background: var(--border-strong); margin: 4px 0; }
.pop-label { font: 600 10px var(--mono); color: var(--text-3); padding: 8px 8px 4px; text-transform: uppercase; letter-spacing: .1em; }
.pop-quick { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; }
.modal-bg { position: fixed; inset: 0; background: rgba(11, 29, 58, .5); z-index: 50; display: grid; place-items: start center; padding: 10vh 16px; overflow: auto; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: 100%; max-width: 500px; background: var(--bg-elevated); border-radius: 3px; box-shadow: var(--shadow-pop); animation: popin .14s; border-top: 6px solid var(--yellow); }
.modal-head { display: flex; align-items: center; padding: 16px 20px 4px; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 12px 20px 0; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 8px 20px 18px; }
