<style>
/* Tokens: see DESIGN.md */
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --bg: #ffffff;
  --bg-subtle: #f8f8fa;
  --bg-hover: #f1f1f4;
  --bg-active: #ebebf0;
  --bg-elevated: #ffffff;
  --border: #ececf0;
  --border-strong: #dedee4;
  --text: #1b1b1f;
  --text-2: #5f5f6b;
  --text-3: #9a9aa6;
  --accent: #5b5bd6;
  --accent-hover: #4c4cc4;
  --accent-soft: #efeffd;
  --accent-text: #4747b8;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --warning: #e5940f;
  --warning-soft: #fdf3e1;
  --success: #30a46c;
  --success-soft: #e6f6ee;
  --shadow-pop: 0 0 0 1px rgba(20, 20, 30, .06), 0 8px 24px -4px rgba(20, 20, 30, .14), 0 2px 6px rgba(20, 20, 30, .06);
  --shadow-drag: 0 12px 28px -6px rgba(20, 20, 30, .22);
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --side-w: 244px;
  --peek-w: 520px;
  --vacation: #30a46c; --sick: #e5484d; --training: #5b5bd6; --other: #8b8d98; --holiday: #e5940f;
  --c-gray: #8b8d98; --c-brown: #a07553; --c-orange: #f76b15; --c-yellow: #e2a336; --c-green: #30a46c;
  --c-blue: #0090ff; --c-purple: #8e4ec6; --c-pink: #d6409f; --c-red: #e5484d; --c-default: #8b8d98;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141417; --bg-subtle: #1a1a1e; --bg-hover: #232328; --bg-active: #2a2a30; --bg-elevated: #1e1e22;
    --border: #26262c; --border-strong: #33333a;
    --text: #ececf0; --text-2: #a0a0ab; --text-3: #6c6c76;
    --accent: #7c7cf0; --accent-hover: #8e8ef5; --accent-soft: #25254a; --accent-text: #a5a5ff;
    --danger: #ff6369; --danger-soft: #3b1c1e; --warning: #f5b94d; --warning-soft: #352a17; --success: #3dd68c; --success-soft: #16301f;
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .06), 0 8px 24px -4px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--font); color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01', 'ss03';
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.sidebar { width: var(--side-w); flex: none; background: var(--bg-subtle); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; }
.ws-mark { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--text); color: var(--bg); }
.ws-mark svg { width: 13px; height: 13px; stroke-width: 2.4; }
.ws-name { font-weight: 600; font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); opacity: .55; }
.sync-dot.busy { background: var(--accent); opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.side-scroll { flex: 1; overflow: auto; padding: 4px 8px 16px; }
.side-search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; margin-bottom: 10px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--bg); color: var(--text-3); font-size: 13px;
}
.side-search:hover { border-color: var(--text-3); }
.side-search span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.kbd { margin-left: auto; font-size: 11px; color: var(--text-3); font-family: ui-monospace, monospace; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: var(--r-sm);
  color: var(--text-2); font-size: 13.5px; font-weight: 500;
}
.nav-item svg { color: var(--text-3); }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-active); color: var(--text); }
.nav-item.active svg { color: var(--text); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav-item .alert { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding-left: 18px; }
.nav-sub .nav-item { height: 26px; font-size: 13px; font-weight: 450; }
.side-section { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 2px; padding: 0 8px; height: 24px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.team-row { display: flex; align-items: center; }
.team-row .chev-btn { width: 18px; height: 28px; display: grid; place-items: center; color: var(--text-3); margin-left: -4px; }
.chev { transition: transform .15s; }
.collapsed .chev { transform: rotate(-90deg); }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2); flex: none; }
.icon-btn.sm { width: 24px; height: 24px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side-foot { border-top: 1px solid var(--border); padding: 8px; }
.me-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: var(--r-sm); }
.me-row:hover { background: var(--bg-hover); }
.me-meta { line-height: 1.3; min-width: 0; font-size: 13px; }
.me-meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; font-size: 13.5px; }
.crumbs button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px; border-radius: var(--r-sm); color: var(--text-2); white-space: nowrap; }
.crumbs button:hover { background: var(--bg-hover); color: var(--text); }
.crumbs .current { color: var(--text); font-weight: 500; }
.crumbs .sep { color: var(--text-3); padding: 0 2px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }

/* ---------- marks, avatars, chips ---------- */
.mark { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 650; flex: none; line-height: 1; }
.mark.md { width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }
.mark.lg { width: 36px; height: 36px; border-radius: 9px; font-size: 16px; }
.avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 600; flex: none; box-shadow: 0 0 0 2px var(--bg); }
.avatar.md { width: 24px; height: 24px; font-size: 10.5px; }
.avatar.lg { width: 28px; height: 28px; font-size: 11.5px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -5px; }
.person { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 5px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; background: var(--bg);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip.soft { border-color: transparent; background: var(--bg-hover); }
.chip.accent { border-color: transparent; background: var(--accent-soft); color: var(--accent-text); }
.chip.danger { border-color: transparent; background: var(--danger-soft); color: var(--danger); }
.chip.warn { border-color: transparent; background: var(--warning-soft); color: var(--warning); }
.chip.ok { border-color: transparent; background: var(--success-soft); color: var(--success); }
.cc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 4px; border-radius: 3px; background: var(--bg-hover); color: var(--text-2); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); white-space: nowrap; }
.glyph { width: 14px; height: 14px; flex: none; }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
.prio-bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; }
.prio-bars i { width: 3px; border-radius: 1px; background: currentColor; opacity: .22; }
.prio-bars i:nth-child(1) { height: 5px; } .prio-bars i:nth-child(2) { height: 8px; } .prio-bars i:nth-child(3) { height: 11px; }
.prio-bars i.on { opacity: 1; }
.prio-urgent { color: var(--danger); } .prio-high, .prio-medium, .prio-low { color: var(--text-2); }
.meta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta svg { color: var(--text-3); }
.meta.overdue, .meta.overdue svg { color: var(--danger); }
.meta.today, .meta.today svg { color: var(--accent-text); }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; border: 1px solid transparent;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.outline { border-color: var(--border-strong); color: var(--text); background: var(--bg); }
.btn.outline:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12.5px; }
.btn.on { background: var(--bg-active); color: var(--text); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea {
  width: 100%; height: 32px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: var(--r-sm); padding: 0 10px; outline: none; font-size: 13.5px;
}
.textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 72px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: var(--bg-hover); gap: 2px; }
.seg button { height: 24px; padding: 0 10px; border-radius: 5px; font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

/* ---------- page ---------- */
.page { max-width: 1120px; margin: 0 auto; padding: 28px 40px 96px; }
.page.wide { max-width: none; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.25; }
.page-sub { color: var(--text-2); margin: 6px 0 0; max-width: 72ch; font-size: 13.5px; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--text-2); font-size: 13px; margin-top: 12px; }
.page-meta .sep { width: 1px; height: 14px; background: var(--border-strong); }
.page-actions { margin-left: auto; display: flex; gap: 6px; }
.h2 { font-size: 13px; font-weight: 600; margin: 32px 0 10px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.h2 .faint { font-weight: 450; }

/* ---------- view bar ---------- */
.db-bar { display: flex; align-items: center; gap: 4px; margin: 20px 0 16px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; margin-right: auto; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.tab svg { color: var(--text-3); }
.tab:hover { background: var(--bg-hover); color: var(--text); }
.tab.active { background: var(--bg-active); color: var(--text); }
.tab.active svg { color: var(--text); }
.tab .n { color: var(--text-3); font-weight: 450; font-variant-numeric: tabular-nums; }
.db-search { height: 28px; width: 0; padding: 0; border: 0; outline: none; background: transparent; font-size: 13px; transition: width .2s; }
.db-search.open, .db-search:focus { width: 170px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 14px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 12.5px; background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }

/* ---------- board ---------- */
.board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 24px; min-height: 360px; }
.col { width: 284px; flex: none; border-radius: var(--r-md); background: var(--bg-subtle); padding: 8px; transition: background .12s; }
.col.drop { background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 6px; font-size: 13px; font-weight: 500; }
.col-head .n { color: var(--text-3); font-weight: 450; }
.col-head .icon-btn { margin-left: auto; }
.card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 6px; cursor: pointer;
  box-shadow: 0 1px 1px rgba(20, 20, 30, .03); transition: border-color .12s, box-shadow .12s;
}
.card:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(20, 20, 30, .06); }
.card.dragging { opacity: .4; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; color: var(--text-3); min-height: 16px; }
.card-top .mark { width: 14px; height: 14px; font-size: 8.5px; border-radius: 4px; }
.card-title { font-size: 13.5px; font-weight: 500; line-height: 1.4; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-title.done { color: var(--text-3); text-decoration: line-through; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; }
.card-meta:empty { display: none; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.card-foot:empty { display: none; }
.add-row { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 8px; color: var(--text-3); border-radius: var(--r-sm); font-size: 13px; }
.add-row:hover { background: var(--bg-hover); color: var(--text-2); }

/* ---------- checkbox ---------- */
.check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: inline-grid; place-items: center; flex: none; transition: all .12s; background: var(--bg); }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--success); border-color: var(--success); }
.check.on::after { content: ''; width: 4px; height: 7px; border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(45deg) translate(-.5px, -1px); }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
table.db { border-collapse: collapse; width: 100%; min-width: 960px; font-size: 13px; }
table.db th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; background: var(--bg-subtle); user-select: none; }
table.db th:hover { color: var(--text); }
table.db th svg { vertical-align: -2px; margin-right: 4px; }
table.db td { padding: 0; border-bottom: 1px solid var(--border); height: 38px; vertical-align: middle; }
table.db tr:last-child td { border-bottom: 0; }
table.db tbody tr:hover td { background: var(--bg-subtle); }
table.db td .cell { padding: 0 12px; min-height: 38px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
table.db td .cell:hover { background: var(--bg-hover); }
table.db .title-cell { display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 38px; cursor: pointer; font-weight: 500; }
table.db .title-cell .open { margin-left: auto; opacity: 0; font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
table.db tr:hover .title-cell .open { opacity: 1; }
.sort-ind { margin-left: 4px; font-size: 9px; }

/* ---------- list ---------- */
.group { margin-bottom: 20px; }
.group-head { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font-weight: 600; font-size: 13px; background: var(--bg-subtle); border-radius: var(--r-sm); }
.group-head .n { color: var(--text-3); font-weight: 450; }
.group-head.danger { color: var(--danger); }
.lrow { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
.lrow:hover { background: var(--bg-subtle); }
.lrow .t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.lrow .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .title.done { color: var(--text-3); text-decoration: line-through; }
.lrow .parent { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lrow .side { display: flex; align-items: center; gap: 12px; flex: none; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-title { font-size: 16px; font-weight: 600; min-width: 150px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; user-select: none; }
.cal-dow { height: 30px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: var(--text-3); font-weight: 500; border-bottom: 1px solid var(--border); background: var(--bg-subtle); }
.cal-day { min-height: 124px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; position: relative; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day:hover { background: var(--bg-subtle); }
.cal-day.other .daynum { color: var(--text-3); }
.cal-day.weekend { background: var(--bg-subtle); }
.cal-day.sel { background: var(--accent-soft) !important; }
.cal-day.drop { background: var(--accent-soft); }
.cal-day.warn { background: var(--danger-soft); }
.cal-day.warn:hover { background: var(--danger-soft); }
.daytop { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.daynum { font-size: 12.5px; font-weight: 500; color: var(--text-2); min-width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 11px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.cal-day.today .daynum { background: var(--accent); color: #fff; }
.daytop .hol { font-size: 11px; color: var(--warning); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
