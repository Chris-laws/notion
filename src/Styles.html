<style>
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --bg: #ffffff;
  --bg-side: #f8f8f7;
  --bg-soft: #fbfbfa;
  --bg-hover: rgba(55, 53, 47, 0.06);
  --bg-active: rgba(55, 53, 47, 0.1);
  --bg-card: #ffffff;
  --bg-input: rgba(242, 241, 238, 0.7);
  --text: #2f2e2b;
  --text-2: rgba(55, 53, 47, 0.68);
  --text-3: rgba(55, 53, 47, 0.46);
  --border: rgba(55, 53, 47, 0.09);
  --border-2: rgba(55, 53, 47, 0.16);
  --accent: #2383e2;
  --accent-hover: #0f74d6;
  --accent-soft: rgba(35, 131, 226, 0.1);
  --danger: #d44c47;
  --shadow-sm: 0 1px 2px rgba(15, 15, 15, 0.06);
  --shadow-card: 0 0 0 1px rgba(15, 15, 15, 0.06), 0 2px 4px rgba(15, 15, 15, 0.05);
  --shadow-pop: 0 0 0 1px rgba(15, 15, 15, 0.05), 0 3px 6px rgba(15, 15, 15, 0.1), 0 9px 24px rgba(15, 15, 15, 0.2);
  --radius: 6px;
  --side-w: 248px;
  --peek-w: 540px;

  --gray-bg: #e9e8e5; --gray-tx: #4b4944;
  --brown-bg: #eee0da; --brown-tx: #5c3b23;
  --orange-bg: #fadec9; --orange-tx: #7a3f13;
  --yellow-bg: #fbeec8; --yellow-tx: #6e4f0a;
  --green-bg: #dbeddb; --green-tx: #1f5132;
  --blue-bg: #d8e8f5; --blue-tx: #174a72;
  --purple-bg: #e8deee; --purple-tx: #4f2a68;
  --pink-bg: #f5e0e9; --pink-tx: #6b2148;
  --red-bg: #ffe2dd; --red-tx: #8a1f17;
  --default-bg: rgba(206, 205, 202, 0.5); --default-tx: #37352f;

  --dot-gray: #9b9a97; --dot-brown: #a27763; --dot-orange: #d9730d; --dot-yellow: #cb912f; --dot-green: #448361;
  --dot-blue: #337ea9; --dot-purple: #9065b0; --dot-pink: #c14c8a; --dot-red: #d44c47; --dot-default: #a3a29e;

  --cap-low: #dbeafe; --cap-ok: #d3ecd9; --cap-high: #fbe7b8; --cap-over: #fbd3cf;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191919;
    --bg-side: #202020;
    --bg-soft: #1e1e1e;
    --bg-hover: rgba(255, 255, 255, 0.055);
    --bg-active: rgba(255, 255, 255, 0.09);
    --bg-card: #252525;
    --bg-input: rgba(255, 255, 255, 0.055);
    --text: rgba(255, 255, 255, 0.86);
    --text-2: rgba(255, 255, 255, 0.58);
    --text-3: rgba(255, 255, 255, 0.4);
    --border: rgba(255, 255, 255, 0.085);
    --border-2: rgba(255, 255, 255, 0.14);
    --accent-soft: rgba(35, 131, 226, 0.2);
    --shadow-card: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 2px 4px rgba(0, 0, 0, 0.3);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 3px 6px rgba(0, 0, 0, 0.3), 0 9px 24px rgba(0, 0, 0, 0.45);
    --gray-bg: #3a3a3a; --gray-tx: #d4d4d4;
    --brown-bg: #4a3a30; --brown-tx: #e6d0c4;
    --orange-bg: #5c3b23; --orange-tx: #f6c9a4;
    --yellow-bg: #564328; --yellow-tx: #f3dca4;
    --green-bg: #2b4a37; --green-tx: #bfe3c9;
    --blue-bg: #24405a; --blue-tx: #bcdcf6;
    --purple-bg: #45325a; --purple-tx: #dbc8ec;
    --pink-bg: #522c40; --pink-tx: #f0c6da;
    --red-bg: #5c2a26; --red-tx: #ffcbc4;
    --default-bg: rgba(255, 255, 255, 0.1); --default-tx: rgba(255, 255, 255, 0.82);
    --cap-low: #1f3550; --cap-ok: #23412d; --cap-high: #4d3d1c; --cap-over: #5a2622;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 20px; height: 20px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- layout ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.sidebar {
  width: var(--side-w); flex: none; background: var(--bg-side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.side-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 14px; }
.ws-mark {
  width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
  background: linear-gradient(135deg, #2f80ed, #7a5af8);
}
.ws-name { font-weight: 600; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-scroll { flex: 1; overflow: auto; padding: 4px 8px 16px; }
.side-search {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; margin: 2px 0 8px; border-radius: var(--radius);
  color: var(--text-2); background: var(--bg-hover);
}
.side-search:hover { background: var(--bg-active); }
.kbd { margin-left: auto; font-size: 11px; color: var(--text-3); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 5px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: var(--radius); color: var(--text-2);
  text-align: left; min-height: 30px; font-weight: 500;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { background: var(--bg-active); color: var(--text); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-weight: 500; }
.nav-item .emoji { width: 18px; text-align: center; font-size: 14px; }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding-left: 22px; }
.side-section {
  display: flex; align-items: center; justify-content: space-between; margin: 18px 0 4px; padding: 0 8px;
  font-size: 12px; font-weight: 600; color: var(--text-3);
}
.icon-btn {
  width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: var(--radius); color: var(--text-2);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side-foot { border-top: 1px solid var(--border); padding: 8px; }
.me-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius); width: 100%; text-align: left; }
.me-row:hover { background: var(--bg-hover); }
.me-meta { line-height: 1.25; min-width: 0; }
.me-meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { transition: transform .15s; }
.collapsed .chev { transform: rotate(-90deg); }

/* ---------- topbar ---------- */
.topbar {
  height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px;
}
.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--text-2); }
.crumbs button { padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.crumbs button:hover { background: var(--bg-hover); color: var(--text); }
.crumbs .sep { color: var(--text-3); }
.crumbs .current { color: var(--text); }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb27f; opacity: .7; }
.sync-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* ---------- page ---------- */
.page { max-width: 1200px; margin: 0 auto; padding: 28px 48px 80px; }
.page.wide { max-width: none; padding-left: 40px; padding-right: 40px; }
.page-icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
.page-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.2; }
.page-sub { color: var(--text-2); margin: 0 0 18px; max-width: 70ch; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--radius);
  font-weight: 500; font-size: 13.5px; color: var(--text-2); white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.outline { box-shadow: inset 0 0 0 1px var(--border-2); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: rgba(212, 76, 71, .1); }
.btn.sm { height: 26px; font-size: 12.5px; padding: 0 8px; }
.btn.active { background: var(--bg-active); color: var(--text); }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--border-2); background: var(--bg-input); border-radius: var(--radius); padding: 6px 10px; outline: none;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg); }
.textarea { resize: vertical; min-height: 80px; line-height: 1.55; }
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field > span { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); }

/* ---------- chips & avatars ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 7px; border-radius: 4px; font-size: 12.5px;
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-weight: 500; line-height: 21px;
}
.tag .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.c-gray { background: var(--gray-bg); color: var(--gray-tx); } .c-gray .dot { background: var(--dot-gray); }
.c-brown { background: var(--brown-bg); color: var(--brown-tx); } .c-brown .dot { background: var(--dot-brown); }
.c-orange { background: var(--orange-bg); color: var(--orange-tx); } .c-orange .dot { background: var(--dot-orange); }
.c-yellow { background: var(--yellow-bg); color: var(--yellow-tx); } .c-yellow .dot { background: var(--dot-yellow); }
.c-green { background: var(--green-bg); color: var(--green-tx); } .c-green .dot { background: var(--dot-green); }
.c-blue { background: var(--blue-bg); color: var(--blue-tx); } .c-blue .dot { background: var(--dot-blue); }
.c-purple { background: var(--purple-bg); color: var(--purple-tx); } .c-purple .dot { background: var(--dot-purple); }
.c-pink { background: var(--pink-bg); color: var(--pink-tx); } .c-pink .dot { background: var(--dot-pink); }
.c-red { background: var(--red-bg); color: var(--red-tx); } .c-red .dot { background: var(--dot-red); }
.c-default { background: var(--default-bg); color: var(--default-tx); } .c-default .dot { background: var(--dot-default); }
.prio { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 500; }
.prio-bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; }
.prio-bars i { width: 3px; border-radius: 1px; background: currentColor; opacity: .25; }
.prio-bars i:nth-child(1) { height: 5px; } .prio-bars i:nth-child(2) { height: 8px; } .prio-bars i:nth-child(3) { height: 11px; }
.prio-bars i.on { opacity: 1; }
.prio-urgent { color: var(--dot-red); } .prio-high { color: var(--dot-orange); } .prio-medium { color: var(--dot-yellow); } .prio-low { color: var(--dot-gray); }
.avatar {
  width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 600;
  flex: none; letter-spacing: .02em; box-shadow: 0 0 0 2px var(--bg-card);
}
.avatar.lg { width: 32px; height: 32px; font-size: 12.5px; }
.avatar.team { border-radius: 6px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -6px; }
.person { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.date { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.date.overdue { color: var(--danger); font-weight: 500; }
.date.today { color: var(--accent); font-weight: 500; }
.flag { font-size: 13px; }

/* ---------- database toolbar ---------- */
.db-bar {
  display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; padding-bottom: 6px;
  flex-wrap: wrap;
}
.tabs { display: flex; gap: 2px; margin-right: auto; overflow-x: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: var(--radius); color: var(--text-2);
  font-weight: 500; position: relative; white-space: nowrap;
}
.tab:hover { background: var(--bg-hover); }
.tab.active { color: var(--text); }
.tab.active::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: -7px; height: 2px; background: var(--text); border-radius: 2px; }
.db-search {
  height: 28px; width: 0; padding: 0; border: 0; outline: none; background: transparent; transition: width .2s;
}
.db-search.open, .db-search:focus { width: 160px; padding: 0 6px; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.fchip {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px;
  background: var(--accent-soft); color: var(--accent); font-weight: 500;
}
.fchip:hover { filter: brightness(.95); }

/* ---------- board ---------- */
.board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 24px; min-height: 320px; }
.col { width: 272px; flex: none; border-radius: 10px; padding: 6px; }
.col.drop { background: var(--bg-hover); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; font-size: 13px; }
.col-head .n { color: var(--text-3); font-weight: 500; }
.col-head .icon-btn { margin-left: auto; opacity: 0; }
.col:hover .col-head .icon-btn { opacity: 1; }
.card {
  background: var(--bg-card); border-radius: 8px; box-shadow: var(--shadow-card); padding: 10px 11px 9px; margin-bottom: 8px; cursor: pointer;
  transition: box-shadow .12s, transform .12s; position: relative;
}
.card:hover { box-shadow: 0 0 0 1px rgba(15, 15, 15, .09), 0 4px 10px rgba(15, 15, 15, .08); }
.card.dragging { opacity: .45; }
.card.selected { box-shadow: 0 0 0 2px var(--accent); }
.card-title { font-weight: 500; line-height: 1.4; margin-bottom: 6px; word-break: break-word; display: flex; gap: 8px; }
.card-title.done { color: var(--text-3); text-decoration: line-through; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12.5px; color: var(--text-2); }
.card-meta:empty { display: none; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.card-foot:empty { display: none; }
.add-row {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; color: var(--text-3); border-radius: var(--radius); font-size: 13px;
}
.add-row:hover { background: var(--bg-hover); color: var(--text-2); }
.empty-col { color: var(--text-3); font-size: 12.5px; padding: 6px 8px; }

/* ---------- checkbox ---------- */
.check {
  width: 16px; height: 16px; border-radius: 50%; border: 1.6px solid var(--text-3); display: inline-grid; place-items: center; flex: none;
  margin-top: 2px; transition: background .12s, border-color .12s;
}
.check:hover { border-color: var(--accent); background: var(--accent-soft); }
.check.on { background: var(--dot-green); border-color: var(--dot-green); }
.check.on::after { content: ''; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; border-top: 1px solid var(--border); }
table.db { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13.5px; }
table.db th {
  text-align: left; font-weight: 500; color: var(--text-2); font-size: 12.5px; padding: 7px 10px; border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border); white-space: nowrap; user-select: none; cursor: pointer; background: var(--bg);
  position: sticky; top: 0; z-index: 1;
}
table.db th:hover { background: var(--bg-hover); }
table.db th:last-child, table.db td:last-child { border-right: 0; }
table.db td { padding: 0; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; height: 36px; }
table.db td .cell { padding: 6px 10px; min-height: 36px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; cursor: pointer; }
table.db td .cell:hover { background: var(--bg-hover); }
table.db tr:hover td { background: var(--bg-soft); }
table.db .title-cell { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer; font-weight: 500; }
table.db .title-cell .open { margin-left: auto; opacity: 0; font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center;
  box-shadow: inset 0 0 0 1px var(--border-2); border-radius: 4px; padding: 0 6px; height: 22px; background: var(--bg); }
table.db tr:hover .title-cell .open { opacity: 1; }
.sort-ind { margin-left: 4px; font-size: 10px; }

/* ---------- list ---------- */
.group { margin-bottom: 22px; }
.group-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; padding: 4px 2px 6px; border-bottom: 1px solid var(--border); }
.group-head .n { color: var(--text-3); font-weight: 500; }
.lrow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 4px; }
.lrow:hover { background: var(--bg-hover); }
.lrow .t { flex: 1; min-width: 0; }
.lrow .t .title { font-weight: 500; }
.lrow .t .title.done { color: var(--text-3); text-decoration: line-through; }
.lrow .side { display: flex; align-items: center; gap: 10px; flex: none; }
.lrow .card-meta { margin-top: 2px; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-title { font-size: 18px; font-weight: 600; min-width: 170px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal-dow { padding: 6px 8px; font-size: 12px; color: var(--text-3); font-weight: 500; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.cal-day {
  min-height: 118px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 4px 6px; position: relative;
  cursor: pointer; min-width: 0;
}
.cal-day:hover { background: var(--bg-soft); }
.cal-day.other { background: var(--bg-soft); }
.cal-day.other .num { color: var(--text-3); }
.cal-day.weekend { background: var(--bg-soft); }
.cal-day.holiday { background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(203, 145, 47, .07) 6px 12px); }
.cal-day.drop { background: var(--accent-soft); }
.cal-day .num { font-size: 12.5px; font-weight: 500; color: var(--text-2); padding: 2px 6px; display: inline-block; border-radius: 10px; }
.cal-day.today .num { background: var(--danger); color: #fff; }
.cal-day .daytop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.cal-day .daytop .add { opacity: 0; }
.cal-day:hover .daytop .add { opacity: 1; }
.ev {
  display: flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 4px; padding: 1px 6px; margin-bottom: 2px; line-height: 18px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.ev > span { overflow: hidden; text-overflow: ellipsis; }
.ev.task { background: var(--bg-card); box-shadow: var(--shadow-card); cursor: grab; }
.ev.task.done span { text-decoration: line-through; color: var(--text-3); }
.ev.hol { color: var(--yellow-tx); background: var(--yellow-bg); font-weight: 500; }
