<script>
/* ==========================================================================
   Reusable UI: toasts, popover menus, property editors, modals, forms,
   and the command palette (search + natural-language quick add).
   ========================================================================== */

/* ---------------- toasts ---------------- */
function toast(msg, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : opts.warn ? ' warn' : '');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (opts.action ? '<button>' + esc(opts.action.label) + '</button>' : '');
  if (opts.action) el.querySelector('button').onclick = () => { opts.action.fn(); el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), opts.duration || (opts.error || opts.warn ? 8000 : 3800));
}

/* ---------------- popovers ---------------- */
let popOutside = null;
function openPop(anchor, html, mount) {
  closePop();
  const root = $('#popover-root');
  root.innerHTML = '<div class="pop" role="dialog">' + html + '</div>';
  const pop = root.firstChild;
  const r = anchor.getBoundingClientRect();
  const w = Math.max(pop.offsetWidth, 220);
  const h = pop.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 8);
  let top = r.bottom + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = top + 'px';
  popOutside = e => { if (!pop.contains(e.target) && !anchor.contains(e.target)) closePop(); };
  setTimeout(() => document.addEventListener('mousedown', popOutside), 0);
  if (mount) mount(pop);
  const first = pop.querySelector('input');
  if (first) first.focus();
  return pop;
}
function closePop() {
  const root = $('#popover-root');
  if (!root.children.length) return false;
  root.innerHTML = '';
  document.removeEventListener('mousedown', popOutside);
  return true;
}
function closeTopLayer() {
  if ($('#palette-root').children.length) { closePalette(); return true; }
  if (closePop()) return true;
  if ($('#modal-root').children.length) { closeModal(); return true; }
  return false;
}

/**
 * Generic option menu.
 * items: [{ value, html, search }], opts: { multi, selected:[], search, create, onPick(value, selected) }
 */
function openMenu(anchor, items, opts) {
  let selected = (opts.selected || []).slice();
  let query = '';
  let hover = 0;
  const visible = () => {
    const q = query.trim().toLowerCase();
    let list = items.filter(it => !q || (it.search || '').toLowerCase().indexOf(q) >= 0);
    if (opts.invite && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q) && !items.some(it => (it.search || '').toLowerCase().indexOf(q) >= 0)) {
      list = list.concat([{ value: q, html: avatar(q) + '<span>' + esc(q) + ' <span class="faint">· per E-Mail einladen</span></span>', create: true, invite: true }]);
    }
    if (opts.create && q && !items.some(it => (it.search || '').toLowerCase() === q)) {
      list = list.concat([{ value: query.trim(), html: icon('plus', 'sm') + ' „' + esc(query.trim()) + '“ hinzufügen', create: true }]);
    }
    return list;
  };
  const draw = pop => {
    const list = visible();
    hover = Math.min(hover, Math.max(0, list.length - 1));
    $('.pop-list', pop).innerHTML = list.map((it, i) => it.label
      ? '<div class="pop-label">' + esc(it.label) + '</div>'
      : '<button class="pop-item' + (i === hover ? ' hover' : '') + '" data-i="' + i + '">' + it.html +
        (selected.indexOf(it.value) >= 0 ? '<span class="tick">' + icon('check', 'sm') + '</span>' : '') +
        (it.deletable && opts.onDelete ? '<span class="pop-del" data-del="' + i + '" title="Löschen">' + icon('trash', 'sm') + '</span>' : '') + '</button>').join('') ||
      '<div class="faint" style="padding:8px">Keine Treffer</div>';
  };
  const pick = (pop, it) => {
    if (!it || it.label) return;
    if (opts.multi) {
      const i = selected.indexOf(it.value);
      if (i >= 0) selected.splice(i, 1); else selected.push(it.value);
      if (it.create) {
        if (it.invite) {
          if (!S.users.some(u => u.email === it.value)) S.users.push(user(it.value));
          items.push({ value: it.value, html: avatar(it.value) + '<span>' + esc(it.value) + '</span>', search: it.value });
        } else items.push({ value: it.value, html: tagChip(it.value), search: it.value });
      }
      if (query) { query = ''; hover = 0; const si = $('.pop-search', pop); if (si) si.value = ''; }
      opts.onPick(it.value, selected.slice());
      draw(pop);
    } else {
      closePop();
      opts.onPick(it.value, [it.value]);
    }
  };
  openPop(anchor,
    (opts.search === true || opts.search !== false && items.length > 6 || opts.create || opts.invite ? '<input class="pop-search" placeholder="' + esc(opts.placeholder || 'Suchen…') + '">' : '') +
    '<div class="pop-list"></div>',
    pop => {
      draw(pop);
      pop.addEventListener('click', e => {
        const del = e.target.closest('[data-del]');
        if (del) {
          const it = visible()[Number(del.dataset.del)];
          items.splice(items.indexOf(it), 1);
          opts.onDelete(it.value);
          draw(pop);
          return;
        }
        const b = e.target.closest('.pop-item');
        if (b) pick(pop, visible()[Number(b.dataset.i)]);
      });
      const input = $('.pop-search', pop);
      const keys = e => {
        const list = visible();
        if (e.key === 'ArrowDown') { hover = Math.min(list.length - 1, hover + 1); draw(pop); e.preventDefault(); }
        if (e.key === 'ArrowUp') { hover = Math.max(0, hover - 1); draw(pop); e.preventDefault(); }
        if (e.key === 'Enter') { pick(pop, list[hover]); e.preventDefault(); }
      };
      if (input) {
        input.addEventListener('input', () => { query = input.value; hover = 0; draw(pop); });
        input.addEventListener('keydown', keys);
      }
    });
}

/* ---------------- property editors ---------------- */
function peopleItems(preferred) {
  const pref = preferred || [];
  const list = S.users.slice().sort((a, b) =>
    (b.email === S.me.email) - (a.email === S.me.email) ||
    (pref.indexOf(b.email) >= 0) - (pref.indexOf(a.email) >= 0) ||
    a.name.localeCompare(b.name));
  return list.map(u => ({
    value: u.email,
    html: avatar(u.email) + '<span class="pp-name">' + esc(u.name) + (u.email === S.me.email ? ' <span class="faint">(ich)</span>' : '') +
      '<small class="faint pp-mail">' + esc(u.email) + '</small></span>',
    search: u.name + ' ' + u.email,
  }));
}
function relevantPeople(t) {
  let emails = [];
  const p = t.projectId && project(t.projectId);
  if (p) emails = emails.concat(projectMembers(p));
  (t.teams || []).forEach(id => { if (team(id)) emails = emails.concat(teamMembers(team(id))); });
  return emails;
}

const PROP_EDITORS = {
  status(anchor, t, save) {
    openMenu(anchor, Shared.STATUSES.map(s => ({ value: s.key, html: statusTag(s.key), search: s.label })),
      { selected: [t.status], search: false, onPick: v => save({ status: v }) });
  },
  priority(anchor, t, save) {
    openMenu(anchor, Shared.PRIORITIES.map(p => ({ value: p.key, html: prioTag(p.key), search: p.label }))
      .concat([{ value: '', html: '<span class="faint">Keine Priorität</span>', search: 'keine' }]),
    { selected: [t.priority], search: false, onPick: v => save({ priority: v }) });
  },
  assignees(anchor, t, save) {
    openMenu(anchor, peopleItems(relevantPeople(t)), {
      multi: true, search: true, invite: true, selected: t.assignees, placeholder: 'Name oder E-Mail suchen…',
      onPick: (v, sel) => save({ assignees: sel }),
    });
  },
  teams(anchor, t, save) {
    openMenu(anchor, S.teams.map(x => ({ value: x.id, html: teamChip(x), search: x.name })),
      { multi: true, selected: t.teams, onPick: (v, sel) => save({ teams: sel }) });
  },
  projectId(anchor, t, save) {
    const items = [{ value: '', html: '<span class="faint">Kein Projekt</span>', search: 'kein' }];
    S.teams.forEach(tm => {
      const ps = S.projects.filter(p => p.teamId === tm.id);
      if (!ps.length) return;
      items.push({ label: (tm.icon || '') + ' ' + tm.name, search: '' });
      ps.forEach(p => items.push({ value: p.id, html: projectChip(p), search: p.name + ' ' + tm.name }));
    });
    openMenu(anchor, items, { selected: [t.projectId], search: true, onPick: v => save({ projectId: v }) });
  },
  recurrence(anchor, t, save) {
    openMenu(anchor, Shared.RECURRENCES.map(r => ({ value: r.key, html: (r.key ? icon('repeat', 'sm') : '') + '<span>' + esc(r.label) + '</span>', search: r.label })),
      { selected: [t.recurrence], search: false, onPick: v => save({ recurrence: v }) });
  },
  tags(anchor, t, save) {
    openMenu(anchor, allTags().map(x => ({ value: x, html: tagChip(x), search: x })), {
      multi: true, create: true, selected: t.tags, placeholder: 'Tag suchen oder neu anlegen…',
      onPick: (v, sel) => save({ tags: sel }),
    });
  },
  progress(anchor, t, save) {
    const v = progressOf(t);
    openPop(anchor,
      '<div style="padding:8px 10px;width:220px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span class="muted">' + (t.progress > 0 ? 'Manuell' : 'Automatisch') + '</span><b class="pvv">' + v + ' %</b></div>' +
      '<input type="range" min="1" max="100" step="5" value="' + v + '" style="width:100%">' +
      '<div style="margin-top:8px"><button class="btn sm outline" data-auto>Auf automatisch zurücksetzen</button></div></div>',
      pop => {
        const r = $('input', pop);
        r.addEventListener('input', () => { $('.pvv', pop).textContent = r.value + ' %'; });
        r.addEventListener('change', () => save({ progress: Number(r.value) }));
        $('[data-auto]', pop).addEventListener('click', () => { closePop(); save({ progress: 0 }); });
      });
  },
  dueDate(anchor, t, save) { dateEditor(anchor, t.dueDate, v => save({ dueDate: v })); },
  startDate(anchor, t, save) { dateEditor(anchor, t.startDate, v => save({ startDate: v })); },
  estimate(anchor, t, save) {
    openPop(anchor,
      '<div style="padding:4px"><input class="input" type="number" min="0" step="0.25" value="' + esc(t.estimate || '') + '" placeholder="Stunden"></div>' +
      '<div class="pop-quick">' + [0.5, 1, 2, 4, 8, 16].map(h => '<button class="btn sm outline" data-h="' + h + '">' + fmtHours(h) + '</button>').join('') + '</div>',
      pop => {
        const input = $('input', pop);
        const done = v => { closePop(); save({ estimate: Number(v) || 0 }); };
        input.addEventListener('keydown', e => { if (e.key === 'Enter') done(input.value); });
        pop.addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) done(b.dataset.h); });
        input.addEventListener('change', () => save({ estimate: Number(input.value) || 0 }));
      });
  },
};
function dateEditor(anchor, value, onSave) {
  const t = TODAY();
  const quick = [
    ['Heute', t], ['Morgen', Shared.addDays(t, 1)], ['Nächster Mo', Shared.addDays(Shared.mondayOf(t), 7)],
    ['In 1 Woche', Shared.addDays(t, 7)],
  ];
  openPop(anchor,
    '<div style="padding:4px"><input class="input" type="date" value="' + esc(value || '') + '"></div>' +
    '<div class="pop-quick">' + quick.map(q => '<button class="btn sm outline" data-d="' + q[1] + '">' + q[0] + '</button>').join('') + '</div>' +
    (value ? '<div class="pop-sep"></div><button class="pop-item" data-d="">' + icon('x', 'sm') + 'Datum entfernen</button>' : ''),
    pop => {
      const input = $('input', pop);
      input.addEventListener('change', () => { if (Shared.isDate(input.value) || !input.value) { onSave(input.value); } });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') closePop(); });
      pop.addEventListener('click', e => {
        const b = e.target.closest('[data-d]');
        if (b) { closePop(); onSave(b.dataset.d); }
      });
    });
}
/** data-action="prop" data-id data-field — used by peek, table and cards. */
A.prop = (el, e) => {
  e.stopPropagation();
  const t = task(el.dataset.id);
  if (!t) return;
  PROP_EDITORS[el.dataset.field](el, t, patch => patchTask(t.id, patch, { keepPeek: false }));
};

/* ---------------- modals & forms ---------------- */
let modalSubmit = null;
function openModal(o) {
  closePop();
  modalSubmit = o.onSubmit;
  $('#modal-root').innerHTML =
    '<div class="modal-bg" data-action="modal-bg"><form class="modal" data-on-submit="modal" autocomplete="off">' +
    '<div class="modal-head">' + esc(o.title) + '<button type="button" class="icon-btn" data-action="modal-close" aria-label="Schließen">' + icon('x') + '</button></div>' +
    '<div class="modal-body">' + o.body + '</div>' +
    '<div class="modal-foot">' + (o.danger ? '<button type="button" class="btn danger left" data-action="modal-danger">' + esc(o.danger.label) + '</button>' : '') +
    '<button type="button" class="btn" data-action="modal-close">Abbrechen</button>' +
    '<button type="submit" class="btn primary">' + esc(o.submitLabel || 'Speichern') + '</button></div></form></div>';
  A['modal-danger'] = () => o.danger && o.danger.onClick();
  const first = $('#modal-root input:not([type=hidden]):not([type=checkbox]), #modal-root textarea');
  if (first) first.focus();
  if (o.mount) o.mount($('#modal-root .modal'));
}
function closeModal() { $('#modal-root').innerHTML = ''; modalSubmit = null; }
A['modal-close'] = () => closeModal();
A['modal-bg'] = (el, e) => { if (e.target === el) closeModal(); };
ON.submit.modal = form => {
  if (!modalSubmit) return;
  const btn = $('button[type=submit]', form);
  btn.disabled = true;
  Promise.resolve(modalSubmit(formValues(form))).then(ok => { if (ok !== false) closeModal(); else btn.disabled = false; })
    .catch(err => { btn.disabled = false; fail(err); });
};
function formValues(form) {
  const out = {};
  $$('[name]', form).forEach(el => {
    if (el.type === 'checkbox') {
      if (!out[el.name]) out[el.name] = [];
      if (el.checked) out[el.name].push(el.value);
    } else if (el.type === 'radio') {
      if (el.checked) out[el.name] = el.value;
    } else out[el.name] = el.value;
  });
  return out;
}
const COLORS = ['gray', 'brown', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'red'];
function colorField(value) {
  return '<input type="hidden" name="color" value="' + esc(value || 'blue') + '"><div class="color-row">' +
    COLORS.map(c => '<button type="button" class="' + (c === (value || 'blue') ? 'on' : '') + '" style="background:var(--c-' + c + ')" data-action="pick-color" data-v="' + c + '" title="' + c + '"></button>').join('') + '</div>';
}
A['pick-color'] = el => {
  const row = el.parentNode;
  const form = el.closest('#view form');
  if (form) form.setAttribute('data-touched', '1');
  $$('button', row).forEach(b => b.classList.toggle('on', b === el));
  row.previousElementSibling.value = el.dataset.v;
};
function peopleField(name, selected, hint) {
  return '<input class="input" placeholder="Person filtern…" data-on-input="filter-people" style="margin-bottom:6px">' +
    '<div class="picker">' + S.users.slice().sort((a, b) => a.name.localeCompare(b.name)).map(u =>
    '<label data-s="' + esc((u.name + ' ' + u.email).toLowerCase()) + '"><input type="checkbox" name="' + name + '" value="' + esc(u.email) + '"' +
    (selected.indexOf(u.email) >= 0 ? ' checked' : '') + '>' + avatar(u.email) + '<span>' + esc(u.name) + '</span><span class="faint" style="margin-left:auto;font-size:12px">' + esc(u.email) + '</span></label>').join('') +
    '</div><input class="input" name="' + name + 'Extra" placeholder="Weitere E-Mails einladen (kommagetrennt)" style="margin-top:6px">' +
    (hint ? '<div class="hint" style="margin-top:4px">' + esc(hint) + '</div>' : '');
}
ON.input['filter-people'] = el => {
  const q = el.value.toLowerCase();
  $$('label', el.nextElementSibling).forEach(l => { l.hidden = q && l.dataset.s.indexOf(q) < 0; });
};
function collectPeople(v, name) {
  return (v[name] || []).concat(String(v[name + 'Extra'] || '').split(/[,;\s]+/).filter(Boolean));
}
function selectField(name, options, value) {
  return '<select class="select" name="' + name + '">' + options.map(o =>
    '<option value="' + esc(o.key) + '"' + (o.key === value ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select>';
}
function field(label, inner) { return '<label class="field"><span>' + esc(label) + '</span>' + inner + '</label>'; }
function divField(label, inner) { return '<div class="field"><span>' + esc(label) + '</span>' + inner + '</div>'; }

/* Team */
function teamModal(t) {
  t = t || { members: [S.me.email], lead: S.me.email, color: 'purple' };
  openModal({
    title: t.id ? 'Team bearbeiten' : 'Neues Team',
    body: field('Name', '<input class="input" name="name" required maxlength="80" value="' + esc(t.name || '') + '" placeholder="z. B. Produkt, Vertrieb, Design">') +
      divField('Farbe', colorField(t.color)) +
      field('Beschreibung', '<textarea class="textarea" name="description" style="min-height:60px">' + esc(t.description || '') + '</textarea>') +
      field('Team-Lead', selectField('lead', S.users.map(u => ({ key: u.email, label: u.name })), t.lead)) +
      divField('Mitglieder', peopleField('members', t.members)),
    submitLabel: t.id ? 'Speichern' : 'Team anlegen',
    danger: t.id ? { label: 'Team löschen', onClick: () => confirmDelete('Team „' + t.name + '“ löschen? Projekte werden entfernt, Aufgaben bleiben erhalten.', () =>
      call('teams.remove', { id: t.id }).then(() => reloadAll()).then(() => go('home'))) } : null,
    onSubmit: v => call('teams.save', Object.assign({ id: t.id }, v, { members: collectPeople(v, 'members') }))
      .then(saved => reloadAll().then(() => go('team', saved.id))),
  });
}
A['team-new'] = () => teamModal();
/** "+" in the member list: search the directory (or invite by e-mail) and add or remove people. */
A['team-members'] = el => {
  const t = team(el.dataset.id);
  if (!t) return;
  openMenu(el, peopleItems(), {
    multi: true, search: true, invite: true, selected: t.members.slice(), placeholder: 'Name oder E-Mail suchen…',
    onPick: (v, sel) => {
      if (v === t.lead && sel.indexOf(v) < 0) { sel.push(v); toast('Der Team-Lead bleibt Mitglied.'); }
      const members = sel.slice();
      const before = t.members;
      t.members = members;
      render();
      call('teams.save', { id: t.id, name: t.name, icon: t.icon, color: t.color, description: t.description, lead: t.lead, members: members })
        .then(saved => { Object.assign(t, saved); render(); })
        .catch(err => { t.members = before; render(); fail(err); });
    },
  });
};
A['team-edit'] = el => teamModal(team(el.dataset.id));

/* Project */
function projectModal(p, teamId) {
  p = p || { teamId: teamId || (myTeams()[0] || S.teams[0] || {}).id, status: 'active', color: 'blue', members: [] };
  if (!S.teams.length) { toast('Lege zuerst ein Team an.'); return teamModal(); }
  openModal({
    title: p.id ? 'Projekt bearbeiten' : 'Neues Projekt',
    body: field('Name', '<input class="input" name="name" required maxlength="120" value="' + esc(p.name || '') + '">') +
      '<div class="row">' + field('Team', selectField('teamId', S.teams.map(t => ({ key: t.id, label: (t.icon || '') + ' ' + t.name })), p.teamId)) +
      field('Status', selectField('status', Shared.PROJECT_STATUSES, p.status)) + '</div>' +
      divField('Farbe', colorField(p.color)) +
      '<div class="row">' + field('Start', '<input class="input" type="date" name="startDate" value="' + esc(p.startDate || '') + '">') +
      field('Ende', '<input class="input" type="date" name="endDate" value="' + esc(p.endDate || '') + '">') + '</div>' +
      field('Beschreibung', '<textarea class="textarea" name="description" style="min-height:60px">' + esc(p.description || '') + '</textarea>') +
      divField('Projektmitglieder', peopleField('members', p.members, 'Leer lassen = ganzes Team. Auch Personen aus anderen Teams sind möglich.')),
    submitLabel: p.id ? 'Speichern' : 'Projekt anlegen',
    danger: p.id ? { label: 'Projekt löschen', onClick: () => confirmDelete('Projekt „' + p.name + '“ löschen? Die Aufgaben bleiben erhalten.', () =>
      call('projects.remove', { id: p.id }).then(() => reloadAll()).then(() => go('team', p.teamId))) } : null,
    onSubmit: v => call('projects.save', Object.assign({ id: p.id }, v, { members: collectPeople(v, 'members') }))
      .then(saved => reloadAll().then(() => go('project', saved.id))),
  });
}
A['project-new'] = el => projectModal(null, el.dataset.team);
A['project-edit'] = el => projectModal(project(el.dataset.id));

/* Event */
function eventModal(ev, date) {
  ev = ev || { type: 'meeting', startDate: date || TODAY(), teamId: S.cal.teamId || '' };
  openModal({
    title: ev.id ? 'Termin bearbeiten' : 'Neuer Termin',
    body: field('Titel', '<input class="input" name="title" required value="' + esc(ev.title || '') + '">') +
      '<div class="row">' + field('Art', selectField('type', Shared.EVENT_TYPES, ev.type)) +
      field('Team', selectField('teamId', [{ key: '', label: 'Alle' }].concat(S.teams.map(t => ({ key: t.id, label: t.name }))), ev.teamId)) + '</div>' +
      '<div class="row">' + field('Von', '<input class="input" type="date" name="startDate" required value="' + esc(ev.startDate) + '">') +
      field('Bis', '<input class="input" type="date" name="endDate" value="' + esc(ev.endDate || '') + '">') + '</div>' +
      field('Notiz', '<textarea class="textarea" name="note" style="min-height:60px">' + esc(ev.note || '') + '</textarea>'),
    danger: ev.id ? { label: 'Löschen', onClick: () => call('events.remove', { id: ev.id }).then(() => { closeModal(); calReload(); }).catch(fail) } : null,
    onSubmit: v => call('events.save', Object.assign({ id: ev.id }, v)).then(() => calReload()),
  });
}
A['event-new'] = el => eventModal(null, el && el.dataset.date);
A['event-edit'] = (el, e) => { e.stopPropagation(); const ev = calFind('events', el.dataset.id); if (ev) eventModal(ev); };

/* Absence */
function absenceModal(a) {
  a = a || { type: 'vacation', email: S.me.email, startDate: TODAY() };
  openModal({
    title: a.id ? 'Abwesenheit bearbeiten' : 'Abwesenheit eintragen',
    body: (S.me.admin ? field('Person', selectField('email', S.users.map(u => ({ key: u.email, label: u.name })), a.email)) : '') +
      field('Art', selectField('type', Shared.ABSENCE_TYPES, a.type)) +
      '<div class="row">' + field('Von', '<input class="input" type="date" name="startDate" required value="' + esc(a.startDate) + '">') +
      field('Bis', '<input class="input" type="date" name="endDate" value="' + esc(a.endDate || '') + '">') + '</div>' +
      field('Notiz (nur für dich und Admins sichtbar)', '<input class="input" name="note" value="' + esc(a.note || '') + '">'),
    danger: a.id ? { label: 'Löschen', onClick: () => call('absences.remove', { id: a.id }).then(() => { closeModal(); calReload(); }).catch(fail) } : null,
    onSubmit: v => call('absences.save', Object.assign({ id: a.id }, v)).then(res => {
      const w = res.warnings || [];
      if (w.length) {
        toast('Achtung: ' + w.map(x => fmtDate(x.date, { absolute: true }) + ' ' + x.teamName + ' ' + x.absent + '/' + x.total).slice(0, 3).join(', ') +
          (w.length > 3 ? ' …' : '') + ' – mindestens ' + res.threshold + ' % des Teams sind dann weg.', { warn: true });
      } else toast('Abwesenheit gespeichert.');
      calReload();
    }),
  });
}
A['absence-new'] = () => absenceModal();
A['absence-edit'] = (el, e) => { e.stopPropagation(); const a = calFind('absences', el.dataset.id); if (a) absenceModal(a); };

/* ---------------- AI assistant ----------------
   Free text in, preview cards out (task / event / absence). Every card can be edited or unticked;
   "Alles anlegen" creates the kept ones and offers one undo for all of them. */
let assistState = null;
A.assistant = () => {
  assistState = { items: [], source: '' };
  openModal({
    title: 'KI-Assistent', submitLabel: 'Alles anlegen',
    body: '<p class="hint" style="margin:0 0 8px">Beschreib in eigenen Worten, was angelegt werden soll: Aufgaben, Termine oder Urlaub. Du siehst vorher eine Vorschau und entscheidest.</p>' +
      '<textarea class="textarea ai-in" rows="4" placeholder="z. B. Lege für Anna morgen „Angebot prüfen“ an, 2h. Ich bin nächste Woche Montag bis Mittwoch im Urlaub."></textarea>' +
      '<div class="ai-bar"><button type="button" class="btn outline" data-action="ai-run">' + icon('sparkle', 'sm') + 'Vorschlag erstellen</button>' +
      '<span class="hint">' + (IS_MAC ? 'Cmd' : 'Strg') + ' + Enter</span></div><div id="ai-prev"></div>',
    onSubmit: () => assistCreate(),
    mount: m => {
      $('.ai-in', m).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); A['ai-run'](); } });
      const edit = e => {
        const el = e.target.closest('[data-ai-i]');
        if (!el) return;
        const it = assistState.items[Number(el.dataset.aiI)];
        if (el.type === 'checkbox') { it.keep = el.checked; el.closest('.ai-card').classList.toggle('off', !el.checked); } else it[el.dataset.aiF] = el.value;
      };
      m.addEventListener('input', edit);
      m.addEventListener('change', edit);
    },
  });
};
A['ai-run'] = () => {
  const ta = $('#modal-root .ai-in');
  if (!ta.value.trim()) { ta.focus(); return Promise.resolve(); }
  $('#ai-prev').innerHTML = '<div class="ai-loading">' + icon('sparkle', 'sm') + (S.ai.enabled ? 'Gemini denkt nach…' : 'Wird erkannt…') + '</div>';
  return call('ai.assist', { text: ta.value }).then(res => {
    assistState = { items: res.items.map(x => Object.assign({ keep: true }, x)), source: res.source };
    drawAssist();
  }).catch(err => { $('#ai-prev').innerHTML = ''; fail(err); });
};
function drawAssist() {
  const st = assistState;
  const TYPES = { task: ['checksq', 'Aufgabe'], event: ['calendar', 'Termin'], absence: ['plane', 'Abwesenheit'] };
  const date = (i, f, v, label) => '<label class="ai-d"><span>' + label + '</span><input class="input" type="date" data-ai-i="' + i + '" data-ai-f="' + f + '" value="' + esc(v || '') + '"></label>';
  const card = (it, i) => {
    const ty = TYPES[it.type] || TYPES.task;
    const head = it.type === 'absence'
      ? '<span class="ai-title">' + esc(absenceType(it.absenceType).label) + ' · ' + esc(user(it.email).name) + '</span>'
      : '<input class="input ai-title" data-ai-i="' + i + '" data-ai-f="title" value="' + esc(it.title || '') + '">';
    const meta = it.type === 'task'
      ? date(i, 'dueDate', it.dueDate, 'Fällig') + '<span class="ai-meta">' + (it.assignees && it.assignees.length ? avatars(it.assignees, 3) : avatar(S.me.email)) +
        (it.estimate ? '<span class="chip">' + icon('hourglass', 'sm') + esc(fmtHours(it.estimate)) + '</span>' : '') + (it.priority ? prioTag(it.priority) : '') +
        (it.projectId && project(it.projectId) ? projectChip(project(it.projectId)) : '') + '</span>'
      : date(i, 'startDate', it.startDate, 'Von') + date(i, 'endDate', it.endDate, 'Bis');
    return '<div class="ai-card' + (it.keep ? '' : ' off') + '"><label class="ai-k"><input type="checkbox" data-ai-i="' + i + '"' + (it.keep ? ' checked' : '') + '></label>' +
      '<div class="ai-main"><div class="ai-row"><span class="ai-type">' + icon(ty[0], 'sm') + ty[1] + '</span>' + head + '</div><div class="ai-row">' + meta + '</div></div></div>';
  };
  $('#ai-prev').innerHTML = (st.source === 'rules'
    ? '<div class="notice">Dummy-Vorschlag, KI noch nicht verbunden: Die Einträge wurden mit Regeln erkannt (ein Eintrag pro Satz). Für Gemini in den Skripteigenschaften <code>VERTEX_API_KEY</code> setzen.</div>' : '') +
    (st.items.length ? '<div class="ai-cards">' + st.items.map(card).join('') + '</div>' : '<div class="empty-w">Nichts erkannt. Formuliere es etwas konkreter, z. B. mit Datum und Person.</div>');
}
function assistCreate() {
  if (!assistState || !assistState.items.length) return A['ai-run']().then(() => false);
  const keep = assistState.items.filter(x => x.keep);
  if (!keep.length) { toast('Nichts ausgewählt.'); return false; }
  const created = [];
  const jobs = keep.map(it => {
    if (it.type === 'event') {
      return call('events.save', { title: it.title, type: it.eventType, startDate: it.startDate, endDate: it.endDate, teamId: it.teamId })
        .then(e => created.push(['events.remove', e.id]));
    }
    if (it.type === 'absence') {
      return call('absences.save', { email: it.email, type: it.absenceType, startDate: it.startDate, endDate: it.endDate })
        .then(a => created.push(['absences.remove', a.id]));
    }
    const f = { title: it.title || 'Ohne Titel' };
    ['dueDate', 'assignees', 'projectId', 'priority', 'estimate', 'recurrence', 'tags', 'teams'].forEach(k => { if (it[k] && (!Array.isArray(it[k]) || it[k].length)) f[k] = it[k]; });
    return Promise.resolve(createTask(f)).then(t => { if (t) created.push(['tasks.remove', t.id]); });
  });
  return Promise.all(jobs).then(() => {
    S.cal.cache = {}; S.cap.data = null; S.briefing = null;
    render();
    toast(created.length + (created.length === 1 ? ' Eintrag angelegt' : ' Einträge angelegt'), { duration: 8000, action: { label: 'Rückgängig', fn: () =>
      Promise.all(created.map(c => call(c[0], { id: c[1] }))).then(() => reloadAll()).then(() => toast('Rückgängig gemacht.')).catch(fail) } });
  });
}

function confirmDelete(text, fn) {
  openModal({
    title: 'Wirklich löschen?',
    body: '<p style="margin:0 0 8px">' + esc(text) + '</p>',
    submitLabel: 'Löschen',
    onSubmit: () => Promise.resolve(fn()).catch(fail),
  });
}

function reloadAll() {
  return call('bootstrap').then(d => { Object.assign(S, d); S.cap.data = null; S.cal.cache = {}; render(); });
}

/* ---------------- command palette ---------------- */
let palState = null;
function parseCtx() {
  return {
    today: TODAY(), me: S.me.email,
    users: S.users.map(u => ({ email: u.email, name: u.name })),
    teams: S.teams.map(t => ({ id: t.id, name: t.name })),
    projects: S.projects.map(p => ({ id: p.id, name: p.name })),
  };
}
function tokenChip(tk) {
  switch (tk.type) {
    case 'due': return '<span class="chip accent">' + icon('calendar', 'sm') + 'Fällig ' + esc(fmtDate(tk.value)) + '</span>';
    case 'start': return '<span class="chip">' + icon('clock', 'sm') + 'Start ' + esc(fmtDate(tk.value)) + '</span>';
    case 'assignee': return '<span class="chip">' + avatar(tk.value) + esc(user(tk.value).name) + '</span>';
    case 'team': return teamChip(team(tk.value));
    case 'project': return '<span class="chip">' + projectChip(project(tk.value)) + '</span>';
    case 'tag': return tagChip(tk.value);
    case 'priority': return '<span class="chip">' + prioTag(tk.value) + '</span>';
    case 'estimate': return '<span class="chip">' + icon('hourglass', 'sm') + esc(fmtHours(tk.value)) + '</span>';
    case 'recurrence': return '<span class="chip accent">' + icon('repeat', 'sm') + esc((Shared.RECURRENCES.find(r => r.key === tk.value) || {}).label) + '</span>';
    default: return '';
  }
}
/** Colours the quick-add syntax inside the input line (a mirror layer behind the transparent input). */
const QA_RULES = [
  ['qa-assign', /@[\p{L}\d._-]+/gu],
  ['qa-team', /\+[\p{L}\d._-]+/gu],
  ['qa-proj', /#[\p{L}\d._-]+/gu],
  ['qa-prio', /![\p{L}]+/gu],
  ['qa-est', /(?<![\p{L}\d])\d+(?:[.,]\d+)?\s?(?:h|std|min|m)(?![\p{L}\d])/giu],
  ['qa-rec', /(?<![\p{L}\d])(?:jede[nrs]?\s(?:tag|werktag|montag|dienstag|mittwoch|donnerstag|freitag|woche|monat)|täglich|werktags|wöchentlich|monatlich)(?![\p{L}\d])/giu],
  ['qa-date', /(?<![\p{L}\d])(?:heute|morgen|übermorgen|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|nächste woche|ende der woche|in \d+ (?:tag|tagen|wochen)|\d{1,2}\.\d{1,2}\.(?:\d{2,4})?)(?![\p{L}\d])/giu],
];
function qaHighlight(text) {
  const marks = [];
  QA_RULES.forEach(r => {
    r[1].lastIndex = 0;
    let m;
    while ((m = r[1].exec(text))) {
      const from = m.index, to = from + m[0].length;
      if (!marks.some(x => from < x.to && to > x.from)) marks.push({ from: from, to: to, cls: r[0] });
      if (m[0].length === 0) r[1].lastIndex++;
    }
  });
  marks.sort((x, y) => x.from - y.from);
  let out = '', pos = 0;
  marks.forEach(m => { out += esc(text.slice(pos, m.from)) + '<span class="' + m.cls + '">' + esc(text.slice(m.from, m.to)) + '</span>'; pos = m.to; });
  return out + esc(text.slice(pos));
}
function openPalette(prefill) {
  closePop();
  palState = { hover: 0, items: [] };
  $('#palette-root').innerHTML =
    '<div class="palette-bg" data-action="palette-bg"><div class="palette" role="dialog" aria-label="Suchen und erstellen">' +
    '<div class="palette-in">' + icon('bolt', 'lg') + '<div class="qa-wrap"><div class="qa-hl" id="pal-hl"></div>' +
    '<input id="pal-in" placeholder="Aufgabe eingeben oder suchen" autocomplete="off" spellcheck="false" value="' + esc(prefill || '') + '"></div></div>' +
    '<div class="palette-preview" id="pal-prev"></div><div class="palette-list" id="pal-list"></div>' +
    '<div class="qa-legend"><span class="qa-date">morgen</span><small>Fällig</small><span class="qa-date">15.11.</span><small>Datum</small><span class="qa-assign">@anna</span><small>zuweisen</small>' +
    '<span class="qa-team">+team</span><small>Team</small><span class="qa-proj">#website</span><small>Projekt oder Tag</small><span class="qa-prio">!hoch</span><small>Priorität</small>' +
    '<span class="qa-est">2h</span><small>Aufwand</small><span class="qa-rec">jeden montag</span><small>Wiederholung</small></div>' +
    '<div class="palette-foot"><span>↵ anlegen</span><span>Strg+↵ anlegen und öffnen</span><span>↑↓ auswählen</span><span style="margin-left:auto">Esc schließen</span></div></div></div>';
  const input = $('#pal-in');
  input.focus();
  input.addEventListener('input', drawPalette);
  input.addEventListener('keydown', e => {
    const n = palState.items.length;
    if (e.key === 'ArrowDown') { palState.hover = (palState.hover + 1) % n; drawPalette(true); e.preventDefault(); }
    if (e.key === 'ArrowUp') { palState.hover = (palState.hover - 1 + n) % n; drawPalette(true); e.preventDefault(); }
    if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(palState.items[palState.hover], e.ctrlKey || e.metaKey); }
  });
  drawPalette();
}
A.palette = () => openPalette();
A['palette-bg'] = (el, e) => { if (e.target === el) closePalette(); };
function closePalette() { $('#palette-root').innerHTML = ''; palState = null; }

function drawPalette(keepHover) {
  const q = $('#pal-in').value;
  $('#pal-hl').innerHTML = qaHighlight(q);
  const parsed = Shared.parse(q, parseCtx());
  const items = [];
  if (q.trim()) items.push({ kind: 'create', parsed: parsed, html: icon('plus') + '<span>Aufgabe anlegen: <b>' + esc(parsed.title) + '</b></span>' });
  const ql = q.trim().toLowerCase();
  const nav = [
    { kind: 'nav', view: 'dash', label: 'Übersicht', ic: icon('home') },
    { kind: 'nav', view: 'home', label: 'Meine Aufgaben', ic: icon('checksq') },
    { kind: 'nav', view: 'all', label: 'Alle Aufgaben', ic: icon('inbox') },
    { kind: 'nav', view: 'calendar', label: 'Kalender', ic: icon('calendar') },
    { kind: 'nav', view: 'capacity', label: 'Verfügbarkeit', ic: icon('users') },
    { kind: 'nav', view: 'settings', label: 'Einstellungen', ic: icon('settings') },
  ].concat(S.teams.map(t => ({ kind: 'nav', view: 'team', id: t.id, label: t.name, ic: mark(t) })))
    .concat(S.projects.map(p => ({ kind: 'nav', view: 'project', id: p.id, label: p.name, ic: mark(p) })));
  nav.filter(n => !ql || n.label.toLowerCase().indexOf(ql) >= 0).slice(0, ql ? 4 : 5)
    .forEach(n => items.push(Object.assign(n, { html: n.ic + '<span>' + esc(n.label) + '</span><small>Öffnen</small>' })));
  if (ql) {
    S.tasks.filter(t => t.title.toLowerCase().indexOf(ql) >= 0).slice(0, 6).forEach(t => items.push({
      kind: 'task', id: t.id, html: '<span class="check' + (isDone(t) ? ' on' : '') + '" style="margin:0"></span><span>' + esc(t.title) + '</span><small>' + esc(fmtDate(t.dueDate)) + '</small>',
    }));
    // people: open their tasks
    S.users.filter(u => (u.name + ' ' + u.email).toLowerCase().indexOf(ql) >= 0).slice(0, 4).forEach(u => items.push({
      kind: 'person', email: u.email, html: avatar(u.email) + '<span>' + esc(u.name) + '</span><small>Aufgaben ansehen</small>',
    }));
  }
  palState.items = items;
  if (!keepHover) palState.hover = 0;
  $('#pal-prev').innerHTML = q.trim() ? '<div class="qa-title">' + esc(parsed.title || 'Ohne Titel') + '</div><div class="qa-chips">' + parsed.tokens.map(tokenChip).join('') + '</div>' : '';
  $('#pal-list').innerHTML = items.map((it, i) => '<button class="pop-item' + (i === palState.hover ? ' hover' : '') + '" data-action="pal-item" data-i="' + i + '">' + it.html + '</button>').join('');
}
A['pal-item'] = (el, e) => runPaletteItem(palState.items[Number(el.dataset.i)], e.ctrlKey || e.metaKey);

function runPaletteItem(it, open) {
  if (!it) return;
  if (it.kind === 'nav') { closePalette(); go(it.view, it.id); return; }
  if (it.kind === 'task') { closePalette(); openPeek(it.id); return; }
  if (it.kind === 'person') {
    closePalette();
    go('all');
    setPrefs({ people: [it.email], quick: 'open' });
    return;
  }
  const text = $('#pal-in').value;
  const fromParse = p => {
    const f = contextDefaults();
    ['title', 'dueDate', 'startDate', 'priority', 'recurrence', 'projectId'].forEach(k => { if (p[k]) f[k] = p[k]; });
    if (p.estimate) f.estimate = p.estimate;
    if (p.assignees && p.assignees.length) f.assignees = p.assignees;
    if (p.teams && p.teams.length) f.teams = (f.teams || []).concat(p.teams);
    if (p.tags && p.tags.length) f.tags = p.tags;
    return f;
  };
  closePalette();
  const go2 = p => createTask(fromParse(p), { open: open }).then(t => {
    if (t && !open) toast('Angelegt: ' + t.title, { action: { label: 'Öffnen', fn: () => openPeek(t.id) } });
  });
  if (S.ai.enabled) {
    toast('KI analysiert die Eingabe…');
    call('ai.parse', { text: text }).then(go2).catch(() => go2(it.parsed));
  } else go2(it.parsed);
}
A['new-task'] = el => {
  const preset = el && el.dataset.preset ? JSON.parse(el.dataset.preset) : {};
  createTask(contextDefaults(Object.assign({ title: '' }, preset)), { open: true });
};
</script>
